[project]
name = "findling"
version = "0.1.0"
description = "Findling ExApp backend: zero-config search for Nextcloud"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "street1983nk" }]
dependencies = [
    "nc-py-api[app]==0.30.3",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "tantivy==0.26.2",
    "pypdfium2==5.13.0",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "striprtf==0.0.33",
    "charset-normalizer==3.5.2",
    "lxml==6.1.3",
    # Pillow was already in uv.lock, pulled in transitively by python-pptx. The
    # OCR path uses it directly (header inspection before decoding, EXIF
    # rotation, downscaling, PNG encoding), and a direct import of an indirect
    # dependency is the version that silently disappears when the package that
    # dragged it in stops needing it. So it becomes a direct edge here. Net new
    # PyPI packages of phase 3: zero.
    "pillow==12.3.0",
    # Phase 6, the semantic half of the search. Every edge below is pinned
    # exactly, because every one of them decides what a search returns.
    #
    # tokenizers and numpy were already in uv.lock, pulled in transitively by
    # fastembed, which no module ever imported and which phase 23 removed. Both
    # are imported directly: tokenizers in embed/model.py, embed/chunker.py and
    # embed/bench.py, numpy in embed/model.py, embed/bench.py and the tests. Same
    # argument as pillow above: a direct import of an indirect dependency is the
    # version that silently disappears when the package that dragged it in goes
    # away, and without tokenizers the semantic half would switch itself off. So
    # both become direct edges, on the versions the lockfile already held.
    # tokenizers still drags huggingface-hub into an image that is not allowed
    # to speak to the outside world; the answer is HF_HUB_OFFLINE=1 plus the
    # model and the tokenizer at fixed paths in the image. Net new PyPI packages
    # of phase 23: zero.
    "tokenizers==0.23.2",
    "numpy==2.5.3",
    # The inference runtime that runs the ONNX model turning text into a 384
    # dimensional vector, and the tool that quantises the model at build time.
    # The pinned 1.30.0 carries a cp313 manylinux_2_28_aarch64 wheel, which the
    # ARM box needs.
    "onnxruntime==1.30.0",
    # The vector store: a loadable SQLite extension, brute force KNN, no second
    # process. There is deliberately no >= here. Everything after 0.1.9
    # (2026-03-31) is a prerelease, and no commit has landed in the upstream
    # repository since 2026-05-18, so a floating floor would only be able to
    # drift into unreleased code (D-07). This is the same argument the tesseract
    # language packs are pinned with: the artifact decides what the search
    # reads. The documented way out if brute force stops scaling is usearch with
    # an HNSW index; it is written down in docs/embeddings.md (plan 06-04) and it
    # is not installed here, because a fallback path is not a dependency (D-10).
    "sqlite-vec==0.1.9",
    # Chunking. Splits a document into passages along sentence and paragraph
    # boundaries instead of every N characters. 0.32.0 (2026-06-16), cp310-abi3
    # wheel, so one wheel serves every Python from 3.10 on.
    "semantic-text-splitter==0.33.0",
]

# The unit suite covered 92 per cent of src/findling when the floor was
# introduced (2026-10-08); 90 leaves room for refactors and still catches a
# feature that arrives without its tests. Integration and resilience runs add
# coverage on top but need a live stack, so the floor is measured where every
# contributor can run it.
[tool.coverage.report]
fail_under = 90
skip_covered = true

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pyright==1.1.414",
    "vulture==2.16",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]
# Build time only, and deliberately a group of its own rather than a dependency.
# onnxruntime.quantization imports the `onnx` package, which onnxruntime itself
# does not depend on, so scripts/dev/quantize_model.py cannot run without it. It
# is needed for exactly one step of the image build and would otherwise sit in
# the runtime image forever: 19 MB of graph manipulation library that the search
# path never calls. Neither `uv sync --no-dev` in the build stage nor the plain
# `uv sync` of the gates job installs it; the model stage of backend/Dockerfile
# asks for it by name with --group quantize.
#
# 1.23.0 is the current release (2026-09-18), Apache-2.0, github.com/onnx/onnx,
# and its cp312-abi3 wheels cover Python 3.13 on manylinux_2_28_aarch64, which
# is what the arm64 half of the multi-arch build needs (wheel list verified on
# PyPI for 1.23.0).
quantize = ["onnx==1.23.1"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "findling"
module-root = "src"

# starlette is not pinned directly because nc-py-api owns the dependency edge.
# The floor stays above CVE-2026-48710 (BadHost, path desync defeating path based
# authorization), so the resolver may never fall below 1.0.1.
[tool.uv]
constraint-dependencies = ["starlette>=1.0.1"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "C4", "RUF", "PT", "RET", "A", "ISC"]

[tool.ruff.lint.per-file-ignores]
# S101 flags every plain assert. Tests are the one place where assert is the
# intended construct, so the bandit rule is muted there and nowhere else.
"tests/*" = ["S101"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A synchronous enabled_handler still works with nc-py-api 0.30.x but only emits a
# DeprecationWarning, and it breaks hard in 0.31.0. Turning that warning into an
# error is the only way the mistake surfaces before the release that removes it.
#
# The second entry silences exactly one warning, and only in the tests: Starlette
# 1.6 warns at import of starlette.testclient that it wants httpx2 instead of
# httpx. Only the tests import the TestClient (src never does), and httpx2 is a
# new package we do not pull in for a test helper. The entry goes once the
# TestClient imports without the warning.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
