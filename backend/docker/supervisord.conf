# Two programs, one process tree. The application alone is not enough under
# HaRP: it binds a unix socket there, and frpc is what carries that socket back
# to Nextcloud.
#
# Every log line goes to the container stdout and stderr, so "docker logs" shows
# the whole tree instead of hiding half of it in a file nobody looks at.

[supervisord]
nodaemon=true
# supervisord's own log is not interesting once both programs log to the
# container output, and writing it to a file would only need a writable
# directory that nothing else uses.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info
user=root

[program:app]
command=/app/docker/entrypoint.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frpc]
command=/app/docker/harp_connect.sh
directory=/app
autostart=true
# Without HP_SHARED_KEY the script logs one line and exits 0. Listing 0 as an
# expected exit code is what keeps supervisord from restarting it in a loop on
# every installation that does not use HaRP.
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
