<?xml version="1.0" encoding="UTF-8"?>
<!--
	Material Design Icons "magnify" by Pictogrammers, Apache-2.0, path data
	verbatim from the commit pinned in THIRD-PARTY.md, the same white glyph as
	app-white.svg. The name is the id of the search provider: the server looks
	for <provider id>.svg before app.svg when it picks the icon of the entry
	"File contents" in the menu of the unified search, and that menu shows an
	icon as an img and inverts it on a bright background. The theming app asks
	for <app id>.svg first as well, so this file is also the glyph of the
	favicon and the touch icon of the Findling pages (white on the primary
	colour). The app navigation names app.svg in info.xml and is not affected.
-->
