name: Set up the test Nextcloud with both Findling halves
description: >-
  Installs a throwaway Nextcloud with app_api, puts the PHP companion into
  apps/findling, starts the backend as a native process and registers it through
  AppAPI. This is everything both integration jobs need before they can assert
  anything, and it lived twice in integration.yml before this action existed.
  Phase 2 adds a third job, which is why the duplication is removed now.

  Since phase 5 the second half is optional. With register-exapp set to false the
  action stops after the installed instance with both apps enabled, and the
  caller registers the backend itself. That is what the HaRP deploy job does: it
  has no host process at all, because a deploy daemon creates the container.

  Two steps are deliberately not in here: the checkout of nextcloud/server and
  the checkout of this repository. actions/checkout empties its target directory,
  so the server checkout at the workspace root has to happen before the checkout
  that provides this very action file, and both belong in the job for that reason.

inputs:
  server-version:
    description: Branch of nextcloud/server and nextcloud/app_api, for instance stable34.
    required: true
  php-version:
    description: PHP version to install, has to match the lower bound of appinfo/info.xml.
    required: true
  database:
    description: >-
      Dialect handed to maintenance:install, sqlite, mysql or pgsql. Phase 2
      introduces the first table of this app, and IQueryBuilder defects are
      dialect dependent: green on SQLite and red on MariaDB is the normal case,
      not the exception. Phase 5 adds pgsql, because the all-in-one setup this
      phase has to prove runs PostgreSQL and the project has never installed
      against it. mysql and pgsql expect a reachable server, which is a service
      container of the calling job.
    required: false
    default: sqlite
  database-host:
    description: Host of the database server, ignored for sqlite. Never localhost, see the install step.
    required: false
    default: 127.0.0.1
  database-name:
    description: Database name, ignored for sqlite.
    required: false
    default: nextcloud
  database-user:
    description: Database user, ignored for sqlite. Test only.
    required: false
    default: nextcloud
  database-pass:
    description: Password of that user, ignored for sqlite. Test only, thrown away with the runner.
    required: false
    default: nextcloud
  admin-user:
    description: Administrator of the throwaway instance.
    required: false
    default: admin
  admin-pass:
    description: Password of that administrator. Test only, thrown away with the runner.
    required: false
    default: password
  exapp-secret:
    description: Shared secret of the ExApp registration. Test only.
    required: true
  exapp-port:
    description: TCP port the backend binds while the tests run.
    required: true
  exapp-version:
    description: >-
      Version the registration announces. Empty by default, which means the
      action reads <version> out of backend/appinfo/info.xml of the findling
      checkout. It used to carry the literal 0.1.0 while both info.xml files had
      long moved on to 0.3.0, and from phase 5 on that value is not cosmetic:
      APP_VERSION is what the container reports as its own version, and the PHP
      half compares major and minor against it. A default that goes stale next to
      the info.xml would turn the lockstep check red for the wrong reason.
    required: false
    default: ''
  register-exapp:
    description: >-
      true or false. With true, this action does what it always did: it starts the
      backend as a host process and registers it through a manual-install daemon.
      With false it stops after the installed instance with app_api and findling
      enabled, and it starts no host process. A caller that passes false promises
      to register a daemon and the ExApp itself, which is what the HaRP deploy job
      does: there the image is pulled and the container is created by the deploy
      daemon, so a host process would only answer instead of it.
    required: false
    default: 'true'
  install-groupfolders:
    description: >-
      true or false. With true the Team folders app is installed and enabled on
      the instance, which is what the team folder scenario of the parity gate
      needs: a mount that belongs to a group rather than to a user. It is off by
      default and has to stay off by default, because it costs a download and a
      set of migrations that the other jobs of this repository have no use for,
      and because a mount provider that is present changes what the crawl walks.
    required: false
    default: 'false'
  nextcloud-host:
    description: >-
      Address the builtin PHP server binds, localhost or 0.0.0.0, handed to
      NEXTCLOUD_HOST of composer run serve. localhost is the default because a
      daemon registered with --net host shares the network namespace of the runner
      and reaches the loopback address anyway. The input exists as a named way out
      for a caller that cannot use --net host: 0.0.0.0 additionally puts 127.0.0.1
      and localhost into trusted_domains, so the server does not refuse the
      request over a host header it does not know.
    required: false
    default: localhost

outputs:
  exapp-version:
    description: >-
      The version this action registered, either the input or the value read out
      of backend/appinfo/info.xml. A caller that registers the ExApp itself needs
      the same number, and reading the file twice is how the two drift apart.
    value: ${{ steps.app-version.outputs.version }}

runs:
  using: composite
  steps:
    # The two inputs this action branches on are checked against a fixed list of
    # values before anything is installed. A typo in a boolean would otherwise
    # silently take the branch it was not meant to take, and a run that skipped
    # the registration by accident looks exactly like a run that was asked to.
    - name: Check the inputs this action branches on
      shell: bash
      env:
        REGISTER_EXAPP: ${{ inputs.register-exapp }}
        INSTALL_GROUPFOLDERS: ${{ inputs.install-groupfolders }}
        NEXTCLOUD_HOST: ${{ inputs.nextcloud-host }}
        DATABASE: ${{ inputs.database }}
      run: |
        case "${REGISTER_EXAPP}" in
          true|false) ;;
          *)
            echo "register-exapp has to be true or false, got '${REGISTER_EXAPP}'"
            exit 1
            ;;
        esac
        case "${INSTALL_GROUPFOLDERS}" in
          true|false) ;;
          *)
            echo "install-groupfolders has to be true or false, got '${INSTALL_GROUPFOLDERS}'"
            exit 1
            ;;
        esac
        case "${NEXTCLOUD_HOST}" in
          localhost|0.0.0.0) ;;
          *)
            echo "nextcloud-host has to be localhost or 0.0.0.0, got '${NEXTCLOUD_HOST}'"
            exit 1
            ;;
        esac
        case "${DATABASE}" in
          sqlite|mysql|pgsql) ;;
          *)
            echo "database has to be sqlite, mysql or pgsql, got '${DATABASE}'"
            exit 1
            ;;
        esac

    # Actions are pinned to commit SHAs, never to tags: a moved tag would be
    # arbitrary code execution inside a job that holds a Nextcloud instance.
    #
    # The residual risk behind that sentence, written down instead of assumed
    # (Sec-L10 of the phase 2 audit, disposition: accepted). Pinning an action
    # pins the action, not everything the action does at runtime. setup-php
    # fetches a PHP build and its extensions while the job runs, and setup-uv
    # below fetches the uv release named in its version input. Neither payload is
    # covered by the SHA above: the SHA fixes which code decides where to fetch
    # from, and nothing more. This is structural. Turning it off would mean
    # carrying our own PHP and our own uv, which is a distribution problem
    # traded for a supply chain problem, and one this project cannot staff.
    #
    # What is actually defended, so nobody reads more into the pin than is there:
    # a moved tag cannot swap the fetching code underneath us, the version inputs
    # are literals in this file and not expressions, and every job that uses this
    # action is a throwaway instance that is destroyed with the runner and holds
    # no secret other than the test credentials in this file. The published
    # artefact of this project is the container image, and its build in
    # docker.yml does not go through either of these two actions.
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        # Linting and running against the oldest supported runtime is what catches
        # syntax and behaviour that only newer PHP accepts.
        php-version: ${{ inputs.php-version }}
        # pdo_mysql, mysqli, pgsql and pdo_pgsql are installed unconditionally
        # although a sqlite run never touches them: an extension list that depends
        # on an input is a second place where the dialect is decided, and the four
        # extensions cost seconds, not minutes.
        extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, mysqli, pdo_mysql, pgsql, pdo_pgsql, gd, zip
        coverage: none

    - name: Check out nextcloud/app_api
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: nextcloud/app_api
        ref: ${{ inputs.server-version }}
        path: apps/app_api

    # The directory name must be exactly the app id. If it is not, the autoloader
    # never finds the classes and the provider stays invisible with no error
    # message at all (pitfall 3, third cause). The backend stays in findling-src,
    # it is not part of the server tree.
    - name: Move the PHP companion to apps/findling
      shell: bash
      run: mv findling-src/php apps/findling

    # One place decides which version both halves talk about, and it is the
    # info.xml unless the caller says otherwise. An empty result is an error
    # rather than an empty APP_VERSION: the version is what the lockstep check
    # compares, and comparing against nothing is the failure mode this step
    # exists to rule out.
    - name: Resolve the version the registration announces
      id: app-version
      shell: bash
      env:
        EXAPP_VERSION_INPUT: ${{ inputs.exapp-version }}
      run: |
        if [ -n "${EXAPP_VERSION_INPUT}" ]; then
          version="${EXAPP_VERSION_INPUT}"
          source="the exapp-version input"
        else
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' \
            findling-src/backend/appinfo/info.xml | head -n 1)
          source="findling-src/backend/appinfo/info.xml"
        fi
        if [ -z "${version}" ]; then
          echo "no app version could be determined from ${source}"
          exit 1
        fi
        echo "app version ${version}, taken from ${source}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    # 127.0.0.1 rather than localhost for the server address, and it is not a
    # matter of taste: the PHP mysql driver reads "localhost" as an instruction
    # to use a unix socket, and a service container of a workflow answers on a
    # forwarded TCP port and on no socket at all. The same holds for the
    # PostgreSQL driver.
    #
    # Every input below is handed to the shell through env rather than
    # interpolated into the script text. Today these are literals of a throwaway
    # instance, but an input that arrives as shell text is an injection site, and
    # this phase adds inputs (Sec-L7).
    - name: Install Nextcloud
      shell: bash
      env:
        DATABASE: ${{ inputs.database }}
        DATABASE_HOST: ${{ inputs.database-host }}
        DATABASE_NAME: ${{ inputs.database-name }}
        DATABASE_USER: ${{ inputs.database-user }}
        DATABASE_PASS: ${{ inputs.database-pass }}
        ADMIN_USER: ${{ inputs.admin-user }}
        ADMIN_PASS: ${{ inputs.admin-pass }}
        NEXTCLOUD_HOST: ${{ inputs.nextcloud-host }}
      run: |
        mkdir data
        if [ "${DATABASE}" = "sqlite" ]; then
          ./occ maintenance:install --database=sqlite \
            --admin-user "${ADMIN_USER}" \
            --admin-pass "${ADMIN_PASS}"
        else
          # mysql and pgsql take the identical set of parameters, so the dialect
          # is the only thing that differs between the two branches. Writing them
          # as one branch keeps it that way.
          ./occ maintenance:install --database="${DATABASE}" \
            --database-host "${DATABASE_HOST}" \
            --database-name "${DATABASE_NAME}" \
            --database-user "${DATABASE_USER}" \
            --database-pass "${DATABASE_PASS}" \
            --admin-user "${ADMIN_USER}" \
            --admin-pass "${ADMIN_PASS}"
        fi
        # Printed rather than assumed: a run that quietly fell back to sqlite
        # would prove the dialect question with the dialect it was asked about.
        ./occ config:system:get dbtype
        # A server bound to 0.0.0.0 is reached under addresses the installer never
        # saw, and Nextcloud answers an unknown host header with its trusted
        # domain warning instead of with the request. Index 0 belongs to the
        # installer, so these two go next to it.
        if [ "${NEXTCLOUD_HOST}" = "0.0.0.0" ]; then
          ./occ config:system:set trusted_domains 1 --value=127.0.0.1
          ./occ config:system:set trusted_domains 2 --value=localhost
          ./occ config:system:get trusted_domains
        fi

    # composer run serve is PHP_CLI_SERVER_WORKERS=${NEXTCLOUD_WORKERS:=4}
    # php -S ${NEXTCLOUD_HOST:=localhost}:${NEXTCLOUD_PORT:=8080}, so the binding
    # is loopback unless this variable says otherwise (pitfall 12).
    - name: Start the PHP builtin server
      shell: bash
      env:
        NEXTCLOUD_HOST: ${{ inputs.nextcloud-host }}
      run: composer run serve &

    - name: Wait for the server
      shell: bash
      run: |
        for _ in $(seq 1 30); do
          if curl -sf http://localhost:8080/status.php > /dev/null; then
            echo "server is up"
            exit 0
          fi
          sleep 2
        done
        echo "server did not answer on http://localhost:8080/status.php"
        exit 1

    - name: Enable app_api
      shell: bash
      run: ./occ app:enable -vvv -f app_api

    - name: Enable findling
      shell: bash
      run: ./occ app:enable -vvv -f findling

    # Team folders, and only for a caller that asks for them. A mount provider
    # that is present changes what the crawl walks, so this must never become
    # something every job gets by accident.
    #
    # Two ways in, and which one was taken is printed rather than guessed. The
    # app store is the first choice, because it resolves the release that fits
    # the installed server on its own. The tarball of the matching major line is
    # the fallback for the case the store is unreachable or refuses the
    # resolution inside a job; the mapping of a server branch to a major line is
    # the one thing this fallback has to know, and it comes from the release
    # list of nextcloud-releases/groupfolders, read on 2026-09-03: the 20 line
    # carries Nextcloud 32, 21 carries 33 and 22 carries 34.
    - name: Install the Team folders app
      if: inputs.install-groupfolders == 'true'
      shell: bash
      env:
        SERVER_VERSION: ${{ inputs.server-version }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        if ./occ app:install groupfolders --force; then
          echo "groupfolders came from the app store"
        else
          case "${SERVER_VERSION}" in
            stable32) tag='v20.1.18' ;;
            stable33) tag='v21.0.15' ;;
            stable34) tag='v22.0.6' ;;
            *)
              echo "no groupfolders fallback release is recorded for ${SERVER_VERSION}"
              exit 1
              ;;
          esac
          echo "the app store did not deliver groupfolders, falling back to the tarball ${tag}"
          curl -sfSL -o "${RUNNER_TEMP_DIR}/groupfolders.tar.gz" \
            "https://github.com/nextcloud-releases/groupfolders/releases/download/${tag}/groupfolders-${tag}.tar.gz"
          tar -xzf "${RUNNER_TEMP_DIR}/groupfolders.tar.gz" -C apps
          echo "groupfolders came from the tarball ${tag}"
        fi
        # -f, because a fallback tarball may declare a version window that the
        # installed server sits at the edge of, and this is a throwaway instance
        # whose only job is to hold a mount that belongs to a group.
        ./occ app:enable -f groupfolders
        ./occ app:list | grep -A2 groupfolders || true

    # Everything from here to the end of this file belongs to the host process
    # path and is skipped for register-exapp: false. uv, the locked environment
    # and the German dictionary are part of it: the runtime image carries all
    # three, so a caller that lets a deploy daemon create the container needs
    # none of them on the runner.
    - name: Install uv
      if: inputs.register-exapp == 'true'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # Same uv release that produced backend/uv.lock, so --frozen resolves
        # identically here and on a developer machine.
        version: '0.11.7'
        enable-cache: true
        cache-dependency-glob: findling-src/backend/uv.lock

    - name: Install the locked backend environment
      if: inputs.register-exapp == 'true'
      shell: bash
      working-directory: findling-src/backend
      run: uv sync --frozen

    # The runtime image installs wngerman; the backend on this runner is a plain
    # process, so the same dictionary has to come from apt. Without it every
    # indexing pass of the armed poller dies in a FileNotFoundError on
    # /usr/share/dict/ngerman before it ever claims a queue row (first run of
    # the resilience gate).
    - name: Install the German dictionary the analyzer reads
      if: inputs.register-exapp == 'true'
      shell: bash
      run: |
        if [ ! -f /usr/share/dict/ngerman ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq wngerman
        fi
        wc -l /usr/share/dict/ngerman

    # The backend runs as a plain process, not as a container: phase 1 proves the
    # integration path, the image is a separate workflow. The HaRP shared key is
    # deliberately absent, because setting it would make the server bind a unix
    # socket instead of the TCP port, and nothing here speaks to that socket
    # (pitfall 5).
    - name: Start the ExApp
      if: inputs.register-exapp == 'true'
      shell: bash
      working-directory: findling-src/backend
      env:
        EXAPP_SECRET: ${{ inputs.exapp-secret }}
        EXAPP_PORT: ${{ inputs.exapp-port }}
        EXAPP_VERSION: ${{ steps.app-version.outputs.version }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        export APP_ID=findling_backend
        export APP_SECRET="${EXAPP_SECRET}"
        export APP_PORT="${EXAPP_PORT}"
        export APP_VERSION="${EXAPP_VERSION}"
        export APP_HOST=127.0.0.1
        export NEXTCLOUD_URL=http://localhost:8080
        export APP_PERSISTENT_STORAGE="${RUNNER_TEMP_DIR}/findling"
        mkdir -p "${APP_PERSISTENT_STORAGE}"
        uv run python -m findling.main > "${RUNNER_TEMP_DIR}/exapp.log" 2>&1 &
        echo $! > "${RUNNER_TEMP_DIR}/exapp.pid"

    - name: Wait for the ExApp heartbeat
      if: inputs.register-exapp == 'true'
      shell: bash
      env:
        EXAPP_PORT: ${{ inputs.exapp-port }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        for _ in $(seq 1 30); do
          if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
            echo "exapp is up"
            exit 0
          fi
          sleep 1
        done
        echo "exapp did not answer on http://127.0.0.1:${EXAPP_PORT}/heartbeat"
        cat "${RUNNER_TEMP_DIR}/exapp.log" || true
        exit 1

    - name: Register the manual install daemon
      if: inputs.register-exapp == 'true'
      shell: bash
      run: |
        timeout 10 ./occ app_api:daemon:register --net host \
          manual_install "Manual Install" manual-install http localhost http://localhost:8080

    # The registration blocks until the handshake is through, which is what turns a
    # race into a verdict. access_level is numeric on the JSON path (1 is USER),
    # symbolic only in info.xml.
    #
    # The route list is exactly the productive one from backend/appinfo/info.xml:
    # three entries, POST on search and snippets at USER level, GET on status at
    # ADMIN level. It used to be url ".*" with all four writing verbs, which
    # registered an instance no user will ever have and left the route
    # restriction itself untested. If a later phase adds a route to info.xml and
    # forgets it here, the integration job is what says so.
    #
    # It said so. Phase 2 put snippets and status into info.xml and left this
    # list at the single entry of phase 1, and an unlisted route is refused by
    # the proxy, so every search would have come back with hits and never with a
    # text excerpt: the second call is where the excerpt comes from. Found while
    # building the end to end job of plan 02-14, which is the job that asserts an
    # excerpt exists.
    #
    # /enabled, /heartbeat and /init are absent on purpose and the registration
    # still completes: AppAPI addresses those three directly instead of going
    # through the proxy, which is the assumption info.xml states and this run
    # verifies. bruteforce_protection is left out here, unlike in info.xml,
    # because it changes what happens after a 401 and not which routes exist.
    - name: Register the ExApp
      if: inputs.register-exapp == 'true'
      shell: bash
      env:
        EXAPP_SECRET: ${{ inputs.exapp-secret }}
        EXAPP_PORT: ${{ inputs.exapp-port }}
        EXAPP_VERSION: ${{ steps.app-version.outputs.version }}
      run: |
        timeout 120 ./occ app_api:app:register findling_backend manual_install --json-info \
          "{\"id\":\"findling_backend\",\"name\":\"Findling Backend\",\"daemon_config_name\":\"manual_install\",\"version\":\"${EXAPP_VERSION}\",\"secret\":\"${EXAPP_SECRET}\",\"port\":${EXAPP_PORT},\"scopes\":[],\"system\":0,\"routes\":[{\"url\":\"search\",\"verb\":\"POST\",\"access_level\":1,\"headers_to_exclude\":[]},{\"url\":\"snippets\",\"verb\":\"POST\",\"access_level\":1,\"headers_to_exclude\":[]},{\"url\":\"status\",\"verb\":\"GET\",\"access_level\":2,\"headers_to_exclude\":[]}]}" \
          --force-scopes --wait-finish
