name: Resilience

# Why this proof gets a workflow of its own instead of a third job in
# integration.yml: a red kill-resume gate is a different verdict from a broken
# search, and in the run list of a pull request the two must not be confusable.
# "The first index survives every abort" is the promise that separates this phase
# from its predecessor, and a promise without a gate is an assertion. It also
# keeps integration.yml free for the search proof of plan 02-14.
#
# Every number this workflow asserts on comes out of the state database and out
# of the tantivy index, read with findling.tools.index_status. A proof that rests
# on a log line this project writes itself proves the log line.
#
# What a run costs, stated openly: the SIGKILL leaves the rows that were in
# flight locked in the queue, and they only come back after QueueMapper's
# LOCK_TIMEOUT of 900 seconds. A green run therefore takes upwards of a quarter
# of an hour. That wait is the point rather than the price: with the 24 hour
# timeout of the app this queue is modelled on (pitfall 7), the same wait would
# never end.
on:
  push:
    paths:
      - 'backend/**'
      - 'php/**'
      - '.github/workflows/resilience.yml'
      # The whole setup up to the registered ExApp lives in a composite action,
      # so a change there is a change to this workflow.
      - '.github/actions/setup-test-nc/**'
  # The measurement job produces numbers and guards no regression, so it runs on
  # a schedule and on demand rather than on every push. Monday morning, before
  # anybody is looking at the repository.
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Both jobs install a whole Nextcloud or build the image, so
# a superseded run is expensive to keep alive.
concurrency:
  group: resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kill-resume:
    name: kill-resume
    # Never on the schedule: this is a gate on the code, and a gate that runs
    # without a change to look at only produces noise.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # The deadline is not derived from the measured runtime here, and the reason
    # is worth a sentence. Measured, this job takes one minute and forty seconds
    # to two minutes and twenty seconds (the six most recent runs, read on
    # 03.09.2026). But its own two ceilings allow far more: MIDRUN_TIMEOUT is 300
    # seconds and DRAIN_TIMEOUT is 1200, so a run that waits for the locked rows
    # to come back may legitimately spend twenty five minutes waiting before it
    # says anything. A deadline under that would kill runs the job itself still
    # considers healthy and would report an infrastructure verdict as a code
    # verdict. Forty minutes is those twenty five plus the installation.
    #
    # Raised to fifty five with the two DI-05-36 steps of plan 06.1-01: they add
    # two waits of UNARMED_TIMEOUT (300 s each, and the negative control always
    # waits its full period) plus two restarts of the container. Forty would
    # have left the sum of the ceilings above the deadline again, which is the
    # exact mistake the paragraph above warns about.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      # Test only values of a throwaway instance that is destroyed with the
      # runner. Nothing here is reused and no real secret is needed: every
      # question this job asks goes through occ or through the command line tool,
      # never through an authenticated HTTP route.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # How much work has to sit in the account before the crawl starts. Enough
      # that documents are still open while others are already done, which is the
      # state the kill has to fall into.
      CORPUS_FILES: '200'
      # Ceiling of the wait for that state. Reaching it is a failure with the
      # last counters printed, not a job that hangs until the runner is reaped.
      MIDRUN_TIMEOUT: '300'
      # Ceiling of the wait for an empty queue after the restart. Above
      # QueueMapper::LOCK_TIMEOUT (900 s), because the rows the killed process
      # held come back exactly then. This number is what turns pitfall 7 into a
      # test: a lock timeout of a day would blow it every single time.
      DRAIN_TIMEOUT: '1200'
      # The wait of the two DI-05-36 steps below, and the clock it is taken from
      # is named rather than guessed: RETREAT_MAX_SECONDS in
      # backend/src/findling/worker/poller.py, the ceiling of the retreat a
      # poller goes into when the queue does not answer, is 300 seconds. That is
      # the slowest clock a first pass after a restart can sit behind, so a
      # shorter wait would declare a container dead that is only waiting.
      #
      # The counter proof stops as soon as it has its pass; the negative control
      # waits the whole period out, because a control that stops early only says
      # that nothing has happened yet.
      #
      # Going over this number is a finding and not a reason to raise it until
      # the step passes. A first pass that needs more than the retreat ceiling
      # means something else is wrong, and raising the wait would hide it.
      UNARMED_TIMEOUT: '300'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance.
      #
      # Both checkouts stay in this order. actions/checkout empties its target
      # directory, so the server checkout at the workspace root has to come
      # first, and the second one is what puts the composite action below into
      # the workspace at all.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # Copies of the reference corpus rather than generated files: they carry the
      # cases that end in every state this job counts, a readable PDF, a scan
      # without a text layer, an encrypted one and an empty one. The corpus itself
      # is never modified, it is only copied, so gate B in integration.yml keeps
      # asserting against the very same bytes.
      - name: Multiply the reference corpus until the account holds enough work
        run: |
          per_copy=$(find findling-src/testdata/corpus -type f | wc -l)
          # Twice the arithmetic: the crawl's extension allowlist keeps files
          # out of the queue entirely (the png of the nine file corpus), so the
          # number of JUDGED files per copy is lower than the number of files on
          # disk, and a plus-one margin still left the 200 floor unreachable
          # (8 judged per copy, runs saw 185 and 193). Doubling is cheap here,
          # the corpus is small, and it keeps this arithmetic out of the way of
          # every future corpus change.
          copies=$(( ((CORPUS_FILES + per_copy - 1) / per_copy) * 2 ))
          for number in $(seq 1 "${copies}"); do
            cp -r findling-src/testdata/corpus "data/admin/files/corpus-${number}"
          done
          ./occ files:scan --all
          echo "the account holds $(find data/admin/files -type f | wc -l) files in ${copies} copies of the corpus"

      # Background jobs do not run by themselves in this CI, so both halves are
      # started by hand. The scheduler creates one crawl job per mount, the crawl
      # walks the mount in slices and plans its own successor, which is why the
      # worker runs with --stop_after instead of --once.
      - name: Queue the crawl
        run: |
          # --no-interaction: occ treats this shell as interactive (no TTY check
          # in this image), so the restart confirmation would default to No and
          # the whole run would wait on an empty queue, which is exactly what
          # happened on the first run of this gate.
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          ./occ findling:index

      # The crawl runs in the background on purpose. It has to keep filling the
      # queue while the container is already emptying it, because the state this
      # step waits for, some documents done and others still open, is exactly the
      # overlap of the two. A crawl that finished first could make that window
      # disappear entirely and the job would fail for a reason that is not a
      # defect.
      - name: Crawl, and kill the container in the middle of the first index
        run: |
          # stop_after with an underscore: the dashed spelling does not exist on
          # background-job:worker, Symfony rejects it and the crawl never runs
          # (second first-run finding of this gate).
          # 240 seconds: the crawl walks the mount in slices and plans its own
          # successor, and a worker that stops before the last slice leaves the
          # remaining files unqueued with nobody left to run the successor job
          # (a 120 s worker enqueued 193 of 222 files). The kill window this
          # step waits for opens long before the crawl ends, so the longer
          # worker costs nothing there.
          timeout 300 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 240 \
            > "${{ runner.temp }}/crawl.log" 2>&1 &

          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          # scheduled plus the rows a worker holds. Both come out of the queue
          # table of Nextcloud, so "still open" is a fact and not a guess.
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          deadline=$(( $(date +%s) + MIDRUN_TIMEOUT ))
          while :; do
            report=$(status)
            indexed=$(echo "${report}" | jq -r '.indexed')
            open=$(open_rows)
            echo "waiting for the middle of the run: indexed=${indexed} open=${open}"
            if [ "${indexed}" -gt 0 ] && [ "${open}" -gt 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "the run never reached the state this test needs: some documents done and others still open"
              echo "${report}"
              ./occ findling:index
              # The crawl worker runs detached; without its log a dead worker
              # and an empty account look identical from here.
              echo "--- crawl worker log ---"
              cat "${{ runner.temp }}/crawl.log" || true
              exit 1
            fi
            sleep 1
          done

          # SIGKILL, no cleanup, no SIGTERM path and therefore no unlock of the
          # rows this process holds. Semantically the same event as docker kill,
          # and APP_PERSISTENT_STORAGE survives it untouched, which is the only
          # reason the test proves anything at all.
          kill -9 "$(cat "${{ runner.temp }}/exapp.pid")"
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done

          # Counters read after the process is gone, so they are the state at the
          # moment of death rather than a moving target.
          report=$(status)
          echo "::group::counters at the moment of the kill"
          echo "${report}"
          echo "::endgroup::"
          {
            echo "indexed_before=$(echo "${report}" | jq -r '.indexed')"
            echo "docs_before=$(echo "${report}" | jq -r '.docs')"
          } >> "${GITHUB_ENV}"

      - name: Start the container again on the very same volume
        working-directory: findling-src/backend
        run: |
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          # The same directory as before the kill. Pointing this somewhere else
          # would leave the test asserting against a fresh index, and it would be
          # green for the wrong reason.
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          # Resolved first and started directly: $! after "uv run ... &" names
          # uv, not the server. See the same two lines in
          # .github/actions/setup-test-nc/action.yml for the whole reasoning.
          server_python=$(uv run python -c 'import sys; print(sys.executable)')
          "${server_python}" -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "the container answers again"
              exit 0
            fi
            sleep 1
          done
          echo "the container did not come back"
          tail -50 "${{ runner.temp }}/exapp.log" || true
          exit 1

      # A restarted process starts silenced. The indexing task is armed by the
      # AppAPI enable call and by nothing else, and AppAPI has no idea that the
      # process behind the port was replaced. In a deployment the container is
      # restarted by AppAPI, which sends that call; here it is two occ commands.
      # Without them the resume half of this test would wait for a container that
      # is up, healthy and deliberately doing nothing.
      - name: Arm the indexing task again
        run: |
          ./occ app_api:app:disable findling_backend
          ./occ app_api:app:enable findling_backend

      # The counter proof to the step above, and it asks a different question.
      # That step restarted the container AND armed it again by hand, because a
      # restarted process used to come up silenced under every circumstance.
      # This one leaves exactly that handle away, which is what a user gets
      # after a restart of the machine or after the docker policy restarted the
      # container following an out of memory kill: AppAPI sends
      # PUT /enabled?enabled=1 once, when it enables the ExApp, and none of its
      # three background jobs ever sends it again.
      #
      # The counted quantity is either of the two lines an armed poller writes
      # (backend/src/findling/worker/poller.py): "pass finished" when it had
      # rows to claim, which is how the box was read on 05.09.2026 (zero passes
      # while unarmed, fourteen after the registration,
      # docs/measurements/2026-09-05-semantiklauf-m7g), and "armed and the work
      # stock is empty" when it had none. A silenced poller writes neither,
      # because it never enters a pass.
      #
      # SIGTERM and not SIGKILL, deliberately. The kill earlier in this job is
      # the subject of the resume test; here the restart is only the vehicle,
      # and a hard kill would lock the rows this process holds for another
      # LOCK_TIMEOUT and push the drain below over its own ceiling.
      - name: A restart that nobody armed keeps indexing (DI-05-36)
        run: |
          log="${{ runner.temp }}/exapp.log"
          pidfile="${{ runner.temp }}/exapp.pid"

          # SIGTERM, and then wait for the process to be gone rather than for
          # the port to go quiet. The shutdown of the lifespan is allowed 30
          # seconds for the poller and 30 more for the reconcile
          # (POLLER_STOP_SECONDS, RECONCILE_STOP_SECONDS), and a pass that is
          # still running in there writes its own "pass finished" line on the
          # way out. Starting the count before that line lands would credit the
          # restarted container with a pass of its predecessor.
          previous=$(cat "${pidfile}")
          kill "${previous}" 2>/dev/null || true
          for _ in $(seq 1 90); do
            if ! kill -0 "${previous}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "${previous}" 2>/dev/null; then
            echo "the process ignored SIGTERM for 90 seconds, taking it down hard"
            kill -9 "${previous}" 2>/dev/null || true
            sleep 5
          fi

          # After the process is gone, never before: every line the armed
          # process still wrote between here and its death would otherwise be
          # counted as a pass of the restarted one.
          before=$(wc -l < "${log}")

          (
            cd findling-src/backend || exit 1
            export APP_ID=findling_backend
            export APP_SECRET="${EXAPP_SECRET}"
            export APP_PORT="${EXAPP_PORT}"
            export APP_VERSION=0.1.0
            export APP_HOST=127.0.0.1
            export NEXTCLOUD_URL=http://localhost:8080
            # The same volume as before, which is where the mark of the last
            # enable lies. A fresh directory here would make this step green
            # for the wrong reason twice over.
            export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
            # Resolved first and started directly, so that $! is the server.
            server_python=$(uv run python -c 'import sys; print(sys.executable)')
            "${server_python}" -m findling.main >> "${log}" 2>&1 &
            echo $! > "${pidfile}"
          )
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              break
            fi
            sleep 1
          done
          # Said separately from the count below, because the two failures mean
          # different things: a container that never came back is an
          # infrastructure verdict, and reporting it as DI-05-36 would send the
          # next reader after the wrong defect.
          if ! curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
            echo "the container did not come back after the restart, so this step judges nothing"
            tail -n 50 "${log}" || true
            exit 1
          fi

          # Two lines and not one, because "pass finished" alone is a statement
          # about the work stock and not about the indexing task: the poller
          # writes it only for a pass that claimed rows, and returns silently
          # from a pass that found the queue empty. The corpus of this job
          # reaches a terminal verdict for every one of its files while the kill
          # step is still waiting, so by the time this step runs there is
          # regularly nothing left to claim, and a correctly armed container
          # wrote not a single line. That is what turned this gate red on
          # 06.09.2026 (run 34056709826) while the restarted container had
          # logged "was enabled before this start" three lines earlier.
          # "armed and the work stock is empty" is the counterpart: an armed
          # poller writes it once per arming, a silenced one never enters the
          # pass at all, so together the two cover both states the gate is about.
          armed='pass finished|armed and the work stock is empty'
          started=$(date +%s)
          deadline=$(( started + UNARMED_TIMEOUT ))
          while :; do
            passes=$(tail -n "+$(( before + 1 ))" "${log}" | grep -cE "${armed}" || true)
            if [ "${passes}" -gt 0 ]; then
              echo "the restarted container armed itself: ${passes} lines after $(( $(date +%s) - started )) seconds"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "the container came up unarmed and stayed that way for ${UNARMED_TIMEOUT} seconds (DI-05-36)"
              echo "what a user gets in this state: a container that answers searches, reports its version,"
              echo "looks reachable on the status page and never indexes another file until somebody"
              echo "disables and enables the app by hand"
              tail -n 50 "${log}" || true
              exit 1
            fi
            sleep 5
          done

      # Without this control the step above is worth nothing. A restart test
      # that would also be green if the mark did nothing measures the presence
      # of a container, not the repair of DI-05-36. So the same procedure runs
      # once more with the mark removed, and it has to produce exactly zero
      # passes.
      #
      # The path of the mark is read out of the settings rather than spelled
      # here, so a rename in the code cannot leave this control silently
      # pointing at a file that no longer exists, which would make it pass for
      # the worst possible reason.
      - name: The same restart without the mark indexes nothing (negative control)
        run: |
          log="${{ runner.temp }}/exapp.log"
          pidfile="${{ runner.temp }}/exapp.pid"
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          marker=$( cd findling-src/backend && uv run python -c \
            'from findling.config import settings; print(settings().armed_marker)' )
          echo "the mark of the last enable: ${marker}"
          if [ ! -f "${marker}" ]; then
            echo "there is no mark to remove, so the step above proved something other than the mark"
            exit 1
          fi

          # SIGTERM, and then wait for the process to be gone rather than for
          # the port to go quiet. The shutdown of the lifespan is allowed 30
          # seconds for the poller and 30 more for the reconcile
          # (POLLER_STOP_SECONDS, RECONCILE_STOP_SECONDS), and a pass that is
          # still running in there writes its own "pass finished" line on the
          # way out. Starting the count before that line lands would credit the
          # restarted container with a pass of its predecessor.
          previous=$(cat "${pidfile}")
          kill "${previous}" 2>/dev/null || true
          for _ in $(seq 1 90); do
            if ! kill -0 "${previous}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "${previous}" 2>/dev/null; then
            echo "the process ignored SIGTERM for 90 seconds, taking it down hard"
            kill -9 "${previous}" 2>/dev/null || true
            sleep 5
          fi

          rm "${marker}"
          before=$(wc -l < "${log}")

          (
            cd findling-src/backend || exit 1
            export APP_ID=findling_backend
            export APP_SECRET="${EXAPP_SECRET}"
            export APP_PORT="${EXAPP_PORT}"
            export APP_VERSION=0.1.0
            export APP_HOST=127.0.0.1
            export NEXTCLOUD_URL=http://localhost:8080
            # Resolved first and started directly, so that $! is the server.
            server_python=$(uv run python -c 'import sys; print(sys.executable)')
            "${server_python}" -m findling.main >> "${log}" 2>&1 &
            echo $! > "${pidfile}"
          )
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              break
            fi
            sleep 1
          done
          # A container that is not running would produce zero passes for the
          # most useless of reasons, and this control would call that a success.
          if ! curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
            echo "the container did not come back after the restart, so zero passes would prove nothing"
            tail -n 50 "${log}" || true
            exit 1
          fi

          # The whole period, not the first sign of life: this half asserts an
          # absence, and an absence is only worth the time it was watched for.
          sleep "${UNARMED_TIMEOUT}"
          # The same two lines the step above counts. Watching only for
          # "pass finished" would let this control pass on an empty work stock
          # even if the mark did nothing at all, which is the very way a control
          # goes green without controlling anything.
          armed='pass finished|armed and the work stock is empty'
          passes=$(tail -n "+$(( before + 1 ))" "${log}" | grep -cE "${armed}" || true)
          if [ "${passes}" -ne 0 ]; then
            echo "the container armed itself ${passes} times without the mark, so the mark is not what arms it"
            echo "and the step before this one is green for a reason nobody knows"
            exit 1
          fi
          echo "without the mark: nothing armed in ${UNARMED_TIMEOUT} seconds, the gate can be red"

          # Back to the ordinary way, so every step after this one keeps the
          # precondition it was written with: an armed container.
          ./occ app_api:app:disable findling_backend
          ./occ app_api:app:enable findling_backend
          if [ ! -f "${marker}" ]; then
            echo "the enable did not write the mark back, the steps after this one have no armed container"
            exit 1
          fi

      - name: Wait until nothing is open any more
        run: |
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          started=$(date +%s)
          deadline=$(( started + DRAIN_TIMEOUT ))
          while :; do
            open=$(open_rows)
            report=$( cd findling-src/backend && uv run python -m findling.tools.index_status \
              --db "${{ runner.temp }}/findling/state.db" )
            echo "draining: open=${open} indexed=$(echo "${report}" | jq -r '.indexed') docs=$(echo "${report}" | jq -r '.docs')"
            if [ "${open}" -eq 0 ]; then
              echo "the queue is empty after $(( $(date +%s) - started )) seconds of waiting"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "the queue did not drain within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 15
          done

      # The three assertions of the acceptance test, each with its own message,
      # because the three failures mean three different things.
      - name: A hard kill costs no progress, and no document lies twice
        run: |
          report=$( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" )
          echo "::group::counters after the resume"
          echo "${report}"
          ./occ findling:index
          echo "::endgroup::"

          indexed=$(echo "${report}" | jq -r '.indexed')
          skipped=$(echo "${report}" | jq -r '.skipped')
          failed=$(echo "${report}" | jq -r '.failed')
          docs=$(echo "${report}" | jq -r '.docs')
          judged=$(( indexed + skipped + failed ))
          # The other side of the same run. The acknowledgement channel of the
          # queue carries FAILURES only (QueueService::acknowledge records
          # 'failed' rows and deletes everything else), so the one set the two
          # databases share is the failure set, and that is what is compared.
          # Verdicts for indexed and skipped files live in the container store
          # alone; asserting them on the Nextcloud side would assert a contract
          # the return channel never had (first run of this gate did exactly
          # that and compared 185 against 23).
          nc_failed=$(./occ findling:index | awk '
            $1 == "failed" { total += $2 }
            END { print total + 0 }')

          echo "indexed before the kill ${indexed_before}, after the resume ${indexed}"
          echo "documents in the index before the kill ${docs_before}, after the resume ${docs}"
          echo "failed in the container ${failed}, failures nextcloud recorded ${nc_failed}"

          if [ "${indexed}" -lt "${indexed_before}" ]; then
            echo "the restart lost progress: ${indexed} documents are indexed, ${indexed_before} were before the kill"
            exit 1
          fi
          if [ "${failed}" -ne "${nc_failed}" ]; then
            echo "the failure channel lost reports: the container failed ${failed} files, nextcloud recorded ${nc_failed}"
            exit 1
          fi
          if [ "${judged}" -lt "${CORPUS_FILES}" ]; then
            echo "too little work was done to prove anything: ${judged} files judged, at least ${CORPUS_FILES} expected"
            exit 1
          fi
          if [ "${docs}" -ne "${indexed}" ]; then
            echo "a document lies twice in the index: ${docs} documents against ${indexed} indexed files"
            exit 1
          fi
          echo "kill-resume holds: ${judged} files judged, ${docs} documents, nothing lost and nothing doubled"

      - name: Everything the failure had to say
        if: failure()
        run: |
          echo "--- counters ---"
          ( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" ) || true
          ./occ findling:index || true
          ./occ app_api:app:list || true
          echo "--- crawl worker ---"
          tail -n 100 "${{ runner.temp }}/crawl.log" || echo "no crawl log written"
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- nextcloud ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # The third gate of this workflow, and the only one about a resource rather
  # than about a signal. The lowDisk path is built (MIN_FREE_BYTES, a pause
  # instead of a loss, the banner on the settings page) and it was driven twice
  # on the box in drill 3 of the 04.09.2026 run. That run produced DI-05-23: a
  # shortage of twenty seconds spent the delivery budget of every row in flight
  # and they ended as failed(repeatedly_stuck) while the page said the indexing
  # was merely paused. Plan 05-20 fixed it, and _abort now unlocks on every path
  # out of it.
  #
  # What has never been measured is the same path WHILE THE SECOND TRACK EMBEDS.
  # Since decision 06-07 the disk floor hangs on the IndexBatchWriter, so that
  # the index and the vector stock ask one directory about one number, and the
  # embedding branch answers the condition with _DiskTight from inside the per
  # file loop, long before the flush the index side pauses at. Built, not
  # measured, and this job is the measurement.
  #
  # Its own job and not a step of kill-resume, for two reasons and the second is
  # the hard one. The deadline arithmetic that job states about itself already
  # adds its ceilings up to fifty five minutes, and a drill that waits out a
  # shortage and a return would push the sum of the ceilings past the deadline
  # again, which is the exact mistake the paragraph up there warns about. And
  # the volume of this job has to be a mounted loop image BEFORE the composite
  # action starts the backend on it, because that action creates
  # APP_PERSISTENT_STORAGE itself and starts the process in the same run. A step
  # appended to kill-resume could not have done that without a second Nextcloud.
  #
  # Why a loop image, and not tmpfs and not a patched reader (06.1-RESEARCH
  # 5.1): tmpfs lies in RAM and falsifies exactly the size that is being
  # measured, and a mocked ceiling proves the mock. Here the free space is what
  # the file system says, read through the very shutil.disk_usage call that
  # resources.low_disk() makes, on a volume whose size this job chose. That the
  # volume really ends where the image ends is proven by a probe of its own
  # below, in the shape of the throttle probe of the measurement job: a write
  # past the end has to come back as ENOSPC from the kernel and has to say so in
  # words. A measuring instrument that cannot fail measures nothing.
  #
  # The drill itself deliberately stops short of a real ENOSPC. The floor exists
  # so that ENOSPC never happens, so the subject is the pause in front of it and
  # not the write that would fail behind it.
  #
  # Assumption A5 of 06.1-RESEARCH is what this job stands on: a GitHub runner
  # may mount a loop image with sudo. If it may not, the mount step below fails
  # with the message the runner gave, and the drill moves to plan 06.1-18 to be
  # driven locally or on the box. It is not quietly rebuilt on tmpfs, because
  # that would be a measurement of the wrong thing reported as this one.
  disk-full:
    name: disk-full
    # Never on the schedule, same rule as kill-resume: this is a gate on the
    # code, and a gate that runs without a change to look at only makes noise.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # The sum of the ceilings below plus the installation, the way kill-resume
    # derives its own. EMBED_START_TIMEOUT is 600, SETTLE_SECONDS is 30,
    # SHORTAGE_SECONDS is 150 and RESUME_TIMEOUT is 420, which is twenty minutes
    # of ceilings. The Nextcloud install, the image pull and the crawl worker sit
    # in front of that. Thirty minutes keeps the sum of the ceilings under the
    # deadline, which is the property that stops a red run from being an
    # infrastructure verdict dressed up as a code verdict.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      # Test only values of a throwaway instance that is destroyed with the
      # runner, the same ones kill-resume uses and for the same reason.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # Copies of the reference corpus. Enough that the first track is still
      # queueing work when the second track writes its first vector, because the
      # shortage has to fall INTO the embedding rather than behind it. Six and
      # not the fifty of kill-resume: this job installs no OCR engine, so the
      # pictures and the scans cost a verdict and not a rendering pass, and what
      # this drill needs is the overlap of the two tracks rather than a
      # particular number of files.
      CORPUS_COPIES: '6'
      # The model of the second track, taken out of the published image below.
      # Job level and not step level, so that it also reaches the backend the
      # composite action starts, the same reason it sits at job level in
      # integration.yml. Without a model directory _wire_the_second_track fails,
      # the track stays off for the whole process, and this job would be
      # measuring a disk pause of the index alone while claiming the other one.
      FINDLING_EMBED_MODEL_DIR: '${{ github.workspace }}/findling-model'
      # How much bigger than MIN_FREE_BYTES the volume is made. It has to carry
      # the state database, the index, the vector stock and the scratch of a few
      # hundred small documents and still leave the floor reachable by filling.
      # Four hundred mebibytes is far above what a corpus this size occupies, and
      # the step below prints what was really used.
      VOLUME_HEADROOM_BYTES: '419430400'
      # How far below the floor the shortage goes. Fifty mebibytes, so that the
      # condition is unambiguous from both sides: the container sees less than
      # MIN_FREE_BYTES, and the volume still holds room for everything the return
      # writes afterwards.
      SHORTFALL_BYTES: '52428800'
      # Ceiling of the wait for the state this drill needs before it may do
      # anything: the second track has written its first vector and the work
      # stock is not empty. Reaching it is a failure with the counters printed.
      EMBED_START_TIMEOUT: '600'
      # The pass that was in flight when the volume filled is allowed to end
      # before the counter is frozen. Without it the drill would race its own
      # baseline, and a vector written half a second after the fallocate would
      # read as a track that ignored the floor.
      SETTLE_SECONDS: '30'
      # How long the frozen counter has to stay frozen. Above
      # POLL_COOLDOWN_MAX_SECONDS, which is 120 in
      # backend/src/findling/config.py, and that is the whole reason for the
      # number: _abort backs the poller off on every paused pass and the backoff
      # doubles up to that cap, so a window shorter than the cap could contain no
      # attempt at all, and a counter that stood still would then say nothing.
      SHORTAGE_SECONDS: '150'
      # Ceiling of the wait for the return. The same backoff caps at 120 seconds,
      # so a container that comes back after two quiet minutes is behaving. Four
      # hundred and twenty is three and a half times that. Exceeding it is a
      # finding about the return and not a number to raise.
      RESUME_TIMEOUT: '420'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance.
      # Both checkouts stay in this order for the reason stated in kill-resume.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      # Two readers, written once and called from four steps. They are small
      # enough to have been heredocs at every call site; they are files because
      # both of them are the point of this job, and a reader that is copied four
      # times is a reader that drifts in three of them.
      - name: Put the two readers of this drill on the runner
        run: |
          cat > "${{ runner.temp }}/free_bytes.py" <<'PY'
          """Free bytes of a volume, through the very call the container makes.

          resources.low_disk() asks shutil.disk_usage(directory).free and holds it
          against MIN_FREE_BYTES. This asks the same question of the same
          directory, so the number in the log is the number the container decides
          on and not a second reading of the same disk by a different tool.
          """

          import shutil
          import sys

          print(shutil.disk_usage(sys.argv[1]).free)
          PY

          cat > "${{ runner.temp }}/vector_count.py" <<'PY'
          """Documents that carry at least one vector, or zero.

          Read over a read only connection and without the vec0 extension, because
          chunks is an ordinary table: the count needs neither the extension nor a
          running container. A stock that is not there yet answers zero rather
          than failing, which is the state every first round of a wait finds.
          """

          import sqlite3
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          if not database.is_file():
              print(0)
              raise SystemExit(0)

          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          row = None
          try:
              row = connection.execute("SELECT COUNT(DISTINCT file_id) FROM chunks").fetchone()
          except sqlite3.DatabaseError:
              # A stock that exists but carries no table yet is the same answer as
              # no stock at all: nothing has been embedded.
              row = None
          finally:
              connection.close()

          print(int(row[0]) if row else 0)
          PY

          python3 "${{ runner.temp }}/free_bytes.py" "${{ runner.temp }}" > /dev/null
          python3 "${{ runner.temp }}/vector_count.py" "${{ runner.temp }}/does-not-exist.db"

      # The volume, and every number about it is one this step chose and printed.
      # It has to exist before the composite action below, because that action
      # creates APP_PERSISTENT_STORAGE and starts the backend on it in one run.
      - name: Build the volume out of a loop image of a known size
        run: |
          volume_dir="${{ runner.temp }}/findling"
          volume_image="${{ runner.temp }}/findling-volume.img"
          echo "VOLUME_DIR=${volume_dir}" >> "${GITHUB_ENV}"
          echo "VOLUME_IMAGE=${volume_image}" >> "${GITHUB_ENV}"

          # The floor is read out of the source rather than repeated here. One
          # number in one place: a copy in this file would go stale the day
          # config.py moves it, and a drill whose shortage sits above the floor
          # is green without having measured anything at all.
          min_free=$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path("findling-src/backend/src/findling/config.py")
          match = re.search(r"^MIN_FREE_BYTES = ([0-9_]+)$", source.read_text(encoding="utf-8"), re.MULTILINE)
          if match is None:
              sys.exit("MIN_FREE_BYTES could not be read out of backend/src/findling/config.py")
          print(int(match.group(1).replace("_", "")))
          PY
          )
          echo "MIN_FREE_BYTES=${min_free}" >> "${GITHUB_ENV}"
          image_bytes=$(( min_free + VOLUME_HEADROOM_BYTES ))
          echo "the floor of this container is ${min_free} bytes, the volume is made ${image_bytes} bytes"

          truncate -s "${image_bytes}" "${volume_image}"
          # -F because the target is a regular file and not a block device, and
          # -m 0 because the five percent reserved for root would be taken off
          # exactly the figure this drill steers by: shutil.disk_usage reports
          # what an unprivileged writer may still have.
          mkfs.ext4 -qF -m 0 "${volume_image}"
          mkdir -p "${volume_dir}"

          # Assumption A5. If a runner refuses this, the message it gives is the
          # finding, and the drill moves to plan 06.1-18 rather than onto tmpfs.
          if ! sudo mount -o loop "${volume_image}" "${volume_dir}" 2> "${{ runner.temp }}/mount.txt"; then
            echo "::error::the runner refused to mount the loop image, so assumption A5 of 06.1-RESEARCH does not hold here"
            cat "${{ runner.temp }}/mount.txt" || true
            echo "The drill is not rebuilt on tmpfs. tmpfs lies in RAM and falsifies exactly the size"
            echo "this measures, so the disk drill belongs on the box instead, in plan 06.1-18."
            exit 1
          fi
          # The backend runs as the runner user, the fresh mount belongs to root.
          sudo chown "$(id -u):$(id -g)" "${volume_dir}"

          free_bytes=$(python3 "${{ runner.temp }}/free_bytes.py" "${volume_dir}")
          echo "the fresh volume has ${free_bytes} free bytes against a floor of ${min_free}"
          df -B1 "${volume_dir}"
          if [ "${free_bytes}" -le "${min_free}" ]; then
            echo "::error::the fresh volume already sits at or below the floor, so there would be nothing to fill"
            exit 1
          fi

      # The counter probe to the whole construction, in the shape of the throttle
      # probe of the measurement job. A write past the end of the image has to
      # come back as ENOSPC from the kernel and has to name it, otherwise the
      # shortage below would be a number this job invented about a volume that
      # does not really end anywhere.
      - name: Prove the volume really ends where the image ends
        run: |
          probe="${VOLUME_DIR}/enospc-probe"
          free_bytes=$(python3 "${{ runner.temp }}/free_bytes.py" "${VOLUME_DIR}")
          blocks=$(( free_bytes / 1048576 + 64 ))
          status=0
          dd if=/dev/zero of="${probe}" bs=1M count="${blocks}" 2> "${{ runner.temp }}/enospc.txt" || status=$?
          cat "${{ runner.temp }}/enospc.txt"
          rm -f "${probe}"
          if [ "${status}" -eq 0 ]; then
            echo "::error::the volume swallowed ${blocks} mebibytes although it holds fewer, so it is not the bounded file system this drill needs"
            exit 1
          fi
          if ! grep -qi 'no space left on device' "${{ runner.temp }}/enospc.txt"; then
            echo "::error::the write past the end failed for some other reason than ENOSPC"
            exit 1
          fi
          echo "the kernel refused the write past the end with ENOSPC, so the shortage below is a real one"
          python3 "${{ runner.temp }}/free_bytes.py" "${VOLUME_DIR}"

      # The model, out of the published image and not out of a download. The
      # identity of that model is asserted once, in the e2e job of
      # integration.yml, which pins its sha256 next to the revision it was
      # quantised from. It is deliberately not pinned a second time here: this
      # job measures a disk pause and not model quality, and a hash that has to
      # be updated in two files is a hash that ends up wrong in one of them. What
      # matters here is that the second track can be wired at all.
      - name: Take the embedding model out of the published image
        run: |
          image=ghcr.io/street1983nk/findling_backend:dev
          docker pull "${image}"
          container=$(docker create "${image}")
          rm -rf "${FINDLING_EMBED_MODEL_DIR}"
          docker cp "${container}:/usr/local/share/findling/model" "${FINDLING_EMBED_MODEL_DIR}"
          docker rm -f "${container}" > /dev/null
          ls -l "${FINDLING_EMBED_MODEL_DIR}"
          if [ ! -s "${FINDLING_EMBED_MODEL_DIR}/model.onnx" ] \
             || [ ! -s "${FINDLING_EMBED_MODEL_DIR}/tokenizer.json" ]; then
            echo "::error::the published image carries no usable model directory, so the second track cannot run here"
            exit 1
          fi

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # The mount has to have survived the composite action, which creates
      # APP_PERSISTENT_STORAGE with mkdir -p and would have made an ordinary
      # directory on the runner disk if anything had unmounted it. A drill that
      # ran on the runner disk would never reach a floor at all, and it would be
      # green.
      - name: The backend really writes into the loop image
        run: |
          findmnt --target "${VOLUME_DIR}"
          source=$(findmnt -no SOURCE --target "${VOLUME_DIR}")
          echo "${VOLUME_DIR} is served by ${source}"
          case "${source}" in
            /dev/loop*) ;;
            *)
              echo "::error::the volume is not the loop image any more, so nothing below would be a measurement"
              exit 1
              ;;
          esac

      - name: Multiply the reference corpus into the account
        run: |
          for number in $(seq 1 "${CORPUS_COPIES}"); do
            cp -r findling-src/testdata/corpus "data/admin/files/corpus-${number}"
          done
          ./occ files:scan --all
          echo "the account holds $(find data/admin/files -type f | wc -l) files in ${CORPUS_COPIES} copies of the corpus"

      # Background jobs do not run by themselves in this CI, so the crawl is
      # started by hand and left running: it has to keep filling the queue while
      # the container is already emptying it, because the state the next step
      # waits for is the overlap of the two tracks.
      - name: Queue the crawl and let it run
        run: |
          # --no-interaction for the reason kill-resume names: occ reads this
          # shell as interactive, so the restart confirmation would default to No
          # and the whole run would wait on an empty queue.
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          # stop_after with an underscore: the dashed spelling does not exist on
          # background-job:worker and Symfony rejects it.
          timeout 420 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 360 \
            > "${{ runner.temp }}/crawl.log" 2>&1 &
          ./occ findling:index

      # The window this whole job is about: the second track has written vectors
      # and there is still work in the stock. Filling the volume before the first
      # vector exists would measure a pause of the index alone, and filling it
      # after the stock ran dry would measure nothing at all.
      - name: Fill the volume while the second track is writing vectors
        run: |
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }
          failed_rows() {
            ./occ findling:index | awk '$1 == "failed" { total += $2 } END { print total + 0 }'
          }

          deadline=$(( $(date +%s) + EMBED_START_TIMEOUT ))
          while :; do
            carrying=$(python3 "${{ runner.temp }}/vector_count.py" "${VOLUME_DIR}/vectors.db")
            open=$(open_rows)
            echo "waiting for the overlap of the two tracks: vectors=${carrying} open=${open}"
            if [ "${carrying}" -gt 0 ] && [ "${open}" -gt 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the second track never wrote a vector while work was still open, so there is no shortage to fall into"
              ./occ findling:index || true
              tail -n 100 "${{ runner.temp }}/exapp.log" || true
              echo "--- crawl worker ---"
              tail -n 50 "${{ runner.temp }}/crawl.log" || true
              exit 1
            fi
            sleep 2
          done

          free_before=$(python3 "${{ runner.temp }}/free_bytes.py" "${VOLUME_DIR}")
          # The ballast is allocated and not written: fallocate reserves the
          # blocks in one call, so the shortage arrives at a moment this job can
          # name instead of over the seconds a copy would take. Its size follows
          # from the reading above, so the volume ends up SHORTFALL_BYTES under
          # the floor whatever the container has already occupied.
          target_free=$(( MIN_FREE_BYTES - SHORTFALL_BYTES ))
          ballast=$(( free_before - target_free ))
          if [ "${ballast}" -le 0 ]; then
            echo "::error::the volume already sits at or below the target of ${target_free} bytes, so there is nothing left to fill"
            exit 1
          fi
          fallocate -l "${ballast}" "${VOLUME_DIR}/ballast.bin"
          free_after=$(python3 "${{ runner.temp }}/free_bytes.py" "${VOLUME_DIR}")

          paused_before=$(grep -c 'index paused, free space below the floor' "${{ runner.temp }}/exapp.log" || true)
          open_at_fill=$(open_rows)
          failed_at_fill=$(failed_rows)
          echo "free before ${free_before}, ballast ${ballast}, free after ${free_after}, floor ${MIN_FREE_BYTES}"
          echo "work stock at the fill ${open_at_fill}, failures nextcloud had recorded ${failed_at_fill}"
          if [ "${free_after}" -ge "${MIN_FREE_BYTES}" ]; then
            echo "::error::the volume still holds ${free_after} bytes, which is at or above the floor, so the container sees no shortage"
            exit 1
          fi
          {
            echo "FREE_BEFORE=${free_before}"
            echo "FREE_TIGHT=${free_after}"
            echo "OPEN_AT_FILL=${open_at_fill}"
            echo "FAILED_AT_FILL=${failed_at_fill}"
            echo "PAUSED_LINES_BEFORE=${paused_before}"
          } >> "${GITHUB_ENV}"

      # Finding one and finding two, and they are two different sentences. One:
      # the second track stops writing while the floor is undercut. Two: it does
      # not pay for that with the work stock, which is the regression DI-05-23
      # was, where a shortage of twenty seconds turned every row in flight into
      # failed(repeatedly_stuck).
      #
      # The counted log line is a liveness witness and nothing else. A counter
      # that stands still cannot on its own tell a poller that refused from a
      # poller that was asleep, so the line says that an attempt happened; what
      # the attempt did is then read out of the two databases. Both branches that
      # pause write the same sentence, so it does not name which of them fired,
      # and it is not asked to: in this window the work stock holds nothing but
      # the trailing track and the unchanged files the crawl keeps handing it.
      - name: The second track pauses, and no work is written off
        run: |
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }
          failed_rows() {
            ./occ findling:index | awk '$1 == "failed" { total += $2 } END { print total + 0 }'
          }

          echo "letting the pass that was in flight end, ${SETTLE_SECONDS} seconds"
          sleep "${SETTLE_SECONDS}"
          frozen=$(python3 "${{ runner.temp }}/vector_count.py" "${VOLUME_DIR}/vectors.db")
          echo "the vector stock stands at ${frozen} documents with the volume under its floor"

          lowest_open=$(open_rows)
          deadline=$(( $(date +%s) + SHORTAGE_SECONDS ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            sleep 15
            carrying=$(python3 "${{ runner.temp }}/vector_count.py" "${VOLUME_DIR}/vectors.db")
            open=$(open_rows)
            free_now=$(python3 "${{ runner.temp }}/free_bytes.py" "${VOLUME_DIR}")
            echo "under the floor: vectors=${carrying} open=${open} free=${free_now}"
            if [ "${open}" -lt "${lowest_open}" ]; then
              lowest_open="${open}"
            fi
            if [ "${carrying}" -ne "${frozen}" ]; then
              echo "::error::the second track wrote vectors below the floor: ${carrying} documents against the ${frozen} it stood at"
              exit 1
            fi
          done

          paused_now=$(grep -c 'index paused, free space below the floor' "${{ runner.temp }}/exapp.log" || true)
          failed_now=$(failed_rows)
          echo "paused passes in the log before the fill ${PAUSED_LINES_BEFORE}, now ${paused_now}"
          echo "work stock at the fill ${OPEN_AT_FILL}, lowest seen under the floor ${lowest_open}"
          echo "failures nextcloud recorded at the fill ${FAILED_AT_FILL}, now ${failed_now}"

          if [ "${paused_now}" -le "${PAUSED_LINES_BEFORE}" ]; then
            echo "::error::not one pass paused in ${SHORTAGE_SECONDS} seconds under the floor, so the counter that stood still says nothing"
            tail -n 100 "${{ runner.temp }}/exapp.log" || true
            exit 1
          fi
          if [ "${lowest_open}" -le 0 ]; then
            echo "::error::the work stock ran to zero under the floor, so the shortage cost work instead of time (DI-05-23)"
            ./occ findling:index || true
            exit 1
          fi
          if [ "${failed_now}" -ne "${FAILED_AT_FILL}" ]; then
            echo "::error::rows ended as failures under the floor: ${failed_now} against the ${FAILED_AT_FILL} of the fill, which is the DI-05-23 signature"
            ./occ findling:index || true
            exit 1
          fi
          echo "FROZEN_VECTORS=${frozen}" >> "${GITHUB_ENV}"

      # Finding three, and it is the one that separates a pause from a quiet
      # loss. A track that stopped and never came back would have satisfied both
      # findings above.
      - name: Freeing the space brings the second track back
        run: |
          rm -f "${VOLUME_DIR}/ballast.bin"
          free_again=$(python3 "${{ runner.temp }}/free_bytes.py" "${VOLUME_DIR}")
          echo "free before the fill ${FREE_BEFORE}, under the floor ${FREE_TIGHT}, after the ballast went ${free_again}"
          if [ "${free_again}" -lt "${MIN_FREE_BYTES}" ]; then
            echo "::error::the volume is still under its floor after the ballast was removed"
            exit 1
          fi

          deadline=$(( $(date +%s) + RESUME_TIMEOUT ))
          while :; do
            carrying=$(python3 "${{ runner.temp }}/vector_count.py" "${VOLUME_DIR}/vectors.db")
            echo "waiting for the return: vectors=${carrying}, frozen at ${FROZEN_VECTORS}"
            if [ "${carrying}" -gt "${FROZEN_VECTORS}" ]; then
              echo "the second track came back: ${FROZEN_VECTORS} documents carried a vector under the floor, ${carrying} carry one now"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the second track did not write a single vector in ${RESUME_TIMEOUT} seconds after the space came back"
              echo "That is a finding about the return out of the pause and not a deadline to raise: the poller"
              echo "backs off to at most POLL_COOLDOWN_MAX_SECONDS, which is 120."
              ./occ findling:index || true
              tail -n 100 "${{ runner.temp }}/exapp.log" || true
              exit 1
            fi
            sleep 10
          done

      - name: Everything the failure had to say
        if: failure()
        run: |
          echo "--- the volume ---"
          df -B1 "${VOLUME_DIR}" || true
          findmnt --target "${VOLUME_DIR}" || true
          ls -l "${VOLUME_DIR}" || true
          echo "--- counters ---"
          ( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${VOLUME_DIR}/state.db" ) || true
          ./occ findling:index || true
          echo "--- crawl worker ---"
          tail -n 100 "${{ runner.temp }}/crawl.log" || echo "no crawl log written"
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- nextcloud ---"
          tail -n 100 data/nextcloud.log || echo "no data/nextcloud.log written"

      # Always, and in this order. A failed run that left a mounted loop image
      # behind hands the next job on this runner a volume of nine hundred
      # megabytes that nobody put there.
      - name: Take the volume down again
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi
          sync || true
          sudo umount "${{ runner.temp }}/findling" 2>/dev/null || true
          # umount detaches the loop device it set up itself. This sweep is for
          # the case where it never got that far, because a loop device that
          # still holds a deleted image is invisible in every listing an operator
          # thinks to look at.
          sudo losetup -j "${{ runner.temp }}/findling-volume.img" 2>/dev/null \
            | cut -d: -f1 \
            | while read -r device; do sudo losetup -d "${device}" || true; done
          rm -f "${{ runner.temp }}/findling-volume.img"
          if findmnt --target "${{ runner.temp }}/findling" --noheadings 2>/dev/null | grep -q loop; then
            echo "a loop mount of this job is still standing on this runner"
            findmnt --target "${{ runner.temp }}/findling"
            exit 1
          fi
          echo "no loop image of this job is left on the runner"

  # The two operating figures of this phase that were estimates until now: what a
  # search costs while the indexer writes on a slow disk, and what the German
  # language quality costs in resident memory. Both decide default values before
  # phase 5, so they are measured rather than assumed.
  #
  # This job deliberately does not fail on an inconvenient number. A measurement
  # job that turns red when a figure comes out badly gets switched off, and then
  # there are no figures at all. It fails when a measurement does not happen: no
  # throttle, no answer, no output.
  measurements:
    name: measurements
    # Not on push. It produces numbers and guards no regression, and it would add
    # an image build to every backend change for nothing.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # This job had never run either, for the same reason as the arm64 bench in
    # python.yml: it never runs on a push, so every recorded run of this workflow
    # skipped it. It was dispatched once on 03.09.2026 instead of being
    # estimated, and it took fifty four seconds including the uncached image
    # build (run 33766227097). Twenty minutes is more than twenty times that and
    # is still a bound instead of the default 360.
    timeout-minutes: 20

    env:
      # The rate the device carrying the container filesystem is throttled to
      # while the search is measured. Two megabytes per second is roughly a slow
      # USB disk or a tired SD card, which is the hardware this app promises to
      # work on. It stands here rather than inside a command line so that the
      # number can be found without reading the shell.
      WRITE_BPS: '2mb'
      # Every figure of this job goes out under this prefix, so a run can be read
      # with a single grep months later.
      MEASURE_PREFIX: 'findling-measurement'
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'

    steps:
      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A plain docker build, not the buildx action the release workflow uses:
      # this job measures one architecture, the one the runner has, and every
      # further moving part between the Dockerfile and the number would be one
      # more thing to explain when the number looks odd.
      - name: Build the backend image
        # The named context carries scripts/dev/quantize_model.py into the model
        # stage; it sits outside ./backend and is not duplicated there.
        run: docker build --build-context scripts=./scripts --tag findling_backend:measure ./backend

      # The device the container filesystem is written to. Throttling asks for
      # the whole disk rather than the partition, which is what PKNAME resolves.
      - name: Find the device the container writes to, and prove the throttle bites
        run: |
          source=$(findmnt -no SOURCE --target /var/lib/docker)
          parent=$(lsblk -no PKNAME "${source}" | head -n1)
          if [ -n "${parent}" ]; then
            device="/dev/${parent}"
          else
            device="${source}"
          fi
          echo "the container filesystem sits on ${device} (mounted from ${source})"
          echo "MEASURE_DEVICE=${device}" >> "${GITHUB_ENV}"

          # A throttle that silently does nothing would turn the whole
          # measurement below into a second idle run reported as a loaded one.
          # Eight megabytes at two megabytes per second cannot be done in under
          # two seconds; an unthrottled runner does it in a few hundredths.
          started=$(date +%s)
          docker run --rm --device-write-bps "${device}:${WRITE_BPS}" \
            --entrypoint dd findling_backend:measure \
            if=/dev/zero of=/tmp/throttle-probe bs=1M count=8 conv=fsync
          elapsed=$(( $(date +%s) - started ))
          echo "${MEASURE_PREFIX} throttle-probe seconds=${elapsed} rate=${WRITE_BPS} device=${device}"
          if [ "${elapsed}" -lt 2 ]; then
            echo "the write throttle had no effect, so nothing below would be a measurement"
            exit 1
          fi

      # Part one. Both modes in the same throttled container, so the write load is
      # the only difference between the two numbers. If the p95 under load is far
      # worse than the idle one, the knob is batch_max_bytes in
      # backend/src/findling/config.py: smaller batches mean shorter, more
      # frequent commits.
      - name: Search latency on a throttled disk, idle and under write load
        run: |
          docker run --rm --device-write-bps "${MEASURE_DEVICE}:${WRITE_BPS}" \
            --entrypoint python findling_backend:measure \
            -m findling.index.bench --mode idle --queries 200 \
            | sed "s/^/${MEASURE_PREFIX} search-latency-idle /"

          docker run --rm --device-write-bps "${MEASURE_DEVICE}:${WRITE_BPS}" \
            --entrypoint python findling_backend:measure \
            -m findling.index.bench --mode under-write --queries 200 \
            | sed "s/^/${MEASURE_PREFIX} search-latency-under-write /"

      # Part two. The compound automaton is built on first use and never freed,
      # so the difference between the first two figures is the price of the
      # German language quality, and the third one is the runtime proof that the
      # cached factory really builds it once: it has to sit on the second.
      - name: Resident memory around the first search
        run: |
          docker run -d --name findling_measure \
            -e APP_ID=findling_backend \
            -e APP_SECRET="${EXAPP_SECRET}" \
            -e APP_PORT="${EXAPP_PORT}" \
            -e APP_VERSION=0.1.0 \
            -e NEXTCLOUD_URL=http://127.0.0.1:8080 \
            -e APP_PERSISTENT_STORAGE=/tmp/fs \
            -p "${EXAPP_PORT}:${EXAPP_PORT}" \
            findling_backend:measure
          for _ in $(seq 30); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null && break
            sleep 1
          done

          # The user arrives in the signed header and nowhere else, which is why
          # a search can be triggered here without a Nextcloud behind it.
          auth=$(printf 'measure:%s' "${EXAPP_SECRET}" | base64 -w0)
          search() {
            curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${EXAPP_PORT}/search" \
              -H 'Content-Type: application/json' \
              -H 'EX-APP-ID: findling_backend' \
              -H 'EX-APP-VERSION: 0.1.0' \
              -H "AUTHORIZATION-APP-API: ${auth}" \
              -d '{"query":"vertrag"}'
          }

          before=$(docker stats --no-stream --format '{{.MemUsage}}' findling_measure)
          echo "${MEASURE_PREFIX} rss before-first-search ${before}"

          first=$(search)
          sleep 2
          after_first=$(docker stats --no-stream --format '{{.MemUsage}}' findling_measure)
          echo "${MEASURE_PREFIX} rss after-first-search ${after_first} http=${first}"

          second=$(search)
          sleep 2
          after_second=$(docker stats --no-stream --format '{{.MemUsage}}' findling_measure)
          echo "${MEASURE_PREFIX} rss after-second-search ${after_second} http=${second}"

          # The direct measurement of what the difference above is expected to
          # be, taken in the very same image with the very same word list. Two
          # numbers that are supposed to explain each other are worth more than
          # one, and this one also states the price of the frugal variant.
          docker run --rm --entrypoint python findling_backend:measure \
            -m findling.index.analyzer \
            | sed "s/^/${MEASURE_PREFIX} automaton-full /"
          docker run --rm -e FINDLING_COMPOUND_DICT=nouns \
            --entrypoint python findling_backend:measure \
            -m findling.index.analyzer \
            | sed "s/^/${MEASURE_PREFIX} automaton-nouns /"

          docker logs findling_measure
          docker rm -f findling_measure

          # The only failure this part knows: a measurement that did not happen.
          # A bad number is a result, an absent one is a broken job. The figures
          # have to exist before the difference below can be stated at all.
          if [ "${first}" != "200" ] || [ "${second}" != "200" ]; then
            echo "the container did not answer both searches (${first}, ${second}), so there is nothing to compare"
            exit 1
          fi
          if [ -z "${before}" ] || [ -z "${after_first}" ] || [ -z "${after_second}" ]; then
            echo "docker stats returned nothing, so the memory figures do not exist"
            exit 1
          fi

          # docker stats prints "123.4MiB / 3.8GiB": the resident set of the
          # container first, the ceiling of the machine second. Only the first
          # figure belongs to this measurement. One named function turns it into
          # bytes, so that the comparison below reads as a comparison instead of
          # as a chain of string surgery.
          to_bytes() {
            reading="${1%%/*}"
            reading="${reading// /}"
            number="${reading%%[A-Za-z]*}"
            unit="${reading##*[0-9.]}"
            case "${unit}" in
              B) factor=1 ;;
              kB|KB|KiB) factor=1024 ;;
              MB|MiB) factor=1048576 ;;
              GB|GiB) factor=1073741824 ;;
              *)
                echo "docker stats reported the unit '${unit}', which this step cannot turn into bytes" >&2
                return 1
                ;;
            esac
            awk -v number="${number}" -v factor="${factor}" 'BEGIN { print int(number * factor) }'
          }

          before_bytes=$(to_bytes "${before}")
          after_first_bytes=$(to_bytes "${after_first}")
          growth=$(( after_first_bytes - before_bytes ))
          echo "${MEASURE_PREFIX} rss first-search-growth-bytes ${growth}"

          # That number is reported and never judged, and the reason is the whole
          # argument behind the step that follows. Plan 06.1-04 was written to
          # put a ceiling here, on the premise that this step loads the second
          # embedding instance because EMBED_ENABLED is on and the model sits in
          # the image. Measured on 2026-09-06 on amd64 with the state after plan
          # 06.1-02, the difference is 241172 bytes in one run and 503316 in the
          # next, and the reason is not that the fix is that good: this container
          # starts on an empty APP_PERSISTENT_STORAGE, so state.db and the index
          # directory do not exist, read_side() returns None, and the search
          # turns back before it reaches the word list, the automaton or the
          # model. A ceiling over that difference would be a gate that cannot go
          # red for the thing it names.
          #
          # So the series stays as an observation, the runs of this workflow
          # collect it, and the gate over the two savings is a counter in the
          # step below. An inherited ceiling would have been worse than none: the
          # 276 MB of report 06-11 were measured on the arm64 box, and a ceiling
          # taken from another machine measures the wrong machine.

      # The ratchet, and it is a counter rather than a byte. Two savings have to
      # hold for the life of this product: one embedding engine per process
      # (plan 06.1-02, 276 MB) and one read of the constituent list per process
      # (plan 06.1-04, 21.9 MB). Both are invisible from the outside and both
      # would come back through an ordinary refactoring, so they get a gate that
      # runs on every push instead of a memory number somebody remembers.
      #
      # findling.tools.one_load builds its own volume, indexes one document,
      # runs one real search round and then wires the second track, in that
      # order. The order is the anti-vacuity clause: the search side has to
      # bring the engine loads to one on its own, so a run that never reaches
      # the model reports a zero and fails rather than passing quietly, which is
      # exactly the shape the ceiling above would have shipped. The tool exits
      # non zero with a named finding for every counter that is not one, and its
      # ability to go red is proven in backend/tests/test_one_load.py by three
      # cases that bring the two regressions back through monkeypatch.
      - name: One engine and one constituent list per process
        run: |
          status=0
          docker run --rm --entrypoint python findling_backend:measure \
            -m findling.tools.one_load > one-load.txt 2>&1 || status=$?
          sed "s/^/${MEASURE_PREFIX} one-load /" one-load.txt
          if [ "${status}" -ne 0 ]; then
            echo "a counter above is not one, and that is a finding and not a threshold to raise:"
            echo "either the search side and the second track stopped sharing the engine of"
            echo "findling.embed.engine, or the cache in findling.index.wordlist.build_artifact"
            echo "stopped holding, or this measurement never reached the model at all."
            exit 1
          fi

      - name: Remove the measurement container
        if: always()
        run: docker rm -f findling_measure 2>/dev/null || true
