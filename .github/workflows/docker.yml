name: Multi-arch image

# The target hardware for this app is a small ARM box. An image that is first
# built for arm64 shortly before the store submission is a schedule risk, so
# both architectures are built on every backend change from the very first
# phase.
on:
  push:
    branches:
      - main
    # The release path. backend/appinfo/info.xml names the image tag AppAPI pulls
    # at installation time, and until this trigger existed the workflow published
    # only :dev and the commit SHA, so an installation that followed the metadata
    # would have failed on the pull. A tag vMAJOR.MINOR.PATCH publishes exactly the
    # tag the metadata names, and the build job refuses to go on if the two
    # disagree.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # One caveat, because GitHub applies one paths filter to every push event in
    # this block, tag pushes included: a release tag has to sit on a commit that
    # touches backend/**. Every release commit does, because it bumps the version
    # and the image tag in backend/appinfo/info.xml. For a tag placed elsewhere,
    # workflow_dispatch on that tag ref is the way in, and it takes the same
    # release path.
    paths:
      - 'backend/**'
      - '.github/workflows/docker.yml'
  # Monthly rebuild. What it does and what it does not do, so nobody reads more
  # into it than is there: it re-runs the build and the smoke test on both
  # architectures, which catches a build that has rotted (the frpc tarball is
  # fetched from a pinned commit of an upstream repository, and that can vanish)
  # and a heartbeat that has stopped answering. It does not pick up base image
  # security updates: the base image is pinned by digest, so a rebuild produces the
  # same layers. Moving that digest is dependabot's job, see .github/dependabot.yml.
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  # Pushing to ghcr needs nothing but the token this workflow already gets. A
  # separate personal access token would be one more long lived secret with
  # write access to the registry, for no gain.
  packages: write

# Serialised per branch, but deliberately never cancelled. This workflow pushes:
# a cancelled run can leave one architecture in the registry without the other,
# and the merge job that turns two digests into one manifest would then publish a
# manifest with a single platform, which still pulls and still runs, on exactly
# the machines that are not the target hardware.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/street1983nk/findling_backend

jobs:
  build:
    name: Build and smoke test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Derived from what this job has actually cost, not guessed. The ten most
    # recent runs finished this job in 32 to 55 seconds with a warm build cache
    # (runs 33761279058, 33641431312, 33664226243, read on 03.09.2026), and the
    # slowest one on record, the first one that had no cache at all, took two and
    # a half minutes (run 32111380972, 18.08.2026). Twenty minutes is roughly
    # eight times a cold build, so an honest slowdown still fits, and a job that
    # hangs costs minutes instead of the default six hours.
    timeout-minutes: 20
    strategy:
      # One architecture failing should not hide the state of the other one.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # Actions are pinned to commit SHAs, never to tags: a tag can be moved and
      # would hand a third party arbitrary code execution in this build.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release that publishes a tag the metadata does not name is worse than no
      # release: AppAPI pulls registry/image:<image-tag> at installation time, and
      # nobody finds out until a user installs the app. Both halves have to carry
      # the same version as well, which is a project rule, so that a user cannot
      # end up with two versions that disagree about the protocol between them.
      #
      # Deliberately a step in this job and not a job of its own: a separate job
      # would have to be a "needs" dependency, and a skipped dependency skips
      # everything behind it, which would turn every ordinary push into a no-op.
      - name: The git tag, both info.xml versions and the image tag have to agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          image_tag=$(sed -n 's:.*<image-tag>\(.*\)</image-tag>.*:\1:p' backend/appinfo/info.xml)
          backend_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' backend/appinfo/info.xml)
          php_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' php/appinfo/info.xml)
          echo "git tag        ${tag}"
          echo "image-tag      ${image_tag}   (backend/appinfo/info.xml)"
          echo "backend version ${backend_version}  (backend/appinfo/info.xml)"
          echo "php version     ${php_version}  (php/appinfo/info.xml)"
          fail=0
          [ "${image_tag}" = "${tag}" ] || { echo "image-tag does not match the git tag"; fail=1; }
          [ "${backend_version}" = "${tag}" ] || { echo "backend version does not match the git tag"; fail=1; }
          [ "${php_version}" = "${tag}" ] || { echo "php version does not match the git tag"; fail=1; }
          exit "${fail}"

      # Each architecture is built on a runner of that architecture. No
      # emulation layer is installed anywhere in this workflow: emulating arm64
      # on an x86 runner turns a build of a few minutes into one of well over an
      # hour and produces failures that are painful to read.
      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build per architecture, and the artefact the smoke test judges is the
      # artefact that leaves this job. Until 03.09.2026 the job built twice: once
      # with load: true for the smoke test and a second time with push-by-digest
      # for the registry. Both builds shared a cache and were very probably
      # identical, but "very probably identical" is not a proof: the smoke test
      # ran against a twin, and the image users pull was checked by nobody
      # (Sec-M7). Now there is one build, and the thing that is tested is the
      # thing that was published, addressed by its digest.
      #
      # What that costs, stated openly, because it reverses the trade the old
      # comment here made. A red smoke test now leaves a manifest behind in the
      # registry. It leaves no tag: push-by-digest publishes none, the merge job
      # below is the only step in this repository that ever gives a digest a
      # name, and it does not run when this job is red. An image that failed here
      # is therefore unreachable under every name a user or AppAPI knows.
      #
      # The alternative that was considered and dropped: a registry service on
      # localhost:5000, as the deploy job of deploy-harp.yml uses, push there,
      # smoke against that, then push to ghcr out of the same cache and assert
      # that the two digests are equal. It keeps the registry free of orphans,
      # but it turns the proof from an identity of one artefact into an equality
      # of two, and it adds a service container to the one job whose whole point
      # is that the tested bytes and the shipped bytes are the same bytes.
      - name: Build the image for this architecture and push it by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          # The model stage runs scripts/dev/quantize_model.py, which lives
          # outside the context above. It arrives as a named build context
          # rather than as a second copy of the file in backend/, so the size
          # gate that catches an unquantised embedding table exists once and
          # cannot drift. Every other caller of this build passes the same flag.
          build-contexts: |
            scripts=./scripts
          platforms: ${{ matrix.platform }}
          # By digest and not by tag: two runners pushing the same tag would
          # overwrite each other, and the merge job below is what turns the two
          # digests into one manifest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      # The pull is what makes the paragraph above a measurement instead of an
      # intention. The image comes back out of the registry addressed by the
      # digest the push returned, and the digest the local daemon then reports
      # for it has to be that same value. Both are printed, so the run log
      # carries the evidence and not only the verdict.
      - name: Pull the pushed digest back out of the registry
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "the push step returned no digest, so there is nothing to smoke test"
            exit 1
          fi
          echo "push digest ${DIGEST}"
          docker pull "${IMAGE}@${DIGEST}"
          pulled=$(docker image inspect --format '{{join .RepoDigests ","}}' "${IMAGE}@${DIGEST}")
          echo "pull digest ${pulled}"
          case "${pulled}" in
            *"${DIGEST}"*)
              echo "the smoke test runs against ${IMAGE}@${DIGEST}, the manifest this run published"
              ;;
            *)
              echo "the pulled image does not carry the pushed digest ${DIGEST}"
              exit 1
              ;;
          esac

      # Wave 0 of phase 6: the two questions a vector schema hangs on, asked in
      # the image that was just published and on the architecture of this
      # runner. A13 is the gate (a CPython without loadable SQLite extensions
      # means this image needs a Python translation of its own), A12 is a
      # measurement that is allowed to come back either way and is recorded in
      # docs/measurements/2026-09-05-welle0-proben/README.md.
      #
      # Three details, each of them load bearing:
      #   --network none    the extension and the model have to work with the
      #                     network cut. It is not the offline proof of plan
      #                     06-10, but it is the half of it this image can show.
      #   the bind mount    backend/.dockerignore keeps tests/ out of the build
      #                     context on purpose, so the probe travels in from the
      #                     checkout instead of living in the image.
      #   --entrypoint      the probe runs as a plain script, because pytest is
      #                     a dev dependency and is deliberately not installed
      #                     in the runtime image.
      - name: Answer A12 and A13 inside this image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}/backend/tests:/probe:ro" \
            --entrypoint python \
            "${IMAGE}@${DIGEST}" /probe/test_vec_extension_probe.py

      # The environment is the one from the local probe, deliberately. Without
      # HP_SHARED_KEY the app binds APP_PORT, frpc logs one line and exits, and
      # the published port is what the heartbeat is asked on.
      #
      # Three things are checked, not one. The heartbeat says the process came up.
      # A signed /search says the middleware, the route and the answer work inside
      # the image, which the heartbeat cannot show: it is the one route that is
      # exempt from authentication. An unsigned /search has to be refused, because
      # a container that answers without a credential is worse than one that does
      # not answer at all. And the uid says the image does not run as root.
      #
      # The container is started from the digest reference itself rather than
      # from a local tag. A tag is a name somebody could have pointed anywhere;
      # a digest is the content.
      - name: Smoke test the image on this architecture
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "smoke testing ${IMAGE}@${DIGEST}"
          docker run -d --name findling_smoke \
            -e APP_ID=findling_backend \
            -e APP_SECRET=12345 \
            -e APP_PORT=10035 \
            -e APP_VERSION=0.1.0 \
            -e NEXTCLOUD_URL=http://127.0.0.1:8080 \
            -e APP_PERSISTENT_STORAGE=/tmp/fs \
            -p 10035:10035 \
            "${IMAGE}@${DIGEST}"
          answer=""
          for _ in $(seq 30); do
            answer=$(curl -sf http://127.0.0.1:10035/heartbeat || true)
            if [ -n "$answer" ]; then
              break
            fi
            sleep 1
          done

          # Collected while the container is still alive, asserted afterwards, so
          # the log below is always the log of everything that was tried.
          auth=$(printf 'smoketest:12345' | base64 -w0)
          signed=$(curl -sf -X POST http://127.0.0.1:10035/search \
            -H 'Content-Type: application/json' \
            -H 'EX-APP-ID: findling_backend' \
            -H 'EX-APP-VERSION: 0.1.0' \
            -H "AUTHORIZATION-APP-API: ${auth}" \
            -d '{"query":"findling-canary"}' || true)
          unsigned=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:10035/search \
            -H 'Content-Type: application/json' \
            -d '{"query":"findling-canary"}')
          uid=$(docker exec findling_smoke id -u || echo unknown)

          echo "::group::container log"
          docker logs findling_smoke
          echo "::endgroup::"
          docker rm -f findling_smoke

          if [ "$answer" != '{"status":"ok"}' ]; then
            echo "heartbeat on ${{ matrix.platform }} answered '${answer}'"
            exit 1
          fi
          echo "heartbeat on ${{ matrix.platform }}: ${answer}"

          echo "signed search answered: ${signed}"
          # The wire format is the candidates envelope of the two stage protocol
          # (02-11); the canary is the one candidate that may carry a text.
          echo "${signed}" | jq -e '.candidates | length == 1'
          echo "${signed}" | jq -e '.candidates[0].title == "findling-canary"'
          # The user name arrives in the signed header only, so this is the proof
          # that the header, and not the body, decides who asked.
          echo "${signed}" | jq -e '.candidates[0].snippet | endswith("for user smoketest")'

          echo "unsigned search answered ${unsigned}"
          test "${unsigned}" = "401"

          echo "the container runs as uid ${uid}"
          test "${uid}" = "1000"

      # The digest travels as a file name, so nothing has to be parsed later.
      - name: Write the digest to a file
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Hand the digest to the merge job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge both digests into one manifest
    needs: build
    runs-on: ubuntu-24.04
    # Measured like the one above: 12 to 22 seconds in the ten most recent runs,
    # read on 03.09.2026. Ten minutes is far beyond anything this job has ever
    # cost and is still a bound rather than the default six hours.
    timeout-minutes: 10
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools rather than a hand built manifest: assembling the index by
      # hand drops the attestations that say where the image came from, and
      # provenance is the only thing a user can check us against.
      #
      # That claim had never been checked, which is Sec-L9 of the phase 2 audit.
      # It was checked on 03.09.2026, against the published index of
      # ghcr.io/street1983nk/findling_backend:dev, read anonymously through the
      # registry API. Result, in both directions:
      #
      #   TRUE. The index carries four entries, not two: linux/amd64,
      #   linux/arm64 and one attestation-manifest per platform, each annotated
      #   with vnd.docker.reference.type=attestation-manifest and pointing at its
      #   platform digest. The payload is an in-toto statement with
      #   predicateType https://slsa.dev/provenance/v1, produced by buildkit, and
      #   it names the source repository, the commit
      #   6d1f091b89606dd715e3272d4e065bfe59caf21f the image was built from, and
      #   the resolved digests of the base images (python:3.13-slim-trixie and
      #   ghcr.io/astral-sh/uv:0.11.7). So imagetools does preserve them.
      #
      #   AND NOT MORE THAN THAT. This is unsigned buildkit provenance. It is not
      #   a GitHub artifact attestation, so `gh attestation verify` cannot check
      #   it: that command wants an attestation from actions/attest-build-provenance
      #   with id-token: write, which this workflow does not produce. The
      #   difference matters and is stated rather than glossed over: the metadata
      #   says where the image came from, but nothing cryptographically binds it
      #   to this repository, so it is an audit trail and not a signature. Adding
      #   a real signature is a decision of its own and belongs in a plan that
      #   owns the release path.
      #
      # The step after the manifest check turns the verified half into a gate, so
      # that the day imagetools stops preserving them is a red run and not a
      # discovery.
      #
      # dev is the moving pointer, the commit SHA is the one that stays
      # addressable, and on a tag run the version from the tag is added. That
      # third tag is the one backend/appinfo/info.xml names, so it is the one an
      # installation actually pulls.
      - name: Create the manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "${IMAGE}:dev" -t "${IMAGE}:${GITHUB_SHA}")
          # The version is read out of the ref inside the shell instead of being
          # interpolated by the workflow expression syntax: a ref is attacker
          # supplied text in the general case, and it must not reach a command line
          # unchecked. The pattern below is the same one the trigger filters on.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "the tag ${GITHUB_REF} is not vMAJOR.MINOR.PATCH, refusing to tag the manifest"
              exit 1
            fi
            tags+=(-t "${IMAGE}:${version}")
            echo "release run, the manifest also gets the tag ${version}"
          fi
          # The word splitting on the last line is the point: every digest file
          # in this directory becomes one more source reference for the manifest.
          # shellcheck disable=SC2046
          docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE}@sha256:%s " *)

      # A manifest that lists only one platform still pulls and still runs, on
      # exactly the machines that are not the target hardware. So the job asks
      # for both entries by name instead of trusting that the matrix ran.
      - name: Verify the manifest carries both platforms
        run: |
          docker buildx imagetools inspect "${IMAGE}:dev" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          echo "manifest ${IMAGE}:dev carries linux/amd64 and linux/arm64"
          # On a release run the tag from info.xml is the one that matters, so it
          # is asked for by name as well. An image nobody can pull under the tag
          # the metadata names is a broken release, not a broken build.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            docker buildx imagetools inspect "${IMAGE}:${version}" | tee release-manifest.txt
            grep -q 'linux/amd64' release-manifest.txt
            grep -q 'linux/arm64' release-manifest.txt
            echo "manifest ${IMAGE}:${version} carries both platforms"
          fi

      # The gate behind the verification written down above. Two attestation
      # manifests, one per platform, and each one has to point at a platform
      # digest that is really in this index. Asking for the count alone would
      # stay green on an index that carries two attestations of something else.
      - name: Verify the provenance attestations survived the merge
        run: |
          docker buildx imagetools inspect "${IMAGE}:dev" --raw > index.json
          python3 - index.json <<'PY'
          import json
          import sys

          index = json.load(open(sys.argv[1], encoding="utf-8"))
          manifests = index.get("manifests", [])
          platforms = {
              m["digest"]
              for m in manifests
              if m.get("platform", {}).get("architecture") in ("amd64", "arm64")
          }
          attestations = [
              m
              for m in manifests
              if m.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
          ]
          subjects = {m["annotations"].get("vnd.docker.reference.digest") for m in attestations}
          print(f"platform manifests: {sorted(platforms)}")
          print(f"attestation manifests: {len(attestations)}, subjects {sorted(s or '' for s in subjects)}")
          if len(platforms) != 2:
              sys.exit("the index does not carry exactly the two platform manifests")
          if len(attestations) != 2:
              sys.exit("the index does not carry one provenance attestation per platform")
          if subjects != platforms:
              sys.exit("an attestation points at something that is not a platform of this index")
          print("provenance survived the merge: one attestation per platform, each on its own platform digest")
          PY

      # The first push creates the package, and a newly created package is
      # private. The store cannot pull a private image, so the package has to be
      # switched to public once, by hand, in the repository package settings.
      - name: Say what still needs a human
        run: |
          echo "If this is the first push, set the ghcr package findling_backend to public:"
          echo "https://github.com/users/street1983nk/packages/container/findling_backend/settings"
