name: Wave 0 measurements

# Measurements, not gates, and that is why the only trigger below is a manual
# one.
#
# Three reasons, in the order they matter. These runs cost runner minutes in the
# tens rather than in the ones, and nothing about them changes between two
# commits: they measure a tokenizer, a model and a SQLite extension, all three of
# which are constants of a published image. Their result belongs in a report a
# person reads, not in a red or a green tick that says "still true" once an hour.
# And a measurement that runs on every push invites the worst habit there is with
# numbers, which is to look at the last one instead of at the one that was
# written down with its hardware.
#
# What comes out is uploaded as an artefact and copied by hand into
# docs/measurements/, next to the report that quotes it. The report names the
# image digest, so any run of this workflow against that digest can be compared
# with it.
#
# The image is pulled and not built. docker.yml already publishes a multi
# architecture manifest on every push to main that touches backend/**, so the
# arm64 runner below pulls the arm64 half of exactly the artefact users install,
# addressed by its digest. Building here instead would cost the model download
# and the quantisation twice per run and would measure an image nobody ships.
#
# Which identity of that image decides, and which one is only written down
# (DI-10-05, decided on 2026-09-11 in the phase 11 audit, docs/audits/
# 2026-09-phase-11/README.md, section 5). Three sentences, and they settle a
# finding that has been open since plan 10-03:
#
#   1. The proof is the tree hash. scripts of the measurement runs write the
#      `baumhash:` lines of rohdaten/40b-baumhash.txt over the files inside the
#      image and over the working tree, and `baumhash-gleich ja` is what says
#      the measured bytes are the bytes of the commit. A baumhash that differs
#      stops a run; nothing below overrides that.
#   2. The resolved digest is the note, not the proof. It is recorded so that a
#      later reader can address the same bytes again, and a digest that moved
#      while the baumhash held is a moved tag and not a changed image.
#   3. A measuring run may therefore check against the wandering tag dev, which
#      is the default of image_ref below, and the digest it resolves to is
#      written along by the "Resolve the image to a digest" step rather than
#      written down in a plan beforehand. A digest pinned in advance goes stale
#      on the next push that touches backend/**, which is how DI-10-05 arose.
#
# None of this loosens the delivery path, which is a different question and is
# nailed down elsewhere: on a tag run docker.yml refuses to go on unless the
# git tag, both <version> entries and the <image-tag> agree. Measuring is
# allowed a moving pointer; shipping is not.
on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Tag or sha256:... digest of ghcr.io/street1983nk/findling_backend'
        required: false
        default: 'dev'
      queries:
        description: 'KNN queries per size and cache state'
        required: false
        default: '100'

permissions:
  contents: read
  # Read only. This workflow publishes nothing; it pulls one image and uploads
  # one artefact, and the artefact upload needs no package scope.
  packages: read

concurrency:
  # Two measuring runs on the same runner pool would compete for the page cache
  # the cold series is about, and the cold series drops that cache for the whole
  # machine. Serialised, and cancelled rather than queued: a measurement that was
  # superseded is of no interest.
  group: measure-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/street1983nk/findling_backend
  # Where the tool sends its output inside the job. One file per run, and the
  # file names are what the report cites.
  OUT: measurements

jobs:
  measure:
    name: Wave 0 on ${{ matrix.arch }} (${{ matrix.role }})
    runs-on: ${{ matrix.runner }}
    # The four throughput combinations cost about half a minute each on a fast
    # x86 core and are the fastest part; the cold scan series is the slow one,
    # because it drops the page cache before every single query and then reads
    # up to 384 MB back from disk. Forty minutes is several times what that has
    # to cost and is still a bound rather than the default 360.
    timeout-minutes: 40
    strategy:
      # The two entries below are the two jobs the plan asks for, written as one
      # definition so that nothing can drift between them: a difference between
      # the two architectures has to come from the hardware and not from a step
      # somebody edited on one side only. Which of the two is the statement and
      # which is the comparison is in the role field and in the report, not in
      # the mechanics.
      fail-fast: false
      matrix:
        include:
          # The target hardware of this app is a small ARM box. This is the
          # number the phase is decided on.
          - arch: arm64
            runner: ubuntu-24.04-arm
            role: target
          # The comparison, so that the report can name the architecture gap
          # instead of asserting it. It is not the answer to anything.
          - arch: amd64
            runner: ubuntu-24.04
            role: comparison
    steps:
      # Actions are pinned to commit SHAs, never to tags: a tag can be moved and
      # would hand a third party arbitrary code execution in this job. The three
      # SHAs below are the ones the rest of this repository already runs, which
      # is a rule of its own (test_workflow_pins.py, rule 5).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The workflow input reaches a command line, so it is read inside the shell
      # out of an environment variable and checked against a pattern first. An
      # input is attacker supplied text in the general case, and the fact that
      # only a maintainer can dispatch this workflow is a permission and not a
      # validation.
      - name: Resolve the image to a digest
        id: image
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          ref="${IMAGE_REF:-dev}"
          if ! printf '%s' "${ref}" | grep -Eq '^(sha256:[0-9a-f]{64}|[A-Za-z0-9._-]{1,128})$'; then
            echo "the image reference ${ref} is neither a digest nor a plain tag"
            exit 1
          fi
          case "${ref}" in
            sha256:*) target="${IMAGE}@${ref}" ;;
            *)        target="${IMAGE}:${ref}" ;;
          esac
          docker pull "${target}"
          digest=$(docker image inspect --format '{{join .RepoDigests ","}}' "${target}")
          echo "requested ${target}"
          echo "digest    ${digest}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # The image published by docker.yml carries findling.embed.bench only from
      # the commit that added it onward. Without this step a run against an older
      # :dev would fail four steps later with a module import error, and the
      # cause would be three screens up. It is also the one place that proves the
      # measuring code inside the image is the code of this checkout: the module
      # is not mounted in, it is the one that was built.
      - name: The image has to carry the measuring tool
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          if ! docker run --rm --network none --entrypoint python "${TARGET}" \
              -m findling.embed.bench --help > /dev/null; then
            echo "this image has no findling.embed.bench."
            echo "docker.yml publishes it on the first push to main that carries plan 06-02;"
            echo "dispatch this workflow again once that build is green."
            exit 1
          fi
          mkdir -p "${OUT}"

      # What the numbers below are numbers of. A measurement without its machine
      # is a claim that gets quoted at the wrong hardware (T-06-07), and the two
      # runners of this matrix differ in more than their instruction set.
      - name: Write down the machine
        env:
          TARGET: ${{ steps.image.outputs.target }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${{ matrix.runner }}"
            echo "role=${{ matrix.role }}"
            echo "arch=$(uname -m)"
            echo "kernel=$(uname -r)"
            echo "cpus=$(nproc)"
            echo "image=${TARGET}"
            echo "digest=${DIGEST}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
          } | tee "${OUT}/machine.txt"
          echo "::group::lscpu"
          lscpu | tee -a "${OUT}/machine.txt"
          echo "::endgroup::"
          echo "::group::memory"
          free -m | tee -a "${OUT}/machine.txt"
          echo "::endgroup::"

      # Measurement A, and the only one that reads real text. Three times, and
      # the three samples are deliberately different kinds of German rather than
      # three tries at the same one.
      #
      #   corpus    the reference corpus of this repository. Real prose, and 659
      #             characters of it, which is a sample small enough to have to
      #             be said out loud.
      #   prose     the German planning documents of this phase, about 450 KB of
      #             continuous administrative and technical prose, with all the
      #             short function words prose has and a tokenizer notices.
      #   wordlist  /usr/share/dict/ngerman, 356.010 German words and not one
      #             function word among them. This is the vocabulary end, and it
      #             is also the closest thing there is to the synthetic load
      #             corpus of phase 5, whose text is generated out of this very
      #             list and whose 27.067 characters per document every
      #             derivation in the report starts from.
      #
      # The truth for a real holding lies between the prose and the wordlist
      # figure, and the report says which of the two each derivation used. The
      # tool prints the file count and the character total and never a file name
      # (T-06-06).
      #
      # This is the one architecture independent number of the three. A tokenizer
      # is a table lookup and a merge loop; it produces the same ids on every
      # machine. It is measured on both runners all the same, because an equal
      # pair of numbers is the cheapest possible proof of that claim.
      - name: A, characters per token
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}/testdata:/testdata:ro" \
            --entrypoint python "${TARGET}" \
            -m findling.embed.bench --mode chars-per-token --text-dir /testdata/corpus \
            | tee "${OUT}/chars-per-token-corpus.txt"
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}/.planning/phases/06-semantische-suche:/prose:ro" \
            --entrypoint python "${TARGET}" \
            -m findling.embed.bench --mode chars-per-token --text-dir /prose \
            | tee "${OUT}/chars-per-token-prose.txt"
          docker run --rm --network none \
            --entrypoint python "${TARGET}" \
            -m findling.embed.bench --mode chars-per-token --text-dir /usr/share/dict/ngerman \
            | tee "${OUT}/chars-per-token-wordlist.txt"

      # Measurement B, four times, and the four runs are levers 4 and 5 of
      # 06-RESEARCH.md 3.6 put against each other: batch 2 against 8 and sequence
      # 256 against 512. The batch decides the activation peak, the sequence
      # decides it quadratically, and both decide the throughput, so the pair
      # that is cheapest in RAM is not obviously the one that is cheapest in
      # time. Four runs answer that instead of choosing it.
      #
      # --cpuset-cpus 0,1 and --threads 2 together are the "two shared cores" of
      # assumption A2. The cpuset is what makes the CPU count in the output true:
      # a --cpus quota would leave the process seeing every core of the runner and
      # the number would be quoted against the wrong machine.
      - name: B, tokens per second
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          for combination in "2 256" "2 512" "8 256" "8 512"; do
            set -- ${combination}
            echo "::group::batch $1 sequence $2"
            docker run --rm --network none --cpuset-cpus 0,1 \
              --entrypoint python "${TARGET}" \
              -m findling.embed.bench --mode tokens-per-second \
              --batch "$1" --sequence "$2" --threads 2 \
              | tee "${OUT}/tokens-per-second-b$1-s$2.txt"
            echo "::endgroup::"
          done

      # Measurement C, twice, once per storage type, and each run carries the
      # warm and the cold series over one and the same fill. The difference is
      # the statement and not the mean (06-RESEARCH.md 2.2), and two separately
      # filled tables would carry the fill variance into it.
      #
      # The two flags that look alarming and are the whole point: --privileged
      # and --user 0. Cold means the page cache is empty, and the only way to
      # empty it is to write to /proc/sys/vm/drop_caches, which is root owned and
      # read only in an ordinary container. Without them the tool reports
      # cold_not_enforced and the cold column becomes unquotable, which is
      # correct behaviour and a wasted run. The alternative that was considered
      # and dropped: lifting the extension out of the image with docker cp and
      # running the tool on the runner itself, where sudo exists. It works, and
      # it measures the runner's Python and the runner's SQLite instead of the
      # ones users get.
      #
      # The blast radius of the two flags, stated rather than waved away: this
      # workflow is dispatch only, it holds no secret beyond the read scoped
      # GITHUB_TOKEN, and the container it grants them to is an image this
      # repository built and pinned to a digest three steps up. The runner is
      # thrown away afterwards.
      - name: C, scan latency
        env:
          TARGET: ${{ steps.image.outputs.target }}
          QUERIES: ${{ inputs.queries }}
        run: |
          queries="${QUERIES:-100}"
          case "${queries}" in
            ''|*[!0-9]*) echo "queries has to be a positive integer, got ${queries}"; exit 1 ;;
          esac
          for kind in int8 bit; do
            echo "::group::${kind}"
            docker run --rm --network none --privileged --user 0 --cpuset-cpus 0,1 \
              --entrypoint python "${TARGET}" \
              -m findling.embed.bench --mode scan-latency --vector-type "${kind}" \
              --cache both --sizes 50000,100000,250000,1000000 --queries "${queries}" \
              | tee "${OUT}/scan-latency-${kind}.txt"
            echo "::endgroup::"
          done

      # A cold series that could not be cold is a finding and not a failure: the
      # run is still worth having, the warm column is untouched, and the report
      # has to be able to say which of the two happened. So this step names it
      # loudly and stays green.
      - name: Say whether the cold series was really cold
        run: |
          if grep -h 'cold_not_enforced' "${OUT}"/scan-latency-*.txt; then
            echo "::warning::the page cache could not be dropped, so the cold column of this run is warm"
          else
            echo "every cold query ran on an empty page cache"
          fi

      # Measurement D, the base load of the startup, one candidate per step.
      #
      # The follow up measurement of 06.1 put 543,7 MB of 678 MB into two lines,
      # 11-tokenizer-gelesen and 12-chunker-gebaut-und-gefahren, and neither of
      # them is the model weights. Two lines that big are an owner nobody has
      # named, so this step takes them apart into five separately named ones and
      # reads VmRSS after each.
      #
      # The script is mounted rather than built into the image on purpose: it is
      # a measuring tool and not part of the product, and the artefacts it needs
      # (the tokenizer and the model directory) are in the image already. It runs
      # with the python of the venv the image carries, so the versions it reports
      # are the ones users get.
      #
      # --network none is not a detail here. It is the mechanical assurance that
      # a measurement walking through the tokenizer and the model sends nothing,
      # which is the privacy rule of this project rather than a preference.
      - name: D, the base load step by step
        env:
          TARGET: ${{ steps.image.outputs.target }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --network none \
            -e FINDLING_MEASURE_DIGEST="${DIGEST}" \
            -e FINDLING_MEASURE_IMAGE="${TARGET}" \
            -e FINDLING_MEASURE_ROLE="${{ matrix.role }}" \
            -v "${GITHUB_WORKSPACE}/docs/measurements/2026-09-grundlast-fein/skripte:/skripte:ro" \
            --entrypoint /app/.venv/bin/python "${TARGET}" \
            /skripte/01-grundlast-fein.py \
            | tee "${OUT}/01-grundlast-fein-${{ matrix.arch }}.txt"

      # Measurement E, and the letter is deliberate: D is the base load taken
      # apart step by step, it is quoted under that letter in a report already,
      # and a second question about the same memory gets a letter of its own
      # rather than a suffix on somebody else's.
      #
      # What it measures is whether the memory a load costs comes back when the
      # holders are let go. Four marks per cycle, read as VmRSS out of
      # /proc/self/status: baseline after the module imports and before the
      # first load, loaded after the tokenizer, the splitter, the encoder, the
      # session and one run, after_gc once the references are gone and
      # gc.collect() has run, and after_trim once malloc_trim(0) has handed
      # whole free pages back. The return value of malloc_trim travels with the
      # line, because a fine percentage next to a trim that returned nothing is
      # a number that came from somewhere else. The expectation these figures
      # are held against is written down before this run in
      # docs/measurements/2026-09-entladung-vorpruefung/skripte/00-ablauf.md.
      #
      # Five cycles and not one. glibc raises M_MMAP_THRESHOLD dynamically while
      # large blocks are freed, so a later load can be served out of the arena
      # instead of by mmap and malloc_trim then gives less back. Cycle 5 is
      # therefore not cycle 1, and a single cycle would say nothing about a
      # container that runs for weeks.
      #
      # The script is mounted and not built into the image, for the reason the
      # step above gives and one more of its own. It is a measuring tool and not
      # part of the product; and this run has to happen against the SHIPPED
      # image before any product code of the phase exists, which a new mode
      # inside findling.embed.bench could not do. Such a mode reaches ghcr.io
      # only after a push to main that touches backend/** and a green docker.yml
      # run, which is exactly the order this measurement is supposed to precede.
      #
      # --cpuset-cpus 0,1 for the reason step B gives for it: the figure is
      # supposed to stand against the two shared cores of the target assumption
      # and not against the whole runner. No --privileged and no --user 0: this
      # step drops no cache, so the justification those two flags carry at step C
      # does not carry here, and a flag without its reason is one nobody removes.
      #
      # --network none, and the output carries numbers and header lines only: no
      # file name, no path of a machine, no search text and nothing of the blind
      # text the script cuts (T-06-06).
      - name: E, RSS returned by a release
        env:
          TARGET: ${{ steps.image.outputs.target }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --network none --cpuset-cpus 0,1 \
            -e FINDLING_MEASURE_DIGEST="${DIGEST}" \
            -e FINDLING_MEASURE_IMAGE="${TARGET}" \
            -e FINDLING_MEASURE_ROLE="${{ matrix.role }}" \
            -v "${GITHUB_WORKSPACE}/docs/measurements/2026-09-entladung-vorpruefung/skripte:/skripte:ro" \
            --entrypoint /app/.venv/bin/python "${TARGET}" \
            /skripte/01-rss-rueckgabe.py --cycles 5 \
            | tee "${OUT}/rss-rueckgabe-${{ matrix.arch }}.txt"

      - name: Hand the raw output over
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: welle0-${{ matrix.arch }}
          path: ${{ env.OUT }}/*
          if-no-files-found: error
          retention-days: 30

  # W4 of phase 22: the OCR slot curve on the target architecture, in the free
  # arm64 runner and not in paid box time. It answers decision D-03 before the
  # cost sheet of the box run is written: does a second, third or fourth OCR
  # slot buy throughput, or only memory. A job of its own and not a step of the
  # matrix above, because it has one architecture only and the job above is
  # left exactly as it was, so that its numbers stay comparable with the runs
  # already quoted in the reports.
  #
  # Every container of this job that runs the product image runs with
  # --network none (T-22-04). The one container that does not is the B7 probe
  # at the end, which is a plain python base image that installs the pinned
  # Dutch word list and the pinned engine through apt and pip; it sees no
  # product data and no secret.
  slots:
    name: W4 slot curve on arm64
    runs-on: ubuntu-24.04-arm
    # Three slot counts of three timed rounds of an eight page scan, plus one
    # warm up each, the single mode, three bench runs and the B7 probe. On four
    # arm cores that is well inside half an hour; forty minutes is a bound and
    # not the default 360.
    timeout-minutes: 40
    steps:
      # The same three pins as the job above (test_workflow_pins.py, rule 5).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same input check as in the job above: the input is read out of the
      # environment inside the shell and matched against a pattern before it
      # reaches a command line (T-22-03).
      - name: Resolve the image to a digest
        id: image
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          ref="${IMAGE_REF:-dev}"
          if ! printf '%s' "${ref}" | grep -Eq '^(sha256:[0-9a-f]{64}|[A-Za-z0-9._-]{1,128})$'; then
            echo "the image reference ${ref} is neither a digest nor a plain tag"
            exit 1
          fi
          case "${ref}" in
            sha256:*) target="${IMAGE}@${ref}" ;;
            *)        target="${IMAGE}:${ref}" ;;
          esac
          docker pull "${target}"
          digest=$(docker image inspect --format '{{join .RepoDigests ","}}' "${target}")
          echo "requested ${target}"
          echo "digest    ${digest}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: The image has to carry the measuring tool
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          if ! docker run --rm --network none --entrypoint python "${TARGET}" \
              -m findling.embed.bench --help > /dev/null; then
            echo "this image has no findling.embed.bench."
            exit 1
          fi
          mkdir -p "${OUT}"

      # What the numbers below are numbers of (T-06-07). The cpu sets of the
      # steps below assume four visible cores, and this sheet is where a runner
      # with fewer would show.
      - name: Write down the machine
        env:
          TARGET: ${{ steps.image.outputs.target }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=ubuntu-24.04-arm"
            echo "role=w4"
            echo "arch=$(uname -m)"
            echo "kernel=$(uname -r)"
            echo "cpus=$(nproc)"
            echo "image=${TARGET}"
            echo "digest=${DIGEST}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
          } | tee "${OUT}/machine.txt"
          echo "::group::lscpu"
          lscpu | tee -a "${OUT}/machine.txt"
          echo "::endgroup::"
          echo "::group::memory"
          free -m | tee -a "${OUT}/machine.txt"
          echo "::endgroup::"

      # The scan the probe reads: eight synthetic pages out of the generator of
      # the load corpus, with a fixed seed, so every run of this job reads the
      # same pixels. Never a user file. The generator needs its pinned font,
      # which it finds two directories above itself, hence the two mounts under
      # one root. The container writes as the runner user, because the image
      # user cannot write into a directory of the runner.
      - name: A, the synthetic scan
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          mkdir -p "${RUNNER_TEMP}/scan"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${GITHUB_WORKSPACE}/scripts/dev:/repo/scripts/dev:ro" \
            -v "${GITHUB_WORKSPACE}/testdata/fonts:/repo/testdata/fonts:ro" \
            -v "${RUNNER_TEMP}/scan:/scan" \
            --entrypoint /app/.venv/bin/python "${TARGET}" \
            -c 'import sys; sys.path.insert(0, "/repo/scripts/dev"); import build_load_corpus as corpus; open("/scan/scan-8.pdf", "wb").write(corpus._scan_pdf(corpus.Rng("phase-22-w4", "scan-8"), 8))'
          {
            echo "pages=8"
            echo "bytes=$(stat -c %s "${RUNNER_TEMP}/scan/scan-8.pdf")"
            echo "sha256=$(sha256sum "${RUNNER_TEMP}/scan/scan-8.pdf" | cut -d' ' -f1)"
          } | tee "${OUT}/scan.txt"

      # W3 for N = 1, 2 and 4, and the cpu set grows with N: one slot on one
      # core, two on two, four on four. That is the curve D-03 asks about, a
      # slot per core, and the cpu set is what makes cpus_visible in the output
      # true. scripts/ops is not in the image, so the probe is mounted.
      - name: B, W3 slot curve
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          for combination in "1 0" "2 0,1" "4 0-3"; do
            set -- ${combination}
            echo "::group::slots $1 on cpu set $2"
            docker run --rm --network none --cpuset-cpus "$2" \
              -v "${GITHUB_WORKSPACE}/scripts/ops:/ops:ro" \
              -v "${RUNNER_TEMP}/scan:/scan:ro" \
              --entrypoint /app/.venv/bin/python "${TARGET}" \
              /ops/ocr_slot_probe.py --slots "$1" --rounds 3 --scan /scan/scan-8.pdf \
              | tee "${OUT}/w3-slots-$1.txt"
            echo "::endgroup::"
          done

      # W3 single mode on four cores: tesseract on one rendered page with
      # OMP_THREAD_LIMIT=1 and without it. It checks the sentence of
      # docs/performance.md that says tesseract uses both cores.
      - name: C, W3 single mode
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          docker run --rm --network none --cpuset-cpus 0-3 \
            -v "${GITHUB_WORKSPACE}/scripts/ops:/ops:ro" \
            -v "${RUNNER_TEMP}/scan:/scan:ro" \
            --entrypoint /app/.venv/bin/python "${TARGET}" \
            /ops/ocr_slot_probe.py --mode single --rounds 3 --scan /scan/scan-8.pdf \
            | tee "${OUT}/w3-single.txt"

      # The embedding side of the same question: tokens per second with 1, 2
      # and 4 threads, each on a cpu set of the same width.
      - name: D, embedding threads
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          for combination in "1 0" "2 0,1" "4 0-3"; do
            set -- ${combination}
            echo "::group::threads $1 on cpu set $2"
            docker run --rm --network none --cpuset-cpus "$2" \
              --entrypoint python "${TARGET}" \
              -m findling.embed.bench --mode tokens-per-second \
              --batch 2 --sequence 512 --threads "$1" \
              | tee "${OUT}/bench-threads-$1.txt"
            echo "::endgroup::"
          done

      # B7: the resident memory of the Dutch automaton, natively on arm64,
      # with the call form of the script head. The memory mode writes ram.txt
      # with three runs; the case numbers of the same run go along beside it.
      - name: E, B7 Dutch automaton memory
        run: |
          sh scripts/dev/measure_compounds_nl.sh "${RUNNER_TEMP}/b7"
          cp "${RUNNER_TEMP}/b7/ram.txt" "${OUT}/b7-nl-automat.txt"
          cp "${RUNNER_TEMP}/b7/kennzahlen.txt" "${OUT}/b7-kennzahlen.txt"
          cat "${OUT}/b7-nl-automat.txt"

      # F4, defined here before the first run and not after it:
      #
      #   F4 = pages per second at N = 4 on --cpuset-cpus 0-3, divided by pages
      #        per second at N = 1 on --cpuset-cpus 0, each the median of three
      #        timed rounds (pages_per_second_median of w3-slots-4.txt over the
      #        one of w3-slots-1.txt).
      #
      # D-03 applies its threshold of 1.5 to this number. A missing or non
      # numeric median, a median of zero at N = 1, or any round with a lost
      # slot leaves F4 undetermined, and then the step writes "F4 unbestimmt"
      # and fails rather than hand over a quotient of a broken run.
      # It runs even when the B7 step above failed: B7 is the first thing to
      # go when time is short (D-05), F4 is what the job is for.
      - name: F, F4
        if: ${{ !cancelled() }}
        run: |
          median() {
            awk '$1 == "pages_per_second_median" { print $2 }' "$1" 2>/dev/null || true
          }
          one=$(median "${OUT}/w3-slots-1.txt")
          four=$(median "${OUT}/w3-slots-4.txt")
          lost=$(cat "${OUT}"/w3-slots-*.txt 2>/dev/null | awk '
            $1 == "round" { for (i = 1; i < NF; i++) if ($i == "failed_slots" && $(i + 1) != "0") n++ }
            END { print n + 0 }')
          valid=yes
          for value in "${one}" "${four}"; do
            case "${value}" in
              '' | *[!0-9.]*) valid=no ;;
            esac
          done
          if [ "${valid}" = yes ] && [ "${lost}" = 0 ] && awk -v one="${one}" 'BEGIN { exit !(one > 0) }'; then
            awk -v one="${one}" -v four="${four}" 'BEGIN { printf "F4 %.3f\n", four / one }' | tee "${OUT}/f4.txt"
          else
            echo "F4 unbestimmt" | tee "${OUT}/f4.txt"
            echo "n1=${one:-missing} n4=${four:-missing} rounds_with_lost_slots=${lost}"
            exit 1
          fi

      - name: Hand the raw output over
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w4-arm64
          path: ${{ env.OUT }}/*
          if-no-files-found: error
          retention-days: 30
