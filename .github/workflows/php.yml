name: PHP and store metadata gates

# Path filtered on purpose, mirroring python.yml: a backend or documentation
# commit must not spend runner minutes on the companion app. backend/appinfo is
# in the list because the store metadata job below validates both info.xml
# files, and the ExApp one lives on the backend side.
on:
  push:
    paths:
      - 'php/**'
      - 'backend/appinfo/**'
      - '.github/workflows/php.yml'
  pull_request:
    paths:
      - 'php/**'
      - 'backend/appinfo/**'
      - '.github/workflows/php.yml'

permissions:
  contents: read

# One run per branch, same reasoning as in python.yml: the older run's verdict is
# worthless the moment a newer commit exists.
concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned commit in nextcloud/appstore, deliberately not master. The two files
  # fetched below decide whether this gate is green, so pulling them from a
  # moving branch would mean an unrelated commit upstream can turn our build red
  # or, worse, silently stop catching what it used to catch.
  APPSTORE_SHA: 5c4373d7d026a8f7c7838cc9990fecaf19e8e682

jobs:
  lint:
    name: php -l
    runs-on: ubuntu-24.04
    # Measured rather than guessed: 12 to 20 seconds over the six most recent
    # runs, read on 03.09.2026. Ten minutes is thirty times that and is still a
    # deadline, which is the point: without this key the ceiling is the GitHub
    # default of 360 minutes, so a hung job holds a runner for six hours.
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs, never to tags: a tag can be moved and
      # would hand a third party arbitrary code execution in this build.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The lower bound declared in appinfo/info.xml. Linting against the
          # oldest supported runtime is what catches syntax that only newer PHP
          # accepts.
          php-version: '8.2'
          coverage: none

      # xargs returns a non zero exit code as soon as one php -l fails, so a
      # single broken file turns the gate red.
      #
      # This is a syntax check and not a test, and the PHP half has no unit test
      # yet. That gap is written down in docs/testing.md, including the nine
      # behaviours a PHPUnit suite has to cover and the reason the suite is not in
      # this workflow: there is no PHP on the development machine, so it could not
      # be run once before being committed. What does cover the PHP half today is
      # both jobs of integration.yml, end to end against a real Nextcloud.
      #
      # php/templates is in the list because there is no PHP on the development
      # machine: a syntax error in a settings template would otherwise surface
      # as a white page in the admin's browser and nowhere earlier. The
      # directory is held open by php/templates/.gitkeep on purpose. find aborts
      # on a missing path, and the tolerant spellings all end the same way,
      # namely with the gate silently checking fewer files than it names, which
      # is the failure mode this job exists to prevent.
      - name: Syntax check every PHP file
        run: find php/lib php/appinfo php/templates -name '*.php' -print0 | xargs -0 -n1 php -l

  app-metadata:
    name: info.xml on the store validation path
    runs-on: ubuntu-24.04
    # 12 to 36 seconds over the same six runs. The spread is the apt install and
    # the two fetches from raw.githubusercontent.com, which is also the reason
    # this one gets the same ten minutes rather than less: the two things that
    # can be slow here are both on somebody else's network.
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install xsltproc and xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc libxml2-utils

      - name: Fetch the pinned store transform and schema
        run: |
          base="https://raw.githubusercontent.com/nextcloud/appstore/${APPSTORE_SHA}/nextcloudappstore/api/v1/release"
          curl -fsSL "${base}/pre-info.xslt" -o "${RUNNER_TEMP}/pre-info.xslt"
          curl -fsSL "${base}/info.xsd" -o "${RUNNER_TEMP}/info.xsd"

      # This is the store path, not an approximation of it. The store transforms
      # the file first and validates the result, so validating info.xml directly
      # against info.xsd would check a document that is never submitted: it
      # rejects the routes block that the store accepts, and it misses whatever
      # the transform changes.
      - name: Validate both info.xml the way the store does
        run: |
          for f in php/appinfo/info.xml backend/appinfo/info.xml; do
            echo "::group::${f}"
            xsltproc "${RUNNER_TEMP}/pre-info.xslt" "$f" | xmllint --noout --schema "${RUNNER_TEMP}/info.xsd" -
            echo "::endgroup::"
          done

      # The normalised document is printed on purpose. It is the shortest proof
      # that pre-info.xslt drops the routes block without complaining, and that
      # is not a defect: it is the reason AppAPI reads the routes out of the
      # release archive instead, which in turn is the reason the tarball has to
      # ship this info.xml unchanged.
      - name: Show what the store actually validates
        run: |
          for f in php/appinfo/info.xml backend/appinfo/info.xml; do
            echo "::group::normalised ${f}"
            xsltproc "${RUNNER_TEMP}/pre-info.xslt" "$f"
            echo "::endgroup::"
          done

      - name: State the routes finding explicitly
        run: |
          normalised=$(xsltproc "${RUNNER_TEMP}/pre-info.xslt" backend/appinfo/info.xml)
          if echo "$normalised" | grep -q '<routes>'; then
            echo "pre-info.xslt kept the routes block; the assumption behind the packaging step changed"
            exit 1
          fi
          echo "pre-info.xslt dropped the routes block as expected, so the release archive must carry info.xml unchanged"

      # The twin of the step above, for the settings block of the companion app.
      # pre-info.xslt has the templates for activity and settings swapped: the
      # settings template copies the children of activity, so a settings block
      # is normalised into an empty element, and that empty element validates
      # because every child of the settings type carries minOccurs="0" in
      # info.xsd. Nothing has to be done about it, and that is precisely why it
      # has to be written down in a form that breaks: the day the store fixes
      # the transform, this step goes red and the assumption gets re-read
      # instead of believed.
      - name: State the settings finding explicitly
        run: |
          if ! grep -q '<settings' php/appinfo/info.xml; then
            echo "php/appinfo/info.xml carries no settings block yet, so there is nothing for the transform to normalise"
            exit 0
          fi
          normalised=$(xsltproc "${RUNNER_TEMP}/pre-info.xslt" php/appinfo/info.xml)
          if echo "$normalised" | grep -q '<settings/>'; then
            echo "pre-info.xslt emptied the settings block as expected; the empty element validates because every child of the settings type has minOccurs=0, and Nextcloud reads settings at runtime from the installed appinfo/info.xml through AppManager::loadApp(), so the normalisation stays harmless as long as the release archive carries info.xml unchanged"
            exit 0
          fi
          if echo "$normalised" | grep -q '<settings'; then
            echo "pre-info.xslt kept children inside the settings block; the assumption behind the packaging step changed"
            exit 1
          fi
          echo "pre-info.xslt dropped the settings block entirely; the assumption behind the packaging step changed"
          exit 1
