name: PHP gates

# Path filtered on purpose, mirroring python.yml: a backend or documentation
# commit must not spend runner minutes on the companion app.
on:
  push:
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'
  pull_request:
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'

permissions:
  contents: read

jobs:
  lint:
    name: php -l
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs, never to tags: a tag can be moved and
      # would hand a third party arbitrary code execution in this build.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # The lower bound declared in appinfo/info.xml. Linting against the
          # oldest supported runtime is what catches syntax that only newer PHP
          # accepts.
          php-version: '8.2'
          coverage: none

      # xargs returns a non zero exit code as soon as one php -l fails, so a
      # single broken file turns the gate red.
      - name: Syntax check every PHP file
        run: find php/lib php/appinfo -name '*.php' -print0 | xargs -0 -n1 php -l

      # The info.xml validation against the app store schema arrives in plan 07,
      # together with the second info.xml of the ExApp. Validating one file with
      # the full xsltproc plus xmllint recipe would only have to be rewritten
      # there.
