name: HaRP deploy

# The installation path a store install takes, and the first job of this
# repository that walks it. Both existing registration paths are manual-install
# (.github/actions/setup-test-nc/action.yml and scripts/dev/register-exapp.sh),
# and the docker smoke test starts the image with a hand built auth header and
# no AppAPI at all. None of them pulls an image, creates a container or a volume,
# and none of them reads the route list out of the release archive.
#
# This job does: a deploy daemon with --harp pulls the backend image from a
# registry, creates the ExApp container and its data volume, and a search over
# the ordinary OCS route comes back with a hit that can only have been produced
# inside that container. Every one of those three is asserted separately, and an
# empty result is red rather than green (the warning sign of pitfall 3).
#
# Since plan 06.1-12 the job walks that path twice. The first pass is the one
# described above and builds the container image locally. The second pass is the
# path a stranger walks: both halves out of the release archives, the image out
# of ghcr, the integrity check of the instance over the companion, and a search
# that finds the content of a file nobody configured anything for.
on:
  push:
    paths:
      - 'backend/**'
      # The whole companion and not only its appinfo, because the store install
      # path of this job packs php/ into the release archive and then lets the
      # instance verify every file in it. A change in php/lib is a change to what
      # this job installs and to what the integrity check hashes.
      - 'php/**'
      - '.github/workflows/deploy-harp.yml'
      # The instance this job installs comes out of the composite action, so a
      # change there is a change to this workflow.
      - '.github/actions/setup-test-nc/**'
      # The archives are built by this script, in this job and in release.yml
      # alike, so a change to it changes what a stranger would install.
      - 'scripts/release/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'php/**'
      - '.github/workflows/deploy-harp.yml'
      - '.github/actions/setup-test-nc/**'
      - 'scripts/release/**'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. This job installs a whole Nextcloud and builds the runtime
# image, so a superseded run is expensive to keep alive.
concurrency:
  group: deploy-harp-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, deliberately not by the tag "release". The tag moves, and a
  # deploy proof that means something different next week is not a proof.
  # Resolved on 2026-09-03 from the tag "release" of the repository
  # ghcr.io/nextcloud/nextcloud-appapi-harp, with the command
  # "docker buildx imagetools inspect <repository>:<tag> --format
  # '{{.Manifest.Digest}}'" (the tag is spelled out here and nowhere as part of
  # an image reference, so that a grep for the moving reference stays empty). The
  # manifest is an index and carries linux/amd64 and linux/arm64, which is why
  # the same line can be used on the ARM box later in this phase, and why the
  # index digest is pinned rather than one of the two platform digests.
  # scripts/dev/compose-harp.yaml carries the identical string.
  HARP_IMAGE: ghcr.io/nextcloud/nextcloud-appapi-harp@sha256:603fdf5ca2802235fd4e40301476dd2fafff409e84a42f8cb3b8f2e17c22ce39

jobs:
  deploy-harp:
    name: deploy-harp
    runs-on: ubuntu-24.04
    # A job that hangs must cost minutes, not the default six hours. The number
    # is the measured runtime with a margin and not a guess; the measurement is
    # written down at the matrix below. It was 15 while the job ended after the
    # search and the uninstall assertions. The drift probe of plan 06.1-09 adds
    # three redeployments of the kind this job has already measured, so the
    # margin over the measurement would have shrunk rather than the runtime
    # having been reconsidered, which is why the number is 20 and still nowhere
    # near the default of 360.
    #
    # Plan 06.1-12 raises it to 45, and the number is named as an estimate rather
    # than dressed up as a measurement, because the store install path it adds
    # has never run. What it is derived from, using figures this job already
    # measured: the archive build is seconds, the anonymous ghcr pull is the same
    # order as the local registry push that measured 60 s, and every deployment
    # of the ExApp measured about 60 s in the drift probe. The second pass adds
    # two of them for the routes probe and the real registration, two more inside
    # its uninstall promises, the observation window of assertion 6 at about 50 s
    # a second time, and the zero config budget of ZERO_CONFIG_BUDGET_SECONDS
    # below, which is 600 in the worst case. That sums to roughly 20 further
    # minutes over the 4 to 5 the job measures today, and 45 leaves the same kind
    # of margin the 20 had. The first green run replaces this paragraph with
    # measured figures.
    timeout-minutes: 45
    # The one entry that may fail is the one for a server version that is not
    # released yet, and which one that is stands at the entry itself.
    continue-on-error: ${{ matrix.tolerate-failure }}
    strategy:
      fail-fast: false
      matrix:
        # Three server versions, and an include list rather than a cross product,
        # because every version brings its own PHP floor.
        #
        # The declared window decides this list and not the other way round. E-H1 of
        # 2026-09-06 sets min-version 33 and max-version 35 in both info.xml, so the
        # entries are 33, 34 and 35, and there is no entry outside them. stable32 ran
        # here until that decision and left with it: Nextcloud 32 goes out of support
        # in September 2026, the app no longer claims it, and a green run against a
        # server nobody claims is a statement nobody asked for.
        # backend/tests/test_lockstep_versions.py holds the two sides together, in
        # both directions: an entry outside the window and a version the window
        # promises while this list skips it are both findings there.
        #
        # PHP 8.2 covers the floors of 33 and 34 completely: lib/versioncheck.php asks
        # for at least 8.2 on stable33 and on stable34 (read out of the branches
        # through the GitHub API on 2026-09-03, when the entry for stable32 was still
        # here and that branch asked for at least 8.1). Nextcloud 35 asks for at least
        # 8.3 in the same file, so that entry carries 8.3. A cross product over PHP
        # versions would produce nine runs for a statement that three runs make.
        #
        # The backend image is built once per entry and not built once and shared,
        # and that is a measurement rather than a preference: build plus push into
        # the local registry took 60 s in run 33743374344, and the image is about
        # 390 MB. Handing it to the entries through an artifact would move that much
        # data twice per entry, once out and once back, to save a minute of runner
        # time each. The entries run in parallel, so the wall clock would get worse
        # rather than better.
        #
        # Measured on 2026-09-03 in the first green run over the four entries of the
        # time (run 33757405755): 3 m 47 s to 4 m 29 s per entry, of which 60 s are
        # the image build and about 50 s the observation window of assertion 6. The
        # entries run in parallel, so that is the wall clock as well. That
        # measurement predates the drift probe of plan 06.1-09 and does not
        # include its three redeployments, which is what timeout-minutes above
        # answers with 20 rather than 15; the next green run replaces the figures
        # of this paragraph with the ones it measures.
        include:
          - server-version: stable33
            php-version: '8.2'
            tolerate-failure: false
          - server-version: stable34
            php-version: '8.2'
            tolerate-failure: false
          # stable35 exists in both repositories this job checks out, and that was
          # not guessed: "gh api repos/nextcloud/server/branches/stable35" and
          # "gh api repos/nextcloud/app_api/branches/stable35" both answered with the
          # branch on 2026-09-03, so neither half falls back to master or main. The
          # line has an expiry date: once Nextcloud 35 is released, stable35 stops
          # being the branch under development and this comment stops being true.
          - server-version: stable35
            php-version: '8.3'
            # The only entry that may fail, and here is the condition for removing
            # this flag: as soon as Nextcloud 35 is generally available. D-23 asks
            # for a statement about NC 35, and a run that has to be green before the
            # server version is finished would be a statement about the state of a
            # branch and not about Findling. The result lands in the log either way,
            # which is what makes it a statement instead of a hope.
            #
            # E-H1 of 2026-09-06 confirms the flag and names the day it falls rather
            # than leaving it to somebody noticing: Nextcloud 35 becomes final on
            # 2026-09-16, so the condition above is met from that day, and plan
            # 06.1-19 removes this flag together with this paragraph. Until then the
            # condition stands here word for word, because a flag whose reason has
            # been paraphrased away is a flag nobody dares to take out.
            tolerate-failure: true

    env:
      # Test-only values of a throwaway instance that is destroyed with the
      # runner. The composite action requires both although this path starts no
      # host process: the container gets its secret from AppAPI, not from here.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      TESTUSER_PASS: 'findling-ci-canary-2026'
      LOCAL_REGISTRY: 'localhost:5000'
      LOCAL_IMAGE_TAG: 'citest'

      # The budget of the zero config proof, in seconds, and a named variable
      # because threat T-06.1-52 is about somebody raising exactly this number
      # until a run goes green. Raising it is a decision and needs a reason next
      # to it; overrunning it is a finding and not an accident.
      #
      # Where the number comes from. The slowest clock involved on a real
      # instance is the system cron, which runs every five minutes, and the first
      # pass of it queues the crawl rather than finishing it, so a user waits two
      # cron rounds before anything is searchable. Ten minutes is those two
      # rounds. This job has no cron daemon and drives cron.php itself, which is
      # the identical command a system cron runs, so its own wall clock is much
      # shorter; the budget is nevertheless dimensioned against the five minute
      # cadence, because that is the clock the promise is made to.
      #
      # And the lesson that decides the shape of the wait rather than its size:
      # in plan 06-11 a counter probe declared a run dead and was 52 seconds off,
      # because it measured against the fastest clock in sight instead of the
      # slowest. So the loop below leaves the moment the hit is there and never
      # sleeps a fixed pause.
      ZERO_CONFIG_BUDGET_SECONDS: '600'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance and
      # a docker socket.
      #
      # These two checkouts stay in the job and stay in this order.
      # actions/checkout empties its target directory, so the server checkout at
      # the workspace root has to come first, and the second one is what puts the
      # composite action below into the workspace at all.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      # register-exapp: false is the whole point of this job. The instance comes
      # up with both apps enabled and nothing else; the daemon below does the
      # part that manual-install never did.
      #
      # nextcloud-host 0.0.0.0 is the named way out the composite action offers,
      # and this job needs it since it puts a proxy in front of the instance. The
      # builtin server binds the first address "localhost" resolves to, which is
      # ::1 on this runner image: curl finds the instance because it tries both
      # families, and the nginx below answered 502 with "connect() failed (111:
      # Connection refused) upstream 127.0.0.1:8080" (run 33755989853). Binding
      # all interfaces puts the instance on both families and adds 127.0.0.1 and
      # localhost to the trusted domains, which the proxied host header needs.
      - name: Set up the test Nextcloud without registering the ExApp
        id: setup
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}
          register-exapp: 'false'
          nextcloud-host: '0.0.0.0'

      # The deploy daemon pulls registry/image:image-tag out of
      # backend/appinfo/info.xml, which is ghcr.io/street1983nk/findling_backend
      # at the released tag. That tag does not exist on a feature branch, so the
      # image this run is supposed to prove has to come from somewhere local.
      - name: Start a local registry and push the backend image into it
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          # The named context carries scripts/dev/quantize_model.py into the
          # model stage; it sits outside the backend context and is not
          # duplicated there.
          docker build --build-context scripts=./findling-src/scripts \
            -t "${LOCAL_REGISTRY}/findling_backend:${LOCAL_IMAGE_TAG}" ./findling-src/backend
          docker push "${LOCAL_REGISTRY}/findling_backend:${LOCAL_IMAGE_TAG}"

      # The key is created here and never printed. add-mask covers the case of a
      # command that echoes its own arguments, which occ does on higher verbosity
      # levels.
      #
      # --net host, and that is the second thing this job had to measure rather
      # than assume. HaRP is not only the way in, it is also the way back: the
      # container reports its init status and asks for queue rows through
      # {nextcloud_url}/ocs/..., HaRP forwards everything that is not /exapps to
      # NC_INSTANCE_URL, and its own agent resolves the ExApp against Nextcloud
      # as well. With published ports instead of the host network that address
      # points into the network namespace of the HaRP container, where nothing
      # listens on 8080. Measured in run 33745892327: "Cannot connect to host
      # localhost:8080" in the HaRP log, followed by 404 on
      # PUT /ocs/v1.php/apps/app_api/ex-app/status in the ExApp log, and an
      # app_api:app:register --wait-finish that printed "deployed successfully"
      # and then waited for an init status that could never arrive, until the
      # timeout of the step ended it after ten minutes. The compose stack of
      # scripts/dev/compose-harp.yaml has no counterpart to this, because there
      # Nextcloud is a service name in the same network.
      #
      # On the host network the published ports are gone and 8780 plus 8782 are
      # bound on the runner directly, which is the same address the daemon
      # registration below uses, and the ExApp container that AppAPI creates with
      # --net host lands in the same namespace.
      - name: Start HaRP
        run: |
          harp_key=$(openssl rand -hex 16)
          echo "::add-mask::${harp_key}"
          echo "HARP_SHARED_KEY=${harp_key}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/certs"
          docker run -d --name appapi-harp --net host \
            -e HP_SHARED_KEY="${harp_key}" \
            -e NC_INSTANCE_URL="http://localhost:8080" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/certs:/certs" \
            "${HARP_IMAGE}"
          # The readiness gate is the very call AppAPI makes first, and it has to
          # be. A TCP handshake on 8780 succeeds from the moment the container
          # exists, because docker publishes the port with a proxy of its own long
          # before HAProxy inside the container binds it, so the handshake proves
          # nothing at all. The first run of this job on a GitHub runner went
          # green on that probe and failed 0.84 s later with "Connection refused
          # for URI http://localhost:8780/exapps/app_api/v1.44/images/create"
          # (run 33743374344), while the HaRP log of that run still said "Waiting
          # for FRP server port". Measured against the pinned image on 2026-09-03:
          # the TCP probe answers in the first second, the docker engine route
          # answers after three to four seconds.
          #
          # /_ping under /exapps/app_api is HaRP's docker engine route, and it
          # needs both headers: harp-shared-key is what the SPOE agent compares
          # against HP_SHARED_KEY (haproxy_agent.py, handle_app_api_request), and
          # docker-engine-port selects the frp tunnel port that carries the docker
          # socket. 24000 is the port of the bundled deploy daemon, the same value
          # occ app_api:daemon:list prints under "HaRP Docker Socket Port". A 200
          # here proves HAProxy, the agent, the frp server and the tunnel down to
          # the docker socket in one call, and the address is spelled the way
          # AppAPI spells it so that name resolution is part of the proof.
          for _ in $(seq 1 45); do
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
              -H "harp-shared-key: ${harp_key}" \
              -H 'docker-engine-port: 24000' \
              http://localhost:8780/exapps/app_api/v1.44/_ping || true)
            if [ "${code}" = "200" ]; then
              echo "harp answers the docker engine route on 8780"
              exit 0
            fi
            sleep 2
          done
          echo "harp did not answer the docker engine route on 8780, last status '${code}'"
          docker logs appapi-harp || true
          exit 1

      # One address that answers for both halves, and this is the third thing
      # this job had to measure rather than read off.
      #
      # The daemon field nextcloud_url is used twice by AppAPI, and the two uses
      # pull in opposite directions. resolveExAppUrl builds the address of the
      # ExApp as "{nextcloud_url}/exapps/{appId}", so it has to reach HaRP, and
      # the very same value is handed to the container as NEXTCLOUD_URL
      # (DockerActions.php, both read on 2026-09-03), so it has to reach
      # Nextcloud. HaRP answers only paths that carry /exapps/{appId}: its agent
      # matches them with a regular expression and rejects everything else with
      # "Invalid request path, cannot find AppID" (haproxy_agent.py). With the
      # HaRP address in that field the container therefore cannot report that it
      # finished its initialisation: measured in run 33747191689 as
      # "404 Client Error for url http://localhost:8780/ocs/v1.php/apps/app_api/
      # ex-app/status" in the ExApp log, and app_api:app:register --wait-finish
      # waits for exactly that status (ExAppService::waitInitStepFinish loops
      # until init reaches 100), so the step ran into its timeout although the
      # container was healthy and the search worked.
      #
      # That is not a defect of HaRP, it is its topology: HaRP belongs in front
      # of Nextcloud, where one address serves the instance and forwards /exapps
      # into the tunnel. A Nextcloud behind Apache does that with a location
      # block, and all-in-one ships it. The PHP builtin server of this job cannot
      # proxy anything, so the topology is built here instead, with the smallest
      # thing that can do it.
      #
      # nginx by tag and not by digest, unlike the HaRP image: no statement of
      # this job depends on its version, it forwards bytes. The same reasoning
      # the local registry above already follows.
      - name: Put one address in front of Nextcloud and HaRP
        run: |
          cat > "${RUNNER_TEMP}/exapps-proxy.conf" <<'CONF'
          server {
            listen 8090;
            # Everything the ExApp side speaks: AppAPI to the container, and the
            # heartbeat that goes with it.
            location /exapps/ {
              proxy_pass http://127.0.0.1:8780;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              # A search over a large index and an OCR job both take longer than
              # the default minute.
              proxy_read_timeout 1800s;
              proxy_send_timeout 1800s;
            }
            # Everything else is Nextcloud, and that is the direction the
            # container needs for its status and for its queue calls.
            location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_read_timeout 300s;
              client_max_body_size 512M;
            }
          }
          CONF
          docker run -d --name exapps-proxy --net host \
            -v "${RUNNER_TEMP}/exapps-proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          # Both directions are asserted before anything is registered, because a
          # proxy that forwards one of them and not the other produces exactly
          # the failure this step exists to remove, only later and in a place
          # that reads like an app defect.
          for _ in $(seq 1 30); do
            nc_code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://localhost:8090/status.php || true)
            harp_code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
              -H "harp-shared-key: ${HARP_SHARED_KEY}" \
              -H 'docker-engine-port: 24000' \
              http://localhost:8090/exapps/app_api/v1.44/_ping || true)
            if [ "${nc_code}" = "200" ] && [ "${harp_code}" = "200" ]; then
              echo "the front proxy answers for Nextcloud and for HaRP"
              exit 0
            fi
            sleep 2
          done
          echo "the front proxy did not serve both halves, status.php '${nc_code}' and the docker engine route '${harp_code}'"
          docker logs exapps-proxy || true
          exit 1

      # Only for the registration. The release archive carries
      # backend/appinfo/info.xml unchanged, because AppAPI reads the route list
      # out of the archive at installation time: an archive with a rewritten
      # info.xml would install an app without its search route and without an
      # error message. The comment head of that file says the same thing next to
      # the block it concerns.
      - name: Build the temporary info.xml that points at the local registry
        run: |
          sed -e "s|<registry>ghcr.io</registry>|<registry>${LOCAL_REGISTRY}</registry>|" \
              -e 's|<image>street1983nk/findling_backend</image>|<image>findling_backend</image>|' \
              -e "s|<image-tag>[^<]*</image-tag>|<image-tag>${LOCAL_IMAGE_TAG}</image-tag>|" \
              findling-src/backend/appinfo/info.xml > "${RUNNER_TEMP}/info-citest.xml"
          grep -E '<registry>|<image>|<image-tag>' "${RUNNER_TEMP}/info-citest.xml"
          # The source file is untouched, and this is where that is checked
          # rather than assumed.
          git -C findling-src diff --quiet -- backend/appinfo/info.xml

      # The two addresses in this command are different on purpose, and getting
      # them right cost this job three runs.
      #
      # The fifth argument is the host of the daemon, and it is the one AppAPI
      # uses for the docker engine: it talks to "{protocol}://{host}/exapps/
      # app_api/..." with the shared key and the socket port in the headers, so
      # it points straight at HaRP.
      #
      # The sixth argument is nextcloud_url, and it has to serve both halves,
      # which is why it is the front proxy and neither 8080 nor 8780. AppAPI
      # resolves the ExApp as "{nextcloud_url}/exapps/{appId}"
      # (DockerActions::resolveExAppUrl), so Nextcloud alone would send every
      # heartbeat into the PHP server, which answers 404 and ends the install in
      # "heartbeat check failed" next to a healthy container (measured in plan
      # 05-01). The same value reaches the container as NEXTCLOUD_URL, so HaRP
      # alone would leave the container without a way back: HaRP serves only
      # paths with /exapps in them, and the status the container reports after
      # its initialisation is /ocs/v1.php/apps/app_api/ex-app/status, which HaRP
      # rejects with 404 (measured in run 33747191689). The proxy step above
      # explains the rest.
      #
      # --net host stays: the ExApp container shares the network namespace of the
      # runner and therefore reaches HaRP and the front proxy on localhost. Every
      # occ call of this job carries a timeout, because a handshake that hangs
      # must not eat the job deadline on its own.
      - name: Register the HaRP deploy daemon
        run: |
          timeout 30 ./occ app_api:daemon:register \
            harp_proxy_host "Harp Proxy (Host)" docker-install http localhost:8780 \
            http://localhost:8090 \
            --harp --harp_frp_address localhost:8782 \
            --harp_shared_key "${HARP_SHARED_KEY}" \
            --net host --set-default
          timeout 30 ./occ app_api:daemon:list

      # --wait-finish makes the handshake synchronous, so the next step asserts a
      # finished installation and not a race.
      - name: Install the ExApp through the daemon
        run: |
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-citest.xml" --wait-finish

      # The three assertions this job exists for. Each one has its own message,
      # and each one treats an empty result as a failure: a deploy job that goes
      # green without a container is the exact warning sign this phase set out to
      # remove. The container name is not guessed, it comes out of
      # buildExAppContainerName and is found by filtering on the app id.
      - name: The container, the volume and the app list
        run: |
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container matches findling_backend, so the deploy daemon created nothing"
            docker ps -a
            exit 1
          fi
          echo "exapp container: ${container}"
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'

          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -z "${volume}" ]; then
            echo "no volume matches findling_backend, so the installation has no data volume"
            docker volume ls
            exit 1
          fi
          echo "exapp volume: ${volume}"
          # The uninstall assertions below look for exactly these two names
          # rather than for a filter that may match nothing. A name that arrives
          # empty is caught there a second time, because "docker volume ls
          # --filter name=" lists everything and would turn a missing measurement
          # into a green result (T-05-29).
          {
            echo "EXAPP_CONTAINER=${container}"
            echo "EXAPP_VOLUME=${volume}"
          } >> "${GITHUB_ENV}"
          # Plan 05-08 removes this volume again and needs its name, so it goes
          # into the job summary and not only into the log.
          {
            echo "### HaRP deploy on ${{ matrix.server-version }}"
            echo ""
            echo "- container: \`${container}\`"
            echo "- volume: \`${volume}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          timeout 30 ./occ app_api:app:list | tee app-list.txt
          if ! grep -q 'findling_backend' app-list.txt; then
            echo "app_api:app:list does not know findling_backend, so the registration did not survive"
            exit 1
          fi

      # The proof has to run as an ordinary user. The admin would work too, but
      # the user id in the answer is the load bearing part, and a second account
      # makes it impossible to confuse it with the installer.
      - name: Add a test user and scan the files
        run: |
          OC_PASS="${TESTUSER_PASS}" ./occ user:add --password-from-env testuser
          timeout 300 ./occ files:scan --all

      # The same canary call the job walking-skeleton makes, and the difference is
      # the whole point: there a host process on the runner answers, here a
      # container that a deploy daemon pulled and started. The subline carries the
      # host name and the timestamp of the process that produced it and ends with
      # the user id that only the signed AppAPI header could have carried into the
      # backend, so a hard coded hit in PHP cannot pass this.
      - name: Search over the ordinary OCS route
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee out.json
          if ! jq -e '.ocs.data.entries | length == 1' out.json > /dev/null; then
            echo "the search did not return exactly one hit, so nothing answered out of the container"
            exit 1
          fi
          jq -e '.ocs.data.entries[0].title == "findling-canary"' out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' out.json

      # The four steps below are the runtime half of the lockstep promise of
      # D-11, and they sit here rather than anywhere else on purpose: the step
      # above has just shown what an agreeing pair does, which is the counter
      # sample every assertion from here on is measured against, and the
      # uninstall proof below needs the installation intact, which the last of
      # the four hands back.
      #
      # What is being proven is the half of D-11 that had no evidence. The
      # repository side is held by backend/tests/test_lockstep_versions.py: both
      # info.xml and the image tag carry one version. Nobody had measured what
      # an instance does when the two halves are nevertheless apart, which is
      # what every instance looks like for the minutes between updating one half
      # and the other, and in both orders.
      #
      # The lever is the version in the info.xml handed to app_api:app:register.
      # AppAPI passes it to the container as APP_VERSION, the container reports
      # it as appVersion out of backend/src/findling/api/status.py, and
      # php/lib/Service/ExAppService.php compares major and minor of it against
      # its own. Nothing in the repository moves for this, which is the reason
      # this lever was chosen over editing a version and rebuilding: a proof
      # that needs the tree changed cannot run on the tree it is proving. That
      # AppAPI really carries the value through is not assumed either, the
      # helper below reads it back off the running container.
      #
      # And what is expressly NOT expected anywhere here is an error status. The
      # unified search calls every provider in parallel, so a provider that
      # throws costs the user the whole search rather than one result group
      # (T-06.1-36). The promise is an honest empty answer, and an empty answer
      # is only worth anything next to the step above, where the same call with
      # the same term returns a hit.
      - name: The drift probe both directions share
        run: |
          companion=$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' \
            apps/findling/appinfo/info.xml | head -1)
          if [ -z "${companion}" ]; then
            echo "no version in php/appinfo/info.xml, so there is nothing to drift away from"
            exit 1
          fi
          major=${companion%%.*}
          rest=${companion#*.}
          minor=${rest%%.*}
          # A minor apart in each direction, because that is the distance the
          # release policy of D-11 attaches the protocol to: a patch is
          # deliberately not a drift, so a probe built on one would assert the
          # opposite of the promise.
          newer="${major}.$((minor + 1)).0"
          if [ "${minor}" -gt 0 ]; then
            older="${major}.$((minor - 1)).0"
          elif [ "${major}" -gt 0 ]; then
            older="$((major - 1)).9.0"
          else
            echo "the companion is at ${companion}, and there is no version below it to drift to"
            exit 1
          fi
          {
            echo "COMPANION_VERSION=${companion}"
            echo "DRIFT_NEWER=${newer}"
            echo "DRIFT_OLDER=${older}"
          } >> "${GITHUB_ENV}"
          echo "companion ${companion}, probing against ${newer} and ${older}"

          # The redeploy helper. One file rather than the same twenty lines in
          # three steps, and it fails on its own if the value it was asked for is
          # not the value the container ended up with.
          cat > "${RUNNER_TEMP}/redeploy.sh" <<'SH'
          #!/bin/sh
          set -eu
          version="$1"
          sed -e "s|<version>[^<]*</version>|<version>${version}</version>|" \
            "${RUNNER_TEMP}/info-citest.xml" > "${RUNNER_TEMP}/info-drift.xml"
          # Exactly one version element, or the sed above rewrote something it
          # was not aimed at and the rest of this script would be measuring a
          # file nobody meant to produce.
          if [ "$(grep -c '<version>' "${RUNNER_TEMP}/info-drift.xml")" != "1" ]; then
            echo "info-drift.xml does not carry exactly one version element"
            exit 1
          fi
          timeout 300 ./occ app_api:app:unregister findling_backend
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-drift.xml" --wait-finish
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the registration at ${version} left no running container"
            docker ps -a
            exit 1
          fi
          running=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "${container}" | sed -n 's/^APP_VERSION=//p' | head -1)
          if [ "${running}" != "${version}" ]; then
            echo "the container runs APP_VERSION '${running}' while the registration asked for '${version}', so this probe would prove nothing"
            exit 1
          fi
          echo "${container} redeployed at APP_VERSION ${running}"
          SH

          # The overview helper. The verdict lives behind an admin frontpage
          # route, and that route answers 401 without a session, 403 to an
          # ordinary user and 412 to an admin without the request token, all
          # three measured in plan 04-03. Basic auth is no way past it, which is
          # what the two round trips below are for. This call is also what puts
          # the container version on record at all: ExAppService::lockstep is
          # reached through the page and nowhere else, and the search path reads
          # what it wrote (KEY_BACKEND_VERSION).
          cat > "${RUNNER_TEMP}/overview.sh" <<'SH'
          #!/bin/sh
          set -eu
          out="$1"
          # Way one, and the one that works without a browser: an app password from
          # occ, used as basic auth. Nextcloud treats an app password as token auth,
          # which is exactly the credential a script is supposed to hold. The form
          # login below stays as the fallback and as the diagnosis if this way dies.
          apppw=""
          if NC_PASS=password timeout 60 php occ user:add-app-password admin \
            --password-from-env > "${RUNNER_TEMP}/apppw.txt" 2>&1; then
            apppw=$(grep -oE '[A-Za-z0-9+/=._-]{40,}' "${RUNNER_TEMP}/apppw.txt" | tail -1)
          fi
          # occ user:add-app-password does not exist on every server of the
          # matrix (stable33 answered 'not available'); the OCS endpoint below
          # is the portable way to the same credential and exists on all three.
          if [ -z "${apppw}" ]; then
            apppw=$(curl -s -u admin:password -H 'OCS-APIRequest: true' \
              'http://localhost:8080/ocs/v2.php/core/getapppassword?format=json' \
              | grep -o '"apppassword":"[^"]*"' | cut -d'"' -f4 || true)
          fi
          if [ -n "${apppw}" ]; then echo "app password: obtained (length ${#apppw})"; else echo "app password: not available"; fi
          if [ -n "${apppw}" ]; then
            # Request.php::passesCSRFCheck() (stable34, line 455) lets any request
          # with the OCS-APIRequest header through, and cookieCheckRequired()
          # waives the strict cookie check for it as well. That header is the
          # scriptable way past the 412 this route answered without it.
          code=$(curl -s -u "admin:${apppw}" -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              -w '%{http_code}' -o "${out}" \
              http://localhost:8080/index.php/apps/findling/admin/overview)
            echo "overview via app password: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              if jq -e '.lockstep | has("state")' "${out}" > /dev/null; then exit 0; fi
              echo "200 without a lockstep verdict:"; head -c 400 "${out}"; echo
            fi
          fi
          # Way two, the session of the login form, with every stage on record: a
          # bare curl exit code on this throwaway instance costs a fifteen-minute
          # run to diagnose (learned three runs in a row).
          jar="${RUNNER_TEMP}/admin-cookies.txt"
          rm -f "${jar}"
          code=$(curl -s -c "${jar}" -o "${RUNNER_TEMP}/login-get.html" \
            -w '%{http_code}' http://localhost:8080/index.php/login)
          token=$(grep -o 'data-requesttoken="[^"]*"' "${RUNNER_TEMP}/login-get.html" \
            | head -1 | cut -d'"' -f2)
          echo "login page: HTTP ${code}, token length ${#token}"
          redirect=$(curl -s -b "${jar}" -c "${jar}" -o /dev/null \
            -w '%{http_code} %{redirect_url}' \
            --data-urlencode "user=admin" \
            --data-urlencode "password=password" \
            --data-urlencode "requesttoken=${token}" \
            http://localhost:8080/index.php/login)
          echo "login post: ${redirect}"
          code=$(curl -s -b "${jar}" -c "${jar}" -o "${RUNNER_TEMP}/settings.html" \
            -w '%{http_code}' http://localhost:8080/index.php/settings/admin)
          token=$(grep -o 'data-requesttoken="[^"]*"' "${RUNNER_TEMP}/settings.html" \
            | head -1 | cut -d'"' -f2)
          echo "settings page: HTTP ${code}, token length ${#token}"
          code=$(curl -s -b "${jar}" -c "${jar}" \
            -H "requesttoken: ${token}" -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            -w '%{http_code}' -o "${out}" \
            http://localhost:8080/index.php/apps/findling/admin/overview)
          echo "overview via session: HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "overview body head:"; head -c 400 "${out}" || true; echo
            exit 1
          fi
          if ! jq -e '.lockstep | has("state")' "${out}" > /dev/null; then
            echo "the overview carries no lockstep verdict, so the session or the route is not what this probe assumes"
            head -c 400 "${out}"
            exit 1
          fi
          SH

          chmod +x "${RUNNER_TEMP}/redeploy.sh" "${RUNNER_TEMP}/overview.sh"

          # The counter sample, and it is the reason the two steps below say
          # anything at all: with the installation untouched the verdict is
          # match, and both numbers are the one version of this release.
          sh "${RUNNER_TEMP}/overview.sh" lockstep-match.json
          jq '.lockstep' lockstep-match.json
          if ! jq -e --arg v "${companion}" \
            '.lockstep.state == "match" and .lockstep.companion == $v and .lockstep.container == $v' \
            lockstep-match.json > /dev/null; then
            echo "the untouched installation does not report a matching pair at ${companion}, so a drift verdict below would be the state it was in all along"
            exit 1
          fi
          echo "baseline: both halves at ${companion}, verdict match"

      # Direction one: the container is a minor ahead of the companion, which is
      # the instance where the ExApp was updated first.
      - name: Drift 1, the container is newer than the companion
        run: |
          sh "${RUNNER_TEMP}/redeploy.sh" "${DRIFT_NEWER}"
          sh "${RUNNER_TEMP}/overview.sh" lockstep-newer.json
          jq '.lockstep' lockstep-newer.json
          if ! jq -e --arg c "${COMPANION_VERSION}" --arg b "${DRIFT_NEWER}" \
            '.lockstep.state == "drift" and .lockstep.companion == $c and .lockstep.container == $b' \
            lockstep-newer.json > /dev/null; then
            echo "the state answer does not name the drift between ${COMPANION_VERSION} and ${DRIFT_NEWER}"
            exit 1
          fi

          # The status code is asserted rather than left to curl -sf, because
          # the distinction between an honest empty answer and a failure is the
          # whole assertion here and -sf would collapse the two.
          code=$(curl -s -o drift-newer.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat drift-newer.json
          if [ "${code}" != "200" ]; then
            echo "the search answered HTTP ${code} while the halves disagree; a provider that fails costs the user every other provider too (T-06.1-36)"
            exit 1
          fi
          if ! jq -e '.ocs.meta.status == "ok" and .ocs.meta.statuscode == 200' drift-newer.json > /dev/null; then
            echo "the OCS envelope reports a failure, which is the same finding one layer down"
            exit 1
          fi
          # The same term that returned the canary two steps ago. No hit may
          # come out of a protocol the other half no longer speaks (T-06.1-37),
          # and the term is what makes the emptiness mean something.
          if ! jq -e '.ocs.data.entries | length == 0' drift-newer.json > /dev/null; then
            echo "the search returned hits although the two halves disagree about what they mean to each other"
            exit 1
          fi
          echo "container ahead: HTTP 200, no hits, verdict drift"

      # Direction two: the companion is a minor ahead of the container, which is
      # the instance where the app store half was updated first. Both directions
      # are run because the comparison is symmetric in ExAppService and a check
      # that only ever saw one of them would not have shown that.
      - name: Drift 2, the container is older than the companion
        run: |
          sh "${RUNNER_TEMP}/redeploy.sh" "${DRIFT_OLDER}"
          sh "${RUNNER_TEMP}/overview.sh" lockstep-older.json
          jq '.lockstep' lockstep-older.json
          if ! jq -e --arg c "${COMPANION_VERSION}" --arg b "${DRIFT_OLDER}" \
            '.lockstep.state == "drift" and .lockstep.companion == $c and .lockstep.container == $b' \
            lockstep-older.json > /dev/null; then
            echo "the state answer does not name the drift between ${COMPANION_VERSION} and ${DRIFT_OLDER}"
            exit 1
          fi

          code=$(curl -s -o drift-older.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat drift-older.json
          if [ "${code}" != "200" ]; then
            echo "the search answered HTTP ${code} while the halves disagree; a provider that fails costs the user every other provider too (T-06.1-36)"
            exit 1
          fi
          if ! jq -e '.ocs.meta.status == "ok" and .ocs.meta.statuscode == 200' drift-older.json > /dev/null; then
            echo "the OCS envelope reports a failure, which is the same finding one layer down"
            exit 1
          fi
          if ! jq -e '.ocs.data.entries | length == 0' drift-older.json > /dev/null; then
            echo "the search returned hits although the two halves disagree about what they mean to each other"
            exit 1
          fi
          echo "container behind: HTTP 200, no hits, verdict drift"

      # The way back, and it is an assertion rather than a cleanup. The uninstall
      # proof below is about the installation this job made, so it has to be that
      # installation again: the same file, the same container name, the same
      # volume, a matching verdict and a search that finds the canary a second
      # time. A drift the job left behind would be inherited by every step after
      # it, silently, because none of them looks at a version.
      - name: Drift 3, the right version is back and the search answers again
        run: |
          sh "${RUNNER_TEMP}/redeploy.sh" "${COMPANION_VERSION}"
          # The restored file has to be the installed one byte for byte, not
          # merely a file that carries the same number somewhere.
          diff "${RUNNER_TEMP}/info-citest.xml" "${RUNNER_TEMP}/info-drift.xml"

          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ "${container}" != "${EXAPP_CONTAINER}" ]; then
            echo "the container is called '${container}' and the uninstall assertions look for '${EXAPP_CONTAINER}', which they would find missing for the wrong reason (T-05-29)"
            exit 1
          fi
          volume=$(docker volume ls --filter "name=${EXAPP_VOLUME}" --format '{{.Name}}')
          if [ "${volume}" != "${EXAPP_VOLUME}" ]; then
            echo "the volume ${EXAPP_VOLUME} did not survive the three redeployments, found '${volume}'"
            docker volume ls
            exit 1
          fi

          sh "${RUNNER_TEMP}/overview.sh" lockstep-restored.json
          jq '.lockstep' lockstep-restored.json
          if ! jq -e --arg v "${COMPANION_VERSION}" \
            '.lockstep.state == "match" and .lockstep.companion == $v and .lockstep.container == $v' \
            lockstep-restored.json > /dev/null; then
            echo "the halves still disagree after the restore, so every step below would run on a drifted instance"
            exit 1
          fi

          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee restored.json
          if ! jq -e '.ocs.data.entries | length == 1' restored.json > /dev/null; then
            echo "the search does not find the canary again, so the emptiness above was not the drift"
            exit 1
          fi
          jq -e '.ocs.data.entries[0].title == "findling-canary"' restored.json
          echo "restored at ${COMPANION_VERSION}, verdict match, canary found again"

      # From here to the teardown runs the uninstall proof, the second half of
      # success criterion 3 of this phase. It falls into assertions that are
      # separate steps on purpose: each one has its own message, each one treats
      # an empty result as a failure, and the order is not free. Assertion 1 is
      # first because it is the only one that can still be made afterwards.
      #
      # What this proof does not cover, and it says so where an admin reads it
      # (docs/uninstall.md): it never touches the web interface, so the "delete
      # data" switch of the app management stays unproven, and it does not check
      # that the pulled image is gone, because the unregister path of AppAPI
      # removes containers and volumes and never an image. Nextcloud 33 is the
      # version in this window that still has that switch; Nextcloud 32 had it as
      # well and left the window with E-H1.
      #
      # Assertion 1: without the flag the data stay. That is the promise decision
      # D-16 rests on, and once assertion 3 has run it cannot be made any more.
      - name: Uninstall 1, an unregister without the flag keeps the volume
        run: |
          if [ -z "${EXAPP_VOLUME}" ] || [ -z "${EXAPP_CONTAINER}" ]; then
            echo "the install step handed over no container or volume name, so this assertion would pass without looking at anything"
            exit 1
          fi
          timeout 300 ./occ app_api:app:unregister findling_backend
          still_there=$(docker ps -a --filter "name=${EXAPP_CONTAINER}" --format '{{.Names}}')
          if [ -n "${still_there}" ]; then
            echo "the container ${EXAPP_CONTAINER} survived the unregister, so the deregistration removed nothing"
            docker ps -a
            exit 1
          fi
          kept=$(docker volume ls --filter "name=${EXAPP_VOLUME}" --format '{{.Name}}')
          if [ "${kept}" != "${EXAPP_VOLUME}" ]; then
            echo "the volume ${EXAPP_VOLUME} is gone after an unregister without --rm-data, and the documented default is that it stays; found '${kept}'"
            docker volume ls
            exit 1
          fi
          echo "container gone, volume ${kept} kept"

      # Assertion 2: the way back. A second registration on the volume the first
      # one left behind is the path an admin takes after a failed attempt, and
      # that it succeeds and picks up the same volume is worth asserting rather
      # than assuming: this is where days of OCR work on a weak box either
      # survive or quietly do not.
      - name: Uninstall 2, a second registration picks up the volume it left
        run: |
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-citest.xml" --wait-finish
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the second registration created no running container"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ "${volume}" != "${EXAPP_VOLUME}" ]; then
            echo "the second registration did not take the volume of the first one, expected ${EXAPP_VOLUME} and found '${volume}'"
            docker volume ls
            exit 1
          fi
          echo "registered again as ${container} on the kept volume ${volume}"

      # Assertion 3: with the flag the data go. The filter is the name from the
      # install step, so an empty answer here means the volume is gone and not
      # that nothing was ever looked for.
      - name: Uninstall 3, an unregister with --rm-data removes the volume
        run: |
          if [ -z "${EXAPP_VOLUME}" ]; then
            echo "no volume name from the install step, so an empty filter result would be a false green (T-05-29)"
            exit 1
          fi
          timeout 300 ./occ app_api:app:unregister findling_backend --rm-data
          left=$(docker volume ls --filter "name=${EXAPP_VOLUME}" --format '{{.Name}}')
          if [ -n "${left}" ]; then
            echo "the volume ${EXAPP_VOLUME} survived an unregister with --rm-data, found '${left}'"
            docker volume ls
            exit 1
          fi
          container=$(docker ps -a --filter "name=${EXAPP_CONTAINER}" --format '{{.Names}}')
          if [ -n "${container}" ]; then
            echo "the container ${EXAPP_CONTAINER} survived the unregister with --rm-data"
            docker ps -a
            exit 1
          fi
          echo "container and volume ${EXAPP_VOLUME} both gone"

      # Every query below carries ".timeout 30000", and that is a measurement as
      # well: the ExApp container is running next to these reads and Nextcloud
      # writes to the same sqlite file for it, so the plain client walked into
      # "in prepare, database is locked (5)" on Nextcloud 32 (run 33756788051)
      # while the other three versions happened to read between two writes. A
      # busy timeout turns a race into a wait. That entry has since left the
      # matrix with E-H1, and the timeout stays: the race belongs to two writers
      # on one sqlite file and not to that version.
      #
      # Assertions 4 and 5 ask the same two questions of the database, and they
      # ask the database rather than occ on purpose: there is no occ command that
      # reports whether a table exists (occ db:* converts, adds indices and
      # repairs), and an occ call that fails prints nothing, which would read
      # exactly like "no tables left" and turn a broken measurement into a green
      # result. The dialect is checked before the first query, because a query
      # against the wrong dialect is the same false green in a different costume.
      - name: The database probe the last two assertions share
        run: |
          dbtype=$(timeout 30 ./occ config:system:get dbtype)
          if [ "${dbtype}" != "sqlite3" ]; then
            echo "these assertions read the sqlite test database, but dbtype is '${dbtype}'"
            exit 1
          fi
          # Neither key is asked for without a way out: config:system:get exits
          # non zero and prints nothing when a key is absent from config.php, and
          # dbname is absent after a sqlite install (measured in run
          # 33756342732, where this step died silently on that single line). The
          # file is therefore looked for rather than derived, and not finding it
          # is an error with a message.
          datadir=$(timeout 30 ./occ config:system:get datadirectory 2>/dev/null || echo "${PWD}/data")
          dbname=$(timeout 30 ./occ config:system:get dbname 2>/dev/null || echo '')
          db="${datadir}/${dbname}.db"
          if [ -z "${dbname}" ] || [ ! -f "${db}" ]; then
            db=$(find "${datadir}" -maxdepth 1 -name '*.db' | head -n 1)
          fi
          if [ -z "${db}" ] || [ ! -f "${db}" ]; then
            echo "no sqlite database found under ${datadir}, so the two assertions below would measure nothing"
            ls -la "${datadir}" || true
            exit 1
          fi
          if ! command -v sqlite3 > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3
          fi
          echo "FINDLING_DB=${db}" >> "${GITHUB_ENV}"
          echo "database ${db}, dialect ${dbtype}"

      # Assertion 4: a disable without intent leaves the Nextcloud half alone.
      # It runs before assertion 5 for the reason threat T-05-31 names: the
      # intent mark of plan 05-02 is a one shot flag, and the only way to show
      # that a disable clears nothing is to disable while no mark is set.
      - name: Uninstall 4, a disable without intent keeps tables and settings
        run: |
          expected='oc_findling_file_state oc_findling_queue oc_findling_scan_stats'
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "before the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the three tables of the app are not all there before the disable, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          timeout 300 ./occ app:disable findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the disable removed tables although no intent was armed, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          if [ "${settings}" -lt 1 ]; then
            echo "the disable emptied the settings of the app although no intent was armed, ${settings} values left"
            exit 1
          fi

      # Assertion 5: a remove with intent clears the Nextcloud half. The order
      # inside the step is the documented one from docs/uninstall.md, and the
      # registration in the middle of it belongs to assertion 6: that one needs a
      # live container while the companion goes away, and the deployment
      # handshake has to happen while the installation is still complete.
      - name: Uninstall 5, a remove with intent clears tables and settings
        run: |
          timeout 300 ./occ app:enable findling
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-citest.xml" --wait-finish
          timeout 300 ./occ findling:purge --arm --no-interaction
          timeout 300 ./occ app:remove findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the remove with intent: tables [${tables}], settings ${settings}"
          if [ -n "${tables}" ]; then
            echo "the remove with intent left tables behind: [${tables}]"
            exit 1
          fi
          if [ "${settings}" -ne 0 ]; then
            echo "the remove with intent left ${settings} settings behind"
            exit 1
          fi

      # Assertion 6: the other half of a half removal. The container that has
      # just lost its caller keeps running and polls a queue that is not there
      # any more, and D-17 says that is a state of operation and not a defect.
      # What it must not become is an error loop: a line per pass fills the disk
      # of a four gigabyte box and hides the lines that would have said something
      # (T-05-30). Measured here in both directions, alive and quiet.
      - name: Uninstall 6, the container without a companion retreats
        run: |
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container after the companion was removed, so the container did not survive the half removal"
            docker ps -a
            exit 1
          fi
          noisy_lines() {
            docker logs "${container}" 2>&1 | grep -cE '^(WARNING|ERROR|CRITICAL):' || true
          }
          before=$(noisy_lines)
          # A budget, not a fixed pause. The poller announces the retreat on the
          # third unanswered pass, and the pause before the first of them can be
          # anything up to the cap of an empty queue, so the worst case is around
          # 165 s. The loop leaves as soon as the line is there, which is some
          # 45 s in the ordinary case.
          entered=""
          for _ in $(seq 1 24); do
            if docker logs "${container}" 2>&1 | grep -q 'the queue has not answered for'; then
              entered="yes"
              break
            fi
            sleep 10
          done
          if [ -z "${entered}" ]; then
            echo "the container never announced the retreat, so it is either still polling pass by pass or it is not polling at all"
            docker logs "${container}" 2>&1 | tail -n 40
            exit 1
          fi
          alive=$(docker ps --filter "name=${container}" --format '{{.Status}}')
          if [ -z "${alive}" ]; then
            echo "the container stopped during the retreat instead of waiting it out"
            docker ps -a
            exit 1
          fi
          # The number that separates a retreat from an error loop, and it is a
          # growth rather than a total so that whatever the container logged
          # while the companion was still there does not count: two ordinary
          # lines for the two passes before the state, one for the state itself,
          # and two spare. A loop per pass would be far above five within the
          # four minutes of the budget above.
          after=$(noisy_lines)
          grew=$((after - before))
          if [ "${grew}" -gt 5 ]; then
            echo "the container wrote ${grew} new warning or error lines while its caller was gone, which is an error loop and not a retreat"
            docker logs "${container}" 2>&1 | grep -E '^(WARNING|ERROR|CRITICAL):' | tail -n 20
            exit 1
          fi
          echo "container ${container} is ${alive}, retreat announced, ${grew} new warning or error lines"

      # =====================================================================
      # The store install path, added by plan 06.1-12
      #
      # Everything above installs the two halves the way a developer does: the
      # companion is moved into apps/ out of the working tree by the composite
      # action, and the ExApp is registered with an info.xml this job rewrites so
      # that it points at a registry on localhost. Both are legitimate for what
      # they prove, and neither of them is the path a stranger walks.
      #
      # From here on the job walks that path. It starts where "Uninstall 5" left
      # the instance, which is the cheapest clean slate this job can reach: the
      # companion is removed, its tables and settings are gone, and the only
      # thing still standing is the container of assertion 6. So the first step
      # takes that container away as well, and then both halves come back out of
      # the release archives.
      #
      # Pitfall 8, written here because this is where it would be walked into:
      # scripts/dev/register-exapp.sh and .github/actions/setup-test-nc are
      # manual-install paths. They pull no image, they create no container, and
      # they read no route list out of an archive. A step below that reached for
      # either of them would prove nothing about the store path, and the warning
      # sign is a path into findling-src where a registry address belongs.
      #
      # And the question plan 06.1-12 had to answer rather than leave open: does
      # the developer pass above stay now that this one exists? It stays, and the
      # reason is not habit. The two passes prove different things and only one
      # of them can prove either.
      #
      #   The developer pass installs the image built from THIS commit. It is the
      #   only pass that can, because a store install by definition pulls a
      #   published image, and on a branch that image is whatever main published
      #   last. Delete the developer pass and no run ever exercises the container
      #   code under review.
      #
      #   The store pass installs what a stranger installs and can say nothing
      #   about the commit under review. Delete it and the release archive, the
      #   route list inside it, the code signature and the anonymous pull go back
      #   to being untested.
      #
      # A silent side by side of two installation paths would be the one
      # unacceptable answer, so the difference is written here: above is the
      # commit, below is the release.
      # =====================================================================

      # The archives are built here rather than downloaded, and the reason is
      # release.yml itself: it runs on a tag or on a manual dispatch and it holds
      # both signing keys, so it does not run on a push and cannot run on a pull
      # request at all (docs/certificates.md forbids exactly that). An artifact
      # from it would therefore be missing on every event this job has, or would
      # come from a different commit, which is worse.
      #
      # What is emphatically NOT done is a second packing path. The staging rules
      # and the tar options are in scripts/release/store-archive.sh and both
      # workflows call the same subcommands, so an archive built here is an
      # archive built the way the released one is built. The content proof runs
      # here too, over the archives this job is about to install from.
      #
      # The signature is the one place where this job cannot be the real thing,
      # and the substitute is named rather than hidden. The release key lives in
      # secrets.APP_PRIVATE_KEY, and docs/certificates.md forbids a workflow with
      # a pull_request trigger from reaching it, which this workflow has. So the
      # job mints its own throwaway code signing identity: a CA that exists for
      # the length of this run, and a leaf certificate whose CN is the app id,
      # because Checker::verify compares the CN against the app id and rejects
      # anything else. The CA is appended to resources/codesigning/root.crt of
      # the throwaway server checkout, which works because Checker splits that
      # file into individual certificates and loads every one of them.
      #
      # What that substitute proves: that the archive carries a signature over
      # the exact file list it ships, that the instance recomputes the hashes of
      # every one of those files and finds them unchanged, and that a single
      # altered byte turns the verdict red. That is the mechanism the store
      # relies on.
      #
      # What it expressly does not prove: that the certificate comes from the
      # Nextcloud Code Signing Root Authority. Nothing here can prove that,
      # because nothing here may hold the key. release.yml proves the other half
      # instead, by fetching both certificates and comparing their public key
      # fingerprints against docs/certificates.md before it signs anything.
      - name: Store install 1, build both release archives and sign the companion
        run: |
          # Every occ call of the store install path goes through this wrapper,
          # and the reason is the zero config proof further down: it has to be
          # able to state which commands ran between the installation and the
          # first hit, and a list somebody maintains by hand is a list that goes
          # stale. The wrapper records and then runs. What it cannot see is a
          # direct ./occ call somebody adds later without it, and that limit is
          # stated here rather than left to be discovered.
          echo "OCC_LOG=${RUNNER_TEMP}/occ-calls.txt" >> "${GITHUB_ENV}"
          : > "${RUNNER_TEMP}/occ-calls.txt"
          cat > "${RUNNER_TEMP}/nc-occ.sh" <<'SH'
          #!/bin/sh
          set -eu
          printf '%s\n' "occ $*" >> "${OCC_LOG}"
          exec timeout 600 ./occ "$@"
          SH
          chmod +x "${RUNNER_TEMP}/nc-occ.sh"

          # The throwaway code signing identity. Two days of validity, because a
          # certificate that expired between signing and checking would fail with
          # a message about a signature and not about a clock.
          mkdir -p "${RUNNER_TEMP}/ci-pki"
          (
            umask 077
            openssl req -x509 -newkey rsa:4096 -sha256 -days 2 -nodes \
              -keyout "${RUNNER_TEMP}/ci-pki/root.key" \
              -out "${RUNNER_TEMP}/ci-pki/root.crt" \
              -subj "/CN=Findling CI Code Signing Root"
            openssl req -new -newkey rsa:4096 -sha256 -nodes \
              -keyout "${RUNNER_TEMP}/ci-pki/findling.key" \
              -out "${RUNNER_TEMP}/ci-pki/findling.csr" \
              -subj "/CN=findling"
            openssl x509 -req -sha256 -days 2 \
              -in "${RUNNER_TEMP}/ci-pki/findling.csr" \
              -CA "${RUNNER_TEMP}/ci-pki/root.crt" \
              -CAkey "${RUNNER_TEMP}/ci-pki/root.key" \
              -CAcreateserial \
              -out "${RUNNER_TEMP}/ci-pki/findling.crt"
          )
          openssl x509 -in "${RUNNER_TEMP}/ci-pki/findling.crt" -noout -subject -issuer -nameopt RFC2253

          # The trust anchor of this run, appended and not replaced: the
          # Nextcloud Root Authority stays in the file, so the only difference to
          # a released archive is which of the two certificates in it signed the
          # app.
          #
          # The newline is the whole trick. root.crt ships from the server repo
          # without a trailing newline on every branch this job runs against, so
          # a plain append glues "-----END CERTIFICATE-----" and the following
          # "-----BEGIN CERTIFICATE-----" onto one line, and Checker::splitCerts
          # then walks past the CI root instead of returning it. The instance
          # answers that with "Certificate is not valid.", which reads like a bad
          # certificate and is really a missing trust anchor.
          #
          # The count is anchored for the same reason: an unanchored
          # 'BEGIN CERTIFICATE' matches the glued line too and reports three
          # certificates for a file that splits into two.
          if [ -n "$(tail -c 1 resources/codesigning/root.crt)" ]; then
            printf '\n' >> resources/codesigning/root.crt
          fi
          before=$(grep -c '^-----BEGIN CERTIFICATE-----$' resources/codesigning/root.crt)
          cat "${RUNNER_TEMP}/ci-pki/root.crt" >> resources/codesigning/root.crt
          after=$(grep -c '^-----BEGIN CERTIFICATE-----$' resources/codesigning/root.crt)
          echo "root.crt carried ${before} certificate(s) and now carries ${after}"
          if [ "${after}" -ne $((before + 1)) ]; then
            echo "the CI root was not appended as exactly one certificate, so the integrity check below would fail for the wrong reason"
            exit 1
          fi

          # Stage, sign, pack, in that order and for the same reason release.yml
          # keeps it: the code signature has to be inside the tarball.
          rm -rf "${RUNNER_TEMP}/store-php" "${RUNNER_TEMP}/store-backend" "${RUNNER_TEMP}/store-dist"
          # setup-test-nc moved php/ into apps/findling earlier, so the checkout
          # no longer carries it. The archive has to come from the committed
          # state anyway, so restore a pristine copy from git before staging.
          ( cd findling-src && git restore --source=HEAD -- php )
          ( cd findling-src && sh scripts/release/store-archive.sh stage-companion "${RUNNER_TEMP}/store-php" )
          ( cd findling-src && sh scripts/release/store-archive.sh stage-backend "${RUNNER_TEMP}/store-backend" )

          timeout 120 ./occ integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/ci-pki/findling.key" \
            --certificate="${RUNNER_TEMP}/ci-pki/findling.crt" \
            --path="${RUNNER_TEMP}/store-php/findling"
          test -s "${RUNNER_TEMP}/store-php/findling/appinfo/signature.json"
          echo "appinfo/signature.json was written and is not empty"

          ( cd findling-src && sh scripts/release/store-archive.sh pack \
              "${RUNNER_TEMP}/store-php" findling "${RUNNER_TEMP}/store-dist/findling.tar.gz" )
          ( cd findling-src && sh scripts/release/store-archive.sh pack \
              "${RUNNER_TEMP}/store-backend" findling_backend "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" )

          # The same content proof release.yml runs, over the archives this job
          # is about to install from. An archive with a tests directory in it is
          # a different product from the one that was reviewed, and this is the
          # place where that would surface before it is installed.
          fail=0
          ( cd findling-src && sh scripts/release/store-archive.sh assert-contents \
              "${RUNNER_TEMP}/store-dist/findling.tar.gz" findling 1 ) || fail=1
          ( cd findling-src && sh scripts/release/store-archive.sh assert-contents \
              "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" findling_backend 0 ) || fail=1
          exit "${fail}"

      # The clean slate. Assertion 6 deliberately left a container running
      # without its caller, and an archive installation on top of that would
      # inherit a volume and a registration from the developer path, which is
      # precisely the confusion this whole second pass exists to avoid.
      #
      # --rm-data on purpose: the volume of the first pass must not survive into
      # the second, otherwise the zero config proof further down could be reading
      # an index the first pass built.
      - name: Store install 2, take the developer installation away completely
        run: |
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend --rm-data
          left=$(docker ps -a --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -n "${left}" ]; then
            echo "a container named ${left} survived the unregister, so the second pass would not start from a clean instance"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -n "${volume}" ]; then
            echo "the volume ${volume} survived the unregister with --rm-data, so an index of the first pass could be read as a result of the second"
            docker volume ls
            exit 1
          fi
          # "Uninstall 5" removed the companion with occ app:remove, which takes
          # the directory with it. Asserted rather than assumed, because an
          # archive extracted over leftovers would be a mixture of two
          # installations and the integrity check would report the leftovers as
          # extra files, which reads like an archive defect.
          if [ -e apps/findling ]; then
            echo "apps/findling still exists after occ app:remove, so the archive installation would be laid over leftovers"
            find apps/findling -maxdepth 2 -mindepth 1 -printf '  %P\n' | sort
            exit 1
          fi
          echo "no container, no volume, no companion directory"

      # The half this step is about is the one the store checks: the companion is
      # PHP that the instance itself loads, so the instance itself can say
      # whether what it loads is what was signed.
      #
      # Why occ integrity:check-app is more than "the directory is there": it
      # reads appinfo/signature.json, validates the certificate against
      # resources/codesigning/root.crt, verifies the RSA-PSS signature over the
      # hash list, and then recomputes the SHA-512 of every single file it ships
      # and compares. No network and no store are involved in any of that, which
      # is why it works on this instance at all.
      #
      # And the trap that makes a naive version of this step a false green, which
      # is exactly the class of mistake this phase exists to remove: CheckApp
      # skips an app that ships no signature.json and returns 0 while printing
      # "App signature not found, skipping app integrity check". A step that only
      # looks at the exit code would be green for an unsigned archive. So the
      # file is asserted to be there, that sentence is asserted to be absent, and
      # the output is asserted to be empty on top.
      - name: Store install 3, the companion out of the archive, verified by the instance
        run: |
          tar -xzf "${RUNNER_TEMP}/store-dist/findling.tar.gz" -C apps
          test -d apps/findling
          # Not a single path into the working tree: the whole companion arrives
          # through the archive, which is what the composite action does not do.
          if [ ! -f apps/findling/appinfo/signature.json ]; then
            echo "the extracted companion carries no appinfo/signature.json, and integrity:check-app would skip it and answer 0"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app:enable findling

          # The verdict is wanted together with the exit code, so the call goes
          # into a file and the status is caught with "|| status=$?" rather than
          # with a pipeline: a pipeline would hand this step the status of the
          # last stage and hide the one that matters.
          check() {
            "${RUNNER_TEMP}/nc-occ.sh" integrity:check-app findling > "$1" 2>&1
          }

          status=0
          check "${RUNNER_TEMP}/integrity-clean.txt" || status=$?
          cat "${RUNNER_TEMP}/integrity-clean.txt"
          if [ "${status}" -ne 0 ]; then
            echo "occ integrity:check-app findling answered ${status} on an untouched archive installation"
            exit 1
          fi
          if grep -q 'skipping app integrity check' "${RUNNER_TEMP}/integrity-clean.txt"; then
            echo "the check skipped the app instead of verifying it, so the exit code above says nothing"
            exit 1
          fi
          if [ -s "${RUNNER_TEMP}/integrity-clean.txt" ]; then
            echo "occ integrity:check-app findling printed something, and a clean verdict is an empty answer"
            exit 1
          fi
          echo "occ integrity:check-app findling: empty answer, verdict clean"

          # The falsification, and the reason the step above means anything. One
          # appended line in one shipped file, and the verdict has to turn. If it
          # does not, the empty answer above was the answer of a check that was
          # not looking.
          probe=apps/findling/lib/AppInfo/Application.php
          test -f "${probe}"
          cp "${probe}" "${RUNNER_TEMP}/integrity-probe-original"
          printf '\n// a single line appended by the tamper probe of plan 06.1-12\n' >> "${probe}"
          status=0
          check "${RUNNER_TEMP}/integrity-tampered.txt" || status=$?
          cat "${RUNNER_TEMP}/integrity-tampered.txt"
          if [ "${status}" -eq 0 ]; then
            echo "one altered file did not change the verdict, so the integrity check of this instance is not checking"
            exit 1
          fi
          if ! grep -q 'INVALID_HASH' "${RUNNER_TEMP}/integrity-tampered.txt"; then
            echo "the check failed but did not name the altered file as an invalid hash, so it failed for another reason"
            exit 1
          fi
          echo "tamper probe: one altered line, verdict INVALID_HASH, exit ${status}"

          # And back, because everything after this step runs against the
          # installation the archive produced and not against a tampered one.
          cp "${RUNNER_TEMP}/integrity-probe-original" "${probe}"
          status=0
          check "${RUNNER_TEMP}/integrity-restored.txt" || status=$?
          cat "${RUNNER_TEMP}/integrity-restored.txt"
          if [ "${status}" -ne 0 ] || [ -s "${RUNNER_TEMP}/integrity-restored.txt" ]; then
            echo "the restored file does not verify again, so the probe left the installation behind in a state nobody meant"
            exit 1
          fi
          echo "restored: empty answer, verdict clean again"
          {
            echo ""
            echo "Store install on ${{ matrix.server-version }}: the companion was installed from"
            echo "\`findling.tar.gz\` and verified by \`occ integrity:check-app\`, and a single altered"
            echo "line turned that verdict into INVALID_HASH."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Annahme A6 of the research, answered by doing it rather than by reasoning
      # about it: can the published image be pulled without any credentials, the
      # way a stranger would pull it? The step sets DOCKER_CONFIG to an empty
      # directory of its own, so a credential that some earlier step might have
      # left in the default config cannot be used by accident. That is the whole
      # point of threat T-06.1-50: a stranger install test that measures our own
      # registry access measures nothing.
      #
      # The second half of this step is the precondition nobody had checked. The
      # archive names registry, image and image-tag, which today is
      # ghcr.io/street1983nk/findling_backend at the released version, and AppAPI
      # pulls exactly that reference. docker.yml publishes that version tag only
      # on a v tag push and otherwise only :dev and the commit SHA, so on an
      # ordinary branch the reference the archive names does not exist yet. That
      # is not a reason to skip quietly:
      #
      #   on main and on a release tag it is a hard failure, because there the
      #   missing tag is the store install failing at a user's instance;
      #   anywhere else it is a named finding, printed and written into the job
      #   summary, and the run continues against the moving tag docker.yml
      #   publishes from main, with the one changed line shown as a diff.
      - name: Store install 4, pull the image without any credentials
        run: |
          mkdir -p "${RUNNER_TEMP}/store-extract"
          tar -xzf "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" -C "${RUNNER_TEMP}/store-extract"
          archive_info="${RUNNER_TEMP}/store-extract/findling_backend/appinfo/info.xml"
          test -f "${archive_info}"

          registry=$(sed -n 's:.*<registry>\(.*\)</registry>.*:\1:p' "${archive_info}" | head -1)
          image=$(sed -n 's:.*<image>\(.*\)</image>.*:\1:p' "${archive_info}" | head -1)
          tag=$(sed -n 's:.*<image-tag>\(.*\)</image-tag>.*:\1:p' "${archive_info}" | head -1)
          if [ -z "${registry}" ] || [ -z "${image}" ] || [ -z "${tag}" ]; then
            echo "the archive info.xml does not name registry, image and image-tag, so nothing here knows what to pull"
            exit 1
          fi
          echo "the archive asks for ${registry}/${image}:${tag}"

          # An empty docker configuration, created here and used by every docker
          # command of this step and of the deploy below. Not a flag on one call:
          # the deploy daemon pulls through the docker socket of this runner, so
          # the credential store the daemon reads has to be the empty one too.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-anonymous"
          mkdir -p "${DOCKER_CONFIG}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
          echo "docker configuration directory contents:"
          ls -la "${DOCKER_CONFIG}"

          released="${registry}/${image}:${tag}"
          store_info="${archive_info}"
          probe=0
          docker buildx imagetools inspect "${released}" > "${RUNNER_TEMP}/manifest-released.txt" 2>&1 || probe=$?
          cat "${RUNNER_TEMP}/manifest-released.txt"
          if [ "${probe}" -eq 0 ]; then
            reference="${released}"
            echo "the tag the archive names exists, so the archive info.xml is used byte for byte"
          else
            echo "the tag the archive names does not exist in the registry"
            case "${GITHUB_REF}" in
              refs/heads/main|refs/tags/v*)
                echo "::error::${released} does not exist, and on ${GITHUB_REF} that is a store installation that would fail at a user's instance"
                exit 1
                ;;
            esac
            reference="${registry}/${image}:dev"
            docker buildx imagetools inspect "${reference}" > "${RUNNER_TEMP}/manifest-dev.txt" 2>&1
            cat "${RUNNER_TEMP}/manifest-dev.txt"
            store_info="${RUNNER_TEMP}/info-store.xml"
            sed -e "s|<image-tag>[^<]*</image-tag>|<image-tag>dev</image-tag>|" \
              "${archive_info}" > "${store_info}"
            # Exactly one line differs, and it is shown rather than described.
            # Everything else, the routes block above all, comes out of the
            # archive unchanged.
            diff "${archive_info}" "${store_info}" || true
            changed=$(diff "${archive_info}" "${store_info}" | grep -c '^[<>]' || true)
            if [ "${changed}" -ne 2 ]; then
              echo "the substitution changed ${changed} lines instead of the one image-tag line"
              exit 1
            fi
            {
              echo ""
              echo "**Finding on ${{ matrix.server-version }}:** the archive names \`${released}\`,"
              echo "which does not exist in the registry on this ref. The store install path ran"
              echo "against \`${reference}\` instead, with only the \`image-tag\` line replaced."
              echo "On \`main\` and on a release tag the same situation is a hard failure."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          # The pull itself, and it is the answer to A6. No login anywhere in
          # this workflow, an empty credential store, and the platform spelled
          # out so that the index resolves to the half this runner can start.
          docker pull --platform linux/amd64 "${reference}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${reference}")
          echo "pulled anonymously: ${digest}"

          # And away again, so that the deploy daemon has to fetch it itself.
          # Leaving it here would let the installation below find a local image
          # and never touch the registry, which is the difference between
          # proving the path and assuming it.
          docker rmi "${reference}" > /dev/null
          echo "the local copy is gone, the deploy daemon has to pull it again"

          {
            echo "STORE_IMAGE_REFERENCE=${reference}"
            echo "STORE_IMAGE_PATH=${registry}/${image}"
            echo "STORE_INFO_XML=${store_info}"
            echo "ARCHIVE_INFO_XML=${archive_info}"
          } >> "${GITHUB_ENV}"

      # The falsification of the whole ExApp half, and it runs before the real
      # registration on purpose: an empty search after a stripped archive means
      # nothing on its own, and the step after this one is where the same call
      # with the same term comes back with a hit.
      #
      # What is being falsified: pre-info.xslt drops the routes block, so the
      # store database never sees the five routes of this container and AppAPI
      # reads them out of the archive at installation time. If that were not so,
      # an archive without the block would install and search exactly like one
      # with it, and the byte for byte copy in scripts/release/store-archive.sh
      # would be a superstition.
      #
      # Both outcomes of the registration are a finding rather than an error: an
      # archive whose info.xml lost the block may fail to install, or it may
      # install into an app with no search route and no error message. The second
      # is the one this project is afraid of, and it is the one that must not
      # produce a hit.
      - name: Store install 5, an archive without its routes block finds nothing
        run: |
          sed '/<routes>/,/<\/routes>/d' "${STORE_INFO_XML}" > "${RUNNER_TEMP}/info-noroutes.xml"
          routes=$(grep -c '<route>' "${RUNNER_TEMP}/info-noroutes.xml" || true)
          if [ "${routes}" -ne 0 ]; then
            echo "the stripped copy still carries ${routes} route elements, so this probe would prove nothing"
            exit 1
          fi
          echo "the stripped copy carries no route element"

          status=0
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-noroutes.xml" --wait-finish || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "an archive without its routes block does not even install (exit ${status}), which is the same finding one layer earlier"
          else
            code=$(curl -s -o noroutes.json -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
            cat noroutes.json
            echo "the search answered HTTP ${code}"
            # Fail closed, and the order of the branches is what makes it fail
            # closed: only an answer that is a valid OCS envelope with no entries
            # passes. An unparsable body falls into the last branch rather than
            # into the middle one, so a broken answer cannot be read as an empty
            # one.
            if [ "${code}" != "200" ]; then
              echo "the app is installed and the search answers HTTP ${code}, so the missing route breaks the search outright"
            elif jq -e '.ocs.data.entries | length == 0' noroutes.json > /dev/null; then
              echo "installed without a search route, and the search stays empty, which is exactly the silent failure the archive rule prevents"
            else
              echo "the search answered 200 with entries or with something jq cannot read, although the archive carries no search route; either AppAPI does not read the routes out of the archive or this probe is measuring the wrong answer"
              exit 1
            fi
          fi

          # Away completely, including the volume, so the real installation below
          # starts where a stranger starts.
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend --rm-data || true
          docker rm -f "$(docker ps -aq --filter 'name=findling_backend')" 2> /dev/null || true
          leftover=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -n "${leftover}" ]; then
            echo "the probe left the volume ${leftover} behind, and the installation below would inherit it"
            docker volume ls
            exit 1
          fi

      # The registration a store install performs, with the file a store install
      # reads. --wait-finish makes the handshake synchronous, so the assertions
      # that follow measure a finished installation and not a race.
      #
      # The info.xml comes out of the unpacked archive and from nowhere else. Not
      # a preference: pre-info.xslt drops the routes block, the store database
      # never sees it, and AppAPI reads it back out of this file at installation
      # time. A path into findling-src here would be the warning sign of pitfall
      # 8 and would turn this into a manual-install test wearing a store install
      # costume.
      - name: Store install 6, the ExApp out of the archive, image out of the registry
        run: |
          echo "registering with ${STORE_INFO_XML}"
          grep -E '<registry>|<image>|<image-tag>' "${STORE_INFO_XML}"
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${STORE_INFO_XML}" --wait-finish

          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container matches findling_backend, so the deploy daemon created nothing out of the archive"
            docker ps -a
            exit 1
          fi
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'

          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -z "${volume}" ]; then
            echo "no volume matches findling_backend, so the archive installation has no data volume"
            docker volume ls
            exit 1
          fi
          echo "exapp volume: ${volume}"

          # The image the container really runs, read off the container rather
          # than off the registration, and compared against the reference the
          # archive named. This is where an installation that quietly used some
          # other image would show.
          running_image=$(docker inspect --format '{{.Config.Image}}' "${container}")
          echo "the container runs image ${running_image}"
          # The repository path and not the whole reference, because AppAPI may
          # address the image by digest once it has resolved the tag. What has to
          # hold is that the image comes from the registry the archive names and
          # never from localhost:5000, which is the address the developer path
          # uses one pass earlier.
          case "${running_image}" in
            *"${STORE_IMAGE_PATH}"*) ;;
            *)
              echo "the container runs '${running_image}' while the archive named '${STORE_IMAGE_PATH}'"
              exit 1
              ;;
          esac
          case "${running_image}" in
            *"${LOCAL_REGISTRY}"*)
              echo "the container runs the image of the local registry, so this pass measured the developer path again"
              exit 1
              ;;
          esac

          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:list | tee store-app-list.txt
          if ! grep -q 'findling_backend' store-app-list.txt; then
            echo "app_api:app:list does not know findling_backend, so the registration out of the archive did not survive"
            exit 1
          fi

          # The same canary call the developer path makes, and the same three
          # assertions: exactly one entry, the title, and a subline that carries
          # the host name and the timestamp of the process that produced it plus
          # the user id that only the signed AppAPI header could have carried
          # into the backend. A hard coded hit in PHP cannot pass this, and
          # neither can an installation whose search route never arrived.
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee store-out.json
          if ! jq -e '.ocs.data.entries | length == 1' store-out.json > /dev/null; then
            echo "the search did not return exactly one hit, so nothing answered out of the container the archive installed"
            exit 1
          fi
          jq -e '.ocs.data.entries[0].title == "findling-canary"' store-out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' store-out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' store-out.json

          {
            echo "STORE_CONTAINER=${container}"
            echo "STORE_VOLUME=${volume}"
          } >> "${GITHUB_ENV}"
          {
            echo ""
            echo "- store install container: \`${container}\`"
            echo "- store install volume: \`${volume}\`"
            echo "- image: \`${running_image}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The promise of this whole project, and the one thing above did not test:
      # after the installation nobody configures anything, and the search finds
      # the content of a document anyway.
      #
      # Everything in this step is deliberately not an occ command. The file
      # arrives over WebDAV as the ordinary user, which is what a user does and
      # what puts it into the file cache without occ files:scan. The engine is
      # driven with "php -f cron.php", which is the identical command a system
      # cron runs and is therefore not a shortcut: it is the mechanism, at a
      # cadence this job controls because a runner has no cron daemon. What is
      # NOT here, and must never be, is occ findling:index, occ
      # background-job:worker or any occ config:app:set. Those are the
      # development shortcuts of integration.yml, and a zero config proof that
      # uses one of them proves the opposite of its name (T-06.1-51).
      #
      # php/lib/Repair/AppInstallStep.php is what makes this possible at all: it
      # is registered under repair-steps/install and puts SchedulerJob into the
      # job list when the app is enabled, once, guarded by a mark in the app
      # config. So the chain that has to run by itself is enable, SchedulerJob,
      # StorageCrawlJob, the container polling the queue, and a hit.
      #
      # The list of occ calls between the installation and the hit is printed and
      # has to be empty. It is produced by the wrapper every step of this pass
      # calls, not by a human writing down what they think they ran.
      - name: Store install 7, a search finds content without anybody configuring anything
        run: |
          marker=$(wc -l < "${OCC_LOG}")
          echo "every occ call of the store install path up to here:"
          cat -n "${OCC_LOG}"
          echo "the installation is complete after ${marker} occ calls, and nothing below may add one"

          # An invented word, and invented on purpose. The analyzer splits German
          # compounds against a dictionary, so a real compound could be indexed
          # as its parts and a miss would say nothing about the index. This one
          # is in no dictionary, in no skeleton file and in no other test of this
          # repository, so a hit for it can only come out of the file below.
          printf 'The findling zero config proof word is florpel.\n' > "${RUNNER_TEMP}/zero-config.txt"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -T "${RUNNER_TEMP}/zero-config.txt" \
            -u "testuser:${TESTUSER_PASS}" \
            'http://localhost:8080/remote.php/dav/files/testuser/findling-zero-config.txt')
          case "${code}" in
            201|204) echo "the file was uploaded over WebDAV, HTTP ${code}" ;;
            *)
              echo "the upload answered HTTP ${code}, so there is no document to find"
              exit 1
              ;;
          esac

          # The loop leaves the moment the hit is there and never sleeps a fixed
          # pause. That is the 52 second lesson of plan 06-11 turned into code: a
          # probe that waits a fixed time measures its own guess, and that guess
          # was wrong by 52 seconds in the direction that declares a healthy run
          # dead.
          deadline=$(( $(date +%s) + ZERO_CONFIG_BUDGET_SECONDS ))
          found=""
          rounds=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            rounds=$(( rounds + 1 ))
            timeout 300 php -f cron.php > "${RUNNER_TEMP}/cron-${rounds}.log" 2>&1 || true
            code=$(curl -s -o zero-config.json -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=florpel')
            if [ "${code}" = "200" ] && jq -e '.ocs.data.entries | length >= 1' zero-config.json > /dev/null 2>&1; then
              found="yes"
              break
            fi
            echo "round ${rounds}: HTTP ${code}, no hit yet, $(( deadline - $(date +%s) ))s of the budget left"
            sleep 10
          done

          if [ -z "${found}" ]; then
            echo "::error::no content hit within ZERO_CONFIG_BUDGET_SECONDS=${ZERO_CONFIG_BUDGET_SECONDS} after ${rounds} cron rounds"
            echo "This is a finding and not a reason to raise the budget (T-06.1-52)."
            cat zero-config.json || true
            tail -n 40 "${RUNNER_TEMP}/cron-${rounds}.log" || true
            docker logs "${STORE_CONTAINER}" 2>&1 | tail -n 60 || true
            exit 1
          fi
          cat zero-config.json
          jq -e '.ocs.data.entries[0].title == "findling-zero-config.txt"' zero-config.json
          echo "content hit after ${rounds} cron rounds, with nothing configured"

          # The claim of this step, checked against the record rather than
          # asserted. Two commands ran in the window above and they are named
          # here: "php -f cron.php" and the OCS search. Neither is an occ call,
          # so the tail of the log has to be empty.
          tail -n +$(( marker + 1 )) "${OCC_LOG}" > "${RUNNER_TEMP}/occ-since-install.txt"
          echo "occ calls between the installation and the hit:"
          cat "${RUNNER_TEMP}/occ-since-install.txt"
          if [ -s "${RUNNER_TEMP}/occ-since-install.txt" ]; then
            echo "an occ call ran between the installation and the hit, so this was not a zero config proof"
            exit 1
          fi
          echo "none, which is what zero config means"
          {
            echo ""
            echo "Zero config on ${{ matrix.server-version }}: content hit after ${rounds} cron rounds,"
            echo "no occ call between the installation and the hit."
          } >> "${GITHUB_STEP_SUMMARY}"

      # =====================================================================
      # The six uninstall promises a second time, against the installation the
      # archive produced.
      #
      # Why they are here in full and not shared with the six steps above. The
      # duplication is real and is the price of two things this phase wants at
      # once: the six steps above stay untouched, because they are the reference
      # and a refactor of a green proof is a refactor of the evidence, and each
      # assertion keeps its own step with its own message, which is what makes a
      # failure readable at all. Sharing them would collapse twelve named steps
      # into two loops and would trade the readability of every future failure
      # for the tidiness of one file. The cost is named rather than hidden: a
      # seventh promise has to be added twice, and a change to any of the six has
      # to be made twice.
      #
      # Why they are not academic. An installation out of the archive puts
      # different files into apps/findling than a move out of the working tree
      # does, it carries a signature.json the other one has no idea about, and
      # its container was created from a registry image rather than from a local
      # one. A cleanup that only ever saw the developer case leaves remains in
      # the other, and remains after an uninstall are what decision D-16 is
      # about.
      # =====================================================================

      - name: Store uninstall 1, an unregister without the flag keeps the volume
        run: |
          if [ -z "${STORE_VOLUME}" ] || [ -z "${STORE_CONTAINER}" ]; then
            echo "the store install step handed over no container or volume name, so this assertion would pass without looking at anything"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend
          still_there=$(docker ps -a --filter "name=${STORE_CONTAINER}" --format '{{.Names}}')
          if [ -n "${still_there}" ]; then
            echo "the container ${STORE_CONTAINER} survived the unregister, so the deregistration removed nothing"
            docker ps -a
            exit 1
          fi
          kept=$(docker volume ls --filter "name=${STORE_VOLUME}" --format '{{.Name}}')
          if [ "${kept}" != "${STORE_VOLUME}" ]; then
            echo "the volume ${STORE_VOLUME} is gone after an unregister without --rm-data, and the documented default is that it stays; found '${kept}'"
            docker volume ls
            exit 1
          fi
          echo "container gone, volume ${kept} kept"

      - name: Store uninstall 2, a second registration picks up the volume it left
        run: |
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${STORE_INFO_XML}" --wait-finish
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the second registration out of the archive created no running container"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ "${volume}" != "${STORE_VOLUME}" ]; then
            echo "the second registration did not take the volume of the first one, expected ${STORE_VOLUME} and found '${volume}'"
            docker volume ls
            exit 1
          fi
          echo "registered again as ${container} on the kept volume ${volume}"

      - name: Store uninstall 3, an unregister with --rm-data removes the volume
        run: |
          if [ -z "${STORE_VOLUME}" ]; then
            echo "no volume name from the store install step, so an empty filter result would be a false green (T-05-29)"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend --rm-data
          left=$(docker volume ls --filter "name=${STORE_VOLUME}" --format '{{.Name}}')
          if [ -n "${left}" ]; then
            echo "the volume ${STORE_VOLUME} survived an unregister with --rm-data, found '${left}'"
            docker volume ls
            exit 1
          fi
          container=$(docker ps -a --filter "name=${STORE_CONTAINER}" --format '{{.Names}}')
          if [ -n "${container}" ]; then
            echo "the container ${STORE_CONTAINER} survived the unregister with --rm-data"
            docker ps -a
            exit 1
          fi
          echo "container and volume ${STORE_VOLUME} both gone"

      # The order is the same as above and for the same reason: the intent mark
      # is a one shot flag, so the only way to show that a disable clears nothing
      # is to disable while no mark is set (T-05-31).
      - name: Store uninstall 4, a disable without intent keeps tables and settings
        run: |
          expected='oc_findling_file_state oc_findling_queue oc_findling_scan_stats'
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "before the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the three tables of the app are not all there before the disable, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app:disable findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the disable removed tables although no intent was armed, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          if [ "${settings}" -lt 1 ]; then
            echo "the disable emptied the settings of the app although no intent was armed, ${settings} values left"
            exit 1
          fi

      # The registration in the middle belongs to assertion 6: that one needs a
      # live container while the companion goes away, so the deployment handshake
      # has to happen while the installation is still complete.
      #
      # The one thing this assertion adds over its twin above: the companion it
      # removes is the one the archive delivered, so this is where a leftover of
      # the archive installation would show. apps/findling is looked at
      # afterwards for exactly that reason.
      - name: Store uninstall 5, a remove with intent clears tables and settings
        run: |
          "${RUNNER_TEMP}/nc-occ.sh" app:enable findling
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${STORE_INFO_XML}" --wait-finish
          "${RUNNER_TEMP}/nc-occ.sh" findling:purge --arm --no-interaction
          "${RUNNER_TEMP}/nc-occ.sh" app:remove findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the remove with intent: tables [${tables}], settings ${settings}"
          if [ -n "${tables}" ]; then
            echo "the remove with intent left tables behind: [${tables}]"
            exit 1
          fi
          if [ "${settings}" -ne 0 ]; then
            echo "the remove with intent left ${settings} settings behind"
            exit 1
          fi
          if [ -e apps/findling ]; then
            echo "the remove left the extracted archive behind in apps/findling, which a developer installation would not have shown"
            find apps/findling -maxdepth 2 -mindepth 1 -printf '  %P\n' | sort
            exit 1
          fi
          echo "no tables, no settings, no directory"

      - name: Store uninstall 6, the container without a companion retreats
        run: |
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container after the companion was removed, so the container did not survive the half removal"
            docker ps -a
            exit 1
          fi
          noisy_lines() {
            docker logs "${container}" 2>&1 | grep -cE '^(WARNING|ERROR|CRITICAL):' || true
          }
          before=$(noisy_lines)
          entered=""
          for _ in $(seq 1 24); do
            if docker logs "${container}" 2>&1 | grep -q 'the queue has not answered for'; then
              entered="yes"
              break
            fi
            sleep 10
          done
          if [ -z "${entered}" ]; then
            echo "the container never announced the retreat, so it is either still polling pass by pass or it is not polling at all"
            docker logs "${container}" 2>&1 | tail -n 40
            exit 1
          fi
          alive=$(docker ps --filter "name=${container}" --format '{{.Status}}')
          if [ -z "${alive}" ]; then
            echo "the container stopped during the retreat instead of waiting it out"
            docker ps -a
            exit 1
          fi
          after=$(noisy_lines)
          grew=$((after - before))
          if [ "${grew}" -gt 5 ]; then
            echo "the container wrote ${grew} new warning or error lines while its caller was gone, which is an error loop and not a retreat"
            docker logs "${container}" 2>&1 | grep -E '^(WARNING|ERROR|CRITICAL):' | tail -n 20
            exit 1
          fi
          echo "container ${container} is ${alive}, retreat announced, ${grew} new warning or error lines"

      - name: Collect the logs and tear the deployment down
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/harp-logs"
          container=$(docker ps -a --filter 'name=findling_backend' --format '{{.Names}}' | head -n 1)
          if [ -n "${container}" ]; then
            docker logs "${container}" > "${RUNNER_TEMP}/harp-logs/exapp.log" 2>&1 || true
          fi
          docker logs appapi-harp > "${RUNNER_TEMP}/harp-logs/harp.log" 2>&1 || true
          docker logs exapps-proxy > "${RUNNER_TEMP}/harp-logs/proxy.log" 2>&1 || true
          # The evidence of the store install pass, saved rather than left in the
          # step log where it scrolls away: the recorded occ calls, the registry
          # manifests and the three integrity verdicts.
          for evidence in occ-calls.txt manifest-released.txt manifest-dev.txt \
            integrity-clean.txt integrity-tampered.txt integrity-restored.txt; do
            if [ -f "${RUNNER_TEMP}/${evidence}" ]; then
              cp "${RUNNER_TEMP}/${evidence}" "${RUNNER_TEMP}/harp-logs/${evidence}"
            fi
          done
          docker rm -f appapi-harp registry exapps-proxy 2>/dev/null || true
          # The ExApp container outlives the assertions since assertion 6 keeps
          # it alive on purpose, so the teardown takes it along. Its log is
          # already saved above, which is the reason this line comes after it.
          if [ -n "${container}" ]; then
            docker rm -f "${container}" 2>/dev/null || true
          fi

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harp-logs-${{ matrix.server-version }}
          path: ${{ runner.temp }}/harp-logs
          if-no-files-found: warn
          retention-days: 7
