name: HaRP deploy

# The installation path a store install takes, and the first job of this
# repository that walks it. Both existing registration paths are manual-install
# (.github/actions/setup-test-nc/action.yml and scripts/dev/register-exapp.sh),
# and the docker smoke test starts the image with a hand built auth header and
# no AppAPI at all. None of them pulls an image, creates a container or a volume,
# and none of them reads the route list out of the release archive.
#
# This job does: a deploy daemon with --harp pulls the backend image from a
# registry, creates the ExApp container and its data volume, and a search over
# the ordinary OCS route comes back with a hit that can only have been produced
# inside that container. Every one of those three is asserted separately, and an
# empty result is red rather than green (the warning sign of pitfall 3).
#
# Since plan 06.1-12 the job walks that path twice. The first pass is the one
# described above and builds the container image locally. The second pass is the
# path a stranger walks: both halves out of the release archives, the image out
# of ghcr, the integrity check of the instance over the companion, and a search
# that finds the content of a file nobody configured anything for.
on:
  push:
    paths:
      - 'backend/**'
      # The whole companion and not only its appinfo, because the store install
      # path of this job packs php/ into the release archive and then lets the
      # instance verify every file in it. A change in php/lib is a change to what
      # this job installs and to what the integrity check hashes.
      - 'php/**'
      - '.github/workflows/deploy-harp.yml'
      # The instance this job installs comes out of the composite action, so a
      # change there is a change to this workflow.
      - '.github/actions/setup-test-nc/**'
      # The archives are built by this script, in this job and in release.yml
      # alike, so a change to it changes what a stranger would install.
      - 'scripts/release/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'php/**'
      - '.github/workflows/deploy-harp.yml'
      - '.github/actions/setup-test-nc/**'
      - 'scripts/release/**'
  workflow_dispatch:
    inputs:
      # Empty is the everyday case and the only case a push or a pull request
      # can produce: the store install path builds both archives itself, out of
      # the commit under test. Set to a release tag it installs the bytes that
      # tag published instead, which is the only way to say anything about what
      # a stranger actually downloads. Plan 11-07 uses the same input for the
      # upgrade proof, so this is built once and used twice.
      release_tag:
        description: 'Install the store archives of this release tag (for example v1.1.0) instead of building them; empty builds them locally'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# One run per branch. This job installs a whole Nextcloud and builds the runtime
# image, so a superseded run is expensive to keep alive.
concurrency:
  group: deploy-harp-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, deliberately not by the tag "release". The tag moves, and a
  # deploy proof that means something different next week is not a proof.
  # Resolved on 2026-09-03 from the tag "release" of the repository
  # ghcr.io/nextcloud/nextcloud-appapi-harp, with the command
  # "docker buildx imagetools inspect <repository>:<tag> --format
  # '{{.Manifest.Digest}}'" (the tag is spelled out here and nowhere as part of
  # an image reference, so that a grep for the moving reference stays empty). The
  # manifest is an index and carries linux/amd64 and linux/arm64, which is why
  # the same line can be used on the ARM box later in this phase, and why the
  # index digest is pinned rather than one of the two platform digests.
  # scripts/dev/compose-harp.yaml carries the identical string.
  HARP_IMAGE: ghcr.io/nextcloud/nextcloud-appapi-harp@sha256:603fdf5ca2802235fd4e40301476dd2fafff409e84a42f8cb3b8f2e17c22ce39

  # The released version the upgrade proof of plan 11-07 starts from, as a
  # variable rather than as a literal inside a URL, so that a later release is
  # one line here and not a search through a step.
  #
  # v1.2.0 and not something newer, because on 2026-09-24 it IS the newest
  # release of this repository: the tag list ends at v1.2.0, and 1.3.0 lives in
  # this tree alone since phase 18. So these are the bytes every existing
  # installation really holds, and the jump this proof drives is the one a user
  # of v1.2.0 will really perform. A tag invented for the test would prove an
  # upgrade nobody performs.
  #
  # Why the tag moved on 2026-09-24, and it is the sharpest statement of phase
  # 18 rather than housekeeping (plan 18-12, success criterion 1). The milestone
  # that carries the schema step is the one milestone in which the upgrade path
  # is really dangerous, so this is the last moment at which the guard may be
  # allowed to go stale. Driven from v1.2.0, the block below asserts that an
  # upgrade 1.2.0 to 1.3.0 under the factory setting de,en moves NONE of the
  # five marks: schema_version is stamped only after a rebuild, and the rebuild
  # does not start at all without a language change. "Store upgrade 6" then
  # drives the other half, the rebuild itself, and it stands beside this block
  # rather than inside it.
  #
  # The predecessor, kept rather than overwritten, because the reason was right
  # in its own time. Until 2026-09-24 the value was v1.1.0, and until 2026-09-21
  # it was v1.0.3: on 2026-09-11 the tag list ended at 1.0.3, both info.xml said
  # 1.0.3, and "Store install 1 from the release" had loaded those assets in run
  # 34526436580. Plan 11-11 published v1.1.0, plan 16-09 followed the tag there,
  # and the release of phase 16 published v1.2.0, which is what this line
  # follows now. The lesson the three moves share: this value is an instruction
  # about the newest published release, so it goes stale with every release and
  # the assurances hanging off it have to be read again each time, never
  # softened.
  UPGRADE_FROM_TAG: v1.2.0

jobs:
  deploy-harp:
    name: deploy-harp
    # The runner comes out of the matrix since plan 11-04, because success
    # criterion 1 of phase 11 asks for the store install path on amd64 AND on
    # arm64, natively and not emulated. The value is a matrix column rather than
    # a second job: a copy of this job would be a second place where the store
    # install path is written down, and the whole point of the path is that
    # there is exactly one of it.
    runs-on: ${{ matrix.runner }}
    # A job that hangs must cost minutes, not the default six hours. The number
    # is the measured runtime with a margin and not a guess; the measurement is
    # written down at the matrix below. It was 15 while the job ended after the
    # search and the uninstall assertions. The drift probe of plan 06.1-09 adds
    # three redeployments of the kind this job has already measured, so the
    # margin over the measurement would have shrunk rather than the runtime
    # having been reconsidered, which is why the number is 20 and still nowhere
    # near the default of 360.
    #
    # Plan 06.1-12 raises it to 45, and the number is named as an estimate rather
    # than dressed up as a measurement, because the store install path it adds
    # has never run. What it is derived from, using figures this job already
    # measured: the archive build is seconds, the anonymous ghcr pull is the same
    # order as the local registry push that measured 60 s, and every deployment
    # of the ExApp measured about 60 s in the drift probe. The second pass adds
    # two of them for the routes probe and the real registration, two more inside
    # its uninstall promises, the observation window of assertion 6 at about 50 s
    # a second time, and the zero config budget of ZERO_CONFIG_BUDGET_SECONDS
    # below, which is 600 in the worst case. That sums to roughly 20 further
    # minutes over the 4 to 5 the job measures today, and 45 leaves the same kind
    # of margin the 20 had. The first green run replaces this paragraph with
    # measured figures.
    timeout-minutes: 45
    # Since plan 12-02 no entry tolerates a failure any more: every
    # tolerate-failure below is false, because v35.0.0 is released and the
    # stable35 leg is must-be-green (12-STABLE35-ENTSCHEID.md). The column and
    # this line stay as the mechanism for the next server version that is not
    # released yet, and a red leg anywhere in this matrix is a finding.
    continue-on-error: ${{ matrix.tolerate-failure }}
    strategy:
      fail-fast: false
      matrix:
        # Three server versions on four legs, and an include list rather than a
        # cross product, because every version brings its own PHP floor. The
        # fourth leg is the second architecture and not a fourth version; the
        # runner column below says which leg is which.
        #
        # The declared window decides this list and not the other way round. E-H1 of
        # 2026-09-06 sets min-version 33 and max-version 35 in both info.xml, so the
        # entries are 33, 34 and 35, and there is no entry outside them. stable32 ran
        # here until that decision and left with it: Nextcloud 32 goes out of support
        # in September 2026, the app no longer claims it, and a green run against a
        # server nobody claims is a statement nobody asked for.
        # backend/tests/test_lockstep_versions.py holds the two sides together, in
        # both directions: an entry outside the window and a version the window
        # promises while this list skips it are both findings there.
        #
        # PHP 8.2 covers the floors of 33 and 34 completely: lib/versioncheck.php asks
        # for at least 8.2 on stable33 and on stable34 (read out of the branches
        # through the GitHub API on 2026-09-03, when the entry for stable32 was still
        # here and that branch asked for at least 8.1). Nextcloud 35 asks for at least
        # 8.3 in the same file, so that entry carries 8.3. A cross product over PHP
        # versions would produce nine runs for a statement that three runs make.
        #
        # The backend image is built once per entry and not built once and shared,
        # and that is a measurement rather than a preference: build plus push into
        # the local registry took 60 s in run 33743374344, and the image is about
        # 390 MB. Handing it to the entries through an artifact would move that much
        # data twice per entry, once out and once back, to save a minute of runner
        # time each. The entries run in parallel, so the wall clock would get worse
        # rather than better.
        #
        # Measured on 2026-09-03 in the first green run over the four entries of the
        # time (run 33757405755): 3 m 47 s to 4 m 29 s per entry, of which 60 s are
        # the image build and about 50 s the observation window of assertion 6. The
        # entries run in parallel, so that is the wall clock as well. That
        # measurement predates the drift probe of plan 06.1-09 and does not
        # include its three redeployments, which is what timeout-minutes above
        # answers with 20 rather than 15; the next green run replaces the figures
        # of this paragraph with the ones it measures.
        # The runner column, added by plan 11-04. Three entries keep the runner
        # they always had, and exactly ONE entry is added on arm64. Not six: six
        # legs would be six instances of a statement that one leg carries, they
        # would double the cost of every run of this workflow, and the second
        # architecture is a statement about the architecture and not about the
        # server version. stable34 carries it because it is the newest released
        # Nextcloud on 2026-09-10 (v34.0.4) and therefore the version the
        # statement stands on; stable33 is the floor and stable35 is not
        # released yet, so neither is the one to hang it on.
        #
        # ubuntu-24.04-arm is the same label docker.yml (job build, matrix entry
        # linux/arm64), python.yml (job extract-bench-arm) and measure.yml (job
        # matrix entry arch arm64) already use, so the label is not new to this
        # repository and the image behind it is a known quantity.
        include:
          - server-version: stable33
            php-version: '8.2'
            tolerate-failure: false
            runner: ubuntu-24.04
          - server-version: stable34
            php-version: '8.2'
            tolerate-failure: false
            runner: ubuntu-24.04
          # The native arm64 leg. It runs the identical step list, and that is
          # the point: an arm64 leg that skipped a step would prove the steps it
          # kept and nothing about the ones it dropped. No continue-on-error and
          # no tolerate-failure here on purpose, because this leg IS the second
          # half of success criterion 1, and a tolerant leg is not a statement.
          #
          # Two places in the job had to learn about the architecture, and both
          # are named here so that a reader of the matrix knows where to look:
          # "Store install 4" pulls the published backend image for the platform
          # of the runner instead of the hard wired linux/amd64 (the image index
          # of ghcr.io/street1983nk/findling_backend carries linux/amd64 and
          # linux/arm64 for :dev and for every released tag, checked on
          # 2026-09-10), and HARP_IMAGE above is pinned by index digest rather
          # than by a platform digest, which is why the same line works here.
          - server-version: stable34
            php-version: '8.2'
            tolerate-failure: false
            runner: ubuntu-24.04-arm
          # stable35 was the branch under development when this matrix was
          # written, and it is not any more: v35.0.0 of 2026-09-15 is the
          # first 35 tag that "gh api repos/nextcloud/server/releases" reports
          # without the prerelease marker. The RE-CHECK paragraph that used to
          # stand here named 2026-09-16 as the day it comes out, and this is that
          # removal and not a paraphrase of it.
          #
          # Done on 2026-09-16 by plan 12-02 on the evidence D-02 asks for
          # (.planning/phases/12-messwerkzeug-runbook-und-terminentscheid/
          # 12-STABLE35-ENTSCHEID.md, option a): the release status alone was not
          # enough, so this leg ran green against stable35 on the tree of that day
          # in run 35095805558 before the flag came out. From here the leg is
          # must-be-green, and a red run is a finding rather than a reason to put
          # the flag back. The entry itself stays regardless, because
          # backend/tests/test_lockstep_versions.py checks that the matrix covers
          # every version of the declared window 33 to 35.
          - server-version: stable35
            php-version: '8.3'
            tolerate-failure: false
            runner: ubuntu-24.04

    env:
      # Test-only values of a throwaway instance that is destroyed with the
      # runner. The composite action requires both although this path starts no
      # host process: the container gets its secret from AppAPI, not from here.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      TESTUSER_PASS: 'findling-ci-canary-2026'
      LOCAL_REGISTRY: 'localhost:5000'
      LOCAL_IMAGE_TAG: 'citest'

      # The dispatch input, resolved once here so that every step below asks
      # one name instead of reaching into the inputs context four times. On a
      # push and on a pull request the context is empty and this renders to the
      # empty string, which is the everyday case: build the archives locally.
      RELEASE_TAG: ${{ inputs.release_tag }}

      # The budget of the zero config proof, in seconds, and a named variable
      # because threat T-06.1-52 is about somebody raising exactly this number
      # until a run goes green. Raising it is a decision and needs a reason next
      # to it; overrunning it is a finding and not an accident.
      #
      # Where the number comes from. The slowest clock involved on a real
      # instance is the system cron, which runs every five minutes, and the first
      # pass of it queues the crawl rather than finishing it, so a user waits two
      # cron rounds before anything is searchable. Ten minutes is those two
      # rounds. This job has no cron daemon and drives cron.php itself, which is
      # the identical command a system cron runs, so its own wall clock is much
      # shorter; the budget is nevertheless dimensioned against the five minute
      # cadence, because that is the clock the promise is made to.
      #
      # And the lesson that decides the shape of the wait rather than its size:
      # in plan 06-11 a counter probe declared a run dead and was 52 seconds off,
      # because it measured against the fastest clock in sight instead of the
      # slowest. So the loop below leaves the moment the hit is there and never
      # sleeps a fixed pause.
      ZERO_CONFIG_BUDGET_SECONDS: '600'

      # The budget the upgrade proof gives the first indexing pass over the
      # reference corpus, in seconds, and a named variable for the same reason
      # the one above is named: raising it is a decision and needs a reason next
      # to it.
      #
      # The number is not new. integration.yml indexes the identical 39 file
      # corpus and gives it DRAIN_TIMEOUT 900, measured there against 26
      # indexed, 7 skipped and 6 failed documents, OCR included. The container
      # here does the same work on the same files, so the same figure is used
      # and named rather than a second one invented. An overrun is a finding
      # about the indexing pass and not an invitation to raise the number.
      #
      # It stays at 900 although "Store upgrade 2" now writes a fill corpus of
      # 64 text documents next to that reference corpus, and the reason is a
      # measurement on both sides. The step took 34 s of the 900 in run
      # 36001341420 (13:01:09Z to 13:01:43Z, the whole corpus including OCR),
      # and what the fill corpus adds is small next to the 866 s left over:
      # the embedding is capped per document (EMBED_TOKEN_CAP 1024, applied
      # before the split), so it is 64 documents and not 32 MB of them, and at
      # the 170 documents per minute measured in
      # docs/measurements/2026-09-vergleichsmessung-m7g that is 23 s;
      # writing 32 MB of body text into the index
      # measured 3.9 s against the real writer with three chains on 2026-09-24;
      # the cron loop needs two or three more rounds of its five second pause.
      # Sixty to a hundred and twenty seconds against 866 spare is why this
      # number is not touched.
      UPGRADE_DRAIN_BUDGET_SECONDS: '900'

      # The budget "Store upgrade 6" gives the rebuild of the index directory,
      # counted from the restart that orders it, and a named variable for the
      # same reason the two above are named.
      #
      # 300 and not the 900 of the pass above, and the difference is the whole
      # difference between the two runs. The indexing pass reads 103 files,
      # rasterises the scanned ones and puts them through tesseract; the rebuild
      # carries documents the index already holds from one directory into the
      # next and reads no file at all.
      #
      # What the rebuild costs is text and not documents. Measured against the
      # real transfer_documents on 2026-09-24 with three chains: 0.25 to 0.6 s
      # per MB of body text, and the module header of
      # backend/src/findling/index/rebuild.py says 4.39 s for 3000 documents of
      # 2.5 kB over four chains, which is the same 0.585 s per MB. The corpus of
      # this proof carries the reference corpus plus the fill corpus of "Store
      # upgrade 2", so about 32 MB, and the carrying measured 7.81 s for exactly
      # that shape. Add the container coming up and the six analysis chains
      # being built, of which the German one carries a 276496 entry automaton,
      # and the whole run is well inside half a minute. 300 stands untouched and
      # is now roughly a tenfold margin rather than a hundredfold one.
      #
      # Why there is a budget at all rather than a loop that waits: an unbounded
      # wait in CI is a hanging run, a hanging run costs the job its whole
      # timeout, and a guard that hangs is a guard somebody switches off. An
      # overrun here is a finding about the rebuild and not an invitation to
      # raise the number.
      REBUILD_BUDGET_SECONDS: '300'

      # The budget the language proof of phase 19 gives its four documents to
      # become searchable, counted from the upload, and a named variable for the
      # same reason the three above are named: raising it is a decision and
      # needs a reason next to it.
      #
      # 600, the same figure as ZERO_CONFIG_BUDGET_SECONDS, because it is the
      # same clock and not the same amount of work. The promise is made against
      # a system cron that runs every five minutes and whose first pass queues
      # the crawl rather than finishing it, so two rounds are ten minutes. What
      # this step actually indexes is four text files of one sentence each, so
      # its own wall clock is a small fraction of that; the budget is
      # dimensioned against the cadence the promise is made to, exactly as the
      # zero config one is.
      #
      # Measured, and the placeholder that stood here is gone: 172 s on the
      # slowest of the four branches of run 36074155306 of 2026-09-24, which is
      # the arm64 one (stable34, ubuntu-24.04-arm, 23:45:38Z to 23:48:30Z). The
      # three amd64 branches of that same run took 73 s (stable34), 41 s
      # (stable33) and 32 s (stable35), and run 36072411846 an hour earlier
      # measured 163 s on the same arm64 branch, so the figure is not a single
      # reading and the slow branch is the one the number has to hold for. 600
      # stands untouched and leaves that branch a margin of roughly three and a
      # half times. The gap between 172 s and the cadence argument above is the
      # argument itself: four text files of one sentence each are indexed inside
      # the first cron round, while the promise is made against an instance whose
      # system cron runs every five minutes.
      #
      # An overrun is a finding about the indexing pass and not an invitation to
      # raise the number (T-06.1-52).
      LANGUAGE_PROOF_BUDGET_SECONDS: '600'

      # The language set "Store upgrade 6" orders the rebuild with, and it is
      # deliberately not in schema field order. config.py::_languages iterates
      # over SUPPORTED_LANGUAGES and never over the admin's input, so the mark
      # the rebuild stamps has to read de,en,es whatever order it was asked in.
      # A set that was already sorted would let a normalisation that does not
      # happen pass unnoticed, and the mark is what the next start compares
      # against: an unnormalised one would order a rebuild at every boot.
      #
      # es and not it, nl or pt for one reason only: Spanish is the language the
      # owner decision E-17-3 is written about, and docs/language-analyzers.md
      # carries its example with both variables.
      REBUILD_LANGUAGES: 'es,de,en'
      REBUILD_LANGUAGES_NORMALISED: 'de,en,es'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance and
      # a docker socket.
      #
      # These two checkouts stay in the job and stay in this order.
      # actions/checkout empties its target directory, so the server checkout at
      # the workspace root has to come first, and the second one is what puts the
      # composite action below into the workspace at all.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      # register-exapp: false is the whole point of this job. The instance comes
      # up with both apps enabled and nothing else; the daemon below does the
      # part that manual-install never did.
      #
      # nextcloud-host 0.0.0.0 is the named way out the composite action offers,
      # and this job needs it since it puts a proxy in front of the instance. The
      # builtin server binds the first address "localhost" resolves to, which is
      # ::1 on this runner image: curl finds the instance because it tries both
      # families, and the nginx below answered 502 with "connect() failed (111:
      # Connection refused) upstream 127.0.0.1:8080" (run 33755989853). Binding
      # all interfaces puts the instance on both families and adds 127.0.0.1 and
      # localhost to the trusted domains, which the proxied host header needs.
      - name: Set up the test Nextcloud without registering the ExApp
        id: setup
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}
          register-exapp: 'false'
          nextcloud-host: '0.0.0.0'

      # The deploy daemon pulls registry/image:image-tag out of
      # backend/appinfo/info.xml, which is ghcr.io/street1983nk/findling_backend
      # at the released tag. That tag does not exist on a feature branch, so the
      # image this run is supposed to prove has to come from somewhere local.
      - name: Start a local registry and push the backend image into it
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          # The named context carries scripts/dev/quantize_model.py into the
          # model stage; it sits outside the backend context and is not
          # duplicated there.
          docker build --build-context scripts=./findling-src/scripts \
            -t "${LOCAL_REGISTRY}/findling_backend:${LOCAL_IMAGE_TAG}" ./findling-src/backend
          docker push "${LOCAL_REGISTRY}/findling_backend:${LOCAL_IMAGE_TAG}"

      # The key is created here and never printed. add-mask covers the case of a
      # command that echoes its own arguments, which occ does on higher verbosity
      # levels.
      #
      # --net host, and that is the second thing this job had to measure rather
      # than assume. HaRP is not only the way in, it is also the way back: the
      # container reports its init status and asks for queue rows through
      # {nextcloud_url}/ocs/..., HaRP forwards everything that is not /exapps to
      # NC_INSTANCE_URL, and its own agent resolves the ExApp against Nextcloud
      # as well. With published ports instead of the host network that address
      # points into the network namespace of the HaRP container, where nothing
      # listens on 8080. Measured in run 33745892327: "Cannot connect to host
      # localhost:8080" in the HaRP log, followed by 404 on
      # PUT /ocs/v1.php/apps/app_api/ex-app/status in the ExApp log, and an
      # app_api:app:register --wait-finish that printed "deployed successfully"
      # and then waited for an init status that could never arrive, until the
      # timeout of the step ended it after ten minutes. The compose stack of
      # scripts/dev/compose-harp.yaml has no counterpart to this, because there
      # Nextcloud is a service name in the same network.
      #
      # On the host network the published ports are gone and 8780 plus 8782 are
      # bound on the runner directly, which is the same address the daemon
      # registration below uses, and the ExApp container that AppAPI creates with
      # --net host lands in the same namespace.
      - name: Start HaRP
        run: |
          harp_key=$(openssl rand -hex 16)
          echo "::add-mask::${harp_key}"
          echo "HARP_SHARED_KEY=${harp_key}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/certs"
          docker run -d --name appapi-harp --net host \
            -e HP_SHARED_KEY="${harp_key}" \
            -e NC_INSTANCE_URL="http://localhost:8080" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/certs:/certs" \
            "${HARP_IMAGE}"
          # The readiness gate is the very call AppAPI makes first, and it has to
          # be. A TCP handshake on 8780 succeeds from the moment the container
          # exists, because docker publishes the port with a proxy of its own long
          # before HAProxy inside the container binds it, so the handshake proves
          # nothing at all. The first run of this job on a GitHub runner went
          # green on that probe and failed 0.84 s later with "Connection refused
          # for URI http://localhost:8780/exapps/app_api/v1.44/images/create"
          # (run 33743374344), while the HaRP log of that run still said "Waiting
          # for FRP server port". Measured against the pinned image on 2026-09-03:
          # the TCP probe answers in the first second, the docker engine route
          # answers after three to four seconds.
          #
          # /_ping under /exapps/app_api is HaRP's docker engine route, and it
          # needs both headers: harp-shared-key is what the SPOE agent compares
          # against HP_SHARED_KEY (haproxy_agent.py, handle_app_api_request), and
          # docker-engine-port selects the frp tunnel port that carries the docker
          # socket. 24000 is the port of the bundled deploy daemon, the same value
          # occ app_api:daemon:list prints under "HaRP Docker Socket Port". A 200
          # here proves HAProxy, the agent, the frp server and the tunnel down to
          # the docker socket in one call, and the address is spelled the way
          # AppAPI spells it so that name resolution is part of the proof.
          for _ in $(seq 1 45); do
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
              -H "harp-shared-key: ${harp_key}" \
              -H 'docker-engine-port: 24000' \
              http://localhost:8780/exapps/app_api/v1.44/_ping || true)
            if [ "${code}" = "200" ]; then
              echo "harp answers the docker engine route on 8780"
              exit 0
            fi
            sleep 2
          done
          echo "harp did not answer the docker engine route on 8780, last status '${code}'"
          docker logs appapi-harp || true
          exit 1

      # One address that answers for both halves, and this is the third thing
      # this job had to measure rather than read off.
      #
      # The daemon field nextcloud_url is used twice by AppAPI, and the two uses
      # pull in opposite directions. resolveExAppUrl builds the address of the
      # ExApp as "{nextcloud_url}/exapps/{appId}", so it has to reach HaRP, and
      # the very same value is handed to the container as NEXTCLOUD_URL
      # (DockerActions.php, both read on 2026-09-03), so it has to reach
      # Nextcloud. HaRP answers only paths that carry /exapps/{appId}: its agent
      # matches them with a regular expression and rejects everything else with
      # "Invalid request path, cannot find AppID" (haproxy_agent.py). With the
      # HaRP address in that field the container therefore cannot report that it
      # finished its initialisation: measured in run 33747191689 as
      # "404 Client Error for url http://localhost:8780/ocs/v1.php/apps/app_api/
      # ex-app/status" in the ExApp log, and app_api:app:register --wait-finish
      # waits for exactly that status (ExAppService::waitInitStepFinish loops
      # until init reaches 100), so the step ran into its timeout although the
      # container was healthy and the search worked.
      #
      # That is not a defect of HaRP, it is its topology: HaRP belongs in front
      # of Nextcloud, where one address serves the instance and forwards /exapps
      # into the tunnel. A Nextcloud behind Apache does that with a location
      # block, and all-in-one ships it. The PHP builtin server of this job cannot
      # proxy anything, so the topology is built here instead, with the smallest
      # thing that can do it.
      #
      # nginx by tag and not by digest, unlike the HaRP image: no statement of
      # this job depends on its version, it forwards bytes. The same reasoning
      # the local registry above already follows.
      - name: Put one address in front of Nextcloud and HaRP
        run: |
          cat > "${RUNNER_TEMP}/exapps-proxy.conf" <<'CONF'
          server {
            listen 8090;
            # Everything the ExApp side speaks: AppAPI to the container, and the
            # heartbeat that goes with it.
            location /exapps/ {
              proxy_pass http://127.0.0.1:8780;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              # A search over a large index and an OCR job both take longer than
              # the default minute.
              proxy_read_timeout 1800s;
              proxy_send_timeout 1800s;
            }
            # Everything else is Nextcloud, and that is the direction the
            # container needs for its status and for its queue calls.
            location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_read_timeout 300s;
              client_max_body_size 512M;
            }
          }
          CONF
          docker run -d --name exapps-proxy --net host \
            -v "${RUNNER_TEMP}/exapps-proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          # Both directions are asserted before anything is registered, because a
          # proxy that forwards one of them and not the other produces exactly
          # the failure this step exists to remove, only later and in a place
          # that reads like an app defect.
          for _ in $(seq 1 30); do
            nc_code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://localhost:8090/status.php || true)
            harp_code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
              -H "harp-shared-key: ${HARP_SHARED_KEY}" \
              -H 'docker-engine-port: 24000' \
              http://localhost:8090/exapps/app_api/v1.44/_ping || true)
            if [ "${nc_code}" = "200" ] && [ "${harp_code}" = "200" ]; then
              echo "the front proxy answers for Nextcloud and for HaRP"
              exit 0
            fi
            sleep 2
          done
          echo "the front proxy did not serve both halves, status.php '${nc_code}' and the docker engine route '${harp_code}'"
          docker logs exapps-proxy || true
          exit 1

      # Only for the registration. The release archive carries
      # backend/appinfo/info.xml unchanged, because AppAPI reads the route list
      # out of the file the registration is handed and writes it into
      # oc_ex_apps_routes, and the store database never sees that block at all
      # (pre-info.xslt drops it). An archive with a rewritten info.xml therefore
      # installs an app whose declared surface is not the one this repository
      # declares.
      #
      # What it does NOT do, corrected on 2026-09-06 after run 34059434556
      # measured the opposite on all three server versions: it does not stop the
      # search. Store install 5 below carries the measurement and the two code
      # paths that explain it. The comment head of backend/appinfo/info.xml still
      # carries the old wording and is corrected in its own change.
      - name: Build the temporary info.xml that points at the local registry
        run: |
          # The fourth expression below is the language set of the developer
          # path, and three reasons put it here rather than anywhere else.
          #
          # One: this path is ungated. Every step of it runs on all four matrix
          # legs, the arm64 one included, and success criterion 1 of phase 19 is
          # written about that leg by name. "Store upgrade 5" and "Store upgrade
          # 6" both carry
          # "matrix.server-version == 'stable34' && matrix.runner ==
          # 'ubuntu-24.04' && env.RELEASE_TAG == ''", so a language proof put
          # there would run on one leg out of four and would say nothing about
          # the other three.
          #
          # Two: this instance builds its index with six body fields from the
          # first document on, so the proof costs no rebuild time. The rebuild
          # is a statement of its own and "Store upgrade 6" already makes it;
          # repeating it here would buy nothing and spend minutes.
          #
          # Three: the store path is untouched by this. It registers with
          # STORE_INFO_XML, which is the file out of the signed archive, so it
          # keeps installing with the shipped default de,en. The two paths
          # therefore answer two different questions, which is what they are for.
          #
          # And the shipped default itself does not move: the substitution runs
          # against the copy in RUNNER_TEMP, and the git diff at the end of this
          # step is where that is checked rather than assumed. A language set in
          # a store archive would be a silent product change.
          #
          # Expected at the start of the run and not hoped for. The string is in
          # the source file exactly once (checked on 2026-09-24 and again here on
          # every run); at two occurrences sed would rewrite a line nobody aimed
          # at, at none it would rewrite nothing and the whole proof below would
          # run against an instance with de,en and still look green.
          # Counted as occurrences and not as lines, audit finding L-19-07.
          # grep -c answers the number of LINES with at least one hit, so two
          # occurrences on one line pass a guard whose whole sentence is "exactly
          # once", and the sed below carries no 1 either and would replace both.
          # The info.xml is formatted one element per line today, so the case is
          # out of reach; the guard claimed something other than what it measured,
          # and that is the sort of gap that surfaces the day somebody reformats
          # the file.
          occurrences=$(grep -oF '<default>de,en</default>' findling-src/backend/appinfo/info.xml | wc -l)
          if [ "${occurrences}" != "1" ]; then
            echo "::error::the shipped language default stands ${occurrences} times in findling-src/backend/appinfo/info.xml and not once, so the substitution below would miss or hit the wrong line"
            grep -n '<default>' findling-src/backend/appinfo/info.xml
            exit 1
          fi
          sed -e "s|<registry>ghcr.io</registry>|<registry>${LOCAL_REGISTRY}</registry>|" \
              -e 's|<image>street1983nk/findling_backend</image>|<image>findling_backend</image>|' \
              -e "s|<image-tag>[^<]*</image-tag>|<image-tag>${LOCAL_IMAGE_TAG}</image-tag>|" \
              -e 's|<default>de,en</default>|<default>de,en,es,it,nl,pt</default>|' \
              findling-src/backend/appinfo/info.xml > "${RUNNER_TEMP}/info-citest.xml"
          # The language line is printed with the other three, so the log says
          # what this instance was installed with instead of leaving a reader to
          # infer it from a step three hundred lines further down.
          grep -E '<registry>|<image>|<image-tag>|<default>de,en' "${RUNNER_TEMP}/info-citest.xml"
          # The source file is untouched, and this is where that is checked
          # rather than assumed.
          git -C findling-src diff --quiet -- backend/appinfo/info.xml

      # The two addresses in this command are different on purpose, and getting
      # them right cost this job three runs.
      #
      # The fifth argument is the host of the daemon, and it is the one AppAPI
      # uses for the docker engine: it talks to "{protocol}://{host}/exapps/
      # app_api/..." with the shared key and the socket port in the headers, so
      # it points straight at HaRP.
      #
      # The sixth argument is nextcloud_url, and it has to serve both halves,
      # which is why it is the front proxy and neither 8080 nor 8780. AppAPI
      # resolves the ExApp as "{nextcloud_url}/exapps/{appId}"
      # (DockerActions::resolveExAppUrl), so Nextcloud alone would send every
      # heartbeat into the PHP server, which answers 404 and ends the install in
      # "heartbeat check failed" next to a healthy container (measured in plan
      # 05-01). The same value reaches the container as NEXTCLOUD_URL, so HaRP
      # alone would leave the container without a way back: HaRP serves only
      # paths with /exapps in them, and the status the container reports after
      # its initialisation is /ocs/v1.php/apps/app_api/ex-app/status, which HaRP
      # rejects with 404 (measured in run 33747191689). The proxy step above
      # explains the rest.
      #
      # --net host stays: the ExApp container shares the network namespace of the
      # runner and therefore reaches HaRP and the front proxy on localhost. Every
      # occ call of this job carries a timeout, because a handshake that hangs
      # must not eat the job deadline on its own.
      - name: Register the HaRP deploy daemon
        run: |
          timeout 30 ./occ app_api:daemon:register \
            harp_proxy_host "Harp Proxy (Host)" docker-install http localhost:8780 \
            http://localhost:8090 \
            --harp --harp_frp_address localhost:8782 \
            --harp_shared_key "${HARP_SHARED_KEY}" \
            --net host --set-default
          timeout 30 ./occ app_api:daemon:list

      # --wait-finish makes the handshake synchronous, so the next step asserts a
      # finished installation and not a race.
      - name: Install the ExApp through the daemon
        run: |
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-citest.xml" --wait-finish

      # The three assertions this job exists for. Each one has its own message,
      # and each one treats an empty result as a failure: a deploy job that goes
      # green without a container is the exact warning sign this phase set out to
      # remove. The container name is not guessed, it comes out of
      # buildExAppContainerName and is found by filtering on the app id.
      - name: The container, the volume and the app list
        run: |
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container matches findling_backend, so the deploy daemon created nothing"
            docker ps -a
            exit 1
          fi
          echo "exapp container: ${container}"
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'

          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -z "${volume}" ]; then
            echo "no volume matches findling_backend, so the installation has no data volume"
            docker volume ls
            exit 1
          fi
          echo "exapp volume: ${volume}"
          # The uninstall assertions below look for exactly these two names
          # rather than for a filter that may match nothing. A name that arrives
          # empty is caught there a second time, because "docker volume ls
          # --filter name=" lists everything and would turn a missing measurement
          # into a green result (T-05-29).
          {
            echo "EXAPP_CONTAINER=${container}"
            echo "EXAPP_VOLUME=${volume}"
          } >> "${GITHUB_ENV}"
          # Plan 05-08 removes this volume again and needs its name, so it goes
          # into the job summary and not only into the log.
          {
            echo "### HaRP deploy on ${{ matrix.server-version }}"
            echo ""
            echo "- container: \`${container}\`"
            echo "- volume: \`${volume}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          timeout 30 ./occ app_api:app:list | tee app-list.txt
          if ! grep -q 'findling_backend' app-list.txt; then
            echo "app_api:app:list does not know findling_backend, so the registration did not survive"
            exit 1
          fi

      # The proof has to run as an ordinary user. The admin would work too, but
      # the user id in the answer is the load bearing part, and a second account
      # makes it impossible to confuse it with the installer.
      - name: Add a test user and scan the files
        run: |
          OC_PASS="${TESTUSER_PASS}" ./occ user:add --password-from-env testuser
          timeout 300 ./occ files:scan --all

      # The same canary call the job walking-skeleton makes, and the difference is
      # the whole point: there a host process on the runner answers, here a
      # container that a deploy daemon pulled and started. The subline carries the
      # host name and the timestamp of the process that produced it and ends with
      # the user id that only the signed AppAPI header could have carried into the
      # backend, so a hard coded hit in PHP cannot pass this.
      - name: Search over the ordinary OCS route
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee out.json
          if ! jq -e '.ocs.data.entries | length == 1' out.json > /dev/null; then
            echo "the search did not return exactly one hit, so nothing answered out of the container"
            exit 1
          fi
          jq -e '.ocs.data.entries[0].title == "findling-canary"' out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' out.json

      # =====================================================================
      # Success criterion 1 of phase 19, on a real Nextcloud and on every leg
      # of the matrix.
      #
      # THIS STEP CARRIES NO "if:" AND MUST NOT BE GIVEN ONE. That is not a
      # preference, it is the statement. "Store upgrade 5" and "Store upgrade 6"
      # both carry "matrix.server-version == 'stable34' && matrix.runner ==
      # 'ubuntu-24.04' && env.RELEASE_TAG == ''", so a language proof put next
      # to the rebuild would run on one leg out of four and would say nothing
      # about the native arm64 one, which is the leg the criterion names word
      # for word. backend/tests/test_language_proof_steps.py holds the absence
      # of the condition as an assertion and reads those two gated steps as its
      # counter sample.
      #
      # The shape is the shape of "Store install 7" further down: upload over
      # WebDAV, poll the ordinary OCS route with cron.php inside the loop, leave
      # the moment the hit is there. What is new is the second half of it. Until
      # this step no CI step of this repository had ever called the result page
      # at all; everything was asked over the unified search route or over the
      # admin overview. Criterion 1 says "per language" about both, so both are
      # here.
      #
      # One instance, four documents and four searches rather than four steps,
      # which is the recommendation of open question 3 of the research: the four
      # chains are built at the same container start whatever this step asks, so
      # four instances would buy four times the setup and the same statement.
      #
      # Expected in the container log of this instance and not a failure: the
      # start warning that FINDLING_OCR_LANGUAGES (deu+eng+fra) does not cover
      # the six index languages. That warning is success criterion 4 of phase 18
      # doing its work. Nothing below reads the log for a verdict, and the four
      # documents are plain text that never reaches the OCR path.
      # =====================================================================
      - name: Language proof, the four new chains answer on the ordinary search route
        run: |
          # -- the precondition, and it deliberately stands first ------------
          # Without this read the whole proof could run against an instance with
          # de,en and still look green: four Romance documents in a German index
          # would answer some of these questions out of body_de, and a green run
          # would mean the opposite of what it says. The admin overview is the
          # only place that reports what the container really built, and the
          # value has to be the six codes in schema field order, because
          # config.py::_languages iterates over SUPPORTED_LANGUAGES and
          # normalises to exactly that order whatever it was asked in.
          #
          # The two ways to a credential are the two ways overview.sh uses
          # further down, in the same order and for the same reason: the occ
          # subcommand does not exist on every server of this matrix (stable33
          # answers "not available"), and the OCS endpoint does. The value is
          # never printed.
          apppw=""
          if NC_PASS=password timeout 60 ./occ user:add-app-password admin \
            --password-from-env > "${RUNNER_TEMP}/language-apppw.txt" 2>&1; then
            apppw=$(grep -oE '[A-Za-z0-9+/=._-]{40,}' "${RUNNER_TEMP}/language-apppw.txt" | tail -1)
          fi
          if [ -z "${apppw}" ]; then
            apppw=$(curl -s -u admin:password -H 'OCS-APIRequest: true' \
              'http://localhost:8080/ocs/v2.php/core/getapppassword?format=json' \
              | grep -o '"apppassword":"[^"]*"' | cut -d'"' -f4 || true)
          fi
          if [ -z "${apppw}" ]; then
            echo "::error::no app password could be taken, so the language set of this instance could not be read at all"
            exit 1
          fi
          # Audit finding L-19-06, and both lines are cheap insurance rather
          # than a leak that was measured. Only the length is ever printed, so
          # nothing writes the value today; a later set -x, an error message
          # from curl or a run with ACTIONS_STEP_DEBUG would write it
          # unredacted, and the file underneath holds it in the clear on the
          # runner for the rest of the job. The credential belongs to a
          # throwaway instance whose admin password is the word password,
          # which is why this is two lines and not a design.
          echo "::add-mask::${apppw}"
          rm -f "${RUNNER_TEMP}/language-apppw.txt"
          echo "app password: obtained (length ${#apppw})"

          overview="${RUNNER_TEMP}/language-overview.json"
          status=$(curl -s -o "${overview}" -w '%{http_code}' \
            -u "admin:${apppw}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            http://localhost:8080/index.php/apps/findling/admin/overview)
          if [ "${status}" != "200" ] \
            || ! jq -e '.backend.languagesActive == "de,en,es,it,nl,pt"' "${overview}" > /dev/null; then
            echo "::error::the overview answered HTTP ${status} with languagesActive '$(jq -r '.backend.languagesActive' "${overview}" 2> /dev/null || echo "unreadable")' instead of de,en,es,it,nl,pt, so every hit below would belong to another chain"
            head -c 600 "${overview}" || true
            exit 1
          fi
          echo "the instance reports languagesActive de,en,es,it,nl,pt"

          # -- the four documents -------------------------------------------
          # One pair per language, and every pair is one that ONLY its own chain
          # merges. Measured on 2026-09-24 over the shipped fixtures against
          # english_analyzer(), cached_german_analyzer(...) and
          # snowball_analyzer(SNOWBALL_NAME[code]), 19-RESEARCH M-5 and M-6:
          #
          #   es   document alemana        question alemanes      both reach aleman
          #   it   document informazione   question informazioni  both reach inform
          #   nl   document beinvloed      question beinvloeden   both reach beinvloed
          #   pt   document paises         question pais          both reach pais
          #
          # All four QUESTIONS are plain ASCII and need no url encoding. Two of
          # the four DOCUMENT words carry an accent, and those two are written
          # as octal escapes rather than as literal bytes: this workflow file is
          # pure ASCII today and a language proof is no reason to make it the
          # first one that is not. \303\257 is a small i with a trema and
          # \303\255 a small i with an acute, both in UTF-8, so the accents end
          # up where they belong, which is inside the file the container reads.
          #
          # The remaining words follow the rule the comment above the botanical
          # fill corpus states: not one of them is a term another proof of this
          # workflow counts, and not one of them is split by the German chain
          # into such a term. They also do not overlap each other, which is what
          # lets each of the four searches below name the single file it has to
          # bring back.
          printf 'Esta es una carta de la empresa alemana sobre el contrato de arrendamiento.\n' \
            > "${RUNNER_TEMP}/language-proof-es.txt"
          printf 'Questa informazione riguarda la riunione con il fornitore.\n' \
            > "${RUNNER_TEMP}/language-proof-it.txt"
          printf 'Deze brief heeft de planning van het kantoor be\303\257nvloed.\n' \
            > "${RUNNER_TEMP}/language-proof-nl.txt"
          printf 'Os nossos clientes vivem em outros pa\303\255ses da Europa.\n' \
            > "${RUNNER_TEMP}/language-proof-pt.txt"

          for lang in es it nl pt; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -T "${RUNNER_TEMP}/language-proof-${lang}.txt" \
              -u "testuser:${TESTUSER_PASS}" \
              "http://localhost:8080/remote.php/dav/files/testuser/language-proof-${lang}.txt")
            case "${status}" in
              201|204) echo "language-proof-${lang}.txt uploaded over WebDAV, HTTP ${status}" ;;
              *)
                echo "::error::the upload of language-proof-${lang}.txt answered HTTP ${status}, so there is no document to find"
                exit 1
                ;;
            esac
          done

          # --restart and not a wait for the first crawl, and the reason is the
          # one the same call carries in "Store upgrade 2": the zero config
          # chain runs when the app is enabled and may have walked this user's
          # mount long before these four files were in it. --no-interaction
          # because occ treats this shell as interactive and would otherwise
          # default the confirmation to No and leave the queue empty.
          timeout 300 ./occ findling:index --restart --no-interaction

          # -- the poll loop --------------------------------------------------
          # It leaves the moment all four languages have their hit and it never
          # sleeps a fixed pause before asking. That is the 52 second lesson of
          # plan 06-11 turned into code: a probe that waits a guessed time
          # measures its own guess, and that guess was wrong by 52 seconds in
          # the direction that declares a healthy run dead (T-06.1-52).
          deadline=$(( $(date +%s) + LANGUAGE_PROOF_BUDGET_SECONDS ))
          rounds=0
          missing="es it nl pt"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            rounds=$(( rounds + 1 ))
            timeout 300 php -f cron.php > "${RUNNER_TEMP}/language-cron-${rounds}.log" 2>&1 || true
            still=""
            for lang in ${missing}; do
              case "${lang}" in
                es) term=alemanes ;;
                it) term=informazioni ;;
                nl) term=beinvloeden ;;
                pt) term=pais ;;
                *) echo "::error::unknown language code ${lang}"; exit 1 ;;
              esac
              # entries | length, and never the subline of the first entry. The
              # gate in backend/tests/test_language_proof_steps.py reads this
              # step for that second name and goes red on it, which is why this
              # paragraph describes it instead of spelling it.
              #
              # A hit that was
              # found through a new language field alone comes back WITHOUT an
              # excerpt, measured on 2026-09-24 (19-RESEARCH M-4): the snippet
              # is cut out of body_de (index/search.py:875), because that is the
              # only stored copy of the text, and a question that meets the
              # document term only through the Spanish chain has no term to mark
              # in the German one. The empty subline is the documented state and
              # not a fault, so a probe that asserted on it would go red on a
              # working search. A hit without an excerpt is still a hit.
              status=$(curl -s -o "${RUNNER_TEMP}/language-hit-${lang}.json" -w '%{http_code}' \
                -u "testuser:${TESTUSER_PASS}" \
                -H 'OCS-APIRequest: true' \
                -H 'Accept: application/json' \
                "http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=${term}")
              if [ "${status}" != "200" ] \
                || ! jq -e '.ocs.data.entries | length >= 1' \
                     "${RUNNER_TEMP}/language-hit-${lang}.json" > /dev/null 2>&1; then
                still="${still} ${lang}"
              fi
            done
            missing=$(echo "${still}" | sed -e 's/^ *//' -e 's/ *$//')
            if [ -z "${missing}" ]; then
              break
            fi
            echo "round ${rounds}: still waiting for [${missing}], $(( deadline - $(date +%s) ))s of the budget left"
            sleep 10
          done

          if [ -n "${missing}" ]; then
            echo "::error::no hit for [${missing}] within LANGUAGE_PROOF_BUDGET_SECONDS=${LANGUAGE_PROOF_BUDGET_SECONDS} after ${rounds} cron rounds"
            echo "This is a finding and not a reason to raise the budget (T-06.1-52)."
            for lang in ${missing}; do
              echo "--- the last answer for ${lang} ---"
              cat "${RUNNER_TEMP}/language-hit-${lang}.json" || true
              echo
            done
            echo "--- the last cron round ---"
            tail -n 40 "${RUNNER_TEMP}/language-cron-${rounds}.log" || true
            echo "--- the container ---"
            docker logs "${EXAPP_CONTAINER}" 2>&1 | tail -n 60 || true
            exit 1
          fi

          # The hit is a hit of the right file, asserted rather than assumed.
          # Each of the four questions is answered by exactly one of the four
          # documents, which is why the first entry can be named at all.
          for lang in es it nl pt; do
            if ! jq -e --arg file "language-proof-${lang}.txt" \
                 '.ocs.data.entries[0].title == $file' \
                 "${RUNNER_TEMP}/language-hit-${lang}.json" > /dev/null; then
              echo "::error::the first hit of the ${lang} search is '$(jq -r '.ocs.data.entries[0].title' "${RUNNER_TEMP}/language-hit-${lang}.json" 2> /dev/null || echo "unreadable")' and not language-proof-${lang}.txt"
              jq -r '.ocs.data.entries[]?.title' "${RUNNER_TEMP}/language-hit-${lang}.json" || true
              exit 1
            fi
            echo "${lang}: the ordinary search route brings back language-proof-${lang}.txt"
          done

          # -- the result page, four calls and one per language ---------------
          # The second half of criterion 1, and the half no step of this
          # workflow had ever touched. PageController::index carries
          # NoAdminRequired, NoCSRFRequired and FrontpageRoute
          # (php/lib/Controller/PageController.php:215-217), so basic auth as
          # the ordinary user is enough and the answer is server rendered HTML
          # with the file name of every hit in it
          # (php/templates/search.php, the findling-hit__title span).
          #
          # The parameter is "query" and not "term". PageController::term()
          # reads getParam('query') at line 340, and nothing on that route ever
          # looks at a parameter called term: a call with ?term= answers 200
          # with the empty landing page, which is the shape of a green step that
          # proves nothing. The assertion below is what makes that impossible,
          # because an empty page carries no file name.
          #
          # Four literal calls and no loop, so that the text gate of
          # backend/tests/test_language_proof_steps.py can count them and see
          # one per language rather than one call it cannot attribute.
          curl -s -o "${RUNNER_TEMP}/language-page-es.html" -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            'http://localhost:8080/index.php/apps/findling/?query=alemanes' \
            > "${RUNNER_TEMP}/language-page-es.code"
          curl -s -o "${RUNNER_TEMP}/language-page-it.html" -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            'http://localhost:8080/index.php/apps/findling/?query=informazioni' \
            > "${RUNNER_TEMP}/language-page-it.code"
          curl -s -o "${RUNNER_TEMP}/language-page-nl.html" -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            'http://localhost:8080/index.php/apps/findling/?query=beinvloeden' \
            > "${RUNNER_TEMP}/language-page-nl.code"
          curl -s -o "${RUNNER_TEMP}/language-page-pt.html" -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            'http://localhost:8080/index.php/apps/findling/?query=pais' \
            > "${RUNNER_TEMP}/language-page-pt.code"

          for lang in es it nl pt; do
            status=$(cat "${RUNNER_TEMP}/language-page-${lang}.code")
            if [ "${status}" != "200" ]; then
              echo "::error::the result page of the ${lang} question answered HTTP ${status}"
              head -c 400 "${RUNNER_TEMP}/language-page-${lang}.html" || true
              exit 1
            fi
            # The file name and never the excerpt, for the reason the OCS
            # assertion above states at length.
            if ! grep -qF "language-proof-${lang}.txt" "${RUNNER_TEMP}/language-page-${lang}.html"; then
              echo "::error::the result page of the ${lang} question answered 200 without language-proof-${lang}.txt in its html, so the page found nothing the search route found"
              exit 1
            fi
            echo "${lang}: the result page carries language-proof-${lang}.txt"
          done

          {
            echo ""
            echo "### Language proof on ${{ matrix.server-version }} / ${{ matrix.runner }}"
            echo ""
            echo "- es, it, nl and pt each answered on the ordinary search route after ${rounds} cron rounds"
            echo "- the result page answered with the same four files, one call per language"
          } >> "${GITHUB_STEP_SUMMARY}"

          # -- and the four documents go again --------------------------------
          # The proof is complete at the line above, and the files are taken out
          # so that the stock of this user is the stock every later step of this
          # job was measured against. One of those steps is the reason: "Store
          # upgrade 2" asserts that Belehrung, Auszug and Erinnerung bring back
          # exactly ONE file each, the search behind that assertion is hybrid,
          # and whether a foreign document lands inside the semantic band of
          # 14.0 around the best neighbour is a measurement and not a deduction
          # (the comment above the fill corpus says exactly that about its own
          # words). Leaving four foreign language documents in the home would
          # put that question to a proof that never asked it.
          for lang in es it nl pt; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -u "testuser:${TESTUSER_PASS}" \
              "http://localhost:8080/remote.php/dav/files/testuser/language-proof-${lang}.txt")
            case "${status}" in
              200|204) echo "language-proof-${lang}.txt removed again, HTTP ${status}" ;;
              *)
                echo "::error::the removal of language-proof-${lang}.txt answered HTTP ${status}, so the stock of the later steps is not the one they were measured against"
                exit 1
                ;;
            esac
          done

          # -- and the removal is measured instead of assumed ------------------
          # Audit finding L-19-05. The removal in Nextcloud and the
          # disappearance from the Findling index are two events, and between
          # them lie the delete job of the events listener and the cron round
          # that carries it out. The paragraph above justifies the removal with
          # the stock the later steps were measured on, and that justification
          # only holds once the index has caught up. Nothing waited for it, and
          # a thing this file measures everywhere else was set here.
          #
          # Measured and reported, and deliberately not a gate yet. A hard
          # failure here would be a new runtime assertion on a timing nobody has
          # ever read on this instance, and it would take the whole pipeline down
          # for a suspicion. What is needed first is how far the two events
          # really lie apart, and the lines below are that reading. They drive
          # the same cron round the poll loop above drives, because nothing else
          # moves the queue at this point of the job. Once a run has printed the
          # figure, the budget is measured rather than guessed, and this block
          # becomes the loop that exits non zero, in the shape of the one above.
          gone_by=$(( $(date +%s) + 60 ))
          rounds_gone=0
          present="es it nl pt"
          while [ -n "${present}" ] && [ "$(date +%s)" -lt "${gone_by}" ]; do
            rounds_gone=$(( rounds_gone + 1 ))
            timeout 300 php -f cron.php > "${RUNNER_TEMP}/language-gone-cron-${rounds_gone}.log" 2>&1 || true
            left=""
            for lang in ${present}; do
              case "${lang}" in
                es) term=alemanes ;;
                it) term=informazioni ;;
                nl) term=beinvloeden ;;
                pt) term=pais ;;
                *) echo "::error::unknown language code ${lang}"; exit 1 ;;
              esac
              status=$(curl -s -o "${RUNNER_TEMP}/language-gone-${lang}.json" -w '%{http_code}' \
                -u "testuser:${TESTUSER_PASS}" \
                -H 'OCS-APIRequest: true' \
                -H 'Accept: application/json' \
                "http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=${term}")
              if [ "${status}" != "200" ] \
                || ! jq -e '.ocs.data.entries | length == 0' \
                     "${RUNNER_TEMP}/language-gone-${lang}.json" > /dev/null 2>&1; then
                left="${left} ${lang}"
              fi
            done
            present=$(echo "${left}" | sed -e 's/^ *//' -e 's/ *$//')
            if [ -n "${present}" ]; then
              sleep 5
            fi
          done
          if [ -z "${present}" ]; then
            echo "the four language documents are out of the index again after ${rounds_gone} cron round(s)"
          else
            echo "::warning::[${present}] still answer a hit ${rounds_gone} cron round(s) and 60s after the removal, so the stock of the steps below is not yet the one they were measured against (L-19-05)"
          fi

      # The four steps below are the runtime half of the lockstep promise of
      # D-11, and they sit here rather than anywhere else on purpose: the step
      # above has just shown what an agreeing pair does, which is the counter
      # sample every assertion from here on is measured against, and the
      # uninstall proof below needs the installation intact, which the last of
      # the four hands back.
      #
      # What is being proven is the half of D-11 that had no evidence. The
      # repository side is held by backend/tests/test_lockstep_versions.py: both
      # info.xml and the image tag carry one version. Nobody had measured what
      # an instance does when the two halves are nevertheless apart, which is
      # what every instance looks like for the minutes between updating one half
      # and the other, and in both orders.
      #
      # The lever is the version in the info.xml handed to app_api:app:register.
      # AppAPI passes it to the container as APP_VERSION, the container reports
      # it as appVersion out of backend/src/findling/api/status.py, and
      # php/lib/Service/ExAppService.php compares major and minor of it against
      # its own. Nothing in the repository moves for this, which is the reason
      # this lever was chosen over editing a version and rebuilding: a proof
      # that needs the tree changed cannot run on the tree it is proving. That
      # AppAPI really carries the value through is not assumed either, the
      # helper below reads it back off the running container.
      #
      # And what is expressly NOT expected anywhere here is an error status. The
      # unified search calls every provider in parallel, so a provider that
      # throws costs the user the whole search rather than one result group
      # (T-06.1-36). The promise is an honest empty answer, and an empty answer
      # is only worth anything next to the step above, where the same call with
      # the same term returns a hit.
      - name: The drift probe both directions share
        run: |
          companion=$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' \
            apps/findling/appinfo/info.xml | head -1)
          if [ -z "${companion}" ]; then
            echo "no version in php/appinfo/info.xml, so there is nothing to drift away from"
            exit 1
          fi
          major=${companion%%.*}
          rest=${companion#*.}
          minor=${rest%%.*}
          # A minor apart in each direction, because that is the distance the
          # release policy of D-11 attaches the protocol to: a patch is
          # deliberately not a drift, so a probe built on one would assert the
          # opposite of the promise.
          newer="${major}.$((minor + 1)).0"
          if [ "${minor}" -gt 0 ]; then
            older="${major}.$((minor - 1)).0"
          elif [ "${major}" -gt 0 ]; then
            older="$((major - 1)).9.0"
          else
            echo "the companion is at ${companion}, and there is no version below it to drift to"
            exit 1
          fi
          {
            echo "COMPANION_VERSION=${companion}"
            echo "DRIFT_NEWER=${newer}"
            echo "DRIFT_OLDER=${older}"
          } >> "${GITHUB_ENV}"
          echo "companion ${companion}, probing against ${newer} and ${older}"

          # The redeploy helper. One file rather than the same twenty lines in
          # three steps, and it fails on its own if the value it was asked for is
          # not the value the container ended up with.
          cat > "${RUNNER_TEMP}/redeploy.sh" <<'SH'
          #!/bin/sh
          set -eu
          version="$1"
          sed -e "s|<version>[^<]*</version>|<version>${version}</version>|" \
            "${RUNNER_TEMP}/info-citest.xml" > "${RUNNER_TEMP}/info-drift.xml"
          # Exactly one version element, or the sed above rewrote something it
          # was not aimed at and the rest of this script would be measuring a
          # file nobody meant to produce.
          if [ "$(grep -c '<version>' "${RUNNER_TEMP}/info-drift.xml")" != "1" ]; then
            echo "info-drift.xml does not carry exactly one version element"
            exit 1
          fi
          timeout 300 ./occ app_api:app:unregister findling_backend
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-drift.xml" --wait-finish
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the registration at ${version} left no running container"
            docker ps -a
            exit 1
          fi
          running=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "${container}" | sed -n 's/^APP_VERSION=//p' | head -1)
          if [ "${running}" != "${version}" ]; then
            echo "the container runs APP_VERSION '${running}' while the registration asked for '${version}', so this probe would prove nothing"
            exit 1
          fi
          echo "${container} redeployed at APP_VERSION ${running}"
          SH

          # The overview helper. The verdict lives behind an admin frontpage
          # route, and that route answers 401 without a session, 403 to an
          # ordinary user and 412 to an admin without the request token, all
          # three measured in plan 04-03. Basic auth is no way past it, which is
          # what the two round trips below are for. This call is also what puts
          # the container version on record at all: ExAppService::lockstep is
          # reached through the page and nowhere else, and the search path reads
          # what it wrote (KEY_BACKEND_VERSION).
          cat > "${RUNNER_TEMP}/overview.sh" <<'SH'
          #!/bin/sh
          set -eu
          out="$1"
          # Way one, and the one that works without a browser: an app password from
          # occ, used as basic auth. Nextcloud treats an app password as token auth,
          # which is exactly the credential a script is supposed to hold. The form
          # login below stays as the fallback and as the diagnosis if this way dies.
          apppw=""
          if NC_PASS=password timeout 60 php occ user:add-app-password admin \
            --password-from-env > "${RUNNER_TEMP}/apppw.txt" 2>&1; then
            apppw=$(grep -oE '[A-Za-z0-9+/=._-]{40,}' "${RUNNER_TEMP}/apppw.txt" | tail -1)
          fi
          # occ user:add-app-password does not exist on every server of the
          # matrix (stable33 answered 'not available'); the OCS endpoint below
          # is the portable way to the same credential and exists on all three.
          if [ -z "${apppw}" ]; then
            apppw=$(curl -s -u admin:password -H 'OCS-APIRequest: true' \
              'http://localhost:8080/ocs/v2.php/core/getapppassword?format=json' \
              | grep -o '"apppassword":"[^"]*"' | cut -d'"' -f4 || true)
          fi
          if [ -n "${apppw}" ]; then echo "app password: obtained (length ${#apppw})"; else echo "app password: not available"; fi
          if [ -n "${apppw}" ]; then
            # Request.php::passesCSRFCheck() (stable34, line 455) lets any request
          # with the OCS-APIRequest header through, and cookieCheckRequired()
          # waives the strict cookie check for it as well. That header is the
          # scriptable way past the 412 this route answered without it.
          code=$(curl -s -u "admin:${apppw}" -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              -w '%{http_code}' -o "${out}" \
              http://localhost:8080/index.php/apps/findling/admin/overview)
            echo "overview via app password: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              if jq -e '.lockstep | has("state")' "${out}" > /dev/null; then exit 0; fi
              echo "200 without a lockstep verdict:"; head -c 400 "${out}"; echo
            fi
          fi
          # Way two, the session of the login form, with every stage on record: a
          # bare curl exit code on this throwaway instance costs a fifteen-minute
          # run to diagnose (learned three runs in a row).
          jar="${RUNNER_TEMP}/admin-cookies.txt"
          rm -f "${jar}"
          code=$(curl -s -c "${jar}" -o "${RUNNER_TEMP}/login-get.html" \
            -w '%{http_code}' http://localhost:8080/index.php/login)
          token=$(grep -o 'data-requesttoken="[^"]*"' "${RUNNER_TEMP}/login-get.html" \
            | head -1 | cut -d'"' -f2)
          echo "login page: HTTP ${code}, token length ${#token}"
          redirect=$(curl -s -b "${jar}" -c "${jar}" -o /dev/null \
            -w '%{http_code} %{redirect_url}' \
            --data-urlencode "user=admin" \
            --data-urlencode "password=password" \
            --data-urlencode "requesttoken=${token}" \
            http://localhost:8080/index.php/login)
          echo "login post: ${redirect}"
          code=$(curl -s -b "${jar}" -c "${jar}" -o "${RUNNER_TEMP}/settings.html" \
            -w '%{http_code}' http://localhost:8080/index.php/settings/admin)
          token=$(grep -o 'data-requesttoken="[^"]*"' "${RUNNER_TEMP}/settings.html" \
            | head -1 | cut -d'"' -f2)
          echo "settings page: HTTP ${code}, token length ${#token}"
          code=$(curl -s -b "${jar}" -c "${jar}" \
            -H "requesttoken: ${token}" -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            -w '%{http_code}' -o "${out}" \
            http://localhost:8080/index.php/apps/findling/admin/overview)
          echo "overview via session: HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "overview body head:"; head -c 400 "${out}" || true; echo
            exit 1
          fi
          if ! jq -e '.lockstep | has("state")' "${out}" > /dev/null; then
            echo "the overview carries no lockstep verdict, so the session or the route is not what this probe assumes"
            head -c 400 "${out}"
            exit 1
          fi
          SH

          chmod +x "${RUNNER_TEMP}/redeploy.sh" "${RUNNER_TEMP}/overview.sh"

          # The counter sample, and it is the reason the two steps below say
          # anything at all: with the installation untouched the verdict is
          # match, and both numbers are the one version of this release.
          sh "${RUNNER_TEMP}/overview.sh" lockstep-match.json
          jq '.lockstep' lockstep-match.json
          if ! jq -e --arg v "${companion}" \
            '.lockstep.state == "match" and .lockstep.companion == $v and .lockstep.container == $v' \
            lockstep-match.json > /dev/null; then
            echo "the untouched installation does not report a matching pair at ${companion}, so a drift verdict below would be the state it was in all along"
            exit 1
          fi
          echo "baseline: both halves at ${companion}, verdict match"

      # Direction one: the container is a minor ahead of the companion, which is
      # the instance where the ExApp was updated first.
      - name: Drift 1, the container is newer than the companion
        run: |
          sh "${RUNNER_TEMP}/redeploy.sh" "${DRIFT_NEWER}"
          sh "${RUNNER_TEMP}/overview.sh" lockstep-newer.json
          jq '.lockstep' lockstep-newer.json
          if ! jq -e --arg c "${COMPANION_VERSION}" --arg b "${DRIFT_NEWER}" \
            '.lockstep.state == "drift" and .lockstep.companion == $c and .lockstep.container == $b' \
            lockstep-newer.json > /dev/null; then
            echo "the state answer does not name the drift between ${COMPANION_VERSION} and ${DRIFT_NEWER}"
            exit 1
          fi

          # The status code is asserted rather than left to curl -sf, because
          # the distinction between an honest empty answer and a failure is the
          # whole assertion here and -sf would collapse the two.
          code=$(curl -s -o drift-newer.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat drift-newer.json
          if [ "${code}" != "200" ]; then
            echo "the search answered HTTP ${code} while the halves disagree; a provider that fails costs the user every other provider too (T-06.1-36)"
            exit 1
          fi
          if ! jq -e '.ocs.meta.status == "ok" and .ocs.meta.statuscode == 200' drift-newer.json > /dev/null; then
            echo "the OCS envelope reports a failure, which is the same finding one layer down"
            exit 1
          fi
          # The same term that returned the canary two steps ago. No hit may
          # come out of a protocol the other half no longer speaks (T-06.1-37),
          # and the term is what makes the emptiness mean something.
          if ! jq -e '.ocs.data.entries | length == 0' drift-newer.json > /dev/null; then
            echo "the search returned hits although the two halves disagree about what they mean to each other"
            exit 1
          fi
          echo "container ahead: HTTP 200, no hits, verdict drift"

      # Direction two: the companion is a minor ahead of the container, which is
      # the instance where the app store half was updated first. Both directions
      # are run because the comparison is symmetric in ExAppService and a check
      # that only ever saw one of them would not have shown that.
      - name: Drift 2, the container is older than the companion
        run: |
          sh "${RUNNER_TEMP}/redeploy.sh" "${DRIFT_OLDER}"
          sh "${RUNNER_TEMP}/overview.sh" lockstep-older.json
          jq '.lockstep' lockstep-older.json
          if ! jq -e --arg c "${COMPANION_VERSION}" --arg b "${DRIFT_OLDER}" \
            '.lockstep.state == "drift" and .lockstep.companion == $c and .lockstep.container == $b' \
            lockstep-older.json > /dev/null; then
            echo "the state answer does not name the drift between ${COMPANION_VERSION} and ${DRIFT_OLDER}"
            exit 1
          fi

          code=$(curl -s -o drift-older.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat drift-older.json
          if [ "${code}" != "200" ]; then
            echo "the search answered HTTP ${code} while the halves disagree; a provider that fails costs the user every other provider too (T-06.1-36)"
            exit 1
          fi
          if ! jq -e '.ocs.meta.status == "ok" and .ocs.meta.statuscode == 200' drift-older.json > /dev/null; then
            echo "the OCS envelope reports a failure, which is the same finding one layer down"
            exit 1
          fi
          if ! jq -e '.ocs.data.entries | length == 0' drift-older.json > /dev/null; then
            echo "the search returned hits although the two halves disagree about what they mean to each other"
            exit 1
          fi
          echo "container behind: HTTP 200, no hits, verdict drift"

      # The way back, and it is an assertion rather than a cleanup. The uninstall
      # proof below is about the installation this job made, so it has to be that
      # installation again: the same file, the same container name, the same
      # volume, a matching verdict and a search that finds the canary a second
      # time. A drift the job left behind would be inherited by every step after
      # it, silently, because none of them looks at a version.
      - name: Drift 3, the right version is back and the search answers again
        run: |
          sh "${RUNNER_TEMP}/redeploy.sh" "${COMPANION_VERSION}"
          # The restored file has to be the installed one byte for byte, not
          # merely a file that carries the same number somewhere.
          diff "${RUNNER_TEMP}/info-citest.xml" "${RUNNER_TEMP}/info-drift.xml"

          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ "${container}" != "${EXAPP_CONTAINER}" ]; then
            echo "the container is called '${container}' and the uninstall assertions look for '${EXAPP_CONTAINER}', which they would find missing for the wrong reason (T-05-29)"
            exit 1
          fi
          volume=$(docker volume ls --filter "name=${EXAPP_VOLUME}" --format '{{.Name}}')
          if [ "${volume}" != "${EXAPP_VOLUME}" ]; then
            echo "the volume ${EXAPP_VOLUME} did not survive the three redeployments, found '${volume}'"
            docker volume ls
            exit 1
          fi

          sh "${RUNNER_TEMP}/overview.sh" lockstep-restored.json
          jq '.lockstep' lockstep-restored.json
          if ! jq -e --arg v "${COMPANION_VERSION}" \
            '.lockstep.state == "match" and .lockstep.companion == $v and .lockstep.container == $v' \
            lockstep-restored.json > /dev/null; then
            echo "the halves still disagree after the restore, so every step below would run on a drifted instance"
            exit 1
          fi

          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee restored.json
          if ! jq -e '.ocs.data.entries | length == 1' restored.json > /dev/null; then
            echo "the search does not find the canary again, so the emptiness above was not the drift"
            exit 1
          fi
          jq -e '.ocs.data.entries[0].title == "findling-canary"' restored.json
          echo "restored at ${COMPANION_VERSION}, verdict match, canary found again"

      # From here to the teardown runs the uninstall proof, the second half of
      # success criterion 3 of this phase. It falls into assertions that are
      # separate steps on purpose: each one has its own message, each one treats
      # an empty result as a failure, and the order is not free. Assertion 1 is
      # first because it is the only one that can still be made afterwards.
      #
      # What this proof does not cover, and it says so where an admin reads it
      # (docs/uninstall.md): it never touches the web interface, so the "delete
      # data" switch of the app management stays unproven, and it does not check
      # that the pulled image is gone, because the unregister path of AppAPI
      # removes containers and volumes and never an image. Nextcloud 33 is the
      # version in this window that still has that switch; Nextcloud 32 had it as
      # well and left the window with E-H1.
      #
      # Assertion 1: without the flag the data stay. That is the promise decision
      # D-16 rests on, and once assertion 3 has run it cannot be made any more.
      - name: Uninstall 1, an unregister without the flag keeps the volume
        run: |
          if [ -z "${EXAPP_VOLUME}" ] || [ -z "${EXAPP_CONTAINER}" ]; then
            echo "the install step handed over no container or volume name, so this assertion would pass without looking at anything"
            exit 1
          fi
          timeout 300 ./occ app_api:app:unregister findling_backend
          still_there=$(docker ps -a --filter "name=${EXAPP_CONTAINER}" --format '{{.Names}}')
          if [ -n "${still_there}" ]; then
            echo "the container ${EXAPP_CONTAINER} survived the unregister, so the deregistration removed nothing"
            docker ps -a
            exit 1
          fi
          kept=$(docker volume ls --filter "name=${EXAPP_VOLUME}" --format '{{.Name}}')
          if [ "${kept}" != "${EXAPP_VOLUME}" ]; then
            echo "the volume ${EXAPP_VOLUME} is gone after an unregister without --rm-data, and the documented default is that it stays; found '${kept}'"
            docker volume ls
            exit 1
          fi
          echo "container gone, volume ${kept} kept"

      # Assertion 2: the way back. A second registration on the volume the first
      # one left behind is the path an admin takes after a failed attempt, and
      # that it succeeds and picks up the same volume is worth asserting rather
      # than assuming: this is where days of OCR work on a weak box either
      # survive or quietly do not.
      - name: Uninstall 2, a second registration picks up the volume it left
        run: |
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-citest.xml" --wait-finish
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the second registration created no running container"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ "${volume}" != "${EXAPP_VOLUME}" ]; then
            echo "the second registration did not take the volume of the first one, expected ${EXAPP_VOLUME} and found '${volume}'"
            docker volume ls
            exit 1
          fi
          echo "registered again as ${container} on the kept volume ${volume}"

      # Assertion 3: with the flag the data go. The filter is the name from the
      # install step, so an empty answer here means the volume is gone and not
      # that nothing was ever looked for.
      - name: Uninstall 3, an unregister with --rm-data removes the volume
        run: |
          if [ -z "${EXAPP_VOLUME}" ]; then
            echo "no volume name from the install step, so an empty filter result would be a false green (T-05-29)"
            exit 1
          fi
          timeout 300 ./occ app_api:app:unregister findling_backend --rm-data
          left=$(docker volume ls --filter "name=${EXAPP_VOLUME}" --format '{{.Name}}')
          if [ -n "${left}" ]; then
            echo "the volume ${EXAPP_VOLUME} survived an unregister with --rm-data, found '${left}'"
            docker volume ls
            exit 1
          fi
          container=$(docker ps -a --filter "name=${EXAPP_CONTAINER}" --format '{{.Names}}')
          if [ -n "${container}" ]; then
            echo "the container ${EXAPP_CONTAINER} survived the unregister with --rm-data"
            docker ps -a
            exit 1
          fi
          echo "container and volume ${EXAPP_VOLUME} both gone"

      # Every query below carries ".timeout 30000", and that is a measurement as
      # well: the ExApp container is running next to these reads and Nextcloud
      # writes to the same sqlite file for it, so the plain client walked into
      # "in prepare, database is locked (5)" on Nextcloud 32 (run 33756788051)
      # while the other three versions happened to read between two writes. A
      # busy timeout turns a race into a wait. That entry has since left the
      # matrix with E-H1, and the timeout stays: the race belongs to two writers
      # on one sqlite file and not to that version.
      #
      # Assertions 4 and 5 ask the same two questions of the database, and they
      # ask the database rather than occ on purpose: there is no occ command that
      # reports whether a table exists (occ db:* converts, adds indices and
      # repairs), and an occ call that fails prints nothing, which would read
      # exactly like "no tables left" and turn a broken measurement into a green
      # result. The dialect is checked before the first query, because a query
      # against the wrong dialect is the same false green in a different costume.
      - name: The database probe the last two assertions share
        run: |
          dbtype=$(timeout 30 ./occ config:system:get dbtype)
          if [ "${dbtype}" != "sqlite3" ]; then
            echo "these assertions read the sqlite test database, but dbtype is '${dbtype}'"
            exit 1
          fi
          # Neither key is asked for without a way out: config:system:get exits
          # non zero and prints nothing when a key is absent from config.php, and
          # dbname is absent after a sqlite install (measured in run
          # 33756342732, where this step died silently on that single line). The
          # file is therefore looked for rather than derived, and not finding it
          # is an error with a message.
          datadir=$(timeout 30 ./occ config:system:get datadirectory 2>/dev/null || echo "${PWD}/data")
          dbname=$(timeout 30 ./occ config:system:get dbname 2>/dev/null || echo '')
          db="${datadir}/${dbname}.db"
          if [ -z "${dbname}" ] || [ ! -f "${db}" ]; then
            db=$(find "${datadir}" -maxdepth 1 -name '*.db' | head -n 1)
          fi
          if [ -z "${db}" ] || [ ! -f "${db}" ]; then
            echo "no sqlite database found under ${datadir}, so the two assertions below would measure nothing"
            ls -la "${datadir}" || true
            exit 1
          fi
          if ! command -v sqlite3 > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3
          fi
          echo "FINDLING_DB=${db}" >> "${GITHUB_ENV}"
          echo "database ${db}, dialect ${dbtype}"

      # Assertion 4: a disable without intent leaves the Nextcloud half alone.
      # It runs before assertion 5 for the reason threat T-05-31 names: the
      # intent mark of plan 05-02 is a one shot flag, and the only way to show
      # that a disable clears nothing is to disable while no mark is set.
      - name: Uninstall 4, a disable without intent keeps tables and settings
        run: |
          expected='oc_findling_file_state oc_findling_queue oc_findling_scan_stats'
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "before the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the three tables of the app are not all there before the disable, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          timeout 300 ./occ app:disable findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the disable removed tables although no intent was armed, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          if [ "${settings}" -lt 1 ]; then
            echo "the disable emptied the settings of the app although no intent was armed, ${settings} values left"
            exit 1
          fi

      # Assertion 5: a remove with intent clears the Nextcloud half. The order
      # inside the step is the documented one from docs/uninstall.md, and the
      # registration in the middle of it belongs to assertion 6: that one needs a
      # live container while the companion goes away, and the deployment
      # handshake has to happen while the installation is still complete.
      - name: Uninstall 5, a remove with intent clears tables and settings
        run: |
          timeout 300 ./occ app:enable findling
          timeout 600 ./occ app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-citest.xml" --wait-finish
          timeout 300 ./occ findling:purge --arm --no-interaction
          timeout 300 ./occ app:remove findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the remove with intent: tables [${tables}], settings ${settings}"
          if [ -n "${tables}" ]; then
            echo "the remove with intent left tables behind: [${tables}]"
            exit 1
          fi
          if [ "${settings}" -ne 0 ]; then
            echo "the remove with intent left ${settings} settings behind"
            exit 1
          fi

      # Assertion 6: the other half of a half removal. The container that has
      # just lost its caller keeps running and polls a queue that is not there
      # any more, and D-17 says that is a state of operation and not a defect.
      # What it must not become is an error loop: a line per pass fills the disk
      # of a four gigabyte box and hides the lines that would have said something
      # (T-05-30). Measured here in both directions, alive and quiet.
      - name: Uninstall 6, the container without a companion retreats
        run: |
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container after the companion was removed, so the container did not survive the half removal"
            docker ps -a
            exit 1
          fi
          noisy_lines() {
            docker logs "${container}" 2>&1 | grep -cE '^(WARNING|ERROR|CRITICAL):' || true
          }
          before=$(noisy_lines)
          # A budget, not a fixed pause. The poller announces the retreat on the
          # third unanswered pass, and the pause before the first of them can be
          # anything up to the cap of an empty queue, so the worst case is around
          # 165 s. The loop leaves as soon as the line is there, which is some
          # 45 s in the ordinary case.
          entered=""
          for _ in $(seq 1 24); do
            if docker logs "${container}" 2>&1 | grep -q 'the queue has not answered for'; then
              entered="yes"
              break
            fi
            sleep 10
          done
          if [ -z "${entered}" ]; then
            echo "the container never announced the retreat, so it is either still polling pass by pass or it is not polling at all"
            docker logs "${container}" 2>&1 | tail -n 40
            exit 1
          fi
          alive=$(docker ps --filter "name=${container}" --format '{{.Status}}')
          if [ -z "${alive}" ]; then
            echo "the container stopped during the retreat instead of waiting it out"
            docker ps -a
            exit 1
          fi
          # The number that separates a retreat from an error loop, counted after
          # the announcement and not from before the retreat, because the lines
          # before it are two different things and only one of them measures
          # anything.
          #
          # The ladder of worker/poller.py:1963 writes one line per unanswered
          # pass up to RETREAT_AFTER_ROUNDS and then exactly one announcement,
          # which is the documented behaviour of plan 05-08. The lines of
          # nc/queue.py ("could not hand", "could not acknowledge") and of
          # poller.py:1198 are one off reports about the work that was in flight
          # when the caller vanished, so how many of them there are depends on
          # what the container happened to be doing at that second and not on
          # whether it behaves. Counting from before the retreat therefore held
          # the container to a number that its own state decides: the same image
          # produced three of those lines with nothing in flight and six with one
          # file in flight, and the second reading failed a gate that the first
          # one passed.
          #
          # What this step claims is that the retreat is a retreat, and that
          # claim is about the silence that follows the announcement.
          # RETREAT_MAX_SECONDS is 300 s, so a container that really retreated
          # writes nothing at all in the minute below; one line is tolerated for
          # the one that was already on its way when the snapshot was taken.
          announced=$(noisy_lines)
          sleep 60
          after=$(noisy_lines)
          grew=$((after - announced))
          if [ "${grew}" -gt 1 ]; then
            echo "the container wrote ${grew} new warning or error lines in the 60 s after it announced the retreat, which is an error loop and not a retreat"
            docker logs "${container}" 2>&1 | grep -E '^(WARNING|ERROR|CRITICAL):' | tail -n 20
            exit 1
          fi
          echo "container ${container} is ${alive}, retreat announced after $((announced - before)) lines, ${grew} lines in the 60 s that followed"

      # =====================================================================
      # The store install path, added by plan 06.1-12
      #
      # Everything above installs the two halves the way a developer does: the
      # companion is moved into apps/ out of the working tree by the composite
      # action, and the ExApp is registered with an info.xml this job rewrites so
      # that it points at a registry on localhost. Both are legitimate for what
      # they prove, and neither of them is the path a stranger walks.
      #
      # From here on the job walks that path. It starts where "Uninstall 5" left
      # the instance, which is the cheapest clean slate this job can reach: the
      # companion is removed, its tables and settings are gone, and the only
      # thing still standing is the container of assertion 6. So the first step
      # takes that container away as well, and then both halves come back out of
      # the release archives.
      #
      # Pitfall 8, written here because this is where it would be walked into:
      # scripts/dev/register-exapp.sh and .github/actions/setup-test-nc are
      # manual-install paths. They pull no image, they create no container, and
      # they read no route list out of an archive. A step below that reached for
      # either of them would prove nothing about the store path, and the warning
      # sign is a path into findling-src where a registry address belongs.
      #
      # And the question plan 06.1-12 had to answer rather than leave open: does
      # the developer pass above stay now that this one exists? It stays, and the
      # reason is not habit. The two passes prove different things and only one
      # of them can prove either.
      #
      #   The developer pass installs the image built from THIS commit. It is the
      #   only pass that can, because a store install by definition pulls a
      #   published image, and on a branch that image is whatever main published
      #   last. Delete the developer pass and no run ever exercises the container
      #   code under review.
      #
      #   The store pass installs what a stranger installs and can say nothing
      #   about the commit under review. Delete it and the release archive, the
      #   route list inside it, the code signature and the anonymous pull go back
      #   to being untested.
      #
      # A silent side by side of two installation paths would be the one
      # unacceptable answer, so the difference is written here: above is the
      # commit, below is the release.
      # =====================================================================

      # The occ recorder of the store pass, and it is a step of its own since
      # plan 11-04 rather than the head of the step below. The reason is the
      # release asset mode that plan adds: the step below runs only when the
      # archives are built locally, and the wrapper is needed either way,
      # because "Store install 7" states which commands ran between the
      # installation and the first hit and reads this log to state it. A
      # recorder that disappears with the build step would have made the zero
      # config proof depend on how the archives arrived.
      - name: Store install 0, the occ recorder every step of the store pass goes through
        run: |
          # Every occ call of the store install path goes through this wrapper,
          # and the reason is the zero config proof further down: it has to be
          # able to state which commands ran between the installation and the
          # first hit, and a list somebody maintains by hand is a list that goes
          # stale. The wrapper records and then runs. What it cannot see is a
          # direct ./occ call somebody adds later without it, and that limit is
          # stated here rather than left to be discovered.
          echo "OCC_LOG=${RUNNER_TEMP}/occ-calls.txt" >> "${GITHUB_ENV}"
          : > "${RUNNER_TEMP}/occ-calls.txt"
          cat > "${RUNNER_TEMP}/nc-occ.sh" <<'SH'
          #!/bin/sh
          set -eu
          printf '%s\n' "occ $*" >> "${OCC_LOG}"
          exec timeout 600 ./occ "$@"
          SH
          chmod +x "${RUNNER_TEMP}/nc-occ.sh"

      # The archives are built here rather than downloaded, and the reason is
      # release.yml itself: it runs on a tag or on a manual dispatch and it holds
      # both signing keys, so it does not run on a push and cannot run on a pull
      # request at all (docs/certificates.md forbids exactly that). An artifact
      # from it would therefore be missing on every event this job has, or would
      # come from a different commit, which is worse.
      #
      # Plan 11-04 adds the one case where that reasoning does not hold, and it
      # is an input rather than a rule change: with release_tag set, the two
      # archives come from the GitHub release of that tag, which is the only
      # way this job can install the bytes a stranger installs. That mode is
      # never automatic. On every push and every pull request the input is
      # empty and this step runs exactly as it always did, because a build
      # strategy that changes with the weather is not evidence about either
      # strategy. The two steps are mutually exclusive by construction, and the
      # archive is never built twice: tar.gz is not byte reproducible (the
      # sibling project measured 45710 bytes locally against 45546 published on
      # its 0.1.8 release), so "build it too and compare" would produce a
      # difference that says nothing.
      #
      # What is emphatically NOT done is a second packing path. The staging rules
      # and the tar options are in scripts/release/store-archive.sh and both
      # workflows call the same subcommands, so an archive built here is an
      # archive built the way the released one is built. The content proof runs
      # here too, over the archives this job is about to install from.
      #
      # The signature is the one place where this job cannot be the real thing,
      # and the substitute is named rather than hidden. The release key lives in
      # secrets.APP_PRIVATE_KEY, and docs/certificates.md forbids a workflow with
      # a pull_request trigger from reaching it, which this workflow has. So the
      # job mints its own throwaway code signing identity: a CA that exists for
      # the length of this run, and a leaf certificate whose CN is the app id,
      # because Checker::verify compares the CN against the app id and rejects
      # anything else. The CA is appended to resources/codesigning/root.crt of
      # the throwaway server checkout, which works because Checker splits that
      # file into individual certificates and loads every one of them.
      #
      # What that substitute proves: that the archive carries a signature over
      # the exact file list it ships, that the instance recomputes the hashes of
      # every one of those files and finds them unchanged, and that a single
      # altered byte turns the verdict red. That is the mechanism the store
      # relies on.
      #
      # What it expressly does not prove: that the certificate comes from the
      # Nextcloud Code Signing Root Authority. Nothing here can prove that,
      # because nothing here may hold the key. release.yml proves the other half
      # instead, by fetching both certificates and comparing their public key
      # fingerprints against docs/certificates.md before it signs anything.
      #
      # And the one case where the substitute is not needed at all: with
      # release_tag set, the companion archive comes from the release and
      # carries the signature release.yml made with the real app key, issued by
      # the Nextcloud Code Signing Root Authority, which the server checkout
      # already trusts. The throwaway identity below is therefore minted in the
      # local build mode only, and the release mode verifies against the same
      # anchor a user's instance verifies against.
      - name: Store install 1, build both release archives and sign the companion
        if: env.RELEASE_TAG == ''
        run: |
          # The throwaway code signing identity. Two days of validity, because a
          # certificate that expired between signing and checking would fail with
          # a message about a signature and not about a clock.
          mkdir -p "${RUNNER_TEMP}/ci-pki"
          (
            umask 077
            openssl req -x509 -newkey rsa:4096 -sha256 -days 2 -nodes \
              -keyout "${RUNNER_TEMP}/ci-pki/root.key" \
              -out "${RUNNER_TEMP}/ci-pki/root.crt" \
              -subj "/CN=Findling CI Code Signing Root"
            openssl req -new -newkey rsa:4096 -sha256 -nodes \
              -keyout "${RUNNER_TEMP}/ci-pki/findling.key" \
              -out "${RUNNER_TEMP}/ci-pki/findling.csr" \
              -subj "/CN=findling"
            openssl x509 -req -sha256 -days 2 \
              -in "${RUNNER_TEMP}/ci-pki/findling.csr" \
              -CA "${RUNNER_TEMP}/ci-pki/root.crt" \
              -CAkey "${RUNNER_TEMP}/ci-pki/root.key" \
              -CAcreateserial \
              -out "${RUNNER_TEMP}/ci-pki/findling.crt"
          )
          openssl x509 -in "${RUNNER_TEMP}/ci-pki/findling.crt" -noout -subject -issuer -nameopt RFC2253

          # The trust anchor of this run, appended and not replaced: the
          # Nextcloud Root Authority stays in the file, so the only difference to
          # a released archive is which of the two certificates in it signed the
          # app.
          #
          # The newline is the whole trick. root.crt ships from the server repo
          # without a trailing newline on every branch this job runs against, so
          # a plain append glues "-----END CERTIFICATE-----" and the following
          # "-----BEGIN CERTIFICATE-----" onto one line, and Checker::splitCerts
          # then walks past the CI root instead of returning it. The instance
          # answers that with "Certificate is not valid.", which reads like a bad
          # certificate and is really a missing trust anchor.
          #
          # The count is anchored for the same reason: an unanchored
          # 'BEGIN CERTIFICATE' matches the glued line too and reports three
          # certificates for a file that splits into two.
          if [ -n "$(tail -c 1 resources/codesigning/root.crt)" ]; then
            printf '\n' >> resources/codesigning/root.crt
          fi
          before=$(grep -c '^-----BEGIN CERTIFICATE-----$' resources/codesigning/root.crt)
          cat "${RUNNER_TEMP}/ci-pki/root.crt" >> resources/codesigning/root.crt
          after=$(grep -c '^-----BEGIN CERTIFICATE-----$' resources/codesigning/root.crt)
          echo "root.crt carried ${before} certificate(s) and now carries ${after}"
          if [ "${after}" -ne $((before + 1)) ]; then
            echo "the CI root was not appended as exactly one certificate, so the integrity check below would fail for the wrong reason"
            exit 1
          fi

          # Stage, sign, pack, in that order and for the same reason release.yml
          # keeps it: the code signature has to be inside the tarball.
          rm -rf "${RUNNER_TEMP}/store-php" "${RUNNER_TEMP}/store-backend" "${RUNNER_TEMP}/store-dist"
          # setup-test-nc moved php/ into apps/findling earlier, so the checkout
          # no longer carries it. The archive has to come from the committed
          # state anyway, so restore a pristine copy from git before staging.
          ( cd findling-src && git restore --source=HEAD -- php )
          ( cd findling-src && sh scripts/release/store-archive.sh stage-companion "${RUNNER_TEMP}/store-php" )
          ( cd findling-src && sh scripts/release/store-archive.sh stage-backend "${RUNNER_TEMP}/store-backend" )

          timeout 120 ./occ integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/ci-pki/findling.key" \
            --certificate="${RUNNER_TEMP}/ci-pki/findling.crt" \
            --path="${RUNNER_TEMP}/store-php/findling"
          test -s "${RUNNER_TEMP}/store-php/findling/appinfo/signature.json"
          echo "appinfo/signature.json was written and is not empty"

          ( cd findling-src && sh scripts/release/store-archive.sh pack \
              "${RUNNER_TEMP}/store-php" findling "${RUNNER_TEMP}/store-dist/findling.tar.gz" )
          ( cd findling-src && sh scripts/release/store-archive.sh pack \
              "${RUNNER_TEMP}/store-backend" findling_backend "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" )

      # The other way the two archives can arrive, and the only way that can say
      # anything about what a stranger downloads. Everything after this step is
      # identical in both modes, because the two modes differ in where the bytes
      # came from and in nothing else.
      #
      # The URL is the one store-submit.yml hands the store
      # (https://github.com/<repo>/releases/download/<tag>/<app>.tar.gz), spelled
      # the same way and built from GITHUB_REPOSITORY for the same reason: a
      # second way to name the same asset would be a second inventory, and the
      # store fetches exactly this one.
      #
      # A failed download ends the job. There is deliberately no fallback to the
      # local build, because a run that silently installs something other than
      # what was asked for is worse than a red run: it would report a green
      # store install for a tag whose assets are missing.
      - name: Store install 1 from the release, load both archives instead of building them
        if: env.RELEASE_TAG != ''
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          rm -rf "${RUNNER_TEMP}/store-php" "${RUNNER_TEMP}/store-backend" "${RUNNER_TEMP}/store-dist"
          mkdir -p "${RUNNER_TEMP}/store-dist"
          for app in findling findling_backend; do
            url="${base}/${app}.tar.gz"
            echo "loading ${url}"
            # -f so that an HTML error page never lands in the file: without it
            # a missing asset would fail three steps later with a message about
            # tar and not about a missing release.
            if ! curl -sfL --retry 3 --retry-delay 5 --retry-connrefused \
                 -o "${RUNNER_TEMP}/store-dist/${app}.tar.gz" "${url}"; then
              echo "::error::${url} could not be loaded, and a failed download is never a quiet fallback to the local build"
              exit 1
            fi
            if [ ! -s "${RUNNER_TEMP}/store-dist/${app}.tar.gz" ]; then
              echo "::error::${url} answered with an empty file"
              exit 1
            fi
          done

          # Which bytes were installed, in the log and in the summary. The
          # upgrade proof of plan 11-07 installs a released version and then the
          # next one, and a reader of either run has to be able to say which
          # archive that was without trusting the tag to have stayed put.
          ls -l "${RUNNER_TEMP}/store-dist"
          sha256sum "${RUNNER_TEMP}/store-dist/findling.tar.gz" \
                    "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz"
          {
            echo ""
            echo "Store install on ${{ matrix.server-version }} (${{ matrix.runner }}): the archives were"
            echo "loaded from the release \`${RELEASE_TAG}\` and not built here."
            sha256sum "${RUNNER_TEMP}/store-dist/findling.tar.gz" \
                      "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" \
              | sed 's|^|    |'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The content proof, and it runs over whichever archives arrived. That is
      # the whole reason it is a step of its own since plan 11-04: a loaded
      # archive is not correct because it was loaded, and the release mode would
      # otherwise be the one path into an installation that nothing checked.
      # An archive with a tests directory in it is a different product from the
      # one that was reviewed, and this is the place where that surfaces before
      # it is installed.
      - name: Store install 1 content proof, over whichever archives arrived
        run: |
          fail=0
          ( cd findling-src && sh scripts/release/store-archive.sh assert-contents \
              "${RUNNER_TEMP}/store-dist/findling.tar.gz" findling 1 ) || fail=1
          ( cd findling-src && sh scripts/release/store-archive.sh assert-contents \
              "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" findling_backend 0 ) || fail=1
          exit "${fail}"

      # The clean slate. Assertion 6 deliberately left a container running
      # without its caller, and an archive installation on top of that would
      # inherit a volume and a registration from the developer path, which is
      # precisely the confusion this whole second pass exists to avoid.
      #
      # --rm-data on purpose: the volume of the first pass must not survive into
      # the second, otherwise the zero config proof further down could be reading
      # an index the first pass built.
      - name: Store install 2, take the developer installation away completely
        run: |
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend --rm-data
          left=$(docker ps -a --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -n "${left}" ]; then
            echo "a container named ${left} survived the unregister, so the second pass would not start from a clean instance"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -n "${volume}" ]; then
            echo "the volume ${volume} survived the unregister with --rm-data, so an index of the first pass could be read as a result of the second"
            docker volume ls
            exit 1
          fi
          # "Uninstall 5" removed the companion with occ app:remove, which takes
          # the directory with it. Asserted rather than assumed, because an
          # archive extracted over leftovers would be a mixture of two
          # installations and the integrity check would report the leftovers as
          # extra files, which reads like an archive defect.
          if [ -e apps/findling ]; then
            echo "apps/findling still exists after occ app:remove, so the archive installation would be laid over leftovers"
            find apps/findling -maxdepth 2 -mindepth 1 -printf '  %P\n' | sort
            exit 1
          fi
          echo "no container, no volume, no companion directory"

      # The half this step is about is the one the store checks: the companion is
      # PHP that the instance itself loads, so the instance itself can say
      # whether what it loads is what was signed.
      #
      # Why occ integrity:check-app is more than "the directory is there": it
      # reads appinfo/signature.json, validates the certificate against
      # resources/codesigning/root.crt, verifies the RSA-PSS signature over the
      # hash list, and then recomputes the SHA-512 of every single file it ships
      # and compares. No network and no store are involved in any of that, which
      # is why it works on this instance at all.
      #
      # And the trap that makes a naive version of this step a false green, which
      # is exactly the class of mistake this phase exists to remove: CheckApp
      # skips an app that ships no signature.json and returns 0 while printing
      # "App signature not found, skipping app integrity check". A step that only
      # looks at the exit code would be green for an unsigned archive. So the
      # file is asserted to be there, that sentence is asserted to be absent, and
      # the output is asserted to be empty on top.
      - name: Store install 3, the companion out of the archive, verified by the instance
        run: |
          tar -xzf "${RUNNER_TEMP}/store-dist/findling.tar.gz" -C apps
          test -d apps/findling
          # Not a single path into the working tree: the whole companion arrives
          # through the archive, which is what the composite action does not do.
          if [ ! -f apps/findling/appinfo/signature.json ]; then
            echo "the extracted companion carries no appinfo/signature.json, and integrity:check-app would skip it and answer 0"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app:enable findling

          # The verdict is wanted together with the exit code, so the call goes
          # into a file and the status is caught with "|| status=$?" rather than
          # with a pipeline: a pipeline would hand this step the status of the
          # last stage and hide the one that matters.
          check() {
            "${RUNNER_TEMP}/nc-occ.sh" integrity:check-app findling > "$1" 2>&1
          }

          status=0
          check "${RUNNER_TEMP}/integrity-clean.txt" || status=$?
          cat "${RUNNER_TEMP}/integrity-clean.txt"
          if [ "${status}" -ne 0 ]; then
            echo "occ integrity:check-app findling answered ${status} on an untouched archive installation"
            exit 1
          fi
          if grep -q 'skipping app integrity check' "${RUNNER_TEMP}/integrity-clean.txt"; then
            echo "the check skipped the app instead of verifying it, so the exit code above says nothing"
            exit 1
          fi
          if [ -s "${RUNNER_TEMP}/integrity-clean.txt" ]; then
            echo "occ integrity:check-app findling printed something, and a clean verdict is an empty answer"
            exit 1
          fi
          echo "occ integrity:check-app findling: empty answer, verdict clean"

          # The falsification, and the reason the step above means anything. One
          # appended line in one shipped file, and the verdict has to turn. If it
          # does not, the empty answer above was the answer of a check that was
          # not looking.
          probe=apps/findling/lib/AppInfo/Application.php
          test -f "${probe}"
          cp "${probe}" "${RUNNER_TEMP}/integrity-probe-original"
          printf '\n// a single line appended by the tamper probe of plan 06.1-12\n' >> "${probe}"
          status=0
          check "${RUNNER_TEMP}/integrity-tampered.txt" || status=$?
          cat "${RUNNER_TEMP}/integrity-tampered.txt"
          if [ "${status}" -eq 0 ]; then
            echo "one altered file did not change the verdict, so the integrity check of this instance is not checking"
            exit 1
          fi
          if ! grep -q 'INVALID_HASH' "${RUNNER_TEMP}/integrity-tampered.txt"; then
            echo "the check failed but did not name the altered file as an invalid hash, so it failed for another reason"
            exit 1
          fi
          echo "tamper probe: one altered line, verdict INVALID_HASH, exit ${status}"

          # And back, because everything after this step runs against the
          # installation the archive produced and not against a tampered one.
          cp "${RUNNER_TEMP}/integrity-probe-original" "${probe}"
          status=0
          check "${RUNNER_TEMP}/integrity-restored.txt" || status=$?
          cat "${RUNNER_TEMP}/integrity-restored.txt"
          if [ "${status}" -ne 0 ] || [ -s "${RUNNER_TEMP}/integrity-restored.txt" ]; then
            echo "the restored file does not verify again, so the probe left the installation behind in a state nobody meant"
            exit 1
          fi
          echo "restored: empty answer, verdict clean again"
          {
            echo ""
            echo "Store install on ${{ matrix.server-version }}: the companion was installed from"
            echo "\`findling.tar.gz\` and verified by \`occ integrity:check-app\`, and a single altered"
            echo "line turned that verdict into INVALID_HASH."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Annahme A6 of the research, answered by doing it rather than by reasoning
      # about it: can the published image be pulled without any credentials, the
      # way a stranger would pull it? The step sets DOCKER_CONFIG to an empty
      # directory of its own, so a credential that some earlier step might have
      # left in the default config cannot be used by accident. That is the whole
      # point of threat T-06.1-50: a stranger install test that measures our own
      # registry access measures nothing.
      #
      # The second half of this step is the precondition nobody had checked. The
      # archive names registry, image and image-tag, which today is
      # ghcr.io/street1983nk/findling_backend at the released version, and AppAPI
      # pulls exactly that reference. docker.yml publishes that version tag only
      # on a v tag push and otherwise only :dev and the commit SHA, so on an
      # ordinary branch the reference the archive names does not exist yet. That
      # is not a reason to skip quietly:
      #
      #   on main and on a release tag it is a hard failure, because there the
      #   missing tag is the store install failing at a user's instance;
      #   anywhere else it is a named finding, printed and written into the job
      #   summary, and the run continues against the moving tag docker.yml
      #   publishes from main, with the one changed line shown as a diff.
      - name: Store install 4, pull the image without any credentials
        run: |
          mkdir -p "${RUNNER_TEMP}/store-extract"
          tar -xzf "${RUNNER_TEMP}/store-dist/findling_backend.tar.gz" -C "${RUNNER_TEMP}/store-extract"
          archive_info="${RUNNER_TEMP}/store-extract/findling_backend/appinfo/info.xml"
          test -f "${archive_info}"

          registry=$(sed -n 's:.*<registry>\(.*\)</registry>.*:\1:p' "${archive_info}" | head -1)
          image=$(sed -n 's:.*<image>\(.*\)</image>.*:\1:p' "${archive_info}" | head -1)
          tag=$(sed -n 's:.*<image-tag>\(.*\)</image-tag>.*:\1:p' "${archive_info}" | head -1)
          if [ -z "${registry}" ] || [ -z "${image}" ] || [ -z "${tag}" ]; then
            echo "the archive info.xml does not name registry, image and image-tag, so nothing here knows what to pull"
            exit 1
          fi
          echo "the archive asks for ${registry}/${image}:${tag}"

          # An empty docker configuration, created here and used by every docker
          # command of this step and of the deploy below. Not a flag on one call:
          # the deploy daemon pulls through the docker socket of this runner, so
          # the credential store the daemon reads has to be the empty one too.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-anonymous"
          mkdir -p "${DOCKER_CONFIG}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
          echo "docker configuration directory contents:"
          ls -la "${DOCKER_CONFIG}"

          released="${registry}/${image}:${tag}"
          store_info="${archive_info}"
          probe=0
          docker buildx imagetools inspect "${released}" > "${RUNNER_TEMP}/manifest-released.txt" 2>&1 || probe=$?
          cat "${RUNNER_TEMP}/manifest-released.txt"
          if [ "${probe}" -eq 0 ]; then
            reference="${released}"
            echo "the tag the archive names exists, so the archive info.xml is used byte for byte"
          else
            echo "the tag the archive names does not exist in the registry"
            case "${GITHUB_REF}" in
              refs/tags/v*)
                echo "::error::${released} does not exist, and on a release tag that is a store installation that would fail at a user's instance"
                exit 1
                ;;
            esac
            # On main the tag cannot exist before the release tag is pushed
            # (docker.yml publishes it on refs/tags/v*), so main takes the
            # loud dev fallback below instead of staying red for months.
            # The release tag lane keeps the hard guarantee.
            reference="${registry}/${image}:dev"
            docker buildx imagetools inspect "${reference}" > "${RUNNER_TEMP}/manifest-dev.txt" 2>&1
            cat "${RUNNER_TEMP}/manifest-dev.txt"
            store_info="${RUNNER_TEMP}/info-store.xml"
            sed -e "s|<image-tag>[^<]*</image-tag>|<image-tag>dev</image-tag>|" \
              "${archive_info}" > "${store_info}"
            # Exactly one line differs, and it is shown rather than described.
            # Everything else, the routes block above all, comes out of the
            # archive unchanged.
            diff "${archive_info}" "${store_info}" || true
            changed=$(diff "${archive_info}" "${store_info}" | grep -c '^[<>]' || true)
            if [ "${changed}" -ne 2 ]; then
              echo "the substitution changed ${changed} lines instead of the one image-tag line"
              exit 1
            fi
            {
              echo ""
              echo "**Finding on ${{ matrix.server-version }}:** the archive names \`${released}\`,"
              echo "which does not exist in the registry on this ref. The store install path ran"
              echo "against \`${reference}\` instead, with only the \`image-tag\` line replaced."
              echo "On a release tag the same situation is a hard failure; before the"
              echo "release the tag cannot exist, so this finding is expected on \`main\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          # The pull itself, and it is the answer to A6. No login anywhere in
          # this workflow, an empty credential store, and the platform spelled
          # out so that the index resolves to the half this runner can start.
          #
          # The platform is read off the runner since plan 11-04 and was the
          # literal linux/amd64 before. On the arm64 leg that literal would have
          # pulled the amd64 half of the index and the container would have run
          # under emulation or not at all, and an emulated install is exactly
          # the statement success criterion 1 does not want. dpkg
          # --print-architecture answers amd64 and arm64, which are the two
          # names the index uses, so no translation table is needed. Checked on
          # 2026-09-10: the index of ghcr.io/street1983nk/findling_backend
          # carries linux/amd64 and linux/arm64 for :dev and for :1.0.3.
          platform="linux/$(dpkg --print-architecture)"
          echo "this runner is ${platform}, and that is the half of the index that gets pulled"
          docker pull --platform "${platform}" "${reference}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${reference}")
          echo "pulled anonymously: ${digest}"

          # And away again, so that the deploy daemon has to fetch it itself.
          # Leaving it here would let the installation below find a local image
          # and never touch the registry, which is the difference between
          # proving the path and assuming it.
          docker rmi "${reference}" > /dev/null
          echo "the local copy is gone, the deploy daemon has to pull it again"

          {
            echo "STORE_IMAGE_REFERENCE=${reference}"
            echo "STORE_IMAGE_PATH=${registry}/${image}"
            echo "STORE_INFO_XML=${store_info}"
            echo "ARCHIVE_INFO_XML=${archive_info}"
          } >> "${GITHUB_ENV}"

      # What an archive without its routes block really produces, and it runs
      # before the real registration on purpose: the step after this one
      # registers the same app with the block in place and counts the same table
      # again, so the two together are one differential measurement.
      #
      # This step asserted something else until 2026-09-06, and the correction is
      # written down rather than quietly swapped, because the same claim was
      # copied into two other comments: "an archive whose info.xml lost the block
      # installs an app with no search route and no error message, so its search
      # finds nothing". Run 34059434556 measured the opposite on all three server
      # versions: HTTP 200 with the canary, ten seconds after the registration.
      # The reason is that there are two paths into the container and the block
      # governs only one of them.
      #
      #   The companion never uses the route list. ExAppService::proxyRequest
      #   calls OCA\AppAPI\PublicFunctions::exAppRequest, AppAPI signs the call
      #   with EX-APP-ID, EX-APP-VERSION, AUTHORIZATION-APP-API, harp-shared-key,
      #   ex-app-host and ex-app-port (AppAPICommonService::
      #   buildAppAPIAuthHeaders) and sends it to
      #   {nextcloud_url}/exapps/findling_backend/search
      #   (DockerActions::resolveExAppUrl). HaRP sees all six headers and takes
      #   the branch "route_allowed = True  # We skip routes checking for AppAPI
      #   signed requests" (haproxy_agent.py of the image pinned in HARP_IMAGE,
      #   HARP_VERSION 0.4.5). Neither AppAPIService::requestToExApp nor HaRP
      #   looks at the route table on that path.
      #
      #   The route list governs the other path: a request that arrives at
      #   /exapps/findling_backend/... without those headers, from a browser
      #   session, an app password or basic auth. There HaRP matches
      #   re.match(route.url, target_path) and answers 404 when nothing matches.
      #
      # So the block is not what makes the search work, and the archive rule
      # needs the reason it actually has: AppAPI reads the routes out of the
      # info.xml the registration is handed, and out of nothing else, and writes
      # them into oc_ex_apps_routes (ExAppService::getAppInfo does
      # file_get_contents on --info-xml and only asks the store when that option
      # is absent; registerExApp then calls registerExAppRoutes). That table is
      # what this step measures, because it is the only place where the
      # difference between the two archives is observable at all.
      #
      # And why this step does not measure the second path over HTTP, which would
      # have been the obvious repair: the five route urls of this container are
      # bare paths ("search", "status"), HaRP matches them against a target path
      # that starts with a slash, and re.match("search", "/search") is None. That
      # path therefore answers 404 with the block and 404 without it, and a probe
      # built on it would measure nothing. The Nextcloud side proxy has a legacy
      # bare path fallback for exactly this case (ExAppProxyController), HaRP has
      # none. That is a finding of its own, it belongs in the backlog and not in
      # this step: the route urls want the canonical "^/search$" form.
      #
      # Both outcomes of the registration remain a finding rather than an error:
      # an archive whose info.xml lost the block may fail to install, or it may
      # install with an empty route table. The second is the one measured here.
      - name: Store install 5, an archive without its routes block registers without them
        run: |
          sed '/<routes>/,/<\/routes>/d' "${STORE_INFO_XML}" > "${RUNNER_TEMP}/info-noroutes.xml"
          routes=$(grep -c '<route>' "${RUNNER_TEMP}/info-noroutes.xml" || true)
          if [ "${routes}" -ne 0 ]; then
            echo "the stripped copy still carries ${routes} route elements, so this probe would prove nothing"
            exit 1
          fi
          echo "the stripped copy carries no route element"

          status=0
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-noroutes.xml" --wait-finish || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "an archive without its routes block does not even install (exit ${status}), which is the same finding one layer earlier"
          else
            # Measurement 1, the load bearing one. The table AppAPI fills from
            # the file it was handed has to be empty, because the file carries no
            # route. A row here would mean the routes came from somewhere else
            # than the registration file, and the byte for byte copy in
            # scripts/release/store-archive.sh would be guarding the wrong thing.
            rows=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
              "SELECT COUNT(*) FROM oc_ex_apps_routes WHERE appid = 'findling_backend';")
            echo "oc_ex_apps_routes carries ${rows} row(s) for findling_backend"
            if [ "${rows}" != "0" ]; then
              echo "the registration produced ${rows} route rows although the info.xml it was handed carries none, so AppAPI takes the routes from somewhere else than the file"
              sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
                "SELECT url, verb, access_level FROM oc_ex_apps_routes WHERE appid = 'findling_backend' ORDER BY url;"
              exit 1
            fi
            echo "no route row: the registration took the routes from the file and the file had none"

            # Measurement 2, the one that used to be the assertion and is now the
            # observation. The search has to keep working, because the companion
            # reaches the container over the signed AppAPI path that HaRP exempts
            # from route checking. If this ever goes empty or unreadable, either
            # AppAPI or HaRP changed that behaviour, and the paragraph above this
            # step plus the comment head of backend/appinfo/info.xml have to be
            # measured again before anything else is believed.
            code=$(curl -s -o noroutes.json -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
            cat noroutes.json
            echo "the search answered HTTP ${code}"
            # Fail closed, and the order of the branches is what makes it fail
            # closed: only a valid OCS envelope carrying exactly one canary entry
            # passes. An unparsable body makes jq exit non zero and falls into the
            # last branch, so a broken answer cannot be read as a good one.
            if [ "${code}" != "200" ]; then
              echo "the search answers HTTP ${code} although the signed path does not depend on the route table, so something other than the missing block is broken"
              exit 1
            elif jq -e '[.ocs.data.entries[] | select(.title == "findling-canary")] | length == 1' noroutes.json > /dev/null; then
              echo "installed with an empty route table, and the search still answers with the canary: the routes block does not gate the signed path"
            else
              echo "the search answered 200 without exactly one canary entry, or with something jq cannot read; the signed path was expected to answer independently of the route table, so this is a change in AppAPI or HaRP and not a finding about the archive"
              exit 1
            fi
          fi

          # Away completely, including the volume, so the real installation below
          # starts where a stranger starts.
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend --rm-data || true
          docker rm -f "$(docker ps -aq --filter 'name=findling_backend')" 2> /dev/null || true
          leftover=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -n "${leftover}" ]; then
            echo "the probe left the volume ${leftover} behind, and the installation below would inherit it"
            docker volume ls
            exit 1
          fi

      # The registration a store install performs, with the file a store install
      # reads. --wait-finish makes the handshake synchronous, so the assertions
      # that follow measure a finished installation and not a race.
      #
      # The info.xml comes out of the unpacked archive and from nowhere else. Not
      # a preference: pre-info.xslt drops the routes block, the store database
      # never sees it, and AppAPI reads it back out of this file at installation
      # time. A path into findling-src here would be the warning sign of pitfall
      # 8 and would turn this into a manual-install test wearing a store install
      # costume.
      - name: Store install 6, the ExApp out of the archive, image out of the registry
        run: |
          echo "registering with ${STORE_INFO_XML}"
          grep -E '<registry>|<image>|<image-tag>' "${STORE_INFO_XML}"
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${STORE_INFO_XML}" --wait-finish

          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container matches findling_backend, so the deploy daemon created nothing out of the archive"
            docker ps -a
            exit 1
          fi
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'

          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -z "${volume}" ]; then
            echo "no volume matches findling_backend, so the archive installation has no data volume"
            docker volume ls
            exit 1
          fi
          echo "exapp volume: ${volume}"

          # The image the container really runs, read off the container rather
          # than off the registration, and compared against the reference the
          # archive named. This is where an installation that quietly used some
          # other image would show.
          running_image=$(docker inspect --format '{{.Config.Image}}' "${container}")
          echo "the container runs image ${running_image}"
          # The repository path and not the whole reference, because AppAPI may
          # address the image by digest once it has resolved the tag. What has to
          # hold is that the image comes from the registry the archive names and
          # never from localhost:5000, which is the address the developer path
          # uses one pass earlier.
          case "${running_image}" in
            *"${STORE_IMAGE_PATH}"*) ;;
            *)
              echo "the container runs '${running_image}' while the archive named '${STORE_IMAGE_PATH}'"
              exit 1
              ;;
          esac
          case "${running_image}" in
            *"${LOCAL_REGISTRY}"*)
              echo "the container runs the image of the local registry, so this pass measured the developer path again"
              exit 1
              ;;
          esac

          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:list | tee store-app-list.txt
          if ! grep -q 'findling_backend' store-app-list.txt; then
            echo "app_api:app:list does not know findling_backend, so the registration out of the archive did not survive"
            exit 1
          fi

          # The other half of the measurement of Store install 5, and the reason
          # that step means anything: the same table, the same app, the same
          # instance, one registration later with the block in place. The five
          # routes of backend/appinfo/info.xml have to be there with their verbs
          # and their access levels (PUBLIC 0, USER 1, ADMIN 2, see
          # ExAppService::mapExAppRouteAccessLevelNameToNumber), because that is
          # what "AppAPI reads the routes out of the file the registration is
          # handed" means when it is measured instead of asserted. Compared as
          # one string so that a missing row, a changed verb and a widened access
          # level all show up as the same failure. The order comes from sort and
          # not from the query, because group_concat has no defined order and a
          # comparison that depends on one would be flaky rather than strict.
          #
          # A sixth route turns this step red, and that is the point: widening
          # the reachable surface of the container is a decision, and it has to
          # be made here as well as in backend/appinfo/info.xml.
          routes_now=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
            "SELECT url || ':' || verb || ':' || access_level FROM oc_ex_apps_routes WHERE appid = 'findling_backend';" \
            | sort | tr '\n' ' ' | sed -e 's/ *$//')
          echo "oc_ex_apps_routes after the archive registration: ${routes_now}"

          # Two comparisons and not one, and the reason is a red run of
          # 2026-09-07 (run 34126702669, all three legs). Plan 06.1-19 put the
          # five urls into their anchored form (DI-06.1-13), AppAPI wrote exactly
          # that into the table, and this step failed anyway because the expected
          # string here still spelled the bare names. The measurement was right
          # and the expectation was stale, which is the one failure mode a single
          # hard coded literal cannot tell apart from a real one.
          #
          # So the expectation is now read out of the archive that was just
          # installed, and the literal stays as a second, independent question:
          #
          #   1. does the table match what the archive declares? That is what
          #      this step was built for: AppAPI reads the routes out of the file
          #      the registration is handed, and a dropped or rewritten row shows
          #      here.
          #   2. does the archive declare exactly the five reviewed routes? That
          #      is the ratchet. A sixth route or a widened access level is a
          #      decision and has to be made here as well as in
          #      backend/appinfo/info.xml. A derived expectation on its own would
          #      accept a widened surface without a word.
          #
          # The access level crosses from a name in the XML to a number in the
          # table, PUBLIC 0, USER 1, ADMIN 2, see
          # ExAppService::mapExAppRouteAccessLevelNameToNumber.
          routes_declared=$(awk '
            /<url>/          { s = $0; sub(/.*<url>/, "", s); sub(/<\/url>.*/, "", s); url = s }
            /<verb>/         { s = $0; sub(/.*<verb>/, "", s); sub(/<\/verb>.*/, "", s); verb = s }
            /<access_level>/ { s = $0; sub(/.*<access_level>/, "", s); sub(/<\/access_level>.*/, "", s); lvl = s }
            /<\/route>/      {
              n = 2
              if (lvl == "PUBLIC") { n = 0 }
              if (lvl == "USER")   { n = 1 }
              print url ":" verb ":" n
              url = ""; verb = ""; lvl = ""
            }
          ' "${ARCHIVE_INFO_XML}" | sort | tr '\n' ' ' | sed -e 's/ *$//')
          echo "the archive declares: ${routes_declared}"

          routes_want='^/diagnose$:GET:2 ^/rates$:GET:2 ^/search$:POST:1 ^/snippets$:POST:1 ^/status$:GET:2'
          if [ "${routes_declared}" != "${routes_want}" ]; then
            echo "the archive declares '${routes_declared}' instead of the five reviewed routes '${routes_want}'"
            echo "widening or renaming the reachable surface of the container is a decision, and it has to be made here too"
            exit 1
          fi
          if [ "${routes_now}" != "${routes_declared}" ]; then
            echo "the archive registration produced '${routes_now}' while the archive declares '${routes_declared}', so the routes of the installed app are not the ones the archive declares"
            exit 1
          fi
          echo "the five routes of the archive arrived with their verbs and access levels, and Store install 5 measured zero rows for the same file without the block"

          # The same canary call the developer path makes, and the same three
          # assertions: exactly one entry, the title, and a subline that carries
          # the host name and the timestamp of the process that produced it plus
          # the user id that only the signed AppAPI header could have carried
          # into the backend. A hard coded hit in PHP cannot pass this. What it
          # does not prove, and what Store install 5 measured instead, is
          # anything about the route table: the signed path does not consult it.
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee store-out.json
          if ! jq -e '.ocs.data.entries | length == 1' store-out.json > /dev/null; then
            echo "the search did not return exactly one hit, so nothing answered out of the container the archive installed"
            exit 1
          fi
          jq -e '.ocs.data.entries[0].title == "findling-canary"' store-out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' store-out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' store-out.json

          {
            echo "STORE_CONTAINER=${container}"
            echo "STORE_VOLUME=${volume}"
          } >> "${GITHUB_ENV}"
          {
            echo ""
            echo "- store install container: \`${container}\`"
            echo "- store install volume: \`${volume}\`"
            echo "- image: \`${running_image}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The promise of this whole project, and the one thing above did not test:
      # after the installation nobody configures anything, and the search finds
      # the content of a document anyway.
      #
      # Everything in this step is deliberately not an occ command. The file
      # arrives over WebDAV as the ordinary user, which is what a user does and
      # what puts it into the file cache without occ files:scan. The engine is
      # driven with "php -f cron.php", which is the identical command a system
      # cron runs and is therefore not a shortcut: it is the mechanism, at a
      # cadence this job controls because a runner has no cron daemon. What is
      # NOT here, and must never be, is occ findling:index, occ
      # background-job:worker or any occ config:app:set. Those are the
      # development shortcuts of integration.yml, and a zero config proof that
      # uses one of them proves the opposite of its name (T-06.1-51).
      #
      # php/lib/Repair/AppInstallStep.php is what makes this possible at all: it
      # is registered under repair-steps/install and puts SchedulerJob into the
      # job list when the app is enabled, once, guarded by a mark in the app
      # config. So the chain that has to run by itself is enable, SchedulerJob,
      # StorageCrawlJob, the container polling the queue, and a hit.
      #
      # The list of occ calls between the installation and the hit is printed and
      # has to be empty. It is produced by the wrapper every step of this pass
      # calls, not by a human writing down what they think they ran.
      - name: Store install 7, a search finds content without anybody configuring anything
        run: |
          marker=$(wc -l < "${OCC_LOG}")
          echo "every occ call of the store install path up to here:"
          cat -n "${OCC_LOG}"
          echo "the installation is complete after ${marker} occ calls, and nothing below may add one"

          # An invented word, and invented on purpose. The analyzer splits German
          # compounds against a dictionary, so a real compound could be indexed
          # as its parts and a miss would say nothing about the index. This one
          # is in no dictionary, in no skeleton file and in no other test of this
          # repository, so a hit for it can only come out of the file below.
          printf 'The findling zero config proof word is florpel.\n' > "${RUNNER_TEMP}/zero-config.txt"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -T "${RUNNER_TEMP}/zero-config.txt" \
            -u "testuser:${TESTUSER_PASS}" \
            'http://localhost:8080/remote.php/dav/files/testuser/findling-zero-config.txt')
          case "${code}" in
            201|204) echo "the file was uploaded over WebDAV, HTTP ${code}" ;;
            *)
              echo "the upload answered HTTP ${code}, so there is no document to find"
              exit 1
              ;;
          esac

          # The loop leaves the moment the hit is there and never sleeps a fixed
          # pause. That is the 52 second lesson of plan 06-11 turned into code: a
          # probe that waits a fixed time measures its own guess, and that guess
          # was wrong by 52 seconds in the direction that declares a healthy run
          # dead.
          deadline=$(( $(date +%s) + ZERO_CONFIG_BUDGET_SECONDS ))
          found=""
          rounds=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            rounds=$(( rounds + 1 ))
            timeout 300 php -f cron.php > "${RUNNER_TEMP}/cron-${rounds}.log" 2>&1 || true
            code=$(curl -s -o zero-config.json -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=florpel')
            if [ "${code}" = "200" ] && jq -e '.ocs.data.entries | length >= 1' zero-config.json > /dev/null 2>&1; then
              found="yes"
              break
            fi
            echo "round ${rounds}: HTTP ${code}, no hit yet, $(( deadline - $(date +%s) ))s of the budget left"
            sleep 10
          done

          if [ -z "${found}" ]; then
            echo "::error::no content hit within ZERO_CONFIG_BUDGET_SECONDS=${ZERO_CONFIG_BUDGET_SECONDS} after ${rounds} cron rounds"
            echo "This is a finding and not a reason to raise the budget (T-06.1-52)."
            cat zero-config.json || true
            tail -n 40 "${RUNNER_TEMP}/cron-${rounds}.log" || true
            docker logs "${STORE_CONTAINER}" 2>&1 | tail -n 60 || true
            exit 1
          fi
          cat zero-config.json
          jq -e '.ocs.data.entries[0].title == "findling-zero-config.txt"' zero-config.json
          echo "content hit after ${rounds} cron rounds, with nothing configured"

          # The claim of this step, checked against the record rather than
          # asserted. Two commands ran in the window above and they are named
          # here: "php -f cron.php" and the OCS search. Neither is an occ call,
          # so the tail of the log has to be empty.
          tail -n +$(( marker + 1 )) "${OCC_LOG}" > "${RUNNER_TEMP}/occ-since-install.txt"
          echo "occ calls between the installation and the hit:"
          cat "${RUNNER_TEMP}/occ-since-install.txt"
          if [ -s "${RUNNER_TEMP}/occ-since-install.txt" ]; then
            echo "an occ call ran between the installation and the hit, so this was not a zero config proof"
            exit 1
          fi
          echo "none, which is what zero config means"
          {
            echo ""
            echo "Zero config on ${{ matrix.server-version }}: content hit after ${rounds} cron rounds,"
            echo "no occ call between the installation and the hit."
          } >> "${GITHUB_STEP_SUMMARY}"

      # =====================================================================
      # The six uninstall promises a second time, against the installation the
      # archive produced.
      #
      # Why they are here in full and not shared with the six steps above. The
      # duplication is real and is the price of two things this phase wants at
      # once: the six steps above stay untouched, because they are the reference
      # and a refactor of a green proof is a refactor of the evidence, and each
      # assertion keeps its own step with its own message, which is what makes a
      # failure readable at all. Sharing them would collapse twelve named steps
      # into two loops and would trade the readability of every future failure
      # for the tidiness of one file. The cost is named rather than hidden: a
      # seventh promise has to be added twice, and a change to any of the six has
      # to be made twice.
      #
      # Why they are not academic. An installation out of the archive puts
      # different files into apps/findling than a move out of the working tree
      # does, it carries a signature.json the other one has no idea about, and
      # its container was created from a registry image rather than from a local
      # one. A cleanup that only ever saw the developer case leaves remains in
      # the other, and remains after an uninstall are what decision D-16 is
      # about.
      # =====================================================================

      - name: Store uninstall 1, an unregister without the flag keeps the volume
        run: |
          if [ -z "${STORE_VOLUME}" ] || [ -z "${STORE_CONTAINER}" ]; then
            echo "the store install step handed over no container or volume name, so this assertion would pass without looking at anything"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend
          still_there=$(docker ps -a --filter "name=${STORE_CONTAINER}" --format '{{.Names}}')
          if [ -n "${still_there}" ]; then
            echo "the container ${STORE_CONTAINER} survived the unregister, so the deregistration removed nothing"
            docker ps -a
            exit 1
          fi
          kept=$(docker volume ls --filter "name=${STORE_VOLUME}" --format '{{.Name}}')
          if [ "${kept}" != "${STORE_VOLUME}" ]; then
            echo "the volume ${STORE_VOLUME} is gone after an unregister without --rm-data, and the documented default is that it stays; found '${kept}'"
            docker volume ls
            exit 1
          fi
          echo "container gone, volume ${kept} kept"

      - name: Store uninstall 2, a second registration picks up the volume it left
        run: |
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${STORE_INFO_XML}" --wait-finish
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the second registration out of the archive created no running container"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ "${volume}" != "${STORE_VOLUME}" ]; then
            echo "the second registration did not take the volume of the first one, expected ${STORE_VOLUME} and found '${volume}'"
            docker volume ls
            exit 1
          fi
          echo "registered again as ${container} on the kept volume ${volume}"

      - name: Store uninstall 3, an unregister with --rm-data removes the volume
        run: |
          if [ -z "${STORE_VOLUME}" ]; then
            echo "no volume name from the store install step, so an empty filter result would be a false green (T-05-29)"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend --rm-data
          left=$(docker volume ls --filter "name=${STORE_VOLUME}" --format '{{.Name}}')
          if [ -n "${left}" ]; then
            echo "the volume ${STORE_VOLUME} survived an unregister with --rm-data, found '${left}'"
            docker volume ls
            exit 1
          fi
          container=$(docker ps -a --filter "name=${STORE_CONTAINER}" --format '{{.Names}}')
          if [ -n "${container}" ]; then
            echo "the container ${STORE_CONTAINER} survived the unregister with --rm-data"
            docker ps -a
            exit 1
          fi
          echo "container and volume ${STORE_VOLUME} both gone"

      # The order is the same as above and for the same reason: the intent mark
      # is a one shot flag, so the only way to show that a disable clears nothing
      # is to disable while no mark is set (T-05-31).
      - name: Store uninstall 4, a disable without intent keeps tables and settings
        run: |
          expected='oc_findling_file_state oc_findling_queue oc_findling_scan_stats'
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "before the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the three tables of the app are not all there before the disable, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          "${RUNNER_TEMP}/nc-occ.sh" app:disable findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the disable: tables [${tables}], settings ${settings}"
          if [ "${tables}" != "${expected}" ]; then
            echo "the disable removed tables although no intent was armed, expected [${expected}] and found [${tables}]"
            exit 1
          fi
          if [ "${settings}" -lt 1 ]; then
            echo "the disable emptied the settings of the app although no intent was armed, ${settings} values left"
            exit 1
          fi

      # The registration in the middle belongs to assertion 6: that one needs a
      # live container while the companion goes away, so the deployment handshake
      # has to happen while the installation is still complete.
      #
      # The one thing this assertion adds over its twin above: the companion it
      # removes is the one the archive delivered, so this is where a leftover of
      # the archive installation would show. apps/findling is looked at
      # afterwards for exactly that reason.
      - name: Store uninstall 5, a remove with intent clears tables and settings
        run: |
          "${RUNNER_TEMP}/nc-occ.sh" app:enable findling
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${STORE_INFO_XML}" --wait-finish
          "${RUNNER_TEMP}/nc-occ.sh" findling:purge --arm --no-interaction
          "${RUNNER_TEMP}/nc-occ.sh" app:remove findling
          tables=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'oc_findling_%' ORDER BY name;" | tr '\n' ' ' | sed -e 's/ *$//')
          settings=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" "SELECT COUNT(*) FROM oc_appconfig WHERE appid = 'findling';")
          echo "after the remove with intent: tables [${tables}], settings ${settings}"
          if [ -n "${tables}" ]; then
            echo "the remove with intent left tables behind: [${tables}]"
            exit 1
          fi
          if [ "${settings}" -ne 0 ]; then
            echo "the remove with intent left ${settings} settings behind"
            exit 1
          fi
          if [ -e apps/findling ]; then
            echo "the remove left the extracted archive behind in apps/findling, which a developer installation would not have shown"
            find apps/findling -maxdepth 2 -mindepth 1 -printf '  %P\n' | sort
            exit 1
          fi
          echo "no tables, no settings, no directory"

      - name: Store uninstall 6, the container without a companion retreats
        run: |
          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "no running container after the companion was removed, so the container did not survive the half removal"
            docker ps -a
            exit 1
          fi
          noisy_lines() {
            docker logs "${container}" 2>&1 | grep -cE '^(WARNING|ERROR|CRITICAL):' || true
          }
          before=$(noisy_lines)
          entered=""
          for _ in $(seq 1 24); do
            if docker logs "${container}" 2>&1 | grep -q 'the queue has not answered for'; then
              entered="yes"
              break
            fi
            sleep 10
          done
          if [ -z "${entered}" ]; then
            echo "the container never announced the retreat, so it is either still polling pass by pass or it is not polling at all"
            docker logs "${container}" 2>&1 | tail -n 40
            exit 1
          fi
          alive=$(docker ps --filter "name=${container}" --format '{{.Status}}')
          if [ -z "${alive}" ]; then
            echo "the container stopped during the retreat instead of waiting it out"
            docker ps -a
            exit 1
          fi
          # Counted after the announcement, for the reason written out at the
          # same comparison in "Uninstall 6" above: the lines before it are the
          # documented ladder plus one off reports about work that was in flight,
          # and their number is decided by the state of the container rather than
          # by its behaviour. The claim of this step is the silence that follows
          # the announcement, and that is what is measured here.
          announced=$(noisy_lines)
          sleep 60
          after=$(noisy_lines)
          grew=$((after - announced))
          if [ "${grew}" -gt 1 ]; then
            echo "the container wrote ${grew} new warning or error lines in the 60 s after it announced the retreat, which is an error loop and not a retreat"
            docker logs "${container}" 2>&1 | grep -E '^(WARNING|ERROR|CRITICAL):' | tail -n 20
            exit 1
          fi
          echo "container ${container} is ${alive}, retreat announced after $((announced - before)) lines, ${grew} lines in the 60 s that followed"

      # =====================================================================
      # The upgrade proof of plan 11-07, and success criterion 2 of phase 11:
      # an installation that really came out of the release assets of
      # UPGRADE_FROM_TAG is brought to the state of this commit, and the index
      # it built survives that untouched. Since plan 16-09 that tag is v1.1.0
      # and the jump is 1.1.0 to 1.2.0; the value and the reason for it stand at
      # the top of this file and nowhere else.
      #
      # Why the block stands at the end of the job and not between the store
      # install path and the six promises above it: those promises need the
      # store installation intact, so an upgrade in the middle of them would
      # take their subject away. Here the store pass has made every statement
      # it has, and the instance is free.
      #
      # Why it is a recombination and not a new mechanism. "Store uninstall 1"
      # shows that an app_api:app:unregister without the flag keeps the volume,
      # "Store uninstall 2" that a second registration picks the same volume up
      # again, and "Store install 1 from the release" that both archives can be
      # loaded from a published tag. The upgrade is those three in one order,
      # with a measurement before and a measurement after.
      #
      # Why exactly one leg. An upgrade path is a statement about the app and
      # not about the server version, and six legs would buy six instances of a
      # statement that one leg carries. stable34 on ubuntu-24.04 is that leg:
      # the newest released Nextcloud on 2026-09-10 (v34.0.4), on the
      # architecture the release is measured on. Every step below names both
      # matrix values in its own if, because this file has no block condition
      # and a step that lost its condition would run half an upgrade on the
      # arm64 leg.
      #
      # And the third condition, RELEASE_TAG being empty. With that input set,
      # the store pass above installed the archives of that very tag, so the new
      # half here would be the same bytes as the old one: the proof would
      # compare the released version with itself and go green without having
      # measured anything. That is the one shape this block must never have, so in that
      # mode it does not run at all rather than run and mean nothing.
      #
      # What this block is emphatically not about is where the bytes of the new
      # half come from. That is the subject of the store install path above,
      # which asserts the registry, the anonymous pull and the integrity check.
      # Here the subject is the index on the volume, and nothing else.
      # =====================================================================

      - name: Store upgrade 0, the store pass is taken away, and never with the flag
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          # "Store uninstall 5" registered the container once more and "Store
          # uninstall 6" watched it retreat without its companion, so a container
          # and a volume of the store pass are standing here. Both have to go:
          # the proof below builds an index of its own, and a volume of the store
          # pass would be a second possible source for the same numbers.
          #
          # The data removing flag of "Store uninstall 3" is deliberately absent,
          # in this step and in every step of this block, and it is not even
          # spelled out here: a grep for it over the upgrade steps has to come
          # back empty (T-11-26). A lost volume in an upgrade path would be the
          # damage of 2026-09-07 in small, and the surest way to keep the flag
          # out of an upgrade step is to leave no occurrence of it here to copy
          # from. The volume of the store pass is therefore removed by name with
          # docker, which is a teardown before the proof rather than a step of
          # the upgrade path.
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend || true
          leftover=$(docker ps -aq --filter 'name=findling_backend')
          if [ -n "${leftover}" ]; then
            echo "a container of the store pass survived the unregister and is removed here"
            docker rm -f ${leftover} > /dev/null
          fi
          for volume in $(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}'); do
            echo "removing the volume ${volume} of the store pass"
            docker volume rm "${volume}" > /dev/null
          done

          left=$(docker ps -a --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -n "${left}" ]; then
            echo "the container ${left} is still here, so the upgrade would start on top of the store pass"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -n "${volume}" ]; then
            echo "the volume ${volume} is still here, and the index below could then be one the store pass built"
            docker volume ls
            exit 1
          fi
          # "Store uninstall 5" removed the companion with occ app:remove, which
          # takes the directory with it. Asserted rather than assumed, because
          # the released archive would otherwise be extracted over the files of
          # this commit and the installation would be a mixture of two versions.
          if [ -e apps/findling ]; then
            echo "apps/findling still exists, so the ${UPGRADE_FROM_TAG} archive would be laid over the files of this commit"
            find apps/findling -maxdepth 2 -mindepth 1 -printf '  %P\n' | sort
            exit 1
          fi
          echo "no container, no volume, no companion directory"

      - name: Store upgrade 1, both halves out of the release assets of the previous version
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          # The same URL shape store-submit.yml hands the store, built from
          # GITHUB_REPOSITORY for the same reason as in "Store install 1 from the
          # release": a second way of naming the same asset would be a second
          # inventory, and the store fetches exactly this one. The tag comes out
          # of UPGRADE_FROM_TAG at the top of this file, where the reason for its
          # value stands.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${UPGRADE_FROM_TAG}"
          from="${RUNNER_TEMP}/upgrade-from"
          rm -rf "${from}"
          mkdir -p "${from}/dist" "${from}/extract"
          for app in findling findling_backend; do
            url="${base}/${app}.tar.gz"
            echo "loading ${url}"
            # -f so that an HTML error page never lands in the file, and no
            # fallback of any kind: an upgrade proof that quietly starts from
            # something other than the released bytes would be worse than a red
            # run.
            if ! curl -sfL --retry 3 --retry-delay 5 --retry-connrefused \
                 -o "${from}/dist/${app}.tar.gz" "${url}"; then
              echo "::error::${url} could not be loaded, so there is no ${UPGRADE_FROM_TAG} installation to upgrade from"
              exit 1
            fi
            if [ ! -s "${from}/dist/${app}.tar.gz" ]; then
              echo "::error::${url} answered with an empty file"
              exit 1
            fi
          done
          # Which bytes the upgrade starts from, on record, so that a reader of
          # this run can say what was installed without trusting the tag to have
          # stayed put.
          ls -l "${from}/dist"
          sha256sum "${from}/dist/findling.tar.gz" "${from}/dist/findling_backend.tar.gz"

          # The companion half. The signature in this archive is the real one
          # release.yml made with the app key of the Nextcloud Code Signing Root
          # Authority, which the server checkout trusts out of the box, so this
          # is the file list a user's instance verifies as well.
          tar -xzf "${from}/dist/findling.tar.gz" -C apps
          test -f apps/findling/appinfo/signature.json
          old_companion=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' apps/findling/appinfo/info.xml | head -1)
          echo "the companion of the release carries version ${old_companion}"
          # The navigation entry, and the assertion reads the other way round
          # since 2026-09-21. Overhauled wording, kept on record: until that day
          # this step demanded the ABSENCE of the <navigations> block, because
          # php/appinfo/info.xml grew it in plan 09-06 after v1.0.3 was
          # published, and a released archive that already carried it would have
          # made assurance 6 of "Store upgrade 5" green for the wrong reason.
          # v1.1.0 carries the block, so that sentence is about a release of the
          # day before yesterday, and assurance 6 moved to the declared filters
          # of the provider in plan 16-09.
          #
          # What is measured here now is the presence of the block, and it is
          # not a formality: it is the cheapest assertion in this file that
          # UPGRADE_FROM_TAG really points at a release this proof understands.
          # A tag out of the 1.0.x line would answer without the block, and the
          # whole block below would then measure a jump nobody claimed.
          #
          # The reasoning moved with the tag on 2026-09-24 (plan 18-12) and the
          # assertion did not, which is why the two are written apart here. Until
          # that day this paragraph said "a release of the 1.1.x line", because
          # UPGRADE_FROM_TAG was v1.1.0 and 1.1.0 was the first release with the
          # block. v1.2.0 carries it as well, so the assertion stays true without
          # a byte of its own changing; what it rules out is now everything below
          # v1.1.0 rather than everything outside 1.1.x, and that is still the
          # cheap floor this step is here to put in.
          if ! grep -q '<navigations>' apps/findling/appinfo/info.xml; then
            echo "the companion of ${UPGRADE_FROM_TAG} declares no navigation entry, so this is older than v1.1.0 and not a release this proof starts from"
            exit 1
          fi
          echo "the companion of ${UPGRADE_FROM_TAG} declares the navigation entry, as every release since v1.1.0 does"
          "${RUNNER_TEMP}/nc-occ.sh" app:enable findling

          # The container half, out of the info.xml of the released archive and
          # out of nothing else: registry, image and image-tag are what a user
          # of the previous version really runs.
          # ghcr.io/street1983nk/findling_backend:1.2.0 is the image the release
          # of phase 16 pushed, as an index with linux/amd64 and linux/arm64, and
          # a missing tag would end this step rather than fall back to anything.
          # The two predecessors were checked the same way and are named so that
          # the habit is visible rather than only its result: :1.1.0 against the
          # manifest list on 2026-09-21, :1.0.3 on 2026-09-10. Whoever moves
          # UPGRADE_FROM_TAG again does this check again, because a tag without
          # an image turns the registration below into a red step with a
          # confusing message.
          tar -xzf "${from}/dist/findling_backend.tar.gz" -C "${from}/extract"
          old_info="${from}/extract/findling_backend/appinfo/info.xml"
          test -f "${old_info}"
          grep -E '<version>|<registry>|<image>|<image-tag>' "${old_info}"
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${old_info}" --wait-finish

          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "the ${UPGRADE_FROM_TAG} registration created no running container"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ -z "${volume}" ]; then
            echo "the ${UPGRADE_FROM_TAG} registration created no volume, and an upgrade that keeps nothing proves nothing"
            docker volume ls
            exit 1
          fi
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "the ${UPGRADE_FROM_TAG} installation runs as ${container} on the volume ${volume}"
          {
            echo "UPGRADE_OLD_CONTAINER=${container}"
            echo "UPGRADE_VOLUME=${volume}"
            echo "UPGRADE_OLD_COMPANION=${old_companion}"
          } >> "${GITHUB_ENV}"

      - name: Store upgrade 2, the corpus of a real installation, indexed and waited out
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          # The 39 file reference corpus, the same one integration.yml indexes,
          # in the account of the ordinary user. It is what makes the three term
          # assertions below possible at all: a hit count needs documents, and
          # documents nobody chose would make the counts arbitrary.
          mkdir -p data/testuser/files
          cp -r findling-src/testdata/corpus data/testuser/files/corpus

          # The Spanish document of the before and after proof of plan 19-08,
          # and it belongs to the corpus of the RELEASED installation rather
          # than to this checkout: it is indexed a few lines below under
          # ${UPGRADE_FROM_TAG}, into a schema that carries no body_es field at
          # all, and that is what makes the nought of "Store upgrade 3" a
          # measurement instead of an accident.
          #
          # The word pair is not a choice, it is a measurement (19-RESEARCH
          # M-5, 2026-09-24). The document carries alemana, the question asks
          # for alemanes, and of the analysis chains this app ships ONLY the
          # Spanish one carries the two onto a common term (aleman): neither
          # the English nor the German one does. A pair such as informacion
          # against informaciones would be folded by the English chain and
          # would therefore have been green before phase 19 touched anything,
          # which is the one shape a before and after proof cannot survive.
          #
          # Why the question is ONE word, and it is the reason the nought can
          # hold at all rather than a matter of taste: api/search.py answers a
          # single word line out of the word index alone (the one term rule of
          # plan 06.1-20, derived in
          # docs/measurements/2026-09-06-vektordistanzen), so the vector half
          # is not built for this question at all and no semantic neighbour can
          # put this document into the answer while the field it needs is
          # missing from the schema. A two word question would be hybrid, and
          # then the nought would be a statement about distances rather than
          # about fields.
          #
          # The words follow the rule of the fill corpus block below: none of
          # them carries Belehrung, Auszug, Erinnerung, florpel or
          # findling-canary, and none of them splits into a constituent that
          # does. The file name carries no form of aleman either, or the name
          # field of the schema would answer the question the body field is
          # there to answer.
          #
          # ASCII throughout, like the rest of this file: Spanish writes every
          # one of these words without an accent.
          {
            echo 'Esta es una carta de la oficina alemana sobre el contrato de arrendamiento.'
            echo 'La empresa confirma la entrega de los documentos del piso en Madrid.'
          } > data/testuser/files/upgrade-carta-es.txt

          # The fill corpus, and it exists for one measured reason: it is what
          # makes the rebuild of "Store upgrade 6" long enough to be watched.
          #
          # The finding of run 36001341420. The rebuild of that run carried the
          # 29 documents of the reference corpus and was over before the loop
          # that watches it had read the overview twice, so assurance 3 (the
          # banner was seen up) and assurance 5 (a search answered inside the
          # run) had nothing to measure. The window a watcher can see is exactly
          # the band run of index/rebuild.py, because that is where
          # rebuildRunning is true, and it was two tenths of a second long.
          #
          # Measured on 2026-09-24 against the real transfer_documents, tantivy
          # 0.26.2, three chains and a 300000 entry compound list: the carrying
          # costs 0.25 to 0.6 s per MB of body text and almost nothing per
          # document (400 tiny documents carry in 0.21 s, 29 small plus 64 of
          # 500000 characters carry in 7.81 s). The module header of
          # index/rebuild.py says the same from the other side: 3000 documents
          # of 2.5 kB over four chains in 4.39 s, which is 0.585 s per MB. So a
          # longer window is bought with TEXT and never with more files.
          #
          # And text is the cheap half here, which is the whole reason this
          # works: EMBED_TOKEN_CAP is 1024 and the chunker applies it BEFORE the
          # split, so every one of these documents costs two or three chunks
          # whatever its length, and MAX_TEXT_CHARS is 524288, so 500019
          # characters are carried whole and nothing lands in the truncated
          # state. 64 documents are therefore 64 documents of indexing work and
          # 32 MB of carrying work, and the expected window is 4 to 8 s, which
          # is 15 to 30 rounds of the reader that watches it.
          #
          # The words are deliberately botanical. None of them carries Belehrung,
          # Auszug, Erinnerung, florpel or findling-canary, and none of them
          # splits into a constituent that does: the three term assertions of
          # this proof have to keep answering with exactly one file each, and
          # the check right after the drain below says so rather than assumes it.
          fill_dir=data/testuser/files/fuellung
          mkdir -p "${fill_dir}"
          block="${RUNNER_TEMP}/fill-block.txt"
          printf '%s\n' "Ahornblatt Birkenrinde Farnwedel Kieselstein Moosteppich Nadelholz Quellwasser Sandbank Tannenzapfen Uferweide Wolkenband Gletschereis Heidekraut Lavendelfeld Muschelschale Nebelschwaden Regenbogen Salzwiese Windstille Bergahorn" > "${block}"
          while [ "$(wc -c < "${block}")" -lt 500000 ]; do
            cat "${block}" "${block}" > "${block}.grown"
            mv "${block}.grown" "${block}"
          done
          head -c 500000 "${block}" > "${block}.capped"
          for number in $(seq 1 64); do
            {
              printf 'Fuelltext Nummer %s\n' "${number}"
              cat "${block}.capped"
            } > "${fill_dir}/fuelltext-${number}.txt"
          done
          echo "the fill corpus: $(find "${fill_dir}" -type f | wc -l) files of $(wc -c < "${fill_dir}/fuelltext-1.txt") characters each"

          "${RUNNER_TEMP}/nc-occ.sh" files:scan --all
          echo "corpus entries: $(find data/testuser/files/corpus -type f | wc -l)"

          # --restart and not a wait for the first crawl: the zero config chain
          # ran when the app was enabled and may have walked the mount before the
          # corpus was in it. --no-interaction because occ treats this shell as
          # interactive and the confirmation would otherwise default to No and
          # leave the queue empty (first run finding of the resilience gate).
          "${RUNNER_TEMP}/nc-occ.sh" findling:index --restart --no-interaction

          # The waiting shape of this job, not a second one: cron.php is the
          # identical command a system cron runs, the loop leaves the moment the
          # condition holds and never sleeps a fixed pause, and the condition is
          # read out of two independent places. That is the 52 second lesson of
          # plan 06-11, the same one "Store install 7" is built on.
          #
          # Two sources, because either alone would be a false green. The queue
          # of Nextcloud says whether work is outstanding; the container says how
          # many files have a verdict. An empty queue alone is also the state
          # before the crawl has queued anything.
          open_rows() {
            "${RUNNER_TEMP}/nc-occ.sh" findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }
          container="${UPGRADE_OLD_CONTAINER}"
          report() {
            docker exec "${container}" sh -c 'python -m findling.tools.index_status --db "${APP_PERSISTENT_STORAGE}/state.db"'
          }
          # Every file of the account, because every one of them ends in one of
          # the three end states. A lower bound and not an exact figure: the
          # admin account carries files of its own and they are crawled as well,
          # so the count may be exceeded and may never be undercut.
          expected=$(find data/testuser/files -type f | wc -l)
          echo "the account of testuser holds ${expected} files, and every one of them has to reach a verdict"

          deadline=$(( $(date +%s) + UPGRADE_DRAIN_BUDGET_SECONDS ))
          rounds=0
          drained=""
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            rounds=$(( rounds + 1 ))
            timeout 300 php -f cron.php > "${RUNNER_TEMP}/upgrade-cron-${rounds}.log" 2>&1 || true
            state=$(report)
            indexed=$(echo "${state}" | jq -r '.indexed')
            skipped=$(echo "${state}" | jq -r '.skipped')
            failed=$(echo "${state}" | jq -r '.failed')
            open=$(open_rows)
            judged=$(( indexed + skipped + failed ))
            echo "round ${rounds}: open=${open} indexed=${indexed} skipped=${skipped} failed=${failed}, $(( deadline - $(date +%s) ))s of the budget left"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${expected}" ]; then
              drained="yes"
              break
            fi
            sleep 5
          done

          if [ -z "${drained}" ]; then
            echo "::error::the first indexing pass did not finish within UPGRADE_DRAIN_BUDGET_SECONDS=${UPGRADE_DRAIN_BUDGET_SECONDS} after ${rounds} cron rounds"
            echo "This is a finding about the indexing pass and not a reason to raise the budget."
            report || true
            "${RUNNER_TEMP}/nc-occ.sh" findling:index || true
            docker logs "${container}" 2>&1 | tail -n 60 || true
            exit 1
          fi
          echo "the work stock is empty and every file has a verdict, after ${rounds} cron rounds"

          # The three terms of the reference corpus, asked once now that the fill
          # corpus is in the same index, and asked HERE because here is where a
          # change to them would be caused. Every later assertion of this proof
          # rests on each of them bringing back exactly one file, and the search
          # is hybrid: the lexical half cannot match these documents, because no
          # word of them and no constituent of any word of them is one of the
          # three, but the semantic half answers with a band of 14.0 around its
          # best neighbour (docs/measurements/2026-09-06-vektordistanzen), and
          # whether a filler lands inside that band is a measurement and not a
          # deduction. If one does, all 64 do, and this line names the fill
          # corpus as the cause instead of leaving four later steps to fail with
          # a count nobody can explain.
          for term in Belehrung Auszug Erinnerung; do
            body="${RUNNER_TEMP}/fill-term-${term}.json"
            code=$(curl -s -o "${body}" -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              "http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=${term}")
            if [ "${code}" != "200" ] || ! jq -e '.ocs.data.entries | length == 1' "${body}" > /dev/null; then
              echo "::error::the search for ${term} answered HTTP ${code} with $(jq -r '.ocs.data.entries | length' "${body}" 2> /dev/null || echo "an unreadable list") entries instead of the one file of the reference corpus, so the fill corpus is answering searches it was chosen not to answer"
              jq -r '.ocs.data.entries[]?.title' "${body}" || true
              exit 1
            fi
          done
          echo "the three terms of the reference corpus still bring back exactly one file each, with the fill corpus in the index"

      - name: Store upgrade 3, the state of the released installation, before anything moves
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          # The probe both sides of the upgrade share, written once and sourced
          # twice. Two implementations of "how many hits does this term have"
          # would compare two measurements instead of two states, which is the
          # one mistake a before and after proof cannot survive. The shape is the
          # one of "The drift probe both directions share" further up.
          cat > "${RUNNER_TEMP}/upgrade-probe.sh" <<'SH'
          # The container is looked up on every call and never remembered: the
          # upgrade replaces it, and a name captured before the upgrade would
          # make the after state read a container that no longer exists.
          findling_container() {
            docker ps --filter 'name=findling_backend' --format '{{.Names}}' | head -n 1
          }

          # The marks and the counters, read out of the volume by the
          # container itself. Not over the /status route: that one sits behind
          # the signed AppAPI header, and findling.tools.index_status exists for
          # exactly this question. python and the package are on the PATH of the
          # image, and the layout under APP_PERSISTENT_STORAGE is state.db with
          # the index directory next to it.
          #
          # Five marks until 2026-09-24 and six since, which is the successor to
          # the assurance that died with the tag, so the candidate check belongs
          # here and is written the way declared_filters() below writes its own
          # (plan 18-12).
          #
          # The question, asked for the third time in this file: which visible
          # difference does the new version make against the released one that a
          # state of this installation can be read for? With UPGRADE_FROM_TAG on
          # v1.2.0 the two candidates this file used before are both spent. The
          # navigation entry of plan 09-06 has been in the released half since
          # v1.1.0. The two date bounds of the provider have been in it since
          # v1.2.0, which is exactly what plan 13-06 put there, so the assertion
          # that made them appear would now read true before and true after: it
          # would pass while measuring nothing, which is worse than no assertion
          # at all.
          #
          # Three candidates were looked at for the replacement, and two do not
          # carry:
          #
          # One, the two rebuild banners of plan 18-10. They are the most visible
          # difference there is, and they are the wrong thing to hang an
          # assurance on here: both are false on an idle installation, so they
          # say nothing outside a running rebuild. "Store upgrade 6" reads them
          # where they do say something, in the middle of the run, and that is a
          # statement about the rebuild rather than about the exchange of the
          # files.
          #
          # Two, schemaVersion itself. It is the mark the whole phase is about,
          # and it is unusable for THIS assurance for the reason that makes the
          # block above worth keeping: it is stamped after a rebuild, the rebuild
          # does not start without a language change, and an upgrade under the
          # factory setting therefore leaves it exactly where it was. An
          # assertion that it moved would be red on the very run this block is
          # built to prove green.
          #
          # Three, the languages mark, and it carries. It is a row in the meta
          # table that 1.2.0 never wrote and that this version writes, it travels
          # through the very helper the probe already has, it costs no page and
          # no render, and the report of 1.2.0 answers without the key rather
          # than with an empty value, which is the difference a jq comparison can
          # see. Read as: absent before the upgrade, present after it, and after
          # the rebuild of "Store upgrade 6" it names the set that rebuild was
          # run for.
          index_report() {
            container=$(findling_container)
            if [ -z "${container}" ]; then
              echo "no running findling_backend container, so there is nothing to read the index state from" >&2
              return 1
            fi
            docker exec "${container}" sh -c 'python -m findling.tools.index_status --db "${APP_PERSISTENT_STORAGE}/state.db"'
          }

          # The hit count of one term over the ordinary OCS route, as the
          # ordinary user. Fail closed in both directions: a status other than
          # 200 and a body jq cannot read are findings, never a count of nought.
          term_hits() {
            body="${RUNNER_TEMP}/upgrade-term.json"
            code=$(curl -s -o "${body}" -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              "http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=$1")
            if [ "${code}" != "200" ]; then
              echo "the search for '$1' answered HTTP ${code}" >&2
              cat "${body}" >&2
              return 1
            fi
            count=$(jq -r '.ocs.data.entries | length' "${body}" 2> /dev/null || true)
            case "${count}" in
              ''|*[!0-9]*)
                echo "the answer for '$1' carries no readable entry list" >&2
                cat "${body}" >&2
                return 1
                ;;
            esac
            printf '%s\n' "${count}"
          }

          # The app menu of the instance, as ids. The list of a Nextcloud always
          # carries more than one entry, so an empty answer is a broken call and
          # never the absence of one entry.
          navigation_ids() {
            body="${RUNNER_TEMP}/upgrade-navigation.json"
            code=$(curl -s -o "${body}" -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/core/navigation/apps')
            if [ "${code}" != "200" ]; then
              echo "the navigation route answered HTTP ${code}" >&2
              cat "${body}" >&2
              return 1
            fi
            ids=$(jq -r '[.ocs.data[].id] | sort | join(" ")' "${body}" 2> /dev/null || true)
            if [ -z "${ids}" ]; then
              echo "the navigation route answered with no entry at all, which is a broken call and not an absent entry" >&2
              cat "${body}" >&2
              return 1
            fi
            printf '%s\n' "${ids}"
          }

          # The reindex banner, read where it is decided. php/templates/admin.php
          # shows the paragraph findling-banner-reindex when the overview says
          # backend.reindexRequired, so the flag is the banner. The overview
          # helper of the drift probe is what gets past the request token of that
          # admin route, and it is reused rather than rebuilt.
          #
          # backendReachable is asked first, because a banner that is down
          # because nobody answered is not a banner that is down.
          reindex_banner() {
            out="${RUNNER_TEMP}/upgrade-overview.json"
            sh "${RUNNER_TEMP}/overview.sh" "${out}" >&2
            if ! jq -e '.backendReachable == true' "${out}" > /dev/null; then
              echo "the overview says the container did not answer, so its banner flag says nothing" >&2
              head -c 400 "${out}" >&2
              return 1
            fi
            if ! jq -e '.backend | has("reindexRequired")' "${out}" > /dev/null; then
              echo "the overview carries no reindexRequired flag, so this probe is not looking at the banner" >&2
              head -c 400 "${out}" >&2
              return 1
            fi
            jq -r '.backend.reindexRequired' "${out}"
          }

          # Whether a rebuild directory is lying on the volume, read at the
          # volume and never on the admin page (plan 18-12). Two words and no
          # numbers: idle when APP_PERSISTENT_STORAGE holds no index.rebuild,
          # rebuilding when it does.
          #
          # Why this and not backend.rebuildRunning, which says the same thing in
          # the overview. The two answer different questions and only one of them
          # belongs in a before and after snapshot. rebuildRunning is a value of
          # the running process and is false the moment that process is gone, so
          # a container that died in the middle of a run reports idle while half
          # a rebuilt directory sits on the disk. The directory is the state of
          # the volume, which is what a snapshot of this installation is about,
          # and its presence before or after an upgrade is a finding either way:
          # nothing in this proof rebuilds anything, so both snapshots have to
          # say idle. "Store upgrade 6" reads rebuildRunning out of the overview
          # for the other question, whether the banner rose while a run was on.
          #
          # docker exec and not a path on the runner: the volume belongs to the
          # container, and its layout under APP_PERSISTENT_STORAGE is the one
          # index_report() already relies on.
          rebuild_state() {
            container=$(findling_container)
            if [ -z "${container}" ]; then
              echo "no running findling_backend container, so there is nothing to read the rebuild state from" >&2
              return 1
            fi
            docker exec "${container}" sh -c \
              'if [ -d "${APP_PERSISTENT_STORAGE}/index.rebuild" ]; then echo rebuilding; else echo idle; fi'
          }

          # Q-5 of the phase 16 research, answered by looking and not by
          # guessing, and the answer is the filter list of the provider.
          #
          # The question: which visible difference does v1.2 make against
          # v1.1 that a state of this installation can be read for? Assurance
          # 6 needs one, because the navigation entry it used to measure has
          # been in the released half since v1.1.0 and is therefore no
          # difference any more. Two candidates stood, and the first one does
          # not carry.
          #
          # The sixth engine state ('unloaded', plan 14-09) fails for two
          # reasons, both looked up rather than assumed. One, the field is
          # not new: git show v1.1.0:php/lib/Service/AdminViewService.php
          # already builds 'engineState' into the overview answer (line 1813
          # there, line 1816 in this checkout), so its presence says nothing
          # and only its value could. Two, that value cannot be reached here:
          # engine_state() in backend/src/findling/embed/engine.py answers
          # 'unloaded' only while unload_count() is above nought (the branch
          # at line 358), which needs an idle span in which the container
          # really gave the weights back. This block registers a container
          # and reads it minutes later, so both halves would report the same
          # word, and an assertion on a word that hangs on a timer is a flake
          # and not a proof.
          #
          # The declared filters do carry, and they are cheaper than the
          # research expected. php/lib/Search/Provider.php answered
          # getSupportedFilters() with term and title-only in the released
          # half (git show v1.1.0:php/lib/Search/Provider.php, line 133) and
          # answers with term, title-only, since and until since plan 13-06.
          # No page has to be rendered for that: the route below carries the
          # list per provider. And the difference is one that has to arrive
          # on an existing installation rather than only on a fresh one,
          # because an undeclared filter is what made this provider drop out
          # of a dated search without a word.
          #
          # The filters the companion declares for its provider, as the unified
          # search dialog reads them before it asks that provider anything.
          # /ocs/v2.php/search/providers answers a filter map per provider, and
          # integration.yml reads the same route for the same question in "The
          # reported filters name term and title-only".
          #
          # Fail closed in both directions, the same way navigation_ids() does
          # it: a status other than 200 and an answer without a findling entry
          # are findings, never an empty filter list. An empty list would be the
          # one shape that makes the assertion after the upgrade meaningless,
          # because it reads like "this version declares nothing" instead of
          # "this call did not work".
          declared_filters() {
            body="${RUNNER_TEMP}/upgrade-providers.json"
            code=$(curl -s -o "${body}" -w '%{http_code}' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers')
            if [ "${code}" != "200" ]; then
              echo "the provider list answered HTTP ${code}" >&2
              cat "${body}" >&2
              return 1
            fi
            names=$(jq -r '[.ocs.data[] | select(.id == "findling") | .filters | keys[]] | sort | join(" ")' "${body}" 2> /dev/null || true)
            if [ -z "${names}" ]; then
              echo "the provider list names no findling provider with a filter at all, which is a broken call and not an absent filter" >&2
              cat "${body}" >&2
              return 1
            fi
            printf '%s\n' "${names}"
          }

          # Everything one state of this installation consists of, in one file.
          snapshot() {
            out="$1"
            label="$2"

            status_text="${RUNNER_TEMP}/upgrade-${label}-status.txt"
            "${RUNNER_TEMP}/nc-occ.sh" findling:index --status > "${status_text}" 2>&1
            cat "${status_text}"
            # The end states as Nextcloud recorded them, next to the counters of
            # the container. indexed is deliberately not read here: that counter
            # belongs to the container and IndexCommand prints a sentence saying
            # so, which $1 == "indexed" would otherwise pick up as a number.
            scheduled=$(awk '$1 == "scheduled" && $2 ~ /^[0-9]+$/ { print $2; exit }' "${status_text}")
            running=$(awk '/^  handed to the worker/ { print $NF; exit }' "${status_text}")
            nc_skipped=$(awk '$1 == "skipped" && $2 ~ /^[0-9]+$/ { print $2; exit }' "${status_text}")
            nc_failed=$(awk '$1 == "failed" && $2 ~ /^[0-9]+$/ { print $2; exit }' "${status_text}")
            for pair in "scheduled=${scheduled}" "handed to the worker=${running}" \
                        "skipped=${nc_skipped}" "failed=${nc_failed}"; do
              case "${pair}" in
                *=)
                  echo "occ findling:index --status printed no number for ${pair%=}" >&2
                  cat "${status_text}" >&2
                  return 1
                  ;;
              esac
            done

            report=$(index_report)
            belehrung=$(term_hits Belehrung)
            auszug=$(term_hits Auszug)
            erinnerung=$(term_hits Erinnerung)
            ids=$(navigation_ids)
            banner=$(reindex_banner)
            filters=$(declared_filters)
            # The eighth value of a snapshot, since 2026-09-24. Its own line and
            # its own emptiness check, in the shape the four occ numbers above
            # are checked in: a value goes into a shell variable first, an empty
            # one ends the snapshot with the raw answer on record, and only then
            # does one jq -n build the object (T-18-12-03). Without the check an
            # exec that did not run would arrive as the empty string and compare
            # equal to the empty string of the other side, which is the one shape
            # that makes a before and after proof pass by saying nothing.
            rebuild=$(rebuild_state) || return 1
            if [ -z "${rebuild}" ]; then
              echo "the container answered nothing about a rebuild directory, so this snapshot would carry an empty value" >&2
              docker ps -a >&2
              return 1
            fi

            # The ninth value of a snapshot, since 2026-09-25, and it carries a
            # key of its OWN instead of a fourth entry in .terms. The reason is
            # the precondition that every entry of that object answers with
            # exactly one file: it stands twice in this file, once in "Store
            # upgrade 3" and once in "Store upgrade 6". A term that is SUPPOSED
            # to answer with nought before the rebuild would break it, and it
            # is not going to be loosened to make room for one. That
            # precondition is the reason the assurances behind it mean anything
            # at all.
            #
            # The counter is the one that is already here. term_hits fails
            # closed on a status other than 200 and on a body jq cannot read,
            # and a second implementation of "how many hits does this term
            # have" would compare two measurements instead of two states, which
            # is the one mistake a before and after proof cannot survive.
            #
            # Same shape as the eighth value above (T-18-12-03): into a shell
            # variable first, an empty one ends the snapshot with the raw
            # answer on record, and only then does the one jq -n below build
            # the object.
            spanish=$(term_hits alemanes) || return 1
            if [ -z "${spanish}" ]; then
              echo "the search for alemanes carried no readable count, so this snapshot would carry an empty value" >&2
              cat "${RUNNER_TEMP}/upgrade-term.json" >&2
              return 1
            fi

            jq -n \
              --arg label "${label}" \
              --argjson report "${report}" \
              --argjson belehrung "${belehrung}" \
              --argjson auszug "${auszug}" \
              --argjson erinnerung "${erinnerung}" \
              --argjson scheduled "${scheduled}" \
              --argjson running "${running}" \
              --argjson ncskipped "${nc_skipped}" \
              --argjson ncfailed "${nc_failed}" \
              --arg ids "${ids}" \
              --arg banner "${banner}" \
              --arg filters "${filters}" \
              --arg rebuild "${rebuild}" \
              --argjson spanish "${spanish}" \
              '{
                 label: $label,
                 terms: {
                   Belehrung: $belehrung,
                   Auszug: $auszug,
                   Erinnerung: $erinnerung
                 },
                 spanish: $spanish,
                 container: {
                   docs: $report.docs,
                   indexed: $report.indexed,
                   skipped: $report.skipped,
                   failed: $report.failed,
                   rebuildState: $rebuild
                 },
                 marks: {
                   schemaVersion: $report.schemaVersion,
                   indexVersion: $report.indexVersion,
                   analyzerVersion: $report.analyzerVersion,
                   wordlistHash: $report.wordlistHash,
                   tantivyVersion: $report.tantivyVersion,
                   languages: $report.languages
                 },
                 nextcloud: {
                   scheduled: $scheduled,
                   running: $running,
                   skipped: $ncskipped,
                   failed: $ncfailed
                 },
                 navigation: {
                   ids: $ids,
                   findling: ($ids | split(" ") | index("findling") != null)
                 },
                 searchFilters: {
                   declared: $filters,
                   dates: (($filters | split(" ") | index("since") != null)
                           and ($filters | split(" ") | index("until") != null))
                 },
                 reindexBanner: ($banner == "true")
               }' > "${out}"
          }
          SH

          . "${RUNNER_TEMP}/upgrade-probe.sh"

          # The three terms are fixed values of the 39 file corpus and every one
          # of them carries a measured statement in
          # backend/tests/test_corpus_terms.py: Belehrung stands only inside
          # Rechtsmittelbelehrung in 15-schweiz-baubewilligung.pdf, Auszug only
          # inside Grundbuchsauszug in 16-oesterreich-mitteilung.pdf, and
          # Erinnerung only inside Zahlungserinnerung in 30-nur-ein-bild.pdf.
          # All three sit on scanned pages, so a hit is the whole chain: OCR,
          # compound splitting, index, search. That test says each of them
          # brings back exactly one file, which is why an unchanged count here
          # is a statement about the index and not about an arbitrary number.
          snapshot "${RUNNER_TEMP}/upgrade-before.json" before
          echo "the state of the ${UPGRADE_FROM_TAG} installation:"
          jq . "${RUNNER_TEMP}/upgrade-before.json"

          # The two facts the before state has to carry, or the assertions after
          # the upgrade would be measuring an installation that never worked.
          if ! jq -e '[.terms[]] | all(. == 1)' "${RUNNER_TEMP}/upgrade-before.json" > /dev/null; then
            echo "::error::not every one of the three terms brings back exactly one file on the ${UPGRADE_FROM_TAG} installation"
            echo "An unchanged count after the upgrade would then be the unchanged absence of a hit."
            jq '.terms' "${RUNNER_TEMP}/upgrade-before.json"
            exit 1
          fi

          # The counter proof of the Spanish before and after: nought here
          # says the schema of ${UPGRADE_FROM_TAG} carries no field that can
          # answer this question, and without it a hit that was there all
          # along would be indistinguishable from one the rebuild made.
          if ! jq -e '.spanish == 0' "${RUNNER_TEMP}/upgrade-before.json" > /dev/null; then
            echo "::error::the question alemanes already brings back $(jq -r '.spanish' "${RUNNER_TEMP}/upgrade-before.json") document(s) on the ${UPGRADE_FROM_TAG} installation, and it has to bring back none"
            echo "Either the Spanish document reached the answer without a body_es field, and then the hit after the rebuild would say nothing, or the word pair folds in a chain other than the Spanish one (19-RESEARCH M-5)."
            jq '{terms: .terms, spanish: .spanish}' "${RUNNER_TEMP}/upgrade-before.json"
            exit 1
          fi
          # The second condition, and what it asks changed twice, on 2026-09-21
          # and again on 2026-09-24. Overhauled wording, kept on record: until
          # the first date it demanded that .navigation.findling be absent, which
          # was the counterpart of assurance 6 while that assurance measured the
          # navigation entry; until the second it demanded that the two date
          # bounds of plan 13-06 be absent, which was its counterpart while
          # assurance 6 measured those. v1.1.0 carries the entry and v1.2.0
          # carries the bounds, so both conditions would now be red on a healthy
          # installation.
          #
          # In its place the absence of the field assurance 6 measures today: the
          # languages mark, which 1.2.0 never wrote. The two belong together and
          # always will, whatever the field is: without this condition assurance
          # 6 could be green because the value was already there before the
          # upgrade, which is the one shape a before and after proof cannot
          # survive. Absent is null here and not the empty string, because the
          # report of the released half has no such key at all and jq answers
          # null for a key that is not there.
          #
          # .navigation and .searchFilters stay in the snapshot. Neither is
          # asserted any more, but they are the app menu and the declared filters
          # of the instance on record, and a reader of a red run should not have
          # to guess them.
          if ! jq -e '.marks.languages == null' "${RUNNER_TEMP}/upgrade-before.json" > /dev/null; then
            echo "::error::the ${UPGRADE_FROM_TAG} installation already reports a languages mark"
            echo "Its presence after the upgrade would then be no change at all."
            jq '.marks' "${RUNNER_TEMP}/upgrade-before.json"
            exit 1
          fi
          echo "three terms, one file each; the Spanish question with no hit at all; no languages mark in the report; the state is on record in upgrade-before.json"

      - name: Store upgrade 3b, the always enabled apps this checkout does not carry
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          # checkAppsRequirements() of lib/private/Updater.php walks the enabled
          # apps and, for one that is shipped and whose appinfo cannot be read,
          # throws UnexpectedValueException instead of disabling it. It runs
          # inside doUpgrade() only, which is why it never fired here before:
          # until the release commit of plan 11-11 both sides carried 1.0.3, occ
          # upgrade answered ERROR_UP_TO_DATE and left before reaching it. With
          # 1.0.3 -> 1.1.0 it gets there, and the instance died on "viewer".
          #
          # Which app is "enabled" is not only what oc_appconfig says.
          # AppManager::getAlwaysEnabledApps() reads core/shipped.json and treats
          # every entry of alwaysEnabled as enabled regardless of the database,
          # and such an app cannot be disabled either. stable34 lists viewer
          # there while apps/ of the same branch does not carry it: the bundle
          # apps live in their own repositories and only a release tarball brings
          # them along. That is why the first attempt at this step found nothing
          # to do in oc_appconfig and the upgrade died all the same.
          #
          # So the instance claims to ship an app it does not have, which is a
          # state no user installation is ever in, and that claim is what is
          # corrected here. Nothing is faked into place, no app is installed and
          # no app is disabled: alwaysEnabled is reduced to the apps that are
          # really in this checkout, and the one entry that goes is named.
          #
          # Only alwaysEnabled, and defaultEnabled deliberately not. That second
          # list decides what a fresh installation switches on, it is not
          # consulted by getAlwaysEnabledApps(), and it played no part in the
          # failure; it names two dozen bundle apps this checkout does not carry
          # either, so editing it would be a large change to the instance that
          # nothing asked for. On stable34 the correction below therefore moves
          # exactly one name.
          #
          # Neither half of Findling appears in shipped.json at all, and the
          # assertion below says so rather than assuming it.
          test -f core/shipped.json
          # Two clauses before anything is edited, because the edit below is
          # driven by a path test and a path test that is wrong about where it
          # stands would answer "missing" for every app there is. Emptying
          # alwaysEnabled would leave the instance without dav, files and
          # settings, and it would do it quietly.
          #
          # The first clause is the anti vacuity one: files is in alwaysEnabled
          # and in every Nextcloud that ever existed, so if it cannot be found
          # here then this step is not standing in the server root and nothing
          # it concludes is worth anything.
          if [ ! -f "apps/files/appinfo/info.xml" ]; then
            echo "::error::apps/files/appinfo/info.xml is not here, so this step is not in the Nextcloud root and must not edit shipped.json"
            pwd
            ls -1
            exit 1
          fi
          missing=""
          count=0
          # tr -d '\r' for the same reason release.yml carries it at the signing
          # keys: a name with a carriage return glued to it turns every path test
          # into a miss, and the failure looks like a finding.
          for app in $(jq -r '.alwaysEnabled[]' core/shipped.json | tr -d '\r'); do
            if [ ! -f "apps/${app}/appinfo/info.xml" ]; then
              missing="${missing} ${app}"
              count=$((count + 1))
              echo "core/shipped.json promises ${app}, but apps/${app}/appinfo/info.xml is not in this checkout"
            fi
          done
          # The second clause, an upper bound on how much this step is allowed to
          # believe. On stable34 exactly one app answers this description and it
          # is viewer; a handful would still be a checkout that moved its apps
          # around, and everything above that is this step being wrong rather
          # than the checkout being odd.
          if [ "${count}" -gt 3 ]; then
            echo "::error::${count} always enabled apps appear to be missing, which is not a checkout this step understands; refusing to edit shipped.json"
            exit 1
          fi
          if [ -z "${missing}" ]; then
            echo "every always enabled app of shipped.json is present; nothing to correct"
          else
            drop=$(printf '%s\n' ${missing} | jq -R . | jq -s .)
            jq --argjson drop "${drop}" '.alwaysEnabled = (.alwaysEnabled - $drop)' \
              core/shipped.json > "${RUNNER_TEMP}/shipped.json.new"
            mv "${RUNNER_TEMP}/shipped.json.new" core/shipped.json
            echo "removed from alwaysEnabled:${missing}"
          fi

          # The guard of this step, in two parts. First: shipped.json is a list
          # of Nextcloud's own apps and must never have named ours, because an
          # entry there would put a half of Findling within reach of the edit
          # above.
          if jq -e '[.shippedApps[], .alwaysEnabled[], .defaultEnabled[]] | any(. == "findling" or . == "findling_backend")' \
               core/shipped.json > /dev/null; then
            echo "::error::shipped.json names a half of Findling, which this step must never be able to touch"
            exit 1
          fi
          # Second: the companion is still enabled. The container half is not
          # kept in oc_appconfig at all but in the ExApp tables of AppAPI, and
          # the steps below check it far more thoroughly than a count could.
          state=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
            "SELECT configvalue FROM oc_appconfig WHERE appid = 'findling' AND configkey = 'enabled';")
          if [ "${state}" = "no" ] || [ -z "${state}" ]; then
            echo "::error::findling is '${state}' after the correction, so the upgrade below would prove nothing"
            exit 1
          fi
          echo "the companion is still enabled; shipped.json now lists only apps this checkout carries"

      - name: Store upgrade 4, the upgrade itself, in two halves
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          # ---------------------------------------------------------------
          # Half one, the companion: the files of this commit take the place of
          # the files of the released version, and the instance is asked to
          # upgrade.
          # ---------------------------------------------------------------
          archive="${RUNNER_TEMP}/store-dist/findling.tar.gz"
          if [ ! -s "${archive}" ]; then
            echo "::error::${archive} is missing, so there is nothing of this commit to upgrade to"
            exit 1
          fi
          echo "the new half is the archive Store install 1 built out of this commit:"
          sha256sum "${archive}"

          installed_before=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
            "SELECT configvalue FROM oc_appconfig WHERE appid = 'findling' AND configkey = 'installed_version';")
          echo "the instance has findling installed at ${installed_before}"

          # The directory goes and the new one takes its place, because that is
          # what an update does: Installer::updateAppstoreApp removes the
          # installed directory before it moves the downloaded one in. An
          # extraction on top would leave files of the released version that the
          # new one dropped, and the result would be a mixture no user ever has.
          rm -rf apps/findling
          tar -xzf "${archive}" -C apps
          test -f apps/findling/appinfo/info.xml
          new_companion=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' apps/findling/appinfo/info.xml | head -1)
          echo "the companion of this commit carries version ${new_companion}"

          # occ upgrade, with its verdict on record. Exit code 3 is
          # ERROR_UP_TO_DATE and is a legitimate answer here, exit code 0 is the
          # answer of a run that had something to do; anything else ends this
          # step.
          status=0
          "${RUNNER_TEMP}/nc-occ.sh" upgrade > "${RUNNER_TEMP}/upgrade-occ.txt" 2>&1 || status=$?
          cat "${RUNNER_TEMP}/upgrade-occ.txt"
          case "${status}" in
            0|3) echo "occ upgrade answered ${status}" ;;
            *)
              echo "::error::occ upgrade answered ${status}, which is neither success nor up-to-date"
              exit 1
              ;;
          esac

          installed_after=$(sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
            "SELECT configvalue FROM oc_appconfig WHERE appid = 'findling' AND configkey = 'installed_version';")
          echo "installed_version went from ${installed_before} to ${installed_after}"

          # The two cases, both named, and both branches stay. They were
          # written in plan 11-07 for a version step that had not happened yet;
          # since plan 16-07 the tree carries 1.2.0 against the 1.1.0 of
          # UPGRADE_FROM_TAG, so it is the FIRST branch that runs, and it is the
          # one that matters: it demands that the instance really performed the
          # app update. A silent "nothing happened" with a newer version on disk
          # would be a store update that leaves a user on the old migrations,
          # and the migration of the minor jump (Version001200Date..., plan
          # 16-07) is exactly what would then never run.
          #
          # The second branch is the equal version case. It ran while both sides
          # carried the same number, which was the state before plan 11-11 and
          # again before plan 16-07, and it is kept rather than deleted because
          # every release cycle passes through it once: between the bump of a
          # tree and the publication of the matching tag the two sides are equal
          # again, and a branch that is gone is a red run nobody planned. It
          # measures the file exchange without a version step, which costs the
          # proof nothing that it is about: the index lives in the volume of the
          # container, and the assertions of the next step are about the volume.
          if [ "${new_companion}" != "${installed_before}" ]; then
            if [ "${installed_after}" != "${new_companion}" ]; then
              echo "::error::the companion on disk is ${new_companion} and the instance still has ${installed_after} installed, so occ upgrade did not perform the app update"
              exit 1
            fi
            echo "the instance performed the app update: ${installed_before} to ${installed_after}"
          else
            echo "::notice::the companion of this commit carries ${new_companion}, the same version ${UPGRADE_FROM_TAG} published, so this run measures the file exchange without a version step"
            echo "With the bump of plan 16-07 the tree carries 1.2.0 against the 1.1.0 of the tag, so the branch above is the one that is expected to run."
            if [ "${installed_after}" != "${installed_before}" ]; then
              echo "::error::installed_version moved from ${installed_before} to ${installed_after} although both sides carry the same version"
              exit 1
            fi
          fi

          # ---------------------------------------------------------------
          # Half two, the container: away without the flag, and back on the very
          # volume it left. This is "Store uninstall 1" and "Store uninstall 2"
          # in one order, and the volume in between is what carries the index of
          # 26 hours of work on a real installation.
          # ---------------------------------------------------------------
          old_image=$(docker inspect --format '{{.Config.Image}}' "${UPGRADE_OLD_CONTAINER}")
          echo "the ${UPGRADE_FROM_TAG} container runs ${old_image}"

          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:unregister findling_backend
          gone=$(docker ps -a --filter "name=${UPGRADE_OLD_CONTAINER}" --format '{{.Names}}')
          if [ -n "${gone}" ]; then
            echo "::error::the container ${UPGRADE_OLD_CONTAINER} survived the unregister, so the new image would never be started"
            docker ps -a
            exit 1
          fi
          kept=$(docker volume ls --filter "name=${UPGRADE_VOLUME}" --format '{{.Name}}')
          if [ "${kept}" != "${UPGRADE_VOLUME}" ]; then
            echo "::error::the volume ${UPGRADE_VOLUME} is gone after an unregister without the flag, and with it the index of the installation being upgraded"
            docker volume ls
            exit 1
          fi
          echo "container gone, volume ${kept} kept, exactly as Store uninstall 1 promises"

          # The new image, and it is the one this run built out of this commit.
          # Why not the reference the archive of this commit names: since plan
          # 16-07 backend/appinfo/info.xml says image-tag 1.2.0, and that tag is
          # not in the registry yet, because the release is plan 16-14. Before
          # that bump the file said 1.0.3, which was the image the old half was
          # already running, so registering it again would have left the
          # container half of this upgrade a no-op. Both reasons end in the same
          # place: the reference of a published tag has no business here.
          # info-citest.xml is the file the developer pass of this job registered
          # at the start, it names the image built from this commit, and where
          # the bytes of a store install come from is the subject of the store
          # install path above and not of this block.
          #
          # What it may NOT bring along is its language set. Since plan 19-07
          # that file carries <default>de,en,es,it,nl,pt</default>, AppAPI hands
          # the environment of the info.xml to the container at registration
          # time, and the volume being upgraded here holds an index of v1.2.0
          # that carries no languages mark at all. Six languages against an
          # absent mark is a real difference, findling.store.repo
          # ._languages_are_legacy reads it as one because the set is not inside
          # de,en, the generation is raised, the reindex banner goes up and
          # assurances 2, 4 and 5 of the step below go red. That is measured and
          # not feared: run 36072411846 of 2026-09-24 failed on exactly those
          # three, with "a reindex is required: languages" in the container log.
          # The subject of this block is an upgrade under the FACTORY setting,
          # so the registration below uses it. The language jump is ordered
          # later and on purpose, by "Store upgrade 6" and through the
          # environment of the container rather than through this file.
          # Occurrences and not lines, for the reason written at the first of
          # these three guards (L-19-07).
          if [ "$(grep -oF '<default>de,en,es,it,nl,pt</default>' "${RUNNER_TEMP}/info-citest.xml" | wc -l)" != "1" ]; then
            echo "::error::info-citest.xml does not carry the six language default exactly once, so the line this step reverts is not the line plan 19-07 wrote"
            grep -n '<default>' "${RUNNER_TEMP}/info-citest.xml"
            exit 1
          fi
          sed 's|<default>de,en,es,it,nl,pt</default>|<default>de,en</default>|' \
            "${RUNNER_TEMP}/info-citest.xml" > "${RUNNER_TEMP}/info-upgrade.xml"
          if [ "$(grep -oF '<default>de,en</default>' "${RUNNER_TEMP}/info-upgrade.xml" | wc -l)" != "1" ]; then
            echo "::error::the upgrade info.xml does not carry the shipped language default exactly once"
            grep -n '<default>' "${RUNNER_TEMP}/info-upgrade.xml"
            exit 1
          fi
          echo "registering the upgraded half with the shipped language default:"
          grep -E '<registry>|<image>|<image-tag>|<default>de,en<' "${RUNNER_TEMP}/info-upgrade.xml"
          "${RUNNER_TEMP}/nc-occ.sh" app_api:app:register findling_backend harp_proxy_host \
            --info-xml "${RUNNER_TEMP}/info-upgrade.xml" --wait-finish

          container=$(docker ps --filter 'name=findling_backend' --format '{{.Names}}')
          if [ -z "${container}" ]; then
            echo "::error::the registration after the upgrade created no running container"
            docker ps -a
            exit 1
          fi
          volume=$(docker volume ls --filter 'name=findling_backend' --format '{{.Name}}')
          if [ "${volume}" != "${UPGRADE_VOLUME}" ]; then
            echo "::error::the container after the upgrade runs on '${volume}' and not on the volume ${UPGRADE_VOLUME} of the installation it upgrades"
            docker volume ls
            exit 1
          fi
          new_image=$(docker inspect --format '{{.Config.Image}}' "${container}")
          echo "the container after the upgrade runs ${new_image} on ${volume}"
          if [ "${new_image}" = "${old_image}" ]; then
            echo "::error::the upgrade put the same image back (${new_image}), so the container half moved nothing and the assertions below would be about an installation that was never upgraded"
            exit 1
          fi
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'

          # The container answers again before the next step measures it. The
          # canary is produced inside the container and never comes out of the
          # index, so this waits for the process without touching the state the
          # assertions are about. Bounded, and an expired budget here is a
          # container that never came up rather than a difference in the index.
          ready=""
          for _ in $(seq 1 30); do
            if curl -sf -u "testuser:${TESTUSER_PASS}" \
                 -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
                 'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' \
                 | jq -e '.ocs.data.entries | length == 1' > /dev/null 2>&1; then
              ready="yes"
              break
            fi
            sleep 5
          done
          if [ -z "${ready}" ]; then
            echo "::error::the container after the upgrade does not answer the canary search, so the next step would measure a container that is not up"
            # Diagnosis only. Nothing below changes the instance: a search is a
            # read, and every occ call here reports rather than acts. The
            # comparison above told us that the answer was not one entry and
            # nothing else, which left the two interesting cases (no entry at
            # all, or an instance that is not answering searches yet)
            # indistinguishable. Each command may fail without ending the step,
            # because a diagnosis that stops at its first gap is worth less than
            # a noisy one.
            echo "--- the canary search once more, status and body ---"
            curl -s -o "${RUNNER_TEMP}/canary.json" -w 'HTTP %{http_code}\n' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' || true
            head -c 2000 "${RUNNER_TEMP}/canary.json" || true
            echo
            echo "--- the search providers this instance offers ---"
            curl -s -o "${RUNNER_TEMP}/providers.json" -w 'HTTP %{http_code}\n' \
              -u "testuser:${TESTUSER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              'http://localhost:8080/ocs/v2.php/search/providers' || true
            jq -r '.ocs.data[]?.id' "${RUNNER_TEMP}/providers.json" 2>/dev/null \
              || head -c 2000 "${RUNNER_TEMP}/providers.json" || true
            echo
            echo "--- maintenance mode and status ---"
            "${RUNNER_TEMP}/nc-occ.sh" maintenance:mode || true
            "${RUNNER_TEMP}/nc-occ.sh" status --output=json || true
            echo "--- the app list ---"
            "${RUNNER_TEMP}/nc-occ.sh" app:list || true
            echo "--- what oc_appconfig holds for findling ---"
            sqlite3 -cmd '.timeout 30000' "${FINDLING_DB}" \
              "SELECT configkey || ' = ' || configvalue FROM oc_appconfig WHERE appid = 'findling';" || true
            echo "--- the ExApp as AppAPI sees it ---"
            "${RUNNER_TEMP}/nc-occ.sh" app_api:app:list || true
            echo "--- the last lines of nextcloud.log ---"
            tail -n 60 data/nextcloud.log || true
            echo "--- the last lines of the container ---"
            docker logs "${container}" 2>&1 | tail -n 60
            exit 1
          fi
          echo "the container after the upgrade answers the canary search"

          # The hard memory limit of scripts/ops/aws_box.sh is gone after every
          # app_api:app:register, and it is named here because it is the kind of
          # thing that gets forgotten: nothing in this job measures against such
          # a limit, no docker update sets one anywhere in this file, so there is
          # nothing to restore. The day a step here measures a limit, it has to
          # be set again right at this point.
          {
            echo "UPGRADE_NEW_CONTAINER=${container}"
            echo "UPGRADE_NEW_COMPANION=${new_companion}"
          } >> "${GITHUB_ENV}"

      # Five assurances about something that did NOT move and one about
      # something that did, and the comment keeps them apart because the two
      # kinds fail for opposite reasons. The five are the promise of D-04: an
      # upgrade from 1.0.x, 1.1.x or 1.2.x leaves the index alone, and a user
      # pays nothing for an update they did not ask for. The sixth is the new
      # code arriving on an existing installation, which is the counter sample:
      # an upgrade that changed nothing at all would pass five assertions and
      # mean that the new files never took effect.
      #
      # The five are sharper since the tag moved to v1.2.0 on 2026-09-24, and
      # that is the whole reason the tag moved rather than the block being
      # softened (plan 18-12). 1.3.0 carries a schema step, so this is the one
      # milestone in which "no mark moves" is a statement with teeth: it holds
      # only because schema_version is stamped after a rebuild and the rebuild
      # does not start under the factory setting de,en. "Store upgrade 6" below
      # drives the other case, where the set does change, and it stands beside
      # this block rather than taking a line out of it.
      #
      # The sixth had two different subjects before. Until 2026-09-21 it measured
      # the navigation entry of plan 09-06, the one visible difference between
      # 1.0.3 and 1.1.0; until 2026-09-24 it measured the two date bounds of plan
      # 13-06, the one between 1.1.0 and 1.2.0. v1.1.0 carries the entry and
      # v1.2.0 carries the bounds, so both differences are spent. In their place
      # stands the languages mark, and the candidate check that chose it is
      # written at the helper index_report() above, in the shape the one at
      # declared_filters() (Q-5) set.
      #
      # The branch this test does NOT drive, named rather than left out. D-05
      # asks that a reindex which IS needed starts visibly, and the mechanism for
      # it exists on both sides: findling.index.open.start_rebuild_on_drift
      # raises the local generation and writes the line this step greps for, the
      # container reports reindexRequired, and php/templates/admin.php raises the
      # paragraph findling-banner-reindex which names "occ findling:index
      # --restart" as the remedy. This test does not drive that branch, because
      # D-04 says no mark moves between 1.0.x and this version, and
      # backend/tests/test_upgrade_compatibility.py holds that promise against
      # the code. What is asserted here is the ABSENCE of the drift signal, and
      # that is a statement and not a gap: the day a mark really moves,
      # assertion 2 below turns red before the two absence assertions do, and the
      # question that follows belongs to the owner and not to a test edit.
      - name: Store upgrade 5, the seven assurances after the upgrade
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        run: |
          . "${RUNNER_TEMP}/upgrade-probe.sh"
          snapshot "${RUNNER_TEMP}/upgrade-after.json" after
          before="${RUNNER_TEMP}/upgrade-before.json"
          after="${RUNNER_TEMP}/upgrade-after.json"
          echo "the state after the upgrade:"
          jq . "${after}"

          fail=0
          # One comparison, one sentence saying what it means, and every one of
          # them runs: a step that stopped at the first difference would hide
          # which of the six the upgrade broke.
          unchanged() {
            path="$1"
            meaning="$2"
            was=$(jq -r "${path}" "${before}")
            now=$(jq -r "${path}" "${after}")
            if [ "${was}" != "${now}" ]; then
              echo "::error::${meaning}: ${path} was ${was} before the upgrade and is ${now} after it"
              fail=1
            else
              echo "unchanged  ${path} = ${was}   (${meaning})"
            fi
          }

          echo "--- 1, the same hits for the three terms of the corpus ---"
          for term in Belehrung Auszug Erinnerung; do
            unchanged ".terms.${term}" "the search for ${term} answers differently after the upgrade, so the upgrade changed what an existing index finds"
          done

          echo "--- 2, the same four marks, and the fifth one may move (D-04) ---"
          for mark in schemaVersion indexVersion analyzerVersion wordlistHash; do
            unchanged ".marks.${mark}" "a version mark moved, and a moved mark is a full reindex on every installation in the field (D-04)"
          done

          # tantivyVersion is the one mark that MAY move, and only in its patch
          # number. The store compares the index format half since the owner
          # decision E-17-7 option a of 2026-09-23, so that is what this asserts:
          # a moved format half is still a full reindex in the field, a moved
          # patch number behind an unchanged format half is the upgrade working.
          # Measured on 2026-09-23: 0.26.0 and 0.26.2 both report
          # "index_format v7", an index written by one opens and answers under
          # the other in both directions, and the tokenisation of seven chains
          # over 224 lines of output is identical between them.
          #
          # The presence of the format half is demanded before the two halves
          # are compared, and that is not a formality: "${was#*index_format }"
          # hands the string back unchanged when the pattern is not in it, so
          # two absent marks (jq -r prints "null" twice) used to compare equal
          # and land in the "the engine banner did not move at all" branch. The
          # runtime rule in backend/src/findling/store/repo.py:1327 calls exactly
          # that state "never a pass" and sends every installation in the field
          # into the reindex this gate exists to prevent, so a gate that goes
          # green on it says the opposite of the rule it guards. Audit finding
          # M-17-05 of 2026-09-23.
          was=$(jq -r '.marks.tantivyVersion' "${before}")
          now=$(jq -r '.marks.tantivyVersion' "${after}")
          for banner in "${was}" "${now}"; do
            case "${banner}" in
              *"index_format "*) ;;
              *) echo "::error::tantivyVersion carries no index_format half, so nothing here can be compared: ${banner}"; fail=1;;
            esac
          done
          if [ "${was#*index_format }" != "${now#*index_format }" ]; then
            echo "::error::the index format half of tantivyVersion went from ${was} to ${now}, and that is a full reindex on every installation in the field (D-04)"
            fail=1
          elif [ "${was}" = "${now}" ]; then
            echo "unchanged  .marks.tantivyVersion = ${was}   (the engine banner did not move at all)"
          else
            echo "moved on purpose  .marks.tantivyVersion ${was} to ${now}, same index format half (E-17-7 option a)"
          fi

          echo "--- 3, the same document counts ---"
          unchanged '.container.docs' "the number of documents in the index changed, so the upgrade added or lost documents"
          unchanged '.container.indexed' "the container counts a different number of indexed files after the upgrade"
          unchanged '.container.skipped' "the container counts a different number of skipped files after the upgrade"
          unchanged '.container.failed' "the container counts a different number of failed files after the upgrade"
          unchanged '.nextcloud.skipped' "Nextcloud recorded a different number of skipped files after the upgrade"
          unchanged '.nextcloud.failed' "Nextcloud recorded a different number of failed files after the upgrade"
          unchanged '.nextcloud.scheduled' "the work stock is not empty after the upgrade, so something requeued work nobody asked for"
          unchanged '.nextcloud.running' "a worker holds queue rows after the upgrade, so something requeued work nobody asked for"
          unchanged '.container.rebuildState' "a rebuild directory appeared or went away across the upgrade, and no step of this block rebuilds anything"

          echo "--- 4, no reindex banner ---"
          if jq -e '.reindexBanner' "${after}" > /dev/null; then
            echo "::error::the admin page raises the reindex banner after the upgrade, so the container found the index built by different code"
            fail=1
          else
            echo "no reindex banner: backend.reindexRequired is false, and the container answered (backendReachable was asserted by the probe)"
          fi

          echo "--- 5, no drift line in the container log ---"
          log="${RUNNER_TEMP}/upgrade-exapp.log"
          docker logs "${UPGRADE_NEW_CONTAINER}" > "${log}" 2>&1
          if [ ! -s "${log}" ]; then
            echo "::error::the container after the upgrade wrote no log at all, so the absence of a drift line says nothing"
            fail=1
          else
            # The sentence start_rebuild_on_drift writes when it raises the
            # generation, matched on its stable half rather than on the whole
            # line, which carries the new generation number.
            drift=$(grep -c 'built by different code' "${log}" || true)
            if [ "${drift}" != "0" ]; then
              echo "::error::the container log carries ${drift} line(s) of start_rebuild_on_drift, so a rebuild of the whole index started"
              grep -n 'built by different code' "${log}"
              fail=1
            else
              echo "no start_rebuild_on_drift line in $(wc -l < "${log}") lines of container log"
            fi
          fi

          echo "--- 6, the languages mark of the report, and this one HAS to have changed ---"
          # Two halves in one assertion and not two assertions, because the
          # second half is what makes the first one worth making. Absent before
          # the upgrade is the counter sample: a report that already carried the
          # key would make this green without anything having been exchanged.
          # And EMPTY after it, exactly, which is the half this step demanded
          # wrongly until 2026-09-24.
          #
          # What the two spellings mean, because the difference between them is
          # the whole measurement. jq -r prints "null" for a key the report does
          # not have and the empty string for a key it has without a value.
          # 1.2.0 has no sixth entry in
          # findling.tools.index_status._VERSION_KEYS at all, so its report
          # answers null. 1.3.0 has the entry and fills it out of the meta
          # table, where the mark is not: the seed is forbidden to write it
          # (threat T-18-05-01, plan 18-05) and the only writer there is is the
          # stamp behind a finished rebuild
          # (findling.index.rebuild.stamp_after_swap). So on a leg that sets no
          # FINDLING_LANGUAGES and rebuilds nothing, the key exists and is
          # empty, and that is the visible difference between the two releases
          # this assurance was given to measure.
          #
          # A VALUE here would therefore be the failure and not the success: it
          # would mean a language set was stamped without a rebuild, which is
          # precisely what the five assertions above have just denied happened,
          # or that the seed wrote the wish of the container down as a fact
          # about the index, which is the trap the mark exists to avoid. The
          # step asked for de,en until 2026-09-24 and got "" in deploy-harp run
          # 35989391950; the demand was wrong, the answer was right. The mark
          # arriving WITH a value is the subject of "Store upgrade 6" below,
          # where a rebuild really runs, and it is asserted there.
          was=$(jq -r '.marks.languages' "${before}")
          now=$(jq -r '.marks.languages' "${after}")
          if [ "${was}" != "null" ] || [ -n "${now}" ]; then
            echo "::error::the report named the languages mark as '${was}' before the upgrade and as '${now}' after it, and the sixth mark of plan 18-05 has to be missing from the report of ${UPGRADE_FROM_TAG} and present but empty in the one of this commit, because nothing on this leg rebuilds and only a finished rebuild writes it"
            jq -r '.marks' "${before}" "${after}"
            jq -r '.searchFilters.declared' "${before}" "${after}"
            jq -r '.navigation.ids' "${before}" "${after}"
            fail=1
          else
            echo "the report had no languages mark before the upgrade and carries it empty after, so the mark arrived without anything having been stamped"
          fi

          echo "--- 7, the Spanish question still finds nothing, because the field list hangs on the mark ---"
          # The CI half of success criterion 2 of phase 19, and the only place
          # in this file where the window between an upgrade and a rebuild is
          # measured at all. Every installation in the field walks through that
          # window: the new code knows a body_es field, this index does not
          # carry one, and the question has to stay unanswered until a rebuild
          # has written the stored text through the Spanish chain.
          #
          # What makes that true is where the field list of a question comes
          # from. It is built from the marks of the index directory and never
          # from the wish of the container (plan 19-03), so an installation
          # that upgrades and leaves its language set alone sees no difference
          # whatever. A hit here would mean a question opened a field the index
          # does not have, which on a real installation is
          # parse_query_lenient throwing and the search answering empty from
          # then on: the riskiest path of this whole milestone, measured rather
          # than asserted.
          #
          # fail=1 and not exit 1, for the reason this step gives at the top:
          # the step ends with exit 1 once anything failed, and stopping at the
          # first difference would hide which of the seven the upgrade broke.
          if ! jq -e '.spanish == 0' "${after}" > /dev/null; then
            echo "::error::the question alemanes brings back $(jq -r '.spanish' "${after}") document(s) after the upgrade and before any rebuild, and it has to bring back none: the field list of a question hangs on the stored schema mark and not on the code, so an index built for de,en must not answer a Spanish question"
            fail=1
          else
            echo "the Spanish question answers $(jq -r '.spanish' "${after}") hits after the upgrade, unchanged against the ${UPGRADE_FROM_TAG} installation, which is the window between upgrade and rebuild measured instead of assumed"
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "the two states side by side:"
            diff -u "${before}" "${after}" || true
            exit 1
          fi

          echo "all seven assurances hold"
          {
            echo ""
            echo "### Upgrade from \`${UPGRADE_FROM_TAG}\` on ${{ matrix.server-version }} (${{ matrix.runner }})"
            echo ""
            echo "- companion \`${UPGRADE_OLD_COMPANION}\` out of the release assets, upgraded to \`${UPGRADE_NEW_COMPANION}\` of this commit"
            echo "- the container was unregistered without the data removing flag and registered again on the volume \`${UPGRADE_VOLUME}\`"
            echo "- unchanged: the hits for Belehrung, Auszug and Erinnerung, four of the five index marks and the index format half of the fifth, the document counts, the work stock"
            echo "- no reindex banner, no \`start_rebuild_on_drift\` line in the container log"
            echo "- the languages mark was missing from the report before and is present and empty after, which is the mark arriving without a rebuild having stamped it"
            echo "- the Spanish question \`alemanes\` still answers with nought hits, because the field list of a question hangs on the stored schema mark and not on the code"
            echo ""
            echo "The reindex branch of D-05 is deliberately not driven here; its absence is what this run asserts."
          } >> "${GITHUB_STEP_SUMMARY}"

      # =====================================================================
      # The other half of the upgrade proof, and it stands BESIDE the block
      # above rather than inside it (plan 18-12, success criterion 5).
      #
      # What the block above proves is that an upgrade 1.2.0 to 1.3.0 under the
      # factory setting moves nothing. That is the promise of D-04 and it is
      # worth exactly as much as the counter case is: a version that cannot
      # rebuild at all would pass every one of those six assurances. So this
      # step drives the case the block above denies, on the very installation
      # the block above left behind, and asserts ten things about it.
      #
      # Why it is a step of its own and not a matrix leg or a second pass.
      # UPGRADE_FROM_TAG is an env of the workflow and the matrix is already
      # spoken for by server-version and runner; a third dimension would double
      # the number of legs and make the paragraph "Why exactly one leg" above
      # untrue. A step that continues where the last one stopped costs one
      # restart and no second registration.
      #
      # Why the rebuild is ordered by a restart and not by a registration. The
      # instance is already at 1.3.0 here, the volume already holds the index of
      # the reference corpus, and the one thing missing is a language set the
      # index was not built with. AppAPI hands its environment to the container
      # at registration time, so the set is changed where it really lives, in
      # the environment of the container, and the container is created again
      # from its own inspect output with everything else of it unchanged. An
      # app_api:app:register would deploy a second time and prove the store
      # install path a third time, which is the subject of a different block.
      #
      # What this step must never do is make itself easy. Every one of the ten
      # is a sentence about an installation in the field: the search answers
      # while the rebuild runs, no document is lost, nothing is read from
      # Nextcloud again, no page is put through tesseract again, and not one
      # byte of the vector stock is written again.
      - name: Store upgrade 6, the rebuild a changed language set orders
        if: matrix.server-version == 'stable34' && matrix.runner == 'ubuntu-24.04' && env.RELEASE_TAG == ''
        env:
          # GitHub evaluates a run scalar as one template as soon as it holds a
          # single expression, and caps that template at 21000 characters. This
          # block is longer, so the two matrix values arrive as plain
          # environment variables and the run text stays expression free.
          MATRIX_SERVER_VERSION: ${{ matrix.server-version }}
          MATRIX_RUNNER: ${{ matrix.runner }}
        run: |
          . "${RUNNER_TEMP}/upgrade-probe.sh"

          # The digest of the vector stock, in the container that holds it. It
          # lives here and not in the shared probe because this is the only step
          # that asks the question, and it answers the word absent rather than
          # failing on a missing file: whether there is a stock at all is a
          # precondition below and not a detail of the reader.
          vectors_digest() {
            container=$(findling_container)
            if [ -z "${container}" ]; then
              echo "no running findling_backend container, so there is no vector stock to read" >&2
              return 1
            fi
            docker exec "${container}" sh -c \
              'if [ -f "${APP_PERSISTENT_STORAGE}/vectors.db" ]; then sha256sum "${APP_PERSISTENT_STORAGE}/vectors.db" | cut -d" " -f1; else echo absent; fi'
          }

          # ---------------------------------------------------------------
          # The state the rebuild starts from, and the four conditions that
          # make the ten assurances below mean anything.
          # ---------------------------------------------------------------
          snapshot "${RUNNER_TEMP}/rebuild-before.json" rebuild-before
          before="${RUNNER_TEMP}/rebuild-before.json"
          echo "the state before the rebuild:"
          jq . "${before}"

          vectors_before=$(vectors_digest)
          echo "the vector stock before the rebuild: ${vectors_before}"

          # An existing installation carries no languages mark until its first
          # rebuild stamps one (the finding of run 35989391950): the report
          # renders that absence as the empty string. Empty is therefore the
          # legacy reading of de,en and a valid start; an explicit de,en is
          # equally valid. Any OTHER value means a rebuild already ran or a
          # seed wrote a wish as a fact, and then the jump below would not
          # measure what this step claims.
          if ! jq -e '.marks.languages == "de,en" or .marks.languages == ""' "${before}" > /dev/null; then
            echo "::error::the installation reports the languages mark $(jq -r '.marks.languages' "${before}") and neither de,en nor the legacy absence, so setting ${REBUILD_LANGUAGES} would order something other than the jump this step measures"
            exit 1
          fi
          if ! jq -e '.container.rebuildState == "idle"' "${before}" > /dev/null; then
            echo "::error::a rebuild directory is already lying on the volume, so this step would measure the end of somebody else's run"
            exit 1
          fi
          if ! jq -e '[.terms[]] | all(. == 1)' "${before}" > /dev/null; then
            echo "::error::not every one of the three terms brings back exactly one file before the rebuild"
            echo "An unchanged count after the rebuild would then be the unchanged absence of a hit."
            jq '.terms' "${before}"
            exit 1
          fi
          if [ "${vectors_before}" = "absent" ]; then
            echo "::error::this installation holds no vectors.db, so assurance 9 would compare two absences and prove nothing about a re-embedding"
            echo "The vector stock is opened on the first indexing pass, so its absence here is a finding about that pass."
            exit 1
          fi
          echo "languages mark de,en, no rebuild directory, three terms with one file each, a vector stock to compare"

          # The app password, taken once and used for every overview call of the
          # loop below. overview.sh takes a fresh one on every call, which costs
          # a second or more, and a second is a long time against a rebuild of
          # a few seconds: the banner has to be read WHILE the run is on, so the
          # reader has to be cheap. The two ways are the ones overview.sh uses,
          # in the same order and for the same reason, and the value itself is
          # never printed.
          apppw=""
          if NC_PASS=password "${RUNNER_TEMP}/nc-occ.sh" user:add-app-password admin \
            --password-from-env > "${RUNNER_TEMP}/rebuild-apppw.txt" 2>&1; then
            apppw=$(grep -oE '[A-Za-z0-9+/=._-]{40,}' "${RUNNER_TEMP}/rebuild-apppw.txt" | tail -1)
          fi
          if [ -z "${apppw}" ]; then
            apppw=$(curl -s -u admin:password -H 'OCS-APIRequest: true' \
              'http://localhost:8080/ocs/v2.php/core/getapppassword?format=json' \
              | grep -o '"apppassword":"[^"]*"' | cut -d'"' -f4 || true)
          fi
          if [ -z "${apppw}" ]; then
            echo "::error::no app password could be taken, so the rebuild banner could not be read while the run is on"
            exit 1
          fi
          # Audit finding L-19-06, and both lines are cheap insurance rather
          # than a leak that was measured. Only the length is ever printed, so
          # nothing writes the value today; a later set -x, an error message
          # from curl or a run with ACTIONS_STEP_DEBUG would write it
          # unredacted, and the file underneath holds it in the clear on the
          # runner for the rest of the job. The credential belongs to a
          # throwaway instance whose admin password is the word password,
          # which is why this is two lines and not a design.
          echo "::add-mask::${apppw}"
          rm -f "${RUNNER_TEMP}/rebuild-apppw.txt"
          echo "app password: obtained (length ${#apppw})"

          # One overview call and nothing else, the status code on stdout and
          # the body in the file the caller names.
          fast_overview() {
            curl -s -o "$1" -w '%{http_code}' \
              -u "admin:${apppw}" \
              -H 'OCS-APIRequest: true' \
              -H 'Accept: application/json' \
              http://localhost:8080/index.php/apps/findling/admin/overview
          }

          # The counter sample for the reader itself: it has to work BEFORE the
          # restart, or a loop that sees no banner would be a loop that cannot
          # see one. The value asserted here is the idle one, which is also the
          # third snapshot of assurance 3 read from the other side.
          code=$(fast_overview "${RUNNER_TEMP}/rebuild-overview-before.json")
          if [ "${code}" != "200" ] \
            || ! jq -e '.backend.rebuildRunning == false and .backend.languagesActive == "de,en"' \
                 "${RUNNER_TEMP}/rebuild-overview-before.json" > /dev/null; then
            echo "::error::the cheap overview reader answered HTTP ${code} without the idle state it has to see before the restart"
            head -c 600 "${RUNNER_TEMP}/rebuild-overview-before.json"
            exit 1
          fi
          echo "the overview reader works and reports rebuildRunning false at languagesActive de,en"

          # ---------------------------------------------------------------
          # The restart with the new set. The container is created again out of
          # its own inspect output, with one environment entry changed and
          # everything else carried over, and every shape this reconstruction
          # does not understand ends the step instead of being guessed at.
          # ---------------------------------------------------------------
          container=$(findling_container)
          if [ -z "${container}" ]; then
            echo "::error::no running findling_backend container to restart"
            docker ps -a
            exit 1
          fi
          spec="${RUNNER_TEMP}/rebuild-container.json"
          docker inspect "${container}" > "${spec}"

          image=$(jq -r '.[0].Config.Image' "${spec}")
          netmode=$(jq -r '.[0].HostConfig.NetworkMode' "${spec}")
          policy=$(jq -r '.[0].HostConfig.RestartPolicy.Name // ""' "${spec}")
          if [ -z "${image}" ] || [ "${image}" = "null" ]; then
            echo "::error::docker inspect names no image for ${container}"
            exit 1
          fi
          # --net host is what app_api:daemon:register set for harp_proxy_host
          # further up in this file, and it is the reason this reconstruction is
          # short: no ports, no networks and no aliases to carry. A container in
          # any other mode is one this step does not understand.
          if [ "${netmode}" != "host" ]; then
            echo "::error::${container} runs in network mode ${netmode} and not host, which is not the shape harp_proxy_host creates"
            exit 1
          fi
          # An entrypoint or a command the container overrides would be lost by
          # a plain docker run, and losing it silently would start a container
          # that does something else. Compared against the image rather than
          # carried, because carrying an override is how this reconstruction
          # would grow into a second deployment path.
          docker image inspect "${image}" > "${RUNNER_TEMP}/rebuild-image.json"
          for field in Entrypoint Cmd; do
            mine=$(jq -c ".[0].Config.${field}" "${spec}")
            theirs=$(jq -c ".[0].Config.${field}" "${RUNNER_TEMP}/rebuild-image.json")
            if [ "${mine}" != "${theirs}" ]; then
              echo "::error::the container overrides ${field} (${mine} against ${theirs} of the image), and this restart carries no overrides"
              exit 1
            fi
          done

          envfile="${RUNNER_TEMP}/rebuild-env.list"
          jq -r '.[0].Config.Env[]' "${spec}" > "${RUNNER_TEMP}/rebuild-env-all.list"
          grep -v '^FINDLING_LANGUAGES=' "${RUNNER_TEMP}/rebuild-env-all.list" > "${envfile}" || true
          if [ ! -s "${envfile}" ]; then
            echo "::error::the container carries no environment left after the filter, which is not a container this restart understands"
            exit 1
          fi
          printf 'FINDLING_LANGUAGES=%s\n' "${REBUILD_LANGUAGES}" >> "${envfile}"
          # The names only. The environment of this container carries APP_SECRET
          # among other things, and a step log is not the place for it.
          echo "the environment of the restarted container, by name:"
          cut -d= -f1 "${envfile}" | sort | tr '\n' ' '
          echo

          mounts="${RUNNER_TEMP}/rebuild-mounts.list"
          jq -r '.[0].Mounts[]
                 | if .Type == "volume" then "type=volume,source=" + .Name + ",target=" + .Destination + (if .RW then "" else ",readonly" end)
                   elif .Type == "bind" then "type=bind,source=" + .Source + ",target=" + .Destination + (if .RW then "" else ",readonly" end)
                   else "UNSUPPORTED " + .Type end' "${spec}" > "${mounts}"
          if grep -q '^UNSUPPORTED' "${mounts}"; then
            echo "::error::the container has a mount this restart does not understand:"
            cat "${mounts}"
            exit 1
          fi
          if ! grep -q "source=${UPGRADE_VOLUME}," "${mounts}"; then
            echo "::error::the container does not mount ${UPGRADE_VOLUME}, so the restart would not be about the index this proof built"
            cat "${mounts}"
            exit 1
          fi
          echo "the mounts carried over:"
          cat "${mounts}"

          labels="${RUNNER_TEMP}/rebuild-labels.list"
          jq -r '.[0].Config.Labels // {} | to_entries[] | .key + "=" + .value' "${spec}" > "${labels}"

          # The one thing docker inspect does not describe, and the finding of
          # run 35997241359. HaRP writes the client certificate of the tunnel,
          # its key and the CA into /certs/frp of the container AFTER it created
          # it, through docker exec; the image brings that directory along empty
          # and owned by the app user for exactly that purpose (the comment at
          # the chown line of backend/Dockerfile). The three files therefore live
          # in the writable layer of the container, which docker rm takes with
          # it, and a container created again out of the image alone finds no
          # readable certificate: harp_connect.sh configures the tunnel without a
          # client certificate, the frp server refuses every login with EOF, and
          # the installation is left with a container that is up, an app that
          # answers on its socket and a Nextcloud that reports backendReachable
          # false. The rebuild ran and finished in two seconds in that run, and
          # the loop below spent its whole budget reading an empty backend block.
          #
          # docker exec runs as the image user, the same uid harp_connect.sh
          # reads them with, so this test asks the very question the tunnel asks.
          certs="${RUNNER_TEMP}/rebuild-certs.tar"
          if ! docker exec "${container}" sh -c \
            'test -r /certs/frp/client.crt && test -r /certs/frp/client.key && test -r /certs/frp/ca.crt'; then
            echo "::error::${container} carries no readable /certs/frp/client.crt, client.key and ca.crt, so this restart has no tunnel to hand to the container it creates"
            echo "HaRP places those three through docker exec after it created the container, and this step cannot invent them."
            docker exec "${container}" ls -la /certs/frp || true
            docker logs "${container}" 2>&1 | grep -i 'harp_connect' || true
            exit 1
          fi
          docker cp "${container}:/certs/frp" - > "${certs}"

          run_args=(--name "${container}" --network host --env-file "${envfile}")
          if [ -n "${policy}" ] && [ "${policy}" != "no" ]; then
            run_args+=(--restart "${policy}")
          fi
          while IFS= read -r mount; do
            if [ -n "${mount}" ]; then run_args+=(--mount "${mount}"); fi
          done < "${mounts}"
          while IFS= read -r label; do
            if [ -n "${label}" ]; then run_args+=(--label "${label}"); fi
          done < "${labels}"

          # Created, then filled, then started, and in that order. frpc reads
          # /certs/frp once while it comes up, so a container that is started
          # first and handed its certificates afterwards spends the rest of its
          # life in the reconnect loop that this three step dance exists to
          # avoid. docker cp works against a created container, which is what
          # makes the window between the two commands the right place for it.
          docker rm -f "${container}" > /dev/null
          docker create "${run_args[@]}" "${image}" > /dev/null
          docker cp - "${container}:/certs" < "${certs}"
          rebuild_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker start "${container}" > /dev/null
          docker ps --filter "name=${container}" --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "the container was created again at ${rebuild_start} with FINDLING_LANGUAGES=${REBUILD_LANGUAGES} and the tunnel certificates of its predecessor"

          # ---------------------------------------------------------------
          # The run, watched. The loop leaves the moment the rebuild is through
          # and never sleeps a fixed pause while the window is still open: the
          # middle snapshot of assurance 3 and the canary of assurance 5 are
          # both inside a window that lasts seconds, and a reader that paused
          # would be a reader that missed it. That is the same lesson of plan
          # 06-11 the waiting loops above are built on, applied to a window
          # rather than to a hit.
          # ---------------------------------------------------------------
          during="${RUNNER_TEMP}/rebuild-during.json"
          probe_a="${RUNNER_TEMP}/rebuild-during-a.json"
          probe_b="${RUNNER_TEMP}/rebuild-during-b.json"
          caught=""
          finished=""
          reachable=""
          rounds=0
          # How many of those rounds read the banner up, which is the length of
          # the window in the only unit this loop can measure it in. It is
          # printed whatever happens, because the next person to size the fill
          # corpus of "Store upgrade 2" needs a number and not an impression:
          # one round is a window that was nearly missed, nought is the finding
          # of run 36001341420, and the fill corpus is dimensioned for 15 to 30.
          running_rounds=0
          deadline=$(( $(date +%s) + REBUILD_BUDGET_SECONDS ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            rounds=$(( rounds + 1 ))
            code=$(fast_overview "${probe_a}") || code="000"
            if [ "${code}" != "200" ]; then
              sleep 1
              continue
            fi
            running=$(jq -r '.backend.rebuildRunning' "${probe_a}" 2> /dev/null || echo "")
            active=$(jq -r '.backend.languagesActive' "${probe_a}" 2> /dev/null || echo "")

            # The overview answers 200 even when Nextcloud cannot reach the
            # backend at all, and then rebuildRunning false with an empty
            # languagesActive is the absence of an answer and not an answer.
            # Read apart from the progress so that the verdict at the end of the
            # budget can name the tunnel when the tunnel is what broke, instead
            # of blaming a rebuild that nobody was in a position to watch. Run
            # 35997241359 spent 133 rounds on an empty backend block and ended
            # with "the rebuild did not finish", while the container log of that
            # very run says the rebuild ended after two seconds.
            if [ "$(jq -r '.backendReachable' "${probe_a}" 2> /dev/null || echo "")" = "true" ]; then
              reachable="yes"
            fi
            if [ "${running}" = "true" ]; then
              running_rounds=$(( running_rounds + 1 ))
            fi

            # The middle snapshot, and the canary inside it. The search is asked
            # BETWEEN two progress readings and the snapshot carries both, which
            # is what makes "during" a measurement rather than a claim: a canary
            # with a progress reading on either side of it cannot have run
            # before or after the rebuild.
            if [ -z "${caught}" ] && [ "${running}" = "true" ]; then
              # The status of the search itself, taken from the call and not
              # from a substitution with a fallback in it: term_hits fails
              # closed on a status other than 200 and on an unreadable body, and
              # an || inside the assignment would swallow exactly that verdict
              # and leave an empty count that reads like nought hits.
              if hits=$(term_hits Belehrung); then
                status=0
              else
                status=1
                hits=""
              fi
              code_b=$(fast_overview "${probe_b}") || code_b="000"
              if [ "${code_b}" = "200" ] && jq -e '.backend.rebuildRunning == true' "${probe_b}" > /dev/null; then
                jq -n \
                  --argjson a "$(jq -c '.backend' "${probe_a}")" \
                  --argjson b "$(jq -c '.backend' "${probe_b}")" \
                  --arg hits "${hits}" \
                  --arg searchFailed "${status}" \
                  '{
                     before: { rebuildRunning: $a.rebuildRunning, rebuildDone: $a.rebuildDone, rebuildTotal: $a.rebuildTotal, languagesActive: $a.languagesActive },
                     after: { rebuildRunning: $b.rebuildRunning, rebuildDone: $b.rebuildDone, rebuildTotal: $b.rebuildTotal, languagesActive: $b.languagesActive },
                     canaryHits: $hits,
                     canaryFailed: ($searchFailed != "0")
                   }' > "${during}"
                caught="yes"
                echo "the rebuild was caught in the act in round ${rounds}:"
                jq -c . "${during}"
              fi
            fi

            if [ "${running}" = "false" ] && [ "${active}" = "${REBUILD_LANGUAGES_NORMALISED}" ]; then
              finished="yes"
              break
            fi
            # A fifth of a second while the window may still be open, two
            # seconds once it has been caught. The short pause and the cheap
            # reader together sample about four times a second, which is what
            # makes 15 to 30 readings out of the window the fill corpus of
            # "Store upgrade 2" buys. It is not zero either, because a loop
            # without a pause is a busy wait against an instance that is doing
            # the work being watched, and the path it walks goes through HaRP.
            if [ -n "${caught}" ]; then
              sleep 2
            else
              sleep 0.2
            fi
          done

          rebuild_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -z "${finished}" ]; then
            if [ -z "${reachable}" ]; then
              echo "::error::Nextcloud did not reach the backend in a single one of ${rounds} rounds, so nothing about the rebuild was measured here"
              echo "This is a finding about the container this step created and the tunnel it speaks through, not about the rebuild."
              docker logs "${container}" 2>&1 | grep -i 'harp_connect\|mutual TLS\|login to server' | head -n 5 || true
            else
              echo "::error::the rebuild did not finish within REBUILD_BUDGET_SECONDS=${REBUILD_BUDGET_SECONDS} after ${rounds} rounds"
              echo "This is a finding about the rebuild and not a reason to raise the budget."
            fi
            head -c 1000 "${probe_a}" || true
            echo
            docker logs "${container}" 2>&1 | tail -n 80 || true
            exit 1
          fi
          echo "the rebuild is through after ${rounds} rounds, languagesActive is ${REBUILD_LANGUAGES_NORMALISED}"
          echo "the banner was up in ${running_rounds} of those rounds, which is the window this reader saw"

          # The log of the window, and the log of the whole life of this
          # container, as two files. The window is what assurance 7 is about,
          # because an indexing pass AFTER the rebuild is ordinary work and not
          # a violation; the whole log is what assurance 8 is about, because a
          # drift line written at any point of the life of this container is a
          # raised generation, and the band run is supposed to need none.
          window_log="${RUNNER_TEMP}/rebuild-window.log"
          whole_log="${RUNNER_TEMP}/rebuild-exapp.log"
          docker logs --until "${rebuild_end}" "${container}" > "${window_log}" 2>&1
          docker logs "${container}" > "${whole_log}" 2>&1

          snapshot "${RUNNER_TEMP}/rebuild-after.json" rebuild-after
          after="${RUNNER_TEMP}/rebuild-after.json"
          echo "the state after the rebuild:"
          jq . "${after}"
          vectors_after=$(vectors_digest)
          echo "the vector stock after the rebuild: ${vectors_after}"

          # ---------------------------------------------------------------
          # The ten assurances. One comparison, one sentence saying what it
          # means, and every one of them runs: fail=1 and never exit 1, for the
          # reason "Store upgrade 5" states, because a step that stopped at the
          # first difference would hide which of the ten the rebuild broke.
          # ---------------------------------------------------------------
          fail=0
          unchanged() {
            path="$1"
            meaning="$2"
            was=$(jq -r "${path}" "${before}")
            now=$(jq -r "${path}" "${after}")
            if [ "${was}" != "${now}" ]; then
              echo "::error::${meaning}: ${path} was ${was} before the rebuild and is ${now} after it"
              fail=1
            else
              echo "unchanged  ${path} = ${was}   (${meaning})"
            fi
          }

          echo "--- 1, the schema mark moved by exactly one step ---"
          # Three branches, after the shape of the tantivyVersion block in
          # "Store upgrade 5": a value that cannot be compared, a value that did
          # not move, and a value that moved further than one step. One step is
          # the only right answer, because SCHEMA_VERSION is a counter and a
          # rebuild answers the drift of the running code and no other.
          was=$(jq -r '.marks.schemaVersion' "${before}")
          now=$(jq -r '.marks.schemaVersion' "${after}")
          case "${was}:${now}" in
            *[!0-9:]*|:*|*:)
              echo "::error::schemaVersion is not a pair of numbers (${was} before, ${now} after), so nothing here can be compared"
              fail=1
              ;;
            *)
              if [ "$(( now - was ))" = "1" ]; then
                echo "the schema mark went from ${was} to ${now}, which is exactly one step"
              elif [ "${was}" = "${now}" ]; then
                echo "::error::the schema mark is still ${was} after the rebuild, so nothing was stamped and the rebuild did not go through"
                fail=1
              else
                echo "::error::the schema mark went from ${was} to ${now}, which is not the one step a rebuild answers"
                fail=1
              fi
              ;;
          esac

          echo "--- 2, the languages mark names the set, in schema field order ---"
          now=$(jq -r '.marks.languages' "${after}")
          if [ "${now}" != "${REBUILD_LANGUAGES_NORMALISED}" ]; then
            echo "::error::the languages mark reads ${now} after a rebuild ordered with ${REBUILD_LANGUAGES}, and it has to read ${REBUILD_LANGUAGES_NORMALISED}"
            echo "An unnormalised mark is a rebuild at every start, because the next comparison never matches."
            fail=1
          else
            echo "the mark reads ${now} for a set given as ${REBUILD_LANGUAGES}, so the order is the schema's and not the admin's"
          fi

          echo "--- 3, the rebuild banner rose and is down again ---"
          # Three readings and the middle one is the one that was missing until
          # today: before the restart (asserted above, rebuildRunning false),
          # inside the run, and after it.
          if [ -z "${caught}" ]; then
            echo "::error::the rebuild was never seen running, so the banner of plan 18-10 was never observed up"
            echo "The loop read the overview ${rounds} times and ${running_rounds} of them answered rebuildRunning true."
            # The remedy is the window and not the reader, and the reason is
            # measured: the carrying costs 0.25 to 0.6 s per MB of body text and
            # almost nothing per document, so a reader cannot be made fine
            # grained enough for a corpus that carries in tenths of a second,
            # and the canary of assurance 5 needs a search AND a second reading
            # inside the same window. The fill corpus of "Store upgrade 2" is
            # the knob: it is 64 documents of 500019 characters today and it
            # buys about 8 s of carrying.
            fail=1
          else
            echo "the banner was up while the run was on:"
            jq -c '{before: .before.rebuildRunning, after: .after.rebuildRunning}' "${during}"
          fi
          code=$(fast_overview "${RUNNER_TEMP}/rebuild-overview-after.json") || code="000"
          if [ "${code}" != "200" ] \
            || ! jq -e '.backend.rebuildRunning == false' "${RUNNER_TEMP}/rebuild-overview-after.json" > /dev/null; then
            echo "::error::the overview answered HTTP ${code} and does not report rebuildRunning false after the run, so the banner stayed up"
            head -c 600 "${RUNNER_TEMP}/rebuild-overview-after.json"
            fail=1
          else
            echo "the banner is down again after the run"
          fi

          echo "--- 4, the same hits for the three terms of the corpus ---"
          for term in Belehrung Auszug Erinnerung; do
            unchanged ".terms.${term}" "the search for ${term} answers differently after the rebuild, so the rebuild changed what the index finds"
          done

          echo "--- 5, a search in the middle of the run answered with hits ---"
          if [ -z "${caught}" ]; then
            echo "::error::no canary was taken inside the run, so nothing says the search kept answering while the index was being rebuilt"
            fail=1
          elif ! jq -e '.canaryFailed == false and (.canaryHits | tonumber) >= 1' "${during}" > /dev/null 2>&1; then
            echo "::error::the canary search inside the run did not answer with at least one hit, which is the promise that a rebuild is invisible to a user"
            jq -c . "${during}"
            fail=1
          else
            echo "the search for Belehrung answered $(jq -r '.canaryHits' "${during}") hit(s) at $(jq -r '.before.rebuildDone' "${during}") of $(jq -r '.before.rebuildTotal' "${during}") documents carried"
          fi

          echo "--- 6, the same document count ---"
          unchanged '.container.docs' "the number of documents in the index changed, so the rebuild added or lost documents"
          unchanged '.container.indexed' "the container counts a different number of indexed files after the rebuild"

          echo "--- 7, Nextcloud was not asked and nothing was extracted again ---"
          unchanged '.nextcloud.scheduled' "the work stock is not empty after the rebuild, so something requeued work nobody asked for"
          unchanged '.nextcloud.running' "a worker holds queue rows after the rebuild, so something requeued work nobody asked for"
          # The line every indexing pass with claimed rows writes, and its
          # absence is the absence of every such pass: no pass, no extraction,
          # no tesseract. Read out of the window log and not out of the whole
          # one, because a pass after the rebuild is ordinary work.
          if [ ! -s "${window_log}" ]; then
            echo "::error::the container wrote no log at all during the rebuild, so the absence of an indexing pass says nothing"
            fail=1
          else
            passes=$(grep -c 'pass finished, claimed=' "${window_log}" || true)
            if [ "${passes}" != "0" ]; then
              echo "::error::the container log carries ${passes} indexing pass(es) during the rebuild, so files were read and put through the extraction path again"
              grep -n 'pass finished, claimed=' "${window_log}"
              fail=1
            else
              echo "no indexing pass in $(wc -l < "${window_log}") lines of container log during the rebuild"
            fi
          fi

          echo "--- 8, no drift line: the band run answers the language jump, no generation is raised ---"
          # The sentence start_rebuild_on_drift writes when it raises the
          # generation, counted over the whole life of this container. None is
          # the right answer since plan 21-01 (owner decision of 2026-09-25):
          # the poller opens the state database with the schema mark and the
          # language mark exempted (answered_elsewhere=MARKS_A_REBUILD_ANSWERS),
          # because the band run carries the documents over and makes both
          # marks true. Until then this assurance demanded exactly one line,
          # and that line was a raised generation: every stored verdict went
          # stale and the next crawl read every file again, a full reindex
          # behind the re-analysis that exists to spare it. One or more lines
          # here mean that raise is back. That the drift was noticed at all is
          # proved elsewhere in this step: the rebuild banner was observed up
          # and the languages mark moved, and neither happens without it.
          drift=$(grep -c 'built by different code' "${whole_log}" || true)
          if [ "${drift}" != "0" ]; then
            echo "::error::the container log carries ${drift} line(s) of start_rebuild_on_drift, so the language jump raised the generation and ordered a full reindex behind the band run"
            grep -n 'built by different code' "${whole_log}" || true
            fail=1
          else
            echo "no start_rebuild_on_drift line in $(wc -l < "${whole_log}") lines of container log"
          fi

          echo "--- 9, the vector stock is byte for byte the same file ---"
          # The cheapest proof of "nothing was embedded again" there is, and it
          # is made at the artefact rather than at an absent log line: a digest
          # that did not move cannot have had a vector written into it. The
          # rebuild carries documents from one index directory into the next and
          # never touches this file, which is why it lives beside the index
          # directory rather than inside it.
          if [ "${vectors_before}" != "${vectors_after}" ]; then
            echo "::error::vectors.db went from ${vectors_before} to ${vectors_after}, so the rebuild wrote into the vector stock and something was embedded again"
            fail=1
          else
            echo "vectors.db is unchanged at ${vectors_after}"
          fi

          echo "--- 10, the Spanish question finds exactly one document now ---"
          # The far end of the before and after of plan 19-08, and it is green
          # only if both halves of this milestone are: the rebuild has to have
          # carried the stored text through the Spanish chain (phase 18), and
          # the field list of a question has to have taken body_es in once the
          # schema mark moved (phase 19). Either half missing and this is
          # nought.
          #
          # A nought here is a finding and never a reason to soften the
          # assertion. It means the rebuild filled no Spanish field or the
          # field plan opened none, and that is exactly the failure this whole
          # path was built to catch.
          #
          # The two counter proofs stand elsewhere on purpose, one per state
          # they are about: "Store upgrade 3" asserts nought on the released
          # installation and assurance 7 of "Store upgrade 5" asserts nought
          # after the upgrade and before this rebuild. Without those two this
          # number would be a hit that might always have been there, and with
          # them the whole chain reads 0, 0, 1.
          if ! jq -e '.spanish == 1' "${after}" > /dev/null; then
            echo "::error::the question alemanes answers $(jq -r '.spanish' "${after}") document(s) after the rebuild and it has to answer exactly one"
            echo "A nought means the rebuild wrote no body_es field or the field plan of a question did not take it in; more than one means a second document of this account answers a question that was chosen to have exactly one answer."
            fail=1
          else
            echo "the question alemanes went from $(jq -r '.spanish' "${before}") to $(jq -r '.spanish' "${after}") hits across the rebuild, which is the Spanish chain and the field plan working together"
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "the two states side by side:"
            diff -u "${before}" "${after}" || true
            exit 1
          fi

          echo "all ten assurances hold"
          {
            echo ""
            echo "### Rebuild on the upgraded installation (${MATRIX_SERVER_VERSION}, ${MATRIX_RUNNER})"
            echo ""
            echo "- \`FINDLING_LANGUAGES=${REBUILD_LANGUAGES}\` was set on the container of the upgraded instance and the container was created again on the volume \`${UPGRADE_VOLUME}\`, without a second registration"
            echo "- the schema mark moved by exactly one step, the languages mark reads \`${REBUILD_LANGUAGES_NORMALISED}\`"
            echo "- the rebuild banner was observed up while the run was on and down after it, in ${running_rounds} of ${rounds} readings"
            echo "- unchanged: the hits for Belehrung, Auszug and Erinnerung, the document counts, the work stock"
            echo "- a search inside the run answered with hits, no indexing pass ran during it, no \`built by different code\` line (no generation raised)"
            echo "- \`vectors.db\` is byte for byte the same file"
            echo "- the Spanish question \`alemanes\` went from 0 hits to 1 across the rebuild: nought on the released installation, nought after the upgrade and before this rebuild, one after it"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect the logs and tear the deployment down
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/harp-logs"
          container=$(docker ps -a --filter 'name=findling_backend' --format '{{.Names}}' | head -n 1)
          if [ -n "${container}" ]; then
            docker logs "${container}" > "${RUNNER_TEMP}/harp-logs/exapp.log" 2>&1 || true
          fi
          docker logs appapi-harp > "${RUNNER_TEMP}/harp-logs/harp.log" 2>&1 || true
          docker logs exapps-proxy > "${RUNNER_TEMP}/harp-logs/proxy.log" 2>&1 || true
          # The evidence of the store install pass, saved rather than left in the
          # step log where it scrolls away: the recorded occ calls, the registry
          # manifests and the three integrity verdicts.
          # The eight after the integrity verdicts belong to the upgrade proof
          # of plan 11-07 and are the whole point of it: two states of one
          # installation, the verdict of occ upgrade between them, and the log
          # of the container that came up on the volume of the old one. The
          # seven after those belong to "Store upgrade 6" and are the same kind
          # of evidence for the rebuild, the middle snapshot included, which is
          # the one a reader cannot reconstruct afterwards because the state it
          # describes lasted seconds. All of them exist on the one leg that runs
          # those blocks, and the copy is guarded by the test below anyway.
          #
          # rebuild-env.list is deliberately NOT in this list. It is the whole
          # environment of the ExApp container and it carries APP_SECRET; the
          # step that writes it prints the names of its entries and never their
          # values, and an artefact would undo that.
          for evidence in occ-calls.txt manifest-released.txt manifest-dev.txt \
            integrity-clean.txt integrity-tampered.txt integrity-restored.txt \
            upgrade-before.json upgrade-after.json upgrade-before-status.txt \
            upgrade-after-status.txt upgrade-occ.txt upgrade-overview.json \
            upgrade-providers.json upgrade-exapp.log \
            rebuild-before.json rebuild-after.json rebuild-during.json \
            upgrade-rebuild-before-status.txt upgrade-rebuild-after-status.txt \
            rebuild-window.log rebuild-exapp.log rebuild-mounts.list; do
            if [ -f "${RUNNER_TEMP}/${evidence}" ]; then
              cp "${RUNNER_TEMP}/${evidence}" "${RUNNER_TEMP}/harp-logs/${evidence}"
            fi
          done
          docker rm -f appapi-harp registry exapps-proxy 2>/dev/null || true
          # The ExApp container outlives the assertions, because the last of
          # them read it while it was running, so the teardown takes it along.
          # Its log is already saved above, which is the reason this line comes
          # after it.
          if [ -n "${container}" ]; then
            docker rm -f "${container}" 2>/dev/null || true
          fi

      - name: Upload the logs
        if: always()
        # The runner belongs in the name, and it did not until 2026-09-11
        # (DI-11-04, decided in the phase 11 audit, docs/audits/
        # 2026-09-phase-11/README.md, section 5). Since plan 11-04 two legs run
        # server-version stable34, one on ubuntu-24.04 and one on
        # ubuntu-24.04-arm, so the old name produced two artefacts called
        # harp-logs-stable34 in the same run: 13,833 bytes and 7,825 bytes in
        # run 34546421219. Only one of the two carries the evidence files of
        # the upgrade proof, because only one leg runs that block, and whoever
        # downloaded "the artefact harp-logs-stable34" had no way of telling
        # which one they got. Every earlier report names the old form; that
        # name stays valid for the runs that wrote it, and this one applies
        # from here on.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harp-logs-${{ matrix.server-version }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/harp-logs
          if-no-files-found: warn
          retention-days: 7
