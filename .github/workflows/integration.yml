name: Integration

# The walking skeleton, end to end: a real Nextcloud is installed, both apps are
# enabled, the ExApp runs as a native process, it is registered through AppAPI
# and the unified search API is asked for a term. The answer has to carry a
# string that can only have been produced inside the running backend. The last
# step stops the backend again and proves that its absence costs a result group
# and nothing else.
#
# The second job in this file proves the read only invariant (IDX-07) on the
# same setup: the container reads every file of the reference corpus once, and
# checksums, modification times, sizes and the file count have to be identical
# afterwards. A user without access to the corpus runs the very same list and
# has to come back with nothing, which is the negative half of COMP-02.
#
# Since phase 3 that job also runs the whole indexing pass over the corpus, OCR
# track included, because the download path is no longer the only path that
# touches a user file: a page is rendered to pixels and an engine is run over it,
# and that is the track the predecessor of this app destroyed data on. And it
# counts the verdicts afterwards, which is the other half of the same thought. A
# checksum comparison only measures what the run actually touched, so a pass that
# never reached the new files would be green and would prove nothing.
#
# The third job, added in phase 2, is the product promise itself: the same corpus
# is indexed and then searched through the ordinary Nextcloud search route, with
# ten German language cases, five of them a compound found through one of its
# parts and every one of those five red without Filter.split_compound, a second
# user who sees exactly the one file that was shared with him, a
# probe of the time budget against an artificially slow backend, and all of it on
# two database dialects.
on:
  push:
    paths:
      - 'php/**'
      - 'backend/**'
      - 'testdata/corpus/**'
      # The expected verdict of every corpus file stands in this document and
      # the verdict counter reads it from there. A reference that can change
      # without the gate running is not a reference.
      - 'testdata/CORPUS.md'
      - 'scripts/dev/build_corpus.py'
      - 'scripts/ci/**'
      - '.github/workflows/integration.yml'
      # The setup of both jobs lives in a composite action, so a change there is a
      # change to this workflow. Without this line the two most expensive jobs in
      # the repository would silently not run on exactly the commits that rewrite
      # how they are set up.
      - '.github/actions/setup-test-nc/**'
  pull_request:
    paths:
      - 'php/**'
      - 'backend/**'
      - 'testdata/corpus/**'
      - 'testdata/CORPUS.md'
      - 'scripts/dev/build_corpus.py'
      - 'scripts/ci/**'
      - '.github/workflows/integration.yml'
      # The setup of both jobs lives in a composite action, so a change there is a
      # change to this workflow. Without this line the two most expensive jobs in
      # the repository would silently not run on exactly the commits that rewrite
      # how they are set up.
      - '.github/actions/setup-test-nc/**'
  workflow_dispatch:
    inputs:
      tamper_probe:
        description: >-
          Modify one corpus file on purpose before the second checksum run. A
          gate that has never been seen failing is not known to work, so this
          switch exists to make it fail on demand. The run must end red.
        type: boolean
        default: false
      missing_verdict_probe:
        description: >-
          Drop the verdict of one corpus file on purpose, the WebP, which is the
          state a run has when a mimetype falls out of the allowlist. It is the
          falsification of the verdict counter and therefore of the sentence
          that a checksum comparison alone cannot prove anything. The run must
          end red, and red in the counter step, not in the checksum step.
        type: boolean
        default: false
      mutation_skip_probe:
        description: >-
          Leave the file that changes under the container alone: the overwriting
          step is skipped and the step after it has to go red. It is the
          falsification of that step, and it answers the one question a green
          run cannot answer by itself, namely whether the step could be green
          merely because the search finds nothing at all. The run must end red,
          and red in the step that asks for the new content.
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch. This is the most expensive workflow in the repository, two
# jobs that each install a whole Nextcloud, so a superseded run is the most
# expensive thing to keep alive.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walking-skeleton:
    name: walking-skeleton
    runs-on: ubuntu-24.04
    # Nothing here indexes, so this is the short one of the three deadlines. It
    # exists for the same reason as the others: a job that hangs must cost
    # minutes and not the default six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One server version only. The full stable32 / stable33 / stable34 matrix
        # becomes a scheduled run in phase 5, otherwise pull request feedback
        # gets slow.
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      # Test-only credentials of a throwaway instance that is destroyed with the
      # runner. Nothing here is reused anywhere else, and no real secret is ever
      # needed by this workflow.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      TESTUSER_PASS: 'findling-ci-canary-2026'
      # The two sides of the edge of the budget chain, and the first thing to
      # say about them is which link they straddle. It is
      # ExAppService::REQUEST_TIMEOUT_SECONDS, one and a half seconds, the
      # ceiling of ONE call. Provider::BUDGET_NANOSECONDS of two and a half
      # seconds is the wall clock of the whole result group across at most three
      # rounds, and every call shrinks its own timeout to what is left of it, so
      # the group budget can bound a call and never widen one. A single /search
      # therefore meets 1.5 first, and the edge sits there rather than at 2.5.
      #
      # Nine hundred milliseconds is six hundred of headroom under the ceiling,
      # and 2400 is nine hundred over it. Both distances are deliberately coarse
      # and not measured to the millisecond: between the stub and the assertion
      # sit a PHP request, the AppAPI proxy and a loopback round trip, and a step
      # that flips on a slow runner is not a test but a coin.
      #
      # 2400 also stays under the 2500 of the group budget, and that is the
      # reason for the number rather than a coincidence: the group budget alone
      # would NOT have ended this call, so the empty group of the upper case can
      # only be the work of the per call timeout.
      EDGE_UNDER_MS: '900'
      EDGE_OVER_MS: '2400'
      # How far below the naive expectation the upper case has to answer. The
      # bound it feeds is a difference and not an absolute number, so the speed
      # of the runner cancels out of it; the arithmetic stands at the step.
      EDGE_MARGIN_MS: '400'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance.
      #
      # These two checkouts stay in the job and stay in this order. actions/checkout
      # empties its target directory, so the server checkout at the workspace root
      # has to come first, and the second one is what puts the composite action
      # below into the workspace at all.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # The canary is the diagnostic question from pitfall 3: if findling shows
      # up in the provider list, a later failure sits in the container. If it
      # does not, the failure sits in the PHP app.
      - name: Canary, findling in the search provider list
        id: canary
        run: |
          curl -sf -u admin:password \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers' | tee providers.json
          jq -e '[.ocs.data[] | select(.id == "findling")] | length == 1' providers.json

      # The proof has to run as an ordinary user. The admin would work too, but
      # the user id in the answer is the load bearing part, and a second account
      # makes it impossible to confuse it with the installer.
      - name: Add a test user
        run: OC_PASS="${TESTUSER_PASS}" ./occ user:add --password-from-env testuser

      # The assertions in order of what they rule out. First: exactly one entry,
      # not "at least one", so a provider that answers twice or leaks a second
      # backend's hit is a red run. Second: the title is the one string the PHP
      # side accepts without a file behind it, which is also what proves the
      # permission recheck let the canary through rather than everything through.
      # Third, and this is the actual proof of the phase: the subline carries the
      # host name and the timestamp of the process that produced it and ends with
      # the user id that only the signed AppAPI header could have carried into the
      # backend. A hard coded hit in PHP cannot pass this. Fourth: the snippet is
      # plain text, so the search dialog has nothing to interpolate as markup.
      - name: Search as the test user
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee out.json
          jq -e '.ocs.data.entries | length == 1' out.json
          jq -e '.ocs.data.entries[0].title == "findling-canary"' out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' out.json
          jq -e '.ocs.data.entries[0].subline | contains("<") | not' out.json

      # The counter probe, and the reason the canary is allowed to stay at all.
      # It is produced inside the container for one single search term, so every
      # other term has to come back empty as long as nothing is indexed. Without
      # this step the canary could colour every search a user ever runs and
      # nobody would notice, because the step above only ever asks for the one
      # term that is supposed to show it.
      #
      # The elapsed time is printed rather than asserted. The wall clock of the
      # provider is two and a half seconds and this is the run that shows what a
      # search actually costs end to end, including the round that finds nothing.
      - name: Another term does not see the canary
        run: |
          start=$(date +%s%N)
          status=$(curl -s -o other.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=vertrag')
          elapsed_ms=$(( ( $(date +%s%N) - start ) / 1000000 ))
          cat other.json
          echo "the search for an ordinary term answered after ${elapsed_ms}ms with status ${status}"
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' other.json

      # A provider is skipped without a word when a client sends a filter it
      # does not declare, and a skipped provider looks exactly like a broken
      # backend: no error, no entry, no hint in any log. The dialog sends
      # title-only for "file name instead of content", so the reported list has
      # to name it, and it has to name the search term itself as well.
      - name: The reported filters name term and title-only
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers' | tee filters.json
          jq -e '[.ocs.data[] | select(.id == "findling")] | length == 1' filters.json
          jq -e '.ocs.data[] | select(.id == "findling") | .filters | has("term")' filters.json
          jq -e '.ocs.data[] | select(.id == "findling") | .filters | has("title-only")' filters.json

      # T2, the timeout path, and the reason it is a step rather than a note: the
      # unified search waits for every provider, so a slow backend does not cost
      # its own result group, it costs the whole search. ExAppService passes one
      # and a half seconds per call to AppAPI for exactly that reason, and a
      # timeout nobody has seen work is a timeout nobody knows to work.
      #
      # The registration stays untouched. Only the process behind the port is
      # exchanged for one that answers /search after ten seconds.
      - name: Replace the backend with one that hangs
        run: |
          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          python3 findling-src/scripts/ci/slow_backend.py > "${{ runner.temp }}/slow.log" 2>&1 &
          echo $! > "${{ runner.temp }}/slow.pid"
          for _ in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "the slow stub answers on the ExApp port"
              exit 0
            fi
            sleep 1
          done
          echo "the slow stub did not come up"
          cat "${{ runner.temp }}/slow.log" || true
          exit 1

      - name: A hanging backend costs a result group, not the search
        run: |
          start=$(date +%s)
          status=$(curl -s -o slow.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          elapsed=$(( $(date +%s) - start ))
          cat slow.json
          echo "the search answered after ${elapsed}s with status ${status}"
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' slow.json
          # One and a half seconds is the configured timeout of the first call,
          # and the second one is never made because the first one failed. Six is
          # the ceiling: high enough for PHP start up on a slow runner, far below
          # the ten seconds the stub takes, so removing the timeout turns this
          # step red.
          test "${elapsed}" -lt 6

      - name: Stop the hanging backend
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/slow.pid" ]; then
            kill "$(cat "${{ runner.temp }}/slow.pid")" 2>/dev/null || true
          fi

      # The step above is the total failure: ten seconds against every ceiling
      # in the chain, and one side of the question. On its own it says that a
      # backend which never answers costs a result group, which is worth
      # knowing and is not the same as knowing where the line runs.
      #
      # The four steps below are the line itself, from both sides. Only both
      # together say anything: an upper side on its own would be a second total
      # failure test with a smaller number, and a lower side on its own would
      # not show that anything ever gives up. The stub is the same process in
      # both, started twice with two different delays, so the only difference
      # between the two runs is the number the chain is measured against.
      - name: Start the stub just under the per call ceiling
        run: |
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          FINDLING_SLOW_BACKEND_DELAY_MS="${EDGE_UNDER_MS}" \
            python3 findling-src/scripts/ci/slow_backend.py > "${{ runner.temp }}/edge-under.log" 2>&1 &
          echo $! > "${{ runner.temp }}/slow.pid"
          for _ in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              cat "${{ runner.temp }}/edge-under.log"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stub with the delay under the ceiling did not come up"
          cat "${{ runner.temp }}/edge-under.log" || true
          exit 1

      - name: The lower side of the edge, a late answer that still arrives
        run: |
          read -r seconds status <<< "$(curl -s -G \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            --data-urlencode 'term=findling-canary' \
            -o edge-under.json -w '%{time_total} %{http_code}' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search')"
          elapsed_ms=$(awk -v value="${seconds}" 'BEGIN { printf "%d", value * 1000 }')
          cat edge-under.json
          echo "the search answered after ${elapsed_ms}ms with status ${status}, against a stub that waits ${EDGE_UNDER_MS}ms"

          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 1' edge-under.json > /dev/null \
            || { echo "::error::an answer inside the per call ceiling cost the hit"; cat edge-under.json; exit 1; }
          jq -e '.ocs.data.entries[0].title == "findling-canary"' edge-under.json > /dev/null \
            || { echo "::error::the one entry is not the hit the stub sent"; cat edge-under.json; exit 1; }

          # The falsifier of this half. An answer that did not wait at all would
          # mean the call never reached the stub, and a hit from anywhere else
          # would satisfy every assertion above without saying a word about the
          # chain.
          if [ "${elapsed_ms}" -lt "${EDGE_UNDER_MS}" ]; then
            echo "::error::the search came back in ${elapsed_ms}ms, sooner than the ${EDGE_UNDER_MS}ms the stub sleeps, so this hit did not come through it"
            exit 1
          fi
          # The other half needs this number, because its bound is a difference.
          echo "EDGE_UNDER_ELAPSED_MS=${elapsed_ms}" >> "${GITHUB_ENV}"

      - name: Start the same stub just over the per call ceiling
        run: |
          if [ -f "${{ runner.temp }}/slow.pid" ]; then
            kill "$(cat "${{ runner.temp }}/slow.pid")" 2>/dev/null || true
          fi
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          FINDLING_SLOW_BACKEND_DELAY_MS="${EDGE_OVER_MS}" \
            python3 findling-src/scripts/ci/slow_backend.py > "${{ runner.temp }}/edge-over.log" 2>&1 &
          echo $! > "${{ runner.temp }}/slow.pid"
          for _ in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              cat "${{ runner.temp }}/edge-over.log"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stub with the delay over the ceiling did not come up"
          cat "${{ runner.temp }}/edge-over.log" || true
          exit 1

      - name: The upper side of the edge, an answer that arrives too late
        run: |
          read -r seconds status <<< "$(curl -s -G \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            --data-urlencode 'term=findling-canary' \
            -o edge-over.json -w '%{time_total} %{http_code}' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search')"
          elapsed_ms=$(awk -v value="${seconds}" 'BEGIN { printf "%d", value * 1000 }')
          cat edge-over.json
          echo "the search answered after ${elapsed_ms}ms with status ${status}, against a stub that waits ${EDGE_OVER_MS}ms"

          # Success and an empty group, which is the whole shape of this
          # behaviour: a provider that gave up must not turn into an error for
          # the user, because the unified search would then show a failure
          # instead of the result groups that did answer.
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' edge-over.json > /dev/null \
            || { echo "::error::an answer past the per call ceiling still produced a hit, so nothing gave up"; cat edge-over.json; exit 1; }

          # The falsifying bound, and it is a difference rather than an absolute
          # number so that the speed of the runner cancels out of it. A run
          # without the per call timeout would sit out the whole delay, which is
          # EDGE_OVER_MS minus EDGE_UNDER_MS longer than the lower case measured
          # a moment ago on this very runner. A run with the timeout stops at the
          # ceiling, which is far short of that. EDGE_MARGIN_MS is the gap that
          # separates the two readings, and it is coarse for the same reason the
          # two delays are.
          naive=$(( EDGE_UNDER_ELAPSED_MS + EDGE_OVER_MS - EDGE_UNDER_MS ))
          ceiling=$(( naive - EDGE_MARGIN_MS ))
          echo "the lower case cost ${EDGE_UNDER_ELAPSED_MS}ms, so waiting this stub out would cost about ${naive}ms"
          if [ "${elapsed_ms}" -ge "${ceiling}" ]; then
            echo "::error::the search took ${elapsed_ms}ms, at or above the ${ceiling}ms of a run that waited for the backend instead of giving up"
            exit 1
          fi
          echo "the chain gave up at its tightest link: ${elapsed_ms}ms against a backend that answers after ${EDGE_OVER_MS}ms"

      - name: Stop the stub of the edge
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/slow.pid" ]; then
            kill "$(cat "${{ runner.temp }}/slow.pid")" 2>/dev/null || true
          fi

      # Unregistering disables the ExApp first, and that call needs a living
      # backend on the port. The timeout probe above killed the real one, so it
      # comes back here, otherwise the teardown fails on its own test setup.
      - name: Restart the real backend for the teardown
        working-directory: findling-src/backend
        run: |
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "exapp is back up"
              exit 0
            fi
            sleep 1
          done
          echo "exapp did not come back before the teardown"
          tail -50 "${{ runner.temp }}/exapp.log" || true
          exit 1

      - name: Unregister the ExApp
        run: ./occ app_api:app:unregister findling_backend

      # Pitfall 1 as a test instead of a warning: with the backend gone the proxy
      # gets an array back, and the whole unified search of that user would die
      # if anyone treated it as a response object. The search must still answer
      # 200, only without our result group.
      - name: Search again with the backend gone
        run: |
          status=$(curl -s -o negative.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat negative.json
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' negative.json

      - name: Nextcloud log
        if: failure()
        run: |
          if [ -f data/nextcloud.log ]; then
            tail -n 200 data/nextcloud.log
          else
            echo "no data/nextcloud.log written"
          fi
          ./occ app:list || true
          ./occ app_api:app:list || true
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- slow stub ---"
          tail -n 40 "${{ runner.temp }}/slow.log" || echo "no slow stub log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # Gate B of the read only invariant. Gate A is the AST test in the python
  # workflow and stops anyone from writing a write path; this job catches a write
  # that happens through a road gate A does not know, for instance inside a
  # library. Deliberately a job of its own and not a few steps appended to the
  # walking skeleton: a red read only gate is the most serious verdict this
  # project can produce, and it must never be confusable with a broken search.
  readonly-gate:
    name: readonly-gate
    runs-on: ubuntu-24.04
    # The OCR pass over the corpus is the slowest thing this repository runs in
    # CI, and a hung engine is exactly the failure this job exists to notice. The
    # default of six hours would hold a runner for an afternoon over it, so the
    # deadline is here (T-03-1303, and the same finding as in the perf audit of
    # resilience.yml). Measured, the whole job is well under twenty minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # Every file of the corpus has to end with a verdict, and that number is
      # the file count rather than a constant: the drain loop below waits for it
      # and the counter step asserts it name by name against CORPUS.md.
      DRAIN_TIMEOUT: '900'
      # The corpus lives in the admin account, because the installer owns a data
      # directory from the first second. The second account deliberately owns
      # nothing and is the negative case.
      CORPUS_USER: 'admin'
      CORPUS_PASS: 'password'
      STRANGER_USER: 'stranger'
      STRANGER_PASS: 'findling-ci-stranger-2026'

    steps:
      # Same order and the same reason as in the job above: the server checkout
      # empties the workspace root, and the second checkout is what brings the
      # composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      # The backend process is not what reads the corpus, the command line tool
      # is. It has to run anyway, because AppAPI only completes the registration
      # handshake against a live heartbeat, and without a registration the
      # gateway would refuse every call.
      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          admin-user: ${{ env.CORPUS_USER }}
          admin-pass: ${{ env.CORPUS_PASS }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # The engine the picture and the scan track need. It is installed here and
      # not in the composite action because only this job runs the OCR pass; the
      # walking skeleton indexes nothing at all.
      #
      # The version on the runner is not the version in the runtime image
      # (Debian trixie ships 5.5.0, Ubuntu noble a 5.3 series), and that
      # difference is deliberate rather than tolerated: it is precisely why the
      # assertions of this phase are verdicts and search terms and never a
      # comparison of the recognised text. A raw text assertion would be a test
      # against a tesseract build and would go red on a point release.
      - name: Install the OCR engine, so the scan track really runs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-osd
          tesseract --version | head -1
          tesseract --list-langs

      - name: Put the reference corpus into the account of the corpus user
        run: |
          # The skeleton of the installer would be crawled as well, and its
          # documents would appear in the verdict list next to the corpus. The
          # corpus is the subject here, so the account starts empty.
          ./occ config:system:set skeletondirectory --value=''
          rm -rf "data/${CORPUS_USER}/files"/* "data/${CORPUS_USER}/files"/.[!.]* 2>/dev/null || true
          cp -r findling-src/testdata/corpus "data/${CORPUS_USER}/files/corpus"
          ./occ files:scan --all
          echo "files on the instance: $(find data/*/files -type f 2>/dev/null | wc -l)"

      # The list is frozen exactly once and both checksum runs use this very
      # list. Hashing a freshly globbed set instead would let a deleted file
      # disappear from both sides of the diff and look like nothing happened.
      - name: Freeze the file list, the checksums and the metadata
        run: |
          find "data/${CORPUS_USER}/files/corpus" -type f | sort > filelist.txt
          test -s filelist.txt
          xargs -a filelist.txt sha256sum > before.txt
          xargs -a filelist.txt stat -c '%n %Y %s' > before-meta.txt
          echo "corpus files: $(wc -l < filelist.txt)"
          cat before.txt

      # One PROPFIND per file instead of a single Depth 1 call on the folder: a
      # Depth 1 answer also carries the folder itself, and dropping the right
      # entry from an XML blob with shell tools is exactly the kind of cleverness
      # that fails silently when the order changes.
      - name: Resolve the file ids over WebDAV
        run: |
          : > ids.txt
          while read -r path; do
            curl -sf -u "${CORPUS_USER}:${CORPUS_PASS}" -X PROPFIND \
              -H 'Depth: 0' -H 'Content-Type: application/xml' \
              --data '<?xml version="1.0"?><d:propfind xmlns:d="DAV:" xmlns:oc="http://owncloud.org/ns"><d:prop><oc:fileid/></d:prop></d:propfind>' \
              "http://localhost:8080/remote.php/dav/files/${CORPUS_USER}/corpus/$(basename "${path}")" \
              | grep -o '<oc:fileid>[0-9]\+</oc:fileid>' | grep -o '[0-9]\+' >> ids.txt
          done < filelist.txt
          cat ids.txt
          test "$(wc -l < ids.txt)" -eq "$(wc -l < filelist.txt)"

      - name: Read every file through the content gateway
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "${CORPUS_USER}" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/read-report.txt"

      - name: The authorised run has to see every single file
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=${count} not-accessible=0 error=0 bytes=" read-report.txt
          # One file of the corpus is empty on purpose, so the sum is what proves
          # that content actually crossed the wire.
          read_bytes=$(sed -n 's/^summary .*bytes=\([0-9]\+\)$/\1/p' read-report.txt)
          test "${read_bytes}" -gt 0
          echo "bytes read: ${read_bytes}"

      - name: Add a user who owns nothing
        run: OC_PASS="${STRANGER_PASS}" ./occ user:add --password-from-env "${STRANGER_USER}"

      # COMP-02, the half that a functional test never covers: the gateway does
      # not only deliver, it also refuses. Same file ids, same code path, only
      # the user id differs.
      - name: Read the same file ids as a user without access
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "${STRANGER_USER}" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/denied-report.txt"

      - name: The unauthorised run must come back empty
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=0 not-accessible=${count} error=0 bytes=0" denied-report.txt
          # Not a single line may claim a successful read.
          ! grep -q ' read bytes=' denied-report.txt

      # The third case, and the only one of the three that used to answer 500: a
      # user id that does not exist at all. getUserFolder() throws for it, and the
      # difference between 500 here and 404 for "not your file" is a user name
      # oracle. The report has to look exactly like the one of the stranger, so
      # not-accessible for every file and error=0. An error line would mean the
      # gateway answered 500 and told the caller which accounts exist.
      - name: Read the same file ids as a user that does not exist
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "no-such-user-findling-ci" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/unknown-user-report.txt"

      - name: An unknown user is indistinguishable from a user without access
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=0 not-accessible=${count} error=0 bytes=0" unknown-user-report.txt
          ! grep -q ' error bytes=' unknown-user-report.txt

      # From here on the second half of the gate: the whole indexing pass over
      # the same files, so that the comparison below covers the track that reads
      # a document as pixels and not only the track that downloads it.
      - name: Index the whole corpus, OCR track included
        run: |
          # --no-interaction: occ treats this shell as interactive, so the
          # restart confirmation would default to No and the queue would stay
          # empty (first run finding of the resilience gate).
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          # stop_after with an underscore. The dashed spelling does not exist on
          # background-job:worker, Symfony rejects it and the crawl never runs.
          timeout 180 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 120
          ./occ findling:index

      # The scans reach the queue twice: once as a content job, which ends as
      # skipped(no_text_layer), and once more as an ocr job that the container
      # requeues itself. So the loop waits for an empty queue and not for a fixed
      # number of passes, and the deadline is generous because thirty rendered
      # pages through an engine is minutes and not seconds.
      - name: Wait until the queue is empty and every file has a verdict
        run: |
          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          expected=$(wc -l < filelist.txt)
          deadline=$(( $(date +%s) + DRAIN_TIMEOUT ))
          while :; do
            report=$(status)
            indexed=$(echo "${report}" | jq -r '.indexed')
            skipped=$(echo "${report}" | jq -r '.skipped')
            failed=$(echo "${report}" | jq -r '.failed')
            open=$(open_rows)
            judged=$(( indexed + skipped + failed ))
            echo "draining: open=${open} indexed=${indexed} skipped=${skipped} failed=${failed}"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${expected}" ]; then
              echo "the queue is empty and ${judged} files have a verdict"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the indexing pass did not finish within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done

      # Off by default, switched on through workflow_dispatch, and the
      # falsification of the step that follows it. Taking a mimetype out of the
      # allowlist leaves exactly this trace: the file is never handed over and
      # keeps no verdict, while every checksum stays where it was.
      - name: Verdict probe, drop the verdict of the WebP on purpose
        if: ${{ inputs.missing_verdict_probe }}
        run: |
          python3 - "${{ runner.temp }}/findling/state.db" <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          removed = connection.execute("DELETE FROM files WHERE path LIKE '%20-rueckruf.webp'").rowcount
          connection.commit()
          connection.close()
          print(f"verdict probe: removed {removed} row(s)")
          PY

      # The step that makes this gate mean something, and the reason it exists is
      # worth spelling out. A checksum comparison measures the files the run
      # touched. A run that never reached the pictures and the scans compares
      # thirty nine unchanged files with thirty nine unchanged files and ends
      # green while proving nothing at all (pitfall 13). So every file is looked
      # up by name, and the expected verdict comes out of testdata/CORPUS.md
      # rather than out of a constant in here: the document that describes the
      # corpus is the reference, and a file added there without a verdict fails
      # this step instead of quietly leaving the count alone.
      - name: Every corpus file has exactly one verdict, and the one CORPUS.md names
        run: |
          python3 - "${{ runner.temp }}/findling/state.db" filelist.txt findling-src/testdata/CORPUS.md <<'PY'
          import re
          import sqlite3
          import sys
          from pathlib import Path

          database, listing, reference = (Path(argument) for argument in sys.argv[1:4])

          # A row of the file table of CORPUS.md: the name in backticks, one
          # column of prose, then the verdict as state or state(reason). Only the
          # first backticked token of that cell is read, so the remarks behind it
          # stay prose.
          ROW = re.compile(r"^\|\s*`(?P<name>\d\d-[^`]+)`\s*\|[^|]*\|\s*`(?P<state>[a-z_]+)(?:\((?P<reason>[a-z_]+)\))?`")
          CAP_REASONS = ("truncated", "timeout", "out_of_memory")

          expected = {}
          for line in reference.read_text(encoding="utf-8").splitlines():
              found = ROW.match(line)
              if found:
                  expected[found["name"]] = (found["state"], found["reason"] or "none")

          on_disk = sorted(Path(line.strip()).name for line in listing.read_text(encoding="utf-8").splitlines() if line.strip())

          # The self check of the reference, and it comes first: a pattern that
          # silently matches nothing would turn this whole step into a loop over
          # an empty dictionary, which is the same kind of green as the one this
          # step was written against.
          unlisted = [name for name in on_disk if name not in expected]
          if unlisted:
              print(f"::error::{reference} names no expected verdict for: {', '.join(unlisted)}")
              print("A corpus file without a reference cannot be counted, so the counter would pass it by.")
              sys.exit(1)

          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          rows = connection.execute("SELECT path, state, reason, deleted_at FROM files").fetchall()
          connection.close()

          actual = {}
          for path, state, reason, deleted_at in rows:
              if not str(path).startswith("corpus/"):
                  continue
              actual[str(path).rsplit("/", 1)[-1]] = (state, reason or "none", deleted_at)

          # The caps of docs/ocr.md, counted before anything can end the step, so
          # that they stand in the log of a red run as well. Every one of them is
          # a pass that was cut short, and a corpus that starts hitting them is a
          # corpus whose numbers stop meaning what CORPUS.md says.
          caps = dict.fromkeys(CAP_REASONS, 0)
          for _state, reason, _deleted in actual.values():
              if reason in caps:
                  caps[reason] += 1
          print("cap verdicts: " + ", ".join(f"{reason}={count}" for reason, count in caps.items()))

          print(f"{'file':<34} {'expected':<28} {'actual':<28}")
          problems = []
          for name in on_disk:
              want = expected[name]
              got = actual.get(name)
              shown = "no verdict at all" if got is None else f"{got[0]}({got[1]})"
              print(f"{name:<34} {want[0] + '(' + want[1] + ')':<28} {shown:<28}")
              if got is None:
                  problems.append(f"{name} was never judged")
              elif (got[0], got[1]) != want:
                  problems.append(f"{name} is {shown} and CORPUS.md expects {want[0]}({want[1]})")
              elif got[2] is not None:
                  problems.append(f"{name} carries a tombstone, so it left the index again")

          # Belt and braces on the caps: the comparison above already catches
          # every one of them, because none of the three stands in CORPUS.md. It
          # is repeated as a rule of its own so that a future row which does name
          # a cap cannot make this job green by agreeing with it.
          if any(caps.values()):
              problems.append(
                  "a cap of the OCR cascade was hit: " + ", ".join(f"{reason}={count}" for reason, count in caps.items())
              )

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              print(
                  "A file without a verdict is worse than a red checksum comparison: "
                  "the OCR pass never touched it, so the comparison above compared "
                  "files nothing had happened to and would have stayed green whatever "
                  "the read path does to a picture."
              )
              sys.exit(1)

          print(f"{len(on_disk)} files, {len(actual)} verdicts, every one of them the expected one")
          PY

      # Off by default, switched on through workflow_dispatch. A gate nobody has
      # ever seen turn red is a gate nobody knows to work, so the falsification
      # is a step in the job rather than a note in a document.
      - name: Manipulation probe, tamper with the corpus on purpose
        if: ${{ inputs.tamper_probe }}
        run: |
          echo x >> "data/${CORPUS_USER}/files/corpus/04-notes.txt"
          # The second half: a touch leaves every checksum intact and still
          # breaks the invariant, which is why metadata is compared as well.
          touch "data/${CORPUS_USER}/files/corpus/05-picture.png"

      # After both halves: the gateway read and the whole indexing pass with its
      # renderer and its engine.
      - name: Checksums and metadata after the read run and the OCR pass
        run: |
          xargs -a filelist.txt sha256sum > after.txt
          xargs -a filelist.txt stat -c '%n %Y %s' > after-meta.txt

      - name: Gate B, not one byte and not one timestamp has moved
        run: |
          diff before.txt after.txt
          diff before-meta.txt after-meta.txt
          # Deletions and additions: the frozen list cannot show them by itself,
          # so the directory is enumerated a second time and compared.
          find "data/${CORPUS_USER}/files/corpus" -type f | sort > filelist-after.txt
          diff filelist.txt filelist-after.txt
          echo "read only invariant holds for $(wc -l < filelist.txt) files"

      - name: Everything the diff had to say
        if: failure()
        run: |
          echo "--- checksums ---"
          diff -u before.txt after.txt || true
          echo "--- metadata (name mtime size) ---"
          diff -u before-meta.txt after-meta.txt || true
          echo "--- file list ---"
          diff -u filelist.txt filelist-after.txt || true
          echo "--- authorised read report ---"
          cat read-report.txt || true
          echo "--- unauthorised read report ---"
          cat denied-report.txt || true
          echo "--- unknown user read report ---"
          cat unknown-user-report.txt || true
          echo "--- nextcloud log ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"
          echo "--- exapp log ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # The product promise as a gate: a word out of a real German document, typed
  # into the ordinary search bar, brings back the document with an excerpt from
  # its text, and only to somebody who is allowed to see the file.
  #
  # Two matrix entries, and the second one is not thoroughness for its own sake.
  # This phase introduces the first table of this app, IQueryBuilder defects are
  # dialect dependent, and the upsert of the queue is open question 4 of the
  # phase research: which upsert variant carries over both dialects. Green on
  # SQLite and red on MariaDB is the normal case for that class of defect, so
  # the answer is a run rather than a decision.
  #
  # Two limits of the German analysis chain are measured, documented in
  # docs/german-analyzer.md under "Known limits" and deliberately NOT asserted
  # here: "suchte" does not find "suchen", because the Snowball stemmer unifies
  # the infinitive and the noun but not the past tense, and "Mietvertrag" is not
  # findable through "Vertrag", because it stands in the constituent list itself
  # and the splitter matches leftmost-longest. Neither is a defect and neither
  # should be turned into one by a future assertion.
  index-search-e2e:
    name: index-search-e2e (${{ matrix.database }})
    runs-on: ubuntu-24.04
    # Two installations of a whole Nextcloud plus an OCR pass over the corpus,
    # twice. The deadline is the guard against a hung engine holding a runner for
    # the default six hours (T-03-1303).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The value travels into the composite action and ends up as the
        # --database=sqlite, --database=mysql or --database=pgsql of occ
        # maintenance:install. The installed dialect is printed there rather than
        # assumed, because a run that quietly fell back would answer the dialect
        # question with the dialect it was asked about.
        #
        # pgsql joined on 03.09.2026 and it is the one entry that is not a
        # portability exercise: Nextcloud all-in-one runs
        # ghcr.io/nextcloud-releases/aio-postgresql, so PostgreSQL is the dialect
        # of the environment this app has to work on, and it was the only one the
        # project had never installed against. It also has the only
        # dialect-specific defect on record, perf finding M7 of phase 2, which
        # the last step of this job now asks about by name.
        #
        # It runs on every push and not on a schedule, and the measurement says
        # that is affordable: the three entries are one matrix and run in
        # parallel, so the wall clock of the job does not move. The three most
        # recent runs took two and a half to four and a half minutes per dialect
        # (runs 33761279279, 33747191605, 33745892446, read on 03.09.2026), and a
        # third entry costs runner minutes, not feedback time. A dialect that is
        # only tested weekly is a dialect whose breakage is found by a user.
        database: ['sqlite', 'mysql', 'pgsql']
        server-version: ['stable34']
        php-version: ['8.2']

    # Service containers cannot be made conditional on a matrix entry, so both
    # database servers start for every run and two of the three ignore one of
    # them. The alternative would be three nearly identical job definitions, and
    # an idle container for a few minutes is the cheaper of the two.
    #
    # Both images are pinned to a series and not to latest. A patch release
    # inside the series is wanted here: what this job asks is whether the query
    # builder speaks MariaDB and PostgreSQL, not whether it speaks one particular
    # build. 16 for PostgreSQL because that is the major the all-in-one image
    # ships, which is the whole reason this dialect is in the matrix.
    #
    # The credentials of both are the defaults of the composite action, so the
    # calling side stays a single database input.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: findling-ci-root-2026
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
        ports:
          - 5432:5432
        # pg_isready with the user and the database named. The bare form asks
        # whether the server accepts connections, which it does a moment before
        # the initdb of this particular database is through, and the install then
        # fails against a server that had just reported itself healthy.
        options: >-
          --health-cmd="pg_isready --username=nextcloud --dbname=nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # Two ordinary accounts. The corpus lives in the first one and exactly one
      # file of it is shared with the second, which is the whole permission case.
      OWNER_USER: 'owner'
      OWNER_PASS: 'findling-ci-owner-2026'
      COLLEAGUE_USER: 'colleague'
      COLLEAGUE_PASS: 'findling-ci-colleague-2026'
      # The one file that is shared, and the six titles the language cases have
      # to bring back. Named here so a rename of a corpus file breaks in one
      # place instead of in ten.
      SHARED_FILE: '09-bescheid.pdf'
      NOTICE_FILE: '10-kuendigung.docx'
      OVERVIEW_FILE: '11-uebersicht.odt'
      MEMO_FILE: '12-aktenvermerk.txt'
      # The three files of the compound cases added in phase 8. All three are
      # scanned pages, so their text exists as pixels and in no other form; the
      # OCR measurement of 2026-09-06 read all three of them without a single
      # wrong character (pages 4, 5 and 6, cer=0.000000).
      SWISS_FILE: '15-schweiz-baubewilligung.pdf'
      AUSTRIAN_FILE: '16-oesterreich-mitteilung.pdf'
      REMINDER_FILE: '30-nur-ein-bild.pdf'
      # What the container has to end up with, measured against the corpus and
      # not guessed. All thirty nine entries of the directory reach the
      # container since plan 03-10: the four picture formats are on the mimetype
      # allowlist of the crawl, so nothing is left without a verdict any more.
      #
      # The three numbers were produced by running the real pipeline over the
      # corpus in the runtime image, text pass first and one OCR pass for every
      # handover, and testdata/CORPUS.md carries the verdict of every single file
      # next to the reason it has that one. The verdict counter of the
      # readonly-gate job asserts that table file by file; these three numbers
      # are the same statement as a sum, and both have to be changed together.
      #
      # failed is six and not zero, and that is the corpus doing its job: the
      # zero byte file plus five of the twelve deliberately broken PDFs. The
      # others are broken in ways pdfium repairs. Asserting the exact numbers is
      # the point; "failed is small" would hide the day a working document
      # starts failing.
      #
      # skipped is seven since the launch hardening while failed did not move
      # with it, and that is the whole point of the six files of job four: a
      # decompression bomb and an AES encrypted document are refusals and not
      # failures, and the four PDFs that describe an action are read like any
      # other document.
      EXPECTED_INDEXED: '26'
      EXPECTED_SKIPPED: '7'
      EXPECTED_FAILED: '6'
      # Ceiling of the wait for an empty queue. Thirty nine small files, but a
      # dozen rendered pages go through the OCR engine on the way, and that is
      # minutes rather than seconds. Still only a bound whose job is to end a
      # broken run with counters instead of with a reaped runner.
      DRAIN_TIMEOUT: '900'
      # The delay the container is restarted with for the time budget probe.
      # It acts in /snippets only (test hook of plan 02-11), so the first call
      # answers normally and the second one runs into its 1.5 second limit.
      DELAY_MS: '3000'
      # Phase 6. The model of the second track is not part of the virtual
      # environment, it is an artefact of the model stage of backend/Dockerfile,
      # so the job puts it here and every process of this job reads it from
      # here. Job level rather than step level, so that it also reaches the
      # backend the composite action starts, the same reason
      # FINDLING_RECONCILE_ENABLED sits at job level in the job below.
      FINDLING_EMBED_MODEL_DIR: '${{ github.workspace }}/findling-model'
      # How many documents have to carry a vector when the second track has run
      # dry. It is EXPECTED_INDEXED and not a number of its own: a document is
      # indexed exactly when it produced stored text, and stored text is what
      # the second track cuts into chunks. The two move together, and a
      # divergence is a finding about the second track rather than a number to
      # be lowered until the run is green (T-06-51).
      EXPECTED_EMBEDDED: '26'
      # Ceiling of the extra wait for the second track, derived and not guessed.
      # The measured rate is 3519 tokens per second p95 on two pinned aarch64
      # cores (docs/measurements/2026-09-05-welle0-arm64/, measurement B), the
      # cap of D-01 is 1024 tokens per document, so twenty six documents are
      # 7.6 seconds of model time in the worst derived case. What the rest of
      # this budget pays for is queue latency: the rows travel a trailing track
      # in claims of eight (EMBED_CLAIM_BATCH), so the wait is dominated by
      # worker passes and not by the model. Three hundred seconds is roughly
      # fifty times the model time. Exceeding it is a finding.
      EMBED_TIMEOUT: '300'
      # The paraphrase case of criterion 1, and the file it has to bring back.
      # The corpus document is the German notice of termination; the query below
      # shares no content word with it, which is what the control run asserts
      # rather than assumes.
      PARAPHRASE_FILE: '10-kuendigung.docx'
      PARAPHRASE_TERM: 'Wann darf ich meinen Job aufgeben und wie lange muss ich vorher warten'
      # The file that changes between the fetch and the verdict, and everything
      # that describes it. It is not part of the corpus and it arrives after the
      # counters of the corpus have been asserted, for that exact reason: the
      # three EXPECTED numbers above are the same statement as the table in
      # testdata/CORPUS.md, and a file that is not in that table has no business
      # moving them.
      MUTATION_FILE: 'mutating.txt'
      # Two invented ASCII tokens, one per revision, and neither of them stands
      # in the corpus. Lower case and without an umlaut for the reason the parity
      # markers are: a token has to be a question about the index and not about a
      # collation or about the query side umlaut variant.
      MUTATION_TERM_BEFORE: 'mutationalpha'
      MUTATION_TERM_AFTER: 'mutationbeta'
      # How many times the file is rewritten while the container works on it.
      # Every write raises NodeWrittenEvent and refreshes the queue row, so the
      # container is asked to fetch a file that is being replaced underneath it,
      # which is the window this case is about. Eight rather than one, because
      # one write and one fetch may simply not overlap and a case that only
      # sometimes happens is a case that never gets measured.
      MUTATION_ROUNDS: '8'
      # Ceiling of the wait for the index to catch up with the last write, and it
      # comes from one clock: RETREAT_MAX_SECONDS in
      # backend/src/findling/worker/poller.py, the cap of the poller retreat, is
      # three hundred seconds. The write lands in the queue of Nextcloud at once
      # and the container fetches it on its next poll, so one full retreat is the
      # longest honest wait. The nightly reconcile is NOT the carrier here: its
      # minimum interval is hours, so a run that only became green through it
      # would be a run that waited for the wrong clock. Exceeding this deadline
      # is a finding and not a number to raise (pitfall 4).
      MUTATION_TIMEOUT: '300'

    steps:
      # Same order and the same reason as in the two jobs above: the server
      # checkout empties the workspace root, and the second checkout is what
      # brings the composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      # The model of the second track, and where it comes from. The ExApp runs
      # as a native process in this job, so it has the virtual environment of
      # backend/ and everything in it, onnxruntime and the sqlite-vec wheel
      # included. What it does not have is the 118 MB int8 model: that artefact
      # is produced by the model stage of backend/Dockerfile and lives in the
      # image and nowhere else. Without it every embedding ends as the honest
      # embedding_unavailable verdict and the paraphrase case below would be a
      # test of nothing.
      #
      # It is copied out of the published image rather than fetched from a model
      # hub and quantised here, for two reasons. The bytes are the same bytes:
      # backend/Dockerfile pins MODEL_REVISION to one commit and
      # quantize_dynamic is reproducible across machines and runs, which plan
      # 06-03 checked three times against the same sha256. And a job that
      # reaches for a model hub on every push is the opposite of the promise
      # this app makes; .github/workflows/measure.yml already takes the same
      # road for the same reason.
      #
      # The checksum is what turns the paragraph above from an intention into a
      # fact, and it is the same argument backend/Dockerfile makes about every
      # file it fetches (T-06-01): an artefact that nobody checks is an artefact
      # anybody can replace, and this one is handed to onnxruntime, which
      # executes the graph in it. :dev is a moving pointer, so without the
      # comparison a moved tag would decide what this job embeds with.
      #
      # The value is the one plan 06-03 measured, at
      # docs/measurements/2026-09-05-modellqualitaet/README.md, where the
      # locally quantised file and the one in the image came out byte identical
      # three times. That is also what makes the staleness question above a gate
      # rather than a caveat: a commit that moves MODEL_REVISION in
      # backend/Dockerfile has to move this line and the measurement report with
      # it, and until the next :dev is published this job says so out loud
      # instead of measuring against a model nobody named.
      - name: Take the embedding model out of the published image
        env:
          # int8 model.onnx, 118101091 bytes, produced by scripts/dev/quantize_model.py
          # from onnx/model.onnx of intfloat/multilingual-e5-small at revision 614241f6.
          MODEL_SHA256: '8da4c9ba0ad59f58e8566839425d7fd6339d31414d0ce5cba2d7d0afb75dd8b6'
        run: |
          image=ghcr.io/street1983nk/findling_backend:dev
          docker pull "${image}"
          container=$(docker create "${image}")
          rm -rf "${FINDLING_EMBED_MODEL_DIR}"
          docker cp "${container}:/usr/local/share/findling/model" "${FINDLING_EMBED_MODEL_DIR}"
          docker rm -f "${container}" > /dev/null
          ls -l "${FINDLING_EMBED_MODEL_DIR}"
          if [ ! -s "${FINDLING_EMBED_MODEL_DIR}/model.onnx" ] \
             || [ ! -s "${FINDLING_EMBED_MODEL_DIR}/tokenizer.json" ]; then
            echo "::error::the published image carries no usable model directory, so the second track cannot run here"
            exit 1
          fi
          if ! echo "${MODEL_SHA256}  ${FINDLING_EMBED_MODEL_DIR}/model.onnx" | sha256sum -c -; then
            echo "::error::the model in the published image is not the one this repository measured"
            echo "If backend/Dockerfile moved MODEL_REVISION on purpose, update MODEL_SHA256 here and the"
            echo "table in docs/measurements/2026-09-05-modellqualitaet/README.md in the same commit."
            exit 1
          fi

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          database: ${{ matrix.database }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # Without the engine every scan and every picture of the corpus would end
      # as failed(ocr_unavailable), which is an honest verdict and the wrong one
      # to measure the corpus against. The counters below are the verdicts of an
      # instance that can read pixels.
      - name: Install the OCR engine, so the scan track really runs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-osd
          tesseract --version | head -1

      # Every file on the instance is crawled, so every file on the instance is
      # part of the arithmetic below. The skeleton would put a manual, a picture
      # and a folder of templates into each of the three accounts, and the
      # counter assertions would then be about documents nobody chose.
      - name: Empty the instance of everything that is not the corpus
        run: |
          ./occ config:system:set skeletondirectory --value=''
          # The installer created its own account before the setting existed.
          rm -rf data/admin/files/* data/admin/files/.[!.]* 2>/dev/null || true
          OC_PASS="${OWNER_PASS}" ./occ user:add --password-from-env "${OWNER_USER}"
          OC_PASS="${COLLEAGUE_PASS}" ./occ user:add --password-from-env "${COLLEAGUE_USER}"
          ./occ files:scan --all
          echo "files on the instance before the corpus: $(find data/*/files -type f 2>/dev/null | wc -l)"

      - name: Put the reference corpus into the account of the owner
        run: |
          # The scan of the step before created both home directories; the mkdir
          # is there so a change in that order fails on the mkdir instead of on a
          # cp whose message is about a missing parent.
          mkdir -p "data/${OWNER_USER}/files"
          cp -r findling-src/testdata/corpus "data/${OWNER_USER}/files/corpus"
          ./occ files:scan --all
          echo "corpus entries: $(find "data/${OWNER_USER}/files/corpus" -type f | wc -l)"

      # The order of this step and the crawl below is the whole point, and it is
      # not an implementation detail: the access list is written while a file is
      # indexed. A share granted afterwards, or revoked afterwards, is not seen
      # by this phase at all; events and reconciliation are phase 3. A later
      # failure here therefore means the crawl did not see the share, not that
      # the permission chain leaks.
      #
      # permissions=1 is read only, shareType=0 is a share with a single user.
      - name: Share exactly one file with the second user, before the crawl
        run: |
          # Without -f on purpose: a refused share answers with a body that says
          # why, and -f would throw exactly that body away.
          curl -s -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            -d "path=/corpus/${SHARED_FILE}" \
            -d 'shareType=0' \
            -d "shareWith=${COLLEAGUE_USER}" \
            -d 'permissions=1' \
            'http://localhost:8080/ocs/v2.php/apps/files_sharing/api/v1/shares' | tee share.json
          jq -e '.ocs.meta.statuscode == 200' share.json > /dev/null \
            || { echo "::error::the share was not created, so the permission case would prove nothing"; cat share.json; exit 1; }
          # The recipient's mount only exists in the mount cache after a scan,
          # and the crawl reads the access list out of that cache.
          ./occ files:scan --all

      - name: Queue and run the crawl
        run: |
          # --no-interaction: occ treats this shell as interactive, so the
          # restart confirmation would default to No and the queue would stay
          # empty (first run finding of the resilience gate).
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          # stop_after with an underscore. The dashed spelling does not exist on
          # background-job:worker, Symfony rejects it and the crawl never runs.
          timeout 120 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 60
          ./occ findling:index

      - name: Wait until the queue is empty and everything has a verdict
        run: |
          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          # scheduled plus the rows a worker holds, both out of the queue table
          # of Nextcloud, so "still open" is a fact rather than a guess.
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          expected=$(( EXPECTED_INDEXED + EXPECTED_SKIPPED + EXPECTED_FAILED ))
          deadline=$(( $(date +%s) + DRAIN_TIMEOUT ))
          while :; do
            report=$(status)
            indexed=$(echo "${report}" | jq -r '.indexed')
            skipped=$(echo "${report}" | jq -r '.skipped')
            failed=$(echo "${report}" | jq -r '.failed')
            open=$(open_rows)
            judged=$(( indexed + skipped + failed ))
            echo "draining: open=${open} indexed=${indexed} skipped=${skipped} failed=${failed}"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${expected}" ]; then
              echo "the queue is empty and ${judged} files have a verdict"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the crawl did not finish within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done

      # The second track, waited for by name. The loop above already waits for
      # an empty queue and the embedding rows travel that same queue, so this is
      # usually a single read; it is a step of its own for the reason the M7
      # step below is one. A second track that never wrote a vector would reach
      # a reader as "the crawl did not finish within 900 seconds", which reads
      # like a slow runner and gets retried, and here the same fact carries its
      # own name.
      #
      # Counted out of vectors.db and not out of the status route, because there
      # is no admin session in this job, and with the plain table rather than
      # through VectorStore, because chunks is an ordinary table and reading it
      # needs no loadable extension.
      #
      # Exceeding EMBED_TIMEOUT is a finding and not an invitation to raise the
      # number until the run is green (T-06-51). The budget is derived from the
      # measured rate, see the comment at the variable.
      - name: Wait until the second track has written its vectors
        run: |
          # Written to a file rather than kept in this step, because the cold
          # start measurement below asks the same question again just before it
          # restarts the container: a restart in the middle of the embedding
          # would take a working track down and leave the number below measuring
          # a container that is busy catching up (bug audit MEDIUM-4 of plan
          # 07-05). Two steps, one counter, one definition of "carrying".
          cat > "${{ runner.temp }}/embedded.sh" <<'SH'
          embedded() {
            python3 - "${RUNNER_TEMP}/findling/vectors.db" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          if not database.is_file():
              print(0)
              raise SystemExit(0)
          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          row = connection.execute("SELECT COUNT(DISTINCT file_id) FROM chunks").fetchone()
          connection.close()
          print(int(row[0]) if row else 0)
          PY
          }
          SH
          . "${{ runner.temp }}/embedded.sh"

          deadline=$(( $(date +%s) + EMBED_TIMEOUT ))
          while :; do
            carrying=$(embedded)
            echo "second track: ${carrying} of ${EXPECTED_EMBEDDED} documents carry a vector"
            if [ "${carrying}" -ge "${EXPECTED_EMBEDDED}" ]; then
              echo "every indexed document of the corpus carries at least one vector"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the second track wrote vectors for ${carrying} of ${EXPECTED_EMBEDDED} documents within ${EMBED_TIMEOUT} seconds"
              echo "This is a finding about the second track, not a deadline to raise: the budget is fifty times"
              echo "the model time the measured rate says twenty six documents cost."
              ./occ findling:index || true
              tail -n 100 "${{ runner.temp }}/exapp.log" || true
              exit 1
            fi
            sleep 5
          done

      # The ten language cases. Each one has its own message, because the ten
      # failures mean ten different things, and each one asserts a count and a
      # title: a search that finds "something" proves that the index is not
      # empty, and nothing else.
      #
      # Cases 8 to 10 arrived with phase 8 and they widen the compound half of
      # this set from two cases to five. Every one of the three search terms was
      # held against the whole corpus before it was written down here, over the
      # tokens of the German chain and over the plain letters of the term, in
      # backend/tests/test_corpus_terms.py. That module is the local half of
      # these three assertions and it runs in every python suite; this step runs
      # on main and on pull requests only, so it is the second half and not the
      # first.
      #
      # A fourth gate joined that module in the audit fix of phase 8, and it is
      # the one that keeps this comment honest: every term of cases 1, 2, 8, 9
      # and 10 has to find nothing at all once Filter.split_compound is taken
      # out of the chain. A compound case whose word also stands on its own
      # somewhere in the corpus is green without the filter it is meant to
      # prove, and case 8 used to be exactly that.
      - name: The ten German language cases, as the owner
        run: |
          search() {
            curl -sfS -G -u "${OWNER_USER}:${OWNER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$1" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$2"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          # 1. The compound through one of its constituents. The file says
          # Grundstuecksverkehrsgenehmigung, the search says Genehmigung, and the
          # splitter is what closes the gap.
          start=$(date +%s%N)
          search 'Genehmigung' compound.json
          echo "an ordinary search answered after $(( ( $(date +%s%N) - start ) / 1000000 ))ms"
          jq -e '.ocs.data.entries | length == 1' compound.json > /dev/null \
            || fail "a compound searched through one constituent did not bring back exactly one file" compound.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' compound.json > /dev/null \
            || fail "the compound hit is not the German PDF of the corpus" compound.json
          # The excerpt, and this is the assertion that separates a hit from a
          # hit with content: the subline has to carry the compound out of the
          # document. The fallback subline is the path, and the path does not
          # contain the word, so a broken excerpt path cannot pass this line.
          jq -e '.ocs.data.entries[0].subline | ascii_downcase | contains("genehmigung")' compound.json > /dev/null \
            || fail "the subline carries no excerpt from the document" compound.json
          jq -e '.ocs.data.entries[0].subline | contains("<") | not' compound.json > /dev/null \
            || fail "the excerpt carries markup, which the search dialog would show verbatim" compound.json

          # 2. The second compound, in a different file and a different format.
          search 'Frist' frist.json
          jq -e '.ocs.data.entries | length == 1' frist.json > /dev/null \
            || fail "Frist did not bring back exactly the notice of termination" frist.json
          jq -e --arg name "${NOTICE_FILE}" '.ocs.data.entries[0].title == $name' frist.json > /dev/null \
            || fail "the Frist hit is not the DOCX of the corpus" frist.json

          # 3. The written out umlaut. The file says Mueller with the character,
          # the search says it with the two letters, and the query side variant
          # of plan 02-09 is what joins them.
          search 'Mueller' umlaut.json
          jq -e '.ocs.data.entries | length == 1' umlaut.json > /dev/null \
            || fail "the written out umlaut did not find the file that spells it with the character" umlaut.json
          jq -e --arg name "${MEMO_FILE}" '.ocs.data.entries[0].title == $name' umlaut.json > /dev/null \
            || fail "the umlaut hit is not the file note of the corpus" umlaut.json

          # 4. Nominal inflection. The file says Vertraege, the search says
          # Vertrag, and the stemmer is what closes that gap.
          search 'Vertrag' flexion.json
          jq -e '.ocs.data.entries | length == 1' flexion.json > /dev/null \
            || fail "the singular did not find the plural" flexion.json
          jq -e --arg name "${OVERVIEW_FILE}" '.ocs.data.entries[0].title == $name' flexion.json > /dev/null \
            || fail "the inflection hit is not the ODT of the corpus" flexion.json

          # 5. The phrase. Only the file with the two words in that order.
          search '"drei Monate"' phrase.json
          jq -e '.ocs.data.entries | length == 1' phrase.json > /dev/null \
            || fail "the phrase did not bring back exactly one file" phrase.json
          jq -e --arg name "${NOTICE_FILE}" '.ocs.data.entries[0].title == $name' phrase.json > /dev/null \
            || fail "the phrase hit is not the DOCX of the corpus" phrase.json

          # 6. The exclusion, and the control that gives it meaning. Bescheid
          # stands in two files on purpose; without the control an exclusion that
          # does nothing would look exactly like one that works.
          search 'bescheid' both.json
          jq -e '.ocs.data.entries | length == 2' both.json > /dev/null \
            || fail "the word that stands in two files did not bring back two files" both.json
          search 'bescheid -frist' excluded.json
          jq -e '.ocs.data.entries | length == 1' excluded.json > /dev/null \
            || fail "the minus did not remove the second file" excluded.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' excluded.json > /dev/null \
            || fail "the exclusion removed the wrong file" excluded.json

          # 7. The file type. There is no built in Nextcloud filter for it, so it
          # travels inside the search line and becomes a required term on ext.
          search 'type:pdf bescheid' filetype.json
          jq -e '.ocs.data.entries | length == 1' filetype.json > /dev/null \
            || fail "the file type filter did not narrow the two hits down to the PDF" filetype.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' filetype.json > /dev/null \
            || fail "the file type filter kept the wrong file" filetype.json

          # 8. The third compound, in the scanned Swiss permit. The page says
          # Rechtsmittelbelehrung, the search says Belehrung, and split_compound
          # is what makes the second part of the word a term of its own.
          #
          # This case replaced a search for "Vereinbarung" in the lease of the
          # corpus, and the reason is the whole point of the case: that file
          # writes "Vereinbarung" out twice on its own as well, so the hit stood
          # with or without the splitter and the case proved the decomposition
          # not at all. "Belehrung" stands in the whole corpus only inside its
          # compound. Measured on 2026-09-08 against the real Debian list, the
          # shipped chain once with and once without Filter.split_compound:
          # with the splitter exactly 15-schweiz-baubewilligung.pdf, without it
          # no file at all. The same run says the same about cases 1, 2, 9 and
          # 10, so all five compound cases of this set are now red without the
          # filter they exist for. The lease keeps its own guard in
          # backend/tests/test_corpus_terms.py, where "Vereinbarung" is now the
          # named counter example of a term that survives without the splitter.
          search 'Belehrung' belehrung.json
          jq -e '.ocs.data.entries | length == 1' belehrung.json > /dev/null \
            || fail "Belehrung did not bring back exactly the scanned Swiss permit" belehrung.json
          jq -e --arg name "${SWISS_FILE}" '.ocs.data.entries[0].title == $name' belehrung.json > /dev/null \
            || fail "the Belehrung hit is not the Swiss permit of the corpus" belehrung.json
          # The excerpt, as in case 1, and this is the assertion that separates a
          # hit from a hit with content. The fallback subline is the path, and the
          # path does not carry the word, so a broken excerpt path fails here.
          # Measured locally on 2026-09-08 that the snippet generator produces a
          # fragment for a hit that exists only through the splitter: the
          # fragment carries the whole word "Rechtsmittelbelehrung".
          jq -e '.ocs.data.entries[0].subline | ascii_downcase | contains("belehrung")' belehrung.json > /dev/null \
            || fail "the Belehrung hit carries no excerpt from the document" belehrung.json
          jq -e '.ocs.data.entries[0].subline | contains("<") | not' belehrung.json > /dev/null \
            || fail "the Belehrung excerpt carries markup, which the search dialog would show verbatim" belehrung.json

          # 9. A compound that exists as pixels and in no other form. The scanned
          # Austrian notice says Grundbuchsauszug, the search says Auszug, and
          # split_compound is what closes the gap; without the OCR track there
          # would be nothing to split in the first place.
          search 'Auszug' auszug.json
          jq -e '.ocs.data.entries | length == 1' auszug.json > /dev/null \
            || fail "Auszug did not bring back exactly the scanned Austrian notice" auszug.json
          jq -e --arg name "${AUSTRIAN_FILE}" '.ocs.data.entries[0].title == $name' auszug.json > /dev/null \
            || fail "the Auszug hit is not the Austrian notice of the corpus" auszug.json

          # 10. The same shape once more, in the file that is one image and
          # nothing else. It says Zahlungserinnerung, the search says Erinnerung,
          # and split_compound is what makes the reminder findable through the
          # word a user actually types.
          search 'Erinnerung' erinnerung.json
          jq -e '.ocs.data.entries | length == 1' erinnerung.json > /dev/null \
            || fail "Erinnerung did not bring back exactly the one page reminder" erinnerung.json
          jq -e --arg name "${REMINDER_FILE}" '.ocs.data.entries[0].title == $name' erinnerung.json > /dev/null \
            || fail "the Erinnerung hit is not the image only PDF of the corpus" erinnerung.json

      # The counter proof, and the only one of the whole workflow that says
      # something about a user who was never meant to see a file. Both directions
      # are checked: the negative half alone would be green even if the search
      # returned nothing to anybody.
      - name: The second user sees the shared file and nothing else
        run: |
          search() {
            curl -sfS -G -u "${COLLEAGUE_USER}:${COLLEAGUE_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$1" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$2"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          search 'Genehmigung' colleague-shared.json
          jq -e '.ocs.data.entries | length == 1' colleague-shared.json > /dev/null \
            || fail "the second user does not find the file that was shared with him" colleague-shared.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' colleague-shared.json > /dev/null \
            || fail "the second user found something other than the shared file" colleague-shared.json

          # Deliberately without "bescheid": that word stands in the shared file
          # as well, and a term the second user is allowed to find has no place
          # in the list of terms he must not find.
          for term in 'Frist' 'Vertrag' 'Mueller'; do
            search "${term}" colleague-denied.json
            jq -e '.ocs.data.entries | length == 0' colleague-denied.json > /dev/null \
              || fail "the second user found a file that was never shared with him, searching for ${term}" colleague-denied.json
          done
          echo "the second user sees one file out of thirty nine, and it is the shared one"

      # Criterion 1 of phase 6, through the whole stack instead of only in the
      # python suite: a query whose content words do not stand in a document
      # brings the document back anyway.
      #
      # It takes two runs and the first one is what gives the second one
      # meaning. With the second track switched off the search is purely
      # lexical, so whatever it answers to this query is what the engine can
      # find on its own; the assertion is that this is nothing. Without that
      # control a green run below would also be green on a query that happened
      # to match lexically after all, which is the trap the same pair of cases
      # guards against in backend/tests/test_semantic_search.py.
      #
      # The restart is the only way to get the control: the vector stock is
      # written by the crawl, and the crawl needs the model. FINDLING_EMBED_ENABLED
      # is the one switch that removes the vector list without touching a file,
      # and it is the same switch an operator has.
      - name: The paraphrase finds nothing without the second track
        working-directory: findling-src/backend
        run: |
          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          export FINDLING_EMBED_ENABLED=false
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null && break
            sleep 1
          done
          curl -sfS -G -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            --data-urlencode "term=${PARAPHRASE_TERM}" \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search' \
            -o "${{ github.workspace }}/paraphrase-lexical.json"
          cat "${{ github.workspace }}/paraphrase-lexical.json"
          jq -e '.ocs.data.entries | length == 0' "${{ github.workspace }}/paraphrase-lexical.json" > /dev/null \
            || { echo "::error::the paraphrase matched lexically, so it is not a paraphrase on this corpus and a hit below would prove nothing about the vector half"; exit 1; }
          echo "the lexical half answers nothing to this query, so anything it finds below came out of the vector half"

      # This step is also the cold start measurement of the phase, and it is the
      # only one in this repository that measures a semantic search the way a
      # user makes one: through Apache, the OCS route, the PHP provider, the
      # AppAPI proxy and both halves of the container, on amd64. It is cold
      # because the restart below takes the module global of the engine holder
      # with it, so the round it makes is the round that loads the weights.
      #
      # The duration is printed and never compared against a bound, in any step
      # of this job. A millisecond ceiling on a shared GitHub runner goes red for
      # runner load and not for the thing it names, and the next reader raises
      # the lid instead of reading the finding. The same argument is written out
      # in resilience.yml in the comment before the ratchet step, where a
      # resident memory ceiling was turned down for the identical reason. What
      # may go red here is what already does: a cold search that finds nothing.
      #
      # Two preconditions carry the number, and both are structural rather than
      # hoped for.
      #
      # One, the line has to keep more than one word, and the step counts them.
      # Since the 06.1-20 addendum a single word line stays lexical
      # (backend/src/findling/api/search.py, rewritten.one_term), so a one word
      # probe would measure that rule instead of the load and would report a fast
      # search that never reached the model. Quotation marks, a leading minus, a
      # field, a file type and titleOnly switch the semantic half off in the same
      # way; the gate asks about the word count alone, because that is the only
      # one of them a later edit of the PARAPHRASE_TERM line can bring about by
      # accident.
      #
      # Two, the stock has to carry vectors, or there is nothing to load for.
      # The step "Wait until the second track has written its vectors" above
      # waits for COUNT(DISTINCT file_id) >= EXPECTED_EMBEDDED and is what buys
      # that. The two steps belong in this order: pulling them apart or turning
      # them around takes the meaning out of the number without turning anything
      # red.
      - name: The paraphrase finds the document with the second track
        working-directory: findling-src/backend
        run: |
          # The structural gate of the measurement, before anything is restarted:
          # a one word line would leave the semantic half out, and the number
          # below would be a lexical search wearing the name of a semantic one.
          words=$(printf '%s' "${PARAPHRASE_TERM}" | wc -w)
          if [ "${words}" -lt 2 ]; then
            echo "::error::PARAPHRASE_TERM holds ${words} word, and this step needs at least two. Since the 06.1-20 addendum a single word line stays lexical (rewritten.one_term in backend/src/findling/api/search.py), so it never reaches the model, and the cold start duration below would measure that rule instead of the load."
            exit 1
          fi

          # The rest of the same rule, and it is the mirror of carried_operators
          # in backend/src/findling/query/rewrite.py (bug audit LOW-8 of plan
          # 07-05). The comment above used to name these marks and then ask
          # about the word count alone, on the argument that only the count can
          # be broken by accident. That argument covers the edit somebody makes
          # to the line; it does not cover the paraphrase they replace it with,
          # and a line with one of these marks in it never reaches the model, so
          # the number below would again be a lexical search under the name of a
          # semantic one. Three cheap questions, one message each.
          if printf '%s' "${PARAPHRASE_TERM}" | grep -q '"'; then
            echo "::error::PARAPHRASE_TERM carries a quotation mark, and a quoted line asks for exactness: carried_operators() reports PHRASE, one_round drops the vector half, and the duration below would time a lexical search."
            exit 1
          fi
          if printf '%s' "${PARAPHRASE_TERM}" | grep -Eq '(^|[[:space:]])-'; then
            echo "::error::PARAPHRASE_TERM carries a leading minus, and an excluded word asks for exactness: carried_operators() reports EXCLUSION, one_round drops the vector half, and the duration below would time a lexical search."
            exit 1
          fi
          if printf '%s' "${PARAPHRASE_TERM}" | grep -q ':'; then
            echo "::error::PARAPHRASE_TERM carries a colon, which is a field or a file type: carried_operators() reports FIELD or FILETYPE, one_round drops the vector half, and the duration below would time a lexical search."
            exit 1
          fi

          # The second structural gate, and it is about the moment rather than
          # about the line (bug audit MEDIUM-4 of plan 07-05). The restart below
          # is only allowed to happen once the second track has run dry: a
          # container taken down mid embedding comes back up with rows waiting
          # for it, and the wall clock further down would then time a search
          # against a worker that is building a 544,3 MB cutter next to it. The
          # step above already waited for this number; it is asked again here
          # because a step stands between the two, and because the restart is
          # the one thing in this job that cannot be taken back.
          . "${{ runner.temp }}/embedded.sh"
          backlog_deadline=$(( $(date +%s) + 60 ))
          while :; do
            carrying=$(embedded)
            if [ "${carrying}" -ge "${EXPECTED_EMBEDDED}" ]; then
              echo "the second track carries ${carrying} of ${EXPECTED_EMBEDDED} documents and has nothing left to do, so the container may be restarted"
              break
            fi
            if [ "$(date +%s)" -ge "${backlog_deadline}" ]; then
              echo "::error::the second track still owes vectors for $(( EXPECTED_EMBEDDED - carrying )) documents, so this container must not be restarted for the cold start measurement"
              exit 1
            fi
            sleep 5
          done

          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null && break
            sleep 1
          done
          answer="${{ github.workspace }}/paraphrase-semantic.json"

          # Cold is asserted and never assumed (bug audit MEDIUM-4 of plan
          # 07-05). The restart takes the module global of the engine holder
          # with it, so the container SHOULD answer "cold" here, and everything
          # that could have made it warm in the meantime is invisible from the
          # outside: one row of the second track arriving between the restart
          # and this line loads the very engine whose first load is being timed.
          # The question goes to the container itself, through the route the
          # admin page reads, and reading it builds nothing and loads nothing
          # (T-07-04), so the gate cannot spoil the number it guards.
          #
          # A container that is not cold does not fail this step. What it
          # produced is still a real search through the whole stack, it is
          # simply not a cold start, and it is printed with that word instead of
          # the other one: going red here would turn a number nobody asserts
          # into a deadline, which is the shape this job turns down everywhere.
          auth=$(printf 'cold:%s' "${EXAPP_SECRET}" | base64 -w0)
          status_answer=$(curl -sf -m 10 "http://127.0.0.1:${EXAPP_PORT}/status" \
            -H 'EX-APP-ID: findling_backend' \
            -H "EX-APP-VERSION: ${APP_VERSION}" \
            -H "AUTHORIZATION-APP-API: ${auth}" || true)
          engine_state=$(printf '%s' "${status_answer}" | jq -r '.engineState // empty' || true)
          if [ -z "${engine_state}" ]; then
            engine_state='unreported'
          fi
          echo "the restarted container reports engineState=${engine_state} before the search"

          # The wall clock of one cold semantic search, around the request and
          # nothing else, so that neither the restart nor the heartbeat wait
          # counts into it.
          start=$(date +%s%N)
          curl -sfS -G -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            --data-urlencode "term=${PARAPHRASE_TERM}" \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "${answer}"
          elapsed_ms=$(( ( $(date +%s%N) - start ) / 1000000 ))
          if [ "${engine_state}" = "cold" ]; then
            echo "cold semantic search over apache, the ocs route, the php provider and both halves:" \
              "${elapsed_ms} ms on amd64, runner ubuntu-24.04, database ${{ matrix.database }}," \
              "corpus of ${EXPECTED_EMBEDDED} documents with vectors."
          else
            echo "semantic search over apache, the ocs route, the php provider and both halves:" \
              "${elapsed_ms} ms on amd64, runner ubuntu-24.04, database ${{ matrix.database }}," \
              "corpus of ${EXPECTED_EMBEDDED} documents with vectors." \
              "WARM, NOT COMPARABLE: the engine reported ${engine_state} and not cold before this search," \
              "so this number does not belong in the cold start series of the phase."
          fi
          echo "the two ceilings this number runs against, printed for the reader and asserted nowhere:" \
            "1500 ms for one single container call (ExAppService::REQUEST_TIMEOUT_SECONDS) and" \
            "2500 ms for the whole result group (Provider::BUDGET_NANOSECONDS)."
          # The whole ranking into the log, with the resource url of every entry.
          # A gate whose evidence is a boolean makes the next reader rerun it.
          jq -r '.ocs.data.entries[] | "  \(.title)  \(.resourceUrl)"' "${answer}" || true
          jq -e '.ocs.data.entries | length > 0' "${answer}" > /dev/null \
            || { echo "::error::the paraphrase found nothing at all, so the vector half did not travel the stack"; cat "${answer}"; exit 1; }
          jq -e --arg name "${PARAPHRASE_FILE}" '[.ocs.data.entries[].title] | index($name) != null' "${answer}" > /dev/null \
            || { echo "::error::the paraphrase did not bring back ${PARAPHRASE_FILE}, the one document of the corpus it is a paraphrase of"; cat "${answer}"; exit 1; }
          # The file id, so that the log names the case rather than only passing
          # it. resourceUrl carries it as the last path segment.
          jq -r --arg name "${PARAPHRASE_FILE}" \
            '.ocs.data.entries[] | select(.title == $name) | "criterion 1 in the integration run: \($name) found through a paraphrase, resource \(.resourceUrl)"' "${answer}"

      # The time budget, measured instead of claimed. The container is restarted
      # with FINDLING_ARTIFICIAL_DELAY_MS, which acts in /snippets and nowhere
      # else, so the candidate call answers normally and only the excerpt call
      # runs into its limit. What has to survive is the hit; what may fall away
      # is the excerpt.
      - name: Restart the backend with an artificial delay
        working-directory: findling-src/backend
        run: |
          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          # The same volume as before, so the index built above is the one that
          # is searched.
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          export FINDLING_ARTIFICIAL_DELAY_MS="${DELAY_MS}"
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "the delayed backend answers on the ExApp port"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the delayed backend did not come up"
          tail -50 "${{ runner.temp }}/exapp.log" || true
          exit 1

      - name: A slow backend costs the excerpt, not the hit and not the budget
        run: |
          read -r seconds status <<< "$(curl -s -G -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            --data-urlencode 'term=Genehmigung' \
            -o delayed.json -w '%{time_total} %{http_code}' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search')"
          elapsed_ms=$(awk -v value="${seconds}" 'BEGIN { printf "%d", value * 1000 }')
          cat delayed.json
          echo "the search answered after ${elapsed_ms}ms with status ${status}, while the backend delayed every excerpt by ${DELAY_MS}ms"

          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 1' delayed.json > /dev/null \
            || { echo "::error::a slow excerpt call cost the hit itself"; cat delayed.json; exit 1; }
          # The excerpt is gone and the subline fell back to the path. That is
          # the designed behaviour: a hit without an excerpt beats no hit.
          jq -e '.ocs.data.entries[0].subline | startswith("corpus/")' delayed.json > /dev/null \
            || { echo "::error::the subline is not the path, so the excerpt call did not run into its limit"; cat delayed.json; exit 1; }
          # The falsifying bound. The backend delays every excerpt by three
          # seconds, so a run that waited for it cannot come back below that;
          # 2900 milliseconds is therefore a ceiling that a missing timeout
          # cannot pass, and it sits far above the roughly 1.5 seconds the
          # limited call costs.
          if [ "${elapsed_ms}" -ge 2900 ]; then
            echo "::error::the search waited for the delayed backend instead of giving up on the excerpt"
            exit 1
          fi

      - name: The verdicts of the whole corpus, counted
        run: |
          report=$( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" )
          echo "::group::counters after the run"
          echo "${report}"
          ./occ findling:index
          echo "::endgroup::"

          indexed=$(echo "${report}" | jq -r '.indexed')
          skipped=$(echo "${report}" | jq -r '.skipped')
          failed=$(echo "${report}" | jq -r '.failed')
          docs=$(echo "${report}" | jq -r '.docs')

          if [ "${indexed}" -ne "${EXPECTED_INDEXED}" ]; then
            echo "::error::${indexed} files were indexed, ${EXPECTED_INDEXED} were expected"
            exit 1
          fi
          if [ "${skipped}" -ne "${EXPECTED_SKIPPED}" ]; then
            echo "::error::${skipped} files were skipped, ${EXPECTED_SKIPPED} were expected: two encrypted PDFs, the decompression bomb, two images below the plausibility threshold and two documents the engine read no text on"
            exit 1
          fi
          if [ "${failed}" -ne "${EXPECTED_FAILED}" ]; then
            echo "::error::${failed} files failed, ${EXPECTED_FAILED} were expected: the zero byte PDF and five of the ten broken ones"
            exit 1
          fi
          if [ "${docs}" -ne "${indexed}" ]; then
            echo "::error::a document lies twice in the index: ${docs} documents against ${indexed} indexed files"
            exit 1
          fi
          echo "the corpus ended as ${indexed} indexed, ${skipped} skipped, ${failed} failed, ${docs} documents in the index"

      # The one question this job asks that only PostgreSQL makes interesting,
      # asked on all three dialects so that the answer stays comparable.
      #
      # Perf finding M7 of phase 2, in the wording of the finding: a record()
      # inside an open transaction aborts the WHOLE transaction on PostgreSQL,
      # the acknowledgement of the queue row then fails, and the queue never
      # empties; MariaDB and SQLite are not affected. It was fixed with
      # UPDATE-first, and until this matrix grew a third entry the fix had never
      # been tried on the dialect the defect was found on.
      #
      # This is a step of its own rather than a line inside the drain loop above,
      # and that is not tidiness. The loop waits for an empty queue, so a broken
      # acknowledgement reaches a reader as "the crawl did not finish within 900
      # seconds", which reads like a slow runner and gets retried. Here the same
      # fact carries its own name, and the day somebody rewrites the loop the
      # statement survives. Without this comment the line looks like an arbitrary
      # extra check and is deleted at the next rewrite.
      - name: The queue really is empty, which is what finding M7 was about
        run: |
          ./occ findling:index | tee queue-final.txt
          open=$(awk '
            $1 == "scheduled" { scheduled = $2 }
            /^  handed to the worker/ { running = $NF }
            END { print (scheduled + 0) + (running + 0) }' queue-final.txt)
          if [ "${open}" -ne 0 ]; then
            echo "::error::${open} queue rows are still open on ${{ matrix.database }} after every verdict was counted, which is the shape of finding M7: the work was done and the acknowledgement was lost"
            exit 1
          fi
          echo "the queue is empty on ${{ matrix.database }}, so every claimed row was acknowledged and no transaction was aborted underneath it"

      # The file that changes between the fetch and the verdict, in three steps
      # so that the middle one can be switched off and the last one has to go
      # red. It is not a permission case, which is why it sits in this job and
      # not in the parity job, and it is not part of the corpus, which is why it
      # arrives after the counters of the corpus have been asserted: those three
      # numbers are the same statement as testdata/CORPUS.md and a file outside
      # that table must not move them.
      #
      # What the case is about. The container fetches the bytes into a scratch
      # file, judges them and stores a content_hash next to the etag it fetched
      # under. Between the fetch and the verdict the file can be replaced, and
      # then a verdict stands over content that no longer exists. The etag
      # comparison is supposed to carry that, and until now nobody had measured
      # it. If it does not carry it, that is the finding of this step and it goes
      # into the summary; it is not something to be healed by asking a softer
      # question here.
      #
      # The file is a megabyte and not a line, and that is not decoration: the
      # window this case is about is the time the fetch takes, and a file that is
      # read in a single packet has almost no window at all.
      - name: Put a file that will change under the container
        run: |
          cat > "${{ runner.temp }}/mutation.sh" <<'SH'
          # One revision of the moving file, as bytes on disk. The token stands
          # in the first line, because a text longer than FINDLING_MAX_TEXT_CHARS
          # is truncated and a token behind the cut would be a question about the
          # truncation instead of one about the etag.
          #
          # $1 token, $2 a word that makes this revision differ from the one
          # before it, $3 output file. The second argument is what moves the etag:
          # two identical writes are one file to Nextcloud and to the container
          # alike, and the whole point here is that every write is a change.
          revision() {
            {
              printf '%s the file that changes under the container, revision %s\n' "$1" "$2"
              seq 1 60000 | sed 's/^/filler line /'
            } > "$3"
          }

          # One search as the owner, and the number of hits as the answer.
          # $1 term, $2 output file.
          hits_for() {
            curl -sfS -G -u "${OWNER_USER}:${OWNER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$1" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$2"
            jq -r '.ocs.data.entries | length' "$2"
          }

          # Waits until one term answers with one number, and never sleeps on
          # suspicion: every round is a real search and the log carries its
          # count. $1 term, $2 expected number of hits, $3 output file.
          # Overrunning the deadline is a finding, see MUTATION_TIMEOUT.
          await_hits() {
            deadline=$(( $(date +%s) + MUTATION_TIMEOUT ))
            while :; do
              found=$(hits_for "$1" "$3")
              echo "the search answers ${found} hit(s) for ${1}, ${2} expected"
              if [ "${found}" -eq "$2" ]; then
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::${1} still answers ${found} hit(s) instead of ${2} after ${MUTATION_TIMEOUT} seconds"
                cat "$3"
                return 1
              fi
              sleep 5
            done
          }
          SH
          . "${{ runner.temp }}/mutation.sh"

          # Over WebDAV and not into the data directory, because only this route
          # raises the node events the container listens to, and the events are
          # what makes the rest of this case work without a second crawl.
          revision "${MUTATION_TERM_BEFORE}" 0 "${{ runner.temp }}/mutating-0.txt"
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" \
            -T "${{ runner.temp }}/mutating-0.txt" \
            "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/${MUTATION_FILE}"

          # The control of the whole case, and it is asked in both directions
          # here as well: the first content is findable and the second one, which
          # has not been written yet, is not. Without this pair the two questions
          # at the end would also be answered by a container that had never seen
          # this file at all.
          await_hits "${MUTATION_TERM_BEFORE}" 1 mutation-before.json
          await_hits "${MUTATION_TERM_AFTER}" 0 mutation-after-early.json
          echo "the file is in the index with its first content"

      # Off by default in the sense that it is on by default and can be switched
      # off: mutation_skip_probe leaves the file alone, and then the step below
      # has to go red. That is the falsification this case needs, because its
      # last assertion is that a term is NOT found any more, and a step that only
      # asserted an absence would be green on a search that answers nothing.
      - name: Overwrite it eight times while the container is working
        if: ${{ ! inputs.mutation_skip_probe }}
        run: |
          . "${{ runner.temp }}/mutation.sh"
          for round in $(seq 1 "${MUTATION_ROUNDS}"); do
            revision "${MUTATION_TERM_BEFORE}" "${round}" "${{ runner.temp }}/mutating-${round}.txt"
            curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" \
              -T "${{ runner.temp }}/mutating-${round}.txt" \
              "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/${MUTATION_FILE}"
            echo "revision ${round} written"
          done
          # The last write is the only one that carries the second token, so the
          # state the run has to end in is unambiguous no matter which of the
          # revisions above the container managed to fetch.
          revision "${MUTATION_TERM_AFTER}" final "${{ runner.temp }}/mutating-final.txt"
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" \
            -T "${{ runner.temp }}/mutating-final.txt" \
            "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/${MUTATION_FILE}"
          echo "the final revision is written, and it is the only one that carries ${MUTATION_TERM_AFTER}"

      - name: The moved file is found by its last content and carries no failed verdict
        run: |
          . "${{ runner.temp }}/mutation.sh"

          # Both directions, and they are the two halves of one statement: the
          # index has caught up with the last write AND it does not still carry
          # an earlier one. Only asking the first would let an index through that
          # holds both revisions of the same file.
          await_hits "${MUTATION_TERM_AFTER}" 1 mutation-after.json
          await_hits "${MUTATION_TERM_BEFORE}" 0 mutation-before-final.json

          file_id=$(jq -r 'first(.ocs.data.entries[].attributes.fileId) // empty' mutation-after.json)
          case "${file_id}" in
            ''|*[!0-9]*)
              echo "::error::the hit on ${MUTATION_TERM_AFTER} carries no usable fileid, so its verdict cannot be looked up"
              cat mutation-after.json
              exit 1
              ;;
          esac

          # The second half of this step, and the one the case is really named
          # after. A file that moved under the container must not end as failed:
          # a verdict of "this document is broken" over a file whose only sin was
          # being written twice is the second finding this step can produce, and
          # it is as much a defect as a stale verdict would be.
          python3 - "${{ runner.temp }}/findling/state.db" "${file_id}" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          if not database.is_file():
              print("::error::the state database is not where this job put it")
              raise SystemExit(1)
          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          row = connection.execute(
              "SELECT state, reason, attempts, deleted_at FROM files WHERE file_id = ?",
              (int(sys.argv[2]),),
          ).fetchone()
          connection.close()

          if row is None:
              print(f"::error::fileid {sys.argv[2]} answers the search but has no verdict at all")
              raise SystemExit(1)
          state, reason, attempts, deleted_at = row
          print(f"the moved file ended as state={state} reason={reason} attempts={attempts} deleted_at={deleted_at}")
          if state != "indexed":
              print(
                  f"::error::the file that changed under the container ended as {state}({reason}) "
                  "instead of indexed, which means a write during the fetch costs the document its verdict"
              )
              raise SystemExit(1)
          if deleted_at is not None:
              print("::error::the file that changed under the container carries a tombstone while it exists")
              raise SystemExit(1)
          PY
          echo "a file that changed under the container is found by its last content, by nothing else, and is not marked as broken"

      - name: Everything the failure had to say
        if: failure()
        run: |
          echo "--- dialect ---"
          ./occ config:system:get dbtype || true
          echo "--- counters ---"
          ( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" ) || true
          ./occ findling:index || true
          echo "--- the last search answers ---"
          for answer in compound.json frist.json umlaut.json flexion.json phrase.json both.json \
                        excluded.json filetype.json colleague-shared.json colleague-denied.json delayed.json \
                        paraphrase-lexical.json paraphrase-semantic.json \
                        mutation-before.json mutation-after-early.json mutation-after.json \
                        mutation-before-final.json; do
            if [ -f "${answer}" ]; then
              echo "== ${answer} =="
              cat "${answer}"
              echo
            fi
          done
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- nextcloud ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # The fourth job, and the two acceptance tests of this phase that a unit test
  # cannot make: the reconcile of IDX-04 word for word, against a real Nextcloud
  # whose cache was filled past the event path, and the DACH promise of D-09 over
  # search terms rather than over recognised text.
  #
  # It is a job of its own for the same reason the read only gate is one: what it
  # asserts is a statement about repair, and a repair that fails must not look
  # like a search that fails.
  reconcile-and-dach:
    name: reconcile-and-dach
    runs-on: ubuntu-24.04
    # The corpus goes through the OCR engine here as well, because the DACH terms
    # of the two scanned documents exist as pixels and in no other form.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      OWNER_USER: 'owner'
      OWNER_PASS: 'findling-ci-owner-2026'
      COLLEAGUE_USER: 'colleague'
      COLLEAGUE_PASS: 'findling-ci-colleague-2026'
      # The reconcile task of the container stays off for the whole job, and this
      # is what turns "exactly one cycle" from a hope into a fact. A container
      # that has never run a cycle considers itself due, so its own loop would
      # walk the file list at some tick of its own choosing, possibly between the
      # manipulation below and the cycle this job triggers. The step that
      # triggers the cycle switches the variable back on for its own process.
      #
      # Job level, so that it reaches the backend the composite action starts. A
      # restart with a different environment would be the alternative, and it
      # would silently lose the armed state that the AppAPI handshake set.
      FINDLING_RECONCILE_ENABLED: 'false'
      # The two scanned DACH documents. Named here so that a rename of a corpus
      # file breaks in one place instead of in three.
      SWISS_FILE: '15-schweiz-baubewilligung.pdf'
      AUSTRIAN_FILE: '16-oesterreich-mitteilung.pdf'
      # The folder the reconcile test works in, and it is deliberately not the
      # corpus: those files are under a read only invariant that the job above
      # measures byte for byte, and a test that rewrites one of them would take
      # that measurement apart.
      WORK_DIR: 'abgleich'
      # Thirty nine corpus files plus the two files of the work folder. The
      # third one is created later, past the event path, and is the point of the
      # whole exercise.
      EXPECTED_JUDGED: '41'
      DRAIN_TIMEOUT: '900'

    steps:
      # Same order and the same reason as in the three jobs above: the server
      # checkout empties the workspace root, and the second checkout is what
      # brings the composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      - name: Install the OCR engine, so the scan track really runs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-osd
          tesseract --version | head -1

      - name: Empty the instance and add the two users
        run: |
          ./occ config:system:set skeletondirectory --value=''
          rm -rf data/admin/files/* data/admin/files/.[!.]* 2>/dev/null || true
          OC_PASS="${OWNER_PASS}" ./occ user:add --password-from-env "${OWNER_USER}"
          OC_PASS="${COLLEAGUE_PASS}" ./occ user:add --password-from-env "${COLLEAGUE_USER}"
          ./occ files:scan --all

      # The corpus carries the DACH cases, the work folder carries the reconcile
      # case. Two files of the work folder exist before the crawl, so that they
      # are ordinary indexed files by the time anything happens behind the back
      # of the event path.
      #
      # The words are measured and not picked: each of them stands in exactly one
      # file of this instance, so a hit is unambiguous and a missing hit cannot be
      # explained away. They are written without umlauts on purpose, unlike the
      # two DACH terms further down, which have to carry theirs because the
      # spelling is the thing under test.
      - name: Put the corpus and the work folder into the account of the owner
        run: |
          mkdir -p "data/${OWNER_USER}/files/${WORK_DIR}"
          cp -r findling-src/testdata/corpus "data/${OWNER_USER}/files/corpus"
          printf 'Der Kanalspuelplan liegt als Vorabzug vor.\n' \
            > "data/${OWNER_USER}/files/${WORK_DIR}/geaendert.txt"
          printf 'Der Ausschreibungsvermerk wurde abgelegt.\n' \
            > "data/${OWNER_USER}/files/${WORK_DIR}/entfernt.txt"
          ./occ files:scan --all
          echo "files of the owner: $(find "data/${OWNER_USER}/files" -type f | wc -l)"

      # The whole work folder is shared, because the removal has to be checked
      # for somebody other than the owner as well: "findable for nobody" is the
      # wording of the acceptance test, and one user is not nobody.
      - name: Share the work folder with the second user, before the crawl
        run: |
          curl -s -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            -d "path=/${WORK_DIR}" \
            -d 'shareType=0' \
            -d "shareWith=${COLLEAGUE_USER}" \
            -d 'permissions=1' \
            'http://localhost:8080/ocs/v2.php/apps/files_sharing/api/v1/shares' | tee share.json
          jq -e '.ocs.meta.statuscode == 200' share.json > /dev/null \
            || { echo "::error::the share was not created, so the removal would be checked for one user only"; cat share.json; exit 1; }
          ./occ files:scan --all

      - name: Queue and run the crawl
        run: |
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          timeout 180 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 120
          ./occ findling:index

      - name: Wait until the queue is empty and everything has a verdict
        run: |
          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          deadline=$(( $(date +%s) + DRAIN_TIMEOUT ))
          while :; do
            report=$(status)
            judged=$(echo "${report}" | jq -r '.indexed + .skipped + .failed')
            open=$(open_rows)
            echo "draining: open=${open} judged=${judged}"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${EXPECTED_JUDGED}" ]; then
              echo "the queue is empty and ${judged} files have a verdict"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the crawl did not finish within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done

      # D-09 as a gate, and the shape of the assertion is the point. The two
      # documents below exist as pixels, so they can only be found once OCR has
      # run, and what is asked is whether a search term finds them. What is
      # deliberately never asked is what the engine actually read: that would be
      # a test against a tesseract build, red on the next Debian point release,
      # and it would say nothing about whether a user finds the document.
      # Measured, this very engine reads the heading of one corpus picture
      # without its umlaut dots, and the file is findable all the same.
      #
      # Each of the three terms stands in exactly one file of the whole instance,
      # which build_corpus.py enforces, so one hit is an unambiguous answer.
      #
      # The two terms below carry real umlauts and a sharp s, unlike every other
      # string in this file. They have to: the spelling is what is under test.
      - name: The DACH cases, over search terms and never over recognised text
        run: |
          search() {
            curl -sfS -G -u "${OWNER_USER}:${OWNER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$1" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$2"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          # 1. The Swiss spelling as it stands in the document, with ss.
          search 'Strasse' swiss-ss.json
          jq -e '.ocs.data.entries | length == 1' swiss-ss.json > /dev/null \
            || fail "the Swiss document is not findable through the spelling it uses itself" swiss-ss.json
          jq -e --arg name "${SWISS_FILE}" '.ocs.data.entries[0].title == $name' swiss-ss.json > /dev/null \
            || fail "the hit for the Swiss spelling is a different file" swiss-ss.json

          # 2. The same document through the German spelling with the sharp s.
          # There is no ascii_fold in the German chain; the Snowball stemmer
          # folds the sharp s and the double s onto the same term, and the query
          # side builds the variant on top. Neither is a promise here, both are
          # measured by this line.
          search 'Straße' swiss-sharp.json
          jq -e '.ocs.data.entries | length == 1' swiss-sharp.json > /dev/null \
            || fail "the German spelling does not find the Swiss document" swiss-sharp.json
          jq -e --arg name "${SWISS_FILE}" '.ocs.data.entries[0].title == $name' swiss-sharp.json > /dev/null \
            || fail "the hit for the German spelling is a different file" swiss-sharp.json

          # 3. The Austrian word form, through itself. A search for Januar
          # finding Jänner would be synonymy, is not built in v1 and is written
          # down as a limit in docs/german-analyzer.md rather than asserted here.
          search 'Jänner' austrian.json
          jq -e '.ocs.data.entries | length == 1' austrian.json > /dev/null \
            || fail "the Austrian document is not findable through its own word form" austrian.json
          jq -e --arg name "${AUSTRIAN_FILE}" '.ocs.data.entries[0].title == $name' austrian.json > /dev/null \
            || fail "the hit for the Austrian word form is a different file" austrian.json

          echo "both spellings lead to the Swiss document, and the Austrian word form to the Austrian one"

      # The control, and without it the three assertions after the cycle would be
      # worth nothing. "Not findable" is the normal state of a file that was never
      # indexed, so each of the three has to be findable here first.
      - name: The three work files are as expected before anything happens behind the events
        run: |
          search() {
            curl -sfS -G -u "$1:$2" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$3" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$4"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          search "${OWNER_USER}" "${OWNER_PASS}" 'Vorabzug' before-changed.json
          jq -e '.ocs.data.entries | length == 1' before-changed.json > /dev/null \
            || fail "the file that is about to change is not findable by its old content" before-changed.json
          jq -e '.ocs.data.entries[0].title == "geaendert.txt"' before-changed.json > /dev/null \
            || fail "the old content leads to a different file" before-changed.json

          search "${OWNER_USER}" "${OWNER_PASS}" 'Ausschreibungsvermerk' before-removed-owner.json
          jq -e '.ocs.data.entries | length == 1' before-removed-owner.json > /dev/null \
            || fail "the file that is about to be removed is not findable for its owner" before-removed-owner.json

          search "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" 'Ausschreibungsvermerk' before-removed-colleague.json
          jq -e '.ocs.data.entries | length == 1' before-removed-colleague.json > /dev/null \
            || fail "the file that is about to be removed is not findable for the second user, so its disappearance would prove nothing" before-removed-colleague.json

          search "${OWNER_USER}" "${OWNER_PASS}" 'Nachtragsvereinbarung' before-new.json
          jq -e '.ocs.data.entries | length == 0' before-new.json > /dev/null \
            || fail "the word of a file that does not exist yet already brings back a hit" before-new.json

      # Step one of the acceptance test of IDX-04, word for word: events blocked.
      #
      # How they are blocked is the decision worth writing down. The obvious way
      # would be a test variable that switches the listeners off, and that is test
      # code in the production path: the switch would exist on every installation
      # for the sake of this run. occ files:scan needs none. It writes the file
      # cache directly and emits none of the node events the companion app listens
      # to, which is the ordinary shape of a mass import and of a restore from a
      # backup. So it is not only the cheaper way to block the events, it is the
      # very case the predecessor of this app failed on, and the next step proves
      # that the blocking really worked.
      #
      # All three cases in one go: a new file, a changed file, a removed file.
      - name: New, changed and removed, all three past the event path
        run: |
          printf 'Die Nachtragsvereinbarung wurde unterzeichnet.\n' \
            > "data/${OWNER_USER}/files/${WORK_DIR}/neu.txt"
          printf 'Der Kanalspuelplan liegt jetzt als Reinschrift vor.\n' \
            > "data/${OWNER_USER}/files/${WORK_DIR}/geaendert.txt"
          rm "data/${OWNER_USER}/files/${WORK_DIR}/entfernt.txt"
          ./occ files:scan --all
          ls -l "data/${OWNER_USER}/files/${WORK_DIR}"

      # Step two, and the one that keeps this test honest. Without it the run
      # could quietly go green over the event path and the reconcile would never
      # have been measured at all. No queue row means the events really stayed
      # out.
      - name: No queue row was created, so the reconcile is what is measured
        run: |
          ./occ findling:index | tee queue-after-scan.txt
          open=$(awk '
            $1 == "scheduled" { scheduled = $2 }
            /^  handed to the worker/ { running = $NF }
            END { print (scheduled + 0) + (running + 0) }' queue-after-scan.txt)
          echo "rows waiting after the scan: ${open}"
          if [ "${open}" -ne 0 ]; then
            echo "::error::${open} queue rows exist after occ files:scan, so events reached the app and this test measures the event path instead of the reconcile"
            exit 1
          fi
          echo "no queue row exists, the three changes are invisible to the app so far"

      # Step three: exactly one reconcile cycle. run_once is one cycle by
      # definition, the task inside the container is switched off for this whole
      # job, and the minimum interval is zero here because a container that was
      # just started would otherwise wait out its daily cadence.
      #
      # It runs as a process of its own against the same state database, which is
      # allowed under WAL and is the second write connection docs/reconcile.md
      # describes. Nothing here writes the index: the cycle produces content and
      # delete jobs, and the poller inside the container does the work.
      - name: One reconcile cycle, and only one
        working-directory: findling-src/backend
        run: |
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          export FINDLING_RECONCILE_ENABLED=true
          uv run python - <<'PY' | tee "${{ github.workspace }}/reconcile.txt"
          import asyncio
          import json

          from findling.worker.reconcile import Reconcile

          result = asyncio.run(Reconcile(min_interval_hours=0).run_once())
          print(
              json.dumps(
                  {
                      "state": result.state,
                      "mounts": result.mounts,
                      "seen": result.seen,
                      "stale": result.stale,
                      "missing": result.missing,
                      "slices": result.slices,
                  }
              )
          )
          PY

      - name: The cycle found the three changes and nothing else
        run: |
          report=$(tail -n 1 reconcile.txt)
          echo "${report}"
          jq -e '.state == "walked"' <<< "${report}" > /dev/null \
            || { echo "::error::the cycle did not walk the whole file list, so its numbers say nothing"; exit 1; }
          # Two content jobs, the new file and the changed one, and one delete
          # job. stale is compared with at least, because a scan may refresh a
          # version mark without anybody editing a file; missing is exact, because
          # concluding a deletion out of an absence is the one thing this round
          # must never get wrong.
          jq -e '.stale >= 2' <<< "${report}" > /dev/null \
            || { echo "::error::the cycle did not see the new and the changed file"; exit 1; }
          jq -e '.missing == 1' <<< "${report}" > /dev/null \
            || { echo "::error::the cycle did not see exactly the one removed file"; exit 1; }

      - name: Wait until the poller has worked off what the cycle queued
        run: |
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            open=$(open_rows)
            echo "draining after the cycle: open=${open}"
            if [ "${open}" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the jobs of the reconcile cycle were not worked off in time"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done
          # The index is committed in batches, so the last commit may be a moment
          # behind the empty queue.
          sleep 5

      # Step four: after one cycle the index is correct. One question per case,
      # and the changed file is asked twice, because a new content that is
      # findable while the old one is findable as well is not an update, it is a
      # second document.
      - name: After one cycle the index is correct, in all three cases
        run: |
          search() {
            curl -sfS -G -u "$1:$2" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$3" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$4"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          search "${OWNER_USER}" "${OWNER_PASS}" 'Nachtragsvereinbarung' new.json
          jq -e '.ocs.data.entries | length == 1' new.json > /dev/null \
            || fail "the file that never produced an event is not findable after the cycle" new.json
          jq -e '.ocs.data.entries[0].title == "neu.txt"' new.json > /dev/null \
            || fail "the hit for the new file is a different file" new.json

          search "${OWNER_USER}" "${OWNER_PASS}" 'Reinschrift' changed.json
          jq -e '.ocs.data.entries | length == 1' changed.json > /dev/null \
            || fail "the changed file is not findable by its new content" changed.json
          jq -e '.ocs.data.entries[0].title == "geaendert.txt"' changed.json > /dev/null \
            || fail "the new content leads to a different file" changed.json

          search "${OWNER_USER}" "${OWNER_PASS}" 'Vorabzug' stale.json
          jq -e '.ocs.data.entries | length == 0' stale.json > /dev/null \
            || fail "the old content is still findable, so the update added a document instead of replacing one" stale.json

          search "${OWNER_USER}" "${OWNER_PASS}" 'Ausschreibungsvermerk' removed-owner.json
          jq -e '.ocs.data.entries | length == 0' removed-owner.json > /dev/null \
            || fail "the removed file is still findable for its owner" removed-owner.json

          search "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" 'Ausschreibungsvermerk' removed-colleague.json
          jq -e '.ocs.data.entries | length == 0' removed-colleague.json > /dev/null \
            || fail "the removed file is still findable for the second user, so it left the index but not the prefilter" removed-colleague.json

          echo "one cycle, and all three cases are correct: new, changed, removed"

      - name: Everything the failure had to say
        if: failure()
        run: |
          echo "--- counters ---"
          ( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" ) || true
          ./occ findling:index || true
          echo "--- the reconcile round ---"
          cat reconcile.txt || true
          echo "--- the last search answers ---"
          for answer in swiss-ss.json swiss-sharp.json austrian.json before-changed.json \
                        before-removed-owner.json before-removed-colleague.json \
                        before-new.json new.json changed.json stale.json removed-owner.json \
                        removed-colleague.json; do
            if [ -f "${answer}" ]; then
              echo "== ${answer} =="
              cat "${answer}"
              echo
            fi
          done
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- nextcloud ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # The fifth job, and the only one in this repository that measures a security
  # property rather than a function: SRCH-04, the permission parity of the two
  # searches. D-21 states it as visibility parity, per scenario and per marker
  # findling produces a hit exactly when the native Nextcloud search shows the
  # same file to the same user. Both directions are compared and they are two
  # different findings: a missed hit is a functional defect, an additional hit is
  # a security defect. scripts/ci/parity_diff.py is what keeps them apart.
  #
  # What this job is not. The permission boundary itself stays the final recheck
  # in Provider, which resolves every candidate through
  # getUserFolder()->getFirstNodeById(). This job measures that boundary, it does
  # not replace it, and that is also why a stale ACL prefilter cannot make it
  # red: the recheck drops the candidate whatever the prefilter still holds.
  #
  # One server version and not the full matrix, on purpose. Parity is a property
  # of the permission chain and not of the server version, and the matrix width
  # of this phase sits on the lean deploy-harp job. Three server versions times
  # an indexing pass would buy three repetitions of the same chain.
  #
  # No OCR engine is installed here, unlike in the three jobs above: every
  # fixture of this job is a text file, because the marker has to be readable by
  # both sides and a scanned page is exactly the case where the native side is
  # blind by design.
  search-parity:
    name: search-parity
    runs-on: ubuntu-24.04
    # One installation, twelve small text files, one crawl and a handful of
    # searches. The deadline is the guard against a hung run holding a runner
    # for the default six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # Test only credentials of a throwaway instance that is destroyed with the
      # runner. Nothing here is reused anywhere else.
      OWNER_USER: 'owner'
      OWNER_PASS: 'findling-ci-owner-2026'
      COLLEAGUE_USER: 'colleague'
      COLLEAGUE_PASS: 'findling-ci-colleague-2026'
      # Scenario 6 in the shape D-22 gives it for CI: no group at all, no team
      # folder access, exactly one received view only share. The guest user of
      # the same decision is a manual probe before the submission and
      # deliberately not a dependency of this matrix.
      MINIMAL_USER: 'minimal'
      MINIMAL_PASS: 'findling-ci-minimal-2026'
      # The fourth account exists for scenario 5 and for nothing else. A group
      # change can only be measured against somebody who stays in the group:
      # "the removed user finds nothing" is also what a broken search says.
      MEMBER_USER: 'member'
      MEMBER_PASS: 'findling-ci-member-2026'
      # The group that holds the team folder, and the mount point of the folder.
      # Neither name contains a marker, for the same reason no folder name does.
      TEAM_GROUP: 'parity-team'
      TEAM_FOLDER: 'parity-team-folder'
      # One marker per scenario, so that the scenarios cannot colour each other.
      # Lower case and ASCII on purpose: the native term filter becomes a LIKE
      # over the name column, which is ASCII case insensitive on SQLite and
      # collation dependent on MariaDB, and an umlaut in a marker would turn
      # parity into a question about collations.
      MARKER_OWN: 'parityown'
      MARKER_SHARED: 'parityshared'
      MARKER_REVOKED: 'parityrevoked'
      MARKER_MINIMAL: 'parityminimal'
      MARKER_TEAM: 'parityteam'
      # Scenario 7, the trash bin. Three files so that the deletion of one of
      # them leaves a non empty set on both sides: a comparison that drops from
      # three to nought would also be satisfied by a search that stopped working.
      MARKER_TRASH: 'paritytrash'
      # Scenario 8, the versions. One file, and three tokens rather than one,
      # because this is the one scenario whose substance the native search
      # cannot answer at all.
      #
      # MARKER_VERSION stands in the name and in the content of both versions,
      # and it is the token the symmetric comparison is made of: the file has to
      # stay visible, once, on both sides, across a version rollback.
      #
      # The two content tokens stand in the content only, one per version, and
      # they are asked of findling alone. That is not a gap in the comparison, it
      # is the fixture rule of this job read backwards: the native term filter is
      # a LIKE over the name column and never looks at a text layer, so a token
      # that only a content search can see has no native counterpart to be
      # compared against. A version rollback cannot rename the file, so there is
      # no way to give the content of the newer version a name, and asking the
      # native side about it would compare a hit against a blind side.
      MARKER_VERSION: 'parityversion'
      MARKER_VERSION_OLD: 'parityversionold'
      MARKER_VERSION_NEW: 'parityversionnew'
      # Five folders in the home of the owner plus one team folder plus the one
      # file of the version scenario. A number rather than a duration, because
      # the drain loop waits for a verdict per file, and because a team folder
      # that never reached the crawl is exactly the failure this number catches.
      #
      # Nineteen and not fifteen since the trash bin and the version scenario
      # joined: three marker files in parity-trash and one uploaded
      # parityversion-1.txt. Every new file is one more verdict, and a number
      # left behind would let the drain loop finish before the new fixtures were
      # judged.
      EXPECTED_JUDGED: '19'
      DRAIN_TIMEOUT: '600'
      # The deadline of every scenario that changes the instance after the
      # crawl, and it comes from one clock: RETREAT_MAX_SECONDS in
      # backend/src/findling/worker/poller.py, the cap of the poller retreat, is
      # three hundred seconds. A file event lands in the queue of Nextcloud at
      # once and the container fetches it on its next poll, so the longest
      # honest wait is one full retreat. It is the same three hundred seconds
      # scenario 3 and scenario 5 pass to drain() as a literal, and it is a
      # variable here because the three new scenarios share it and because a
      # deadline that gets raised until a run is green is a finding and not an
      # adjustment (pitfall 4).
      EVENT_DEADLINE: '300'

    steps:
      # Same order and the same reason as in the four jobs above: the server
      # checkout empties the workspace root, and the second checkout is what
      # brings the composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}
          # Scenario 4 needs a mount that belongs to a group and not to a user.
          # This is the only job of the repository that asks for it.
          install-groupfolders: 'true'

      # Everything on the instance is crawled and everything on the instance is
      # visible to the native search, so a skeleton folder would end up in both
      # answers and in neither expectation.
      - name: Empty the instance and add the three users
        run: |
          ./occ config:system:set skeletondirectory --value=''
          rm -rf data/admin/files/* data/admin/files/.[!.]* 2>/dev/null || true
          OC_PASS="${OWNER_PASS}" ./occ user:add --password-from-env "${OWNER_USER}"
          OC_PASS="${COLLEAGUE_PASS}" ./occ user:add --password-from-env "${COLLEAGUE_USER}"
          OC_PASS="${MINIMAL_PASS}" ./occ user:add --password-from-env "${MINIMAL_USER}"
          ./occ files:scan --all
          echo "files on the instance before the fixtures: $(find data/*/files -type f 2>/dev/null | wc -l)"

      # The condition of every comparison in this job, and therefore a step of
      # its own with a read back rather than a line inside another step. Without
      # it the server cuts both answers down to twenty five entries, and two
      # truncated lists agree without saying anything about the permission chain.
      # SearchQuery::LIMIT_DEFAULT is five, the cap
      # unified_search_max_results_per_request is twenty five, and one hundred is
      # the same number every ask() below sends as its limit.
      #
      # The typed variant is tried first and the untyped one is the fallback: the
      # option exists on the branches this job runs on, and a fallback is cheaper
      # than a job that goes red over the spelling of an occ option.
      - name: Raise the result cap of the unified search
        run: |
          ./occ config:app:set core unified_search_max_results_per_request --value=100 --type=integer \
            || ./occ config:app:set core unified_search_max_results_per_request --value=100
          cap=$(./occ config:app:get core unified_search_max_results_per_request)
          echo "unified_search_max_results_per_request is ${cap}"
          if [ "${cap}" != "100" ]; then
            echo "::error::the result cap is ${cap} and not 100, so every comparison below would be made of truncated lists"
            exit 1
          fi

      # The fixture rule of this job, and it is the difference between a
      # comparison and a coin toss: a marker token stands in the FILE NAME and in
      # the CONTENT. The native search is a name search, the term filter of the
      # provider files becomes a LIKE over the name column inside the visible set
      # of the user, and it never looks at a text layer. Findling reads the
      # content and the name. So a marker only in the content makes the native
      # side blind and the comparison worthless, and a marker only in the name
      # makes findling blind and produces a false alarm.
      #
      # The folder names carry no marker, and the hyphen is what keeps it that
      # way: parity-own does not contain parityown. The native answer includes
      # folders, and a folder has a fileid that findling never indexes, so a
      # folder named after its marker would show up as a missing hit forever.
      - name: Build the marker fixtures, one marker per scenario
        run: |
          write_three() {  # $1 folder, $2 marker
            mkdir -p "data/${OWNER_USER}/files/$1"
            for n in 1 2 3; do
              printf '%s marker file %s of the parity fixture, in the name and in the content.\n' "$2" "${n}" \
                > "data/${OWNER_USER}/files/$1/$2-${n}.txt"
            done
          }
          write_three parity-own "${MARKER_OWN}"
          write_three parity-shared "${MARKER_SHARED}"
          write_three parity-revoked "${MARKER_REVOKED}"
          write_three parity-minimal "${MARKER_MINIMAL}"
          # Scenario 7. Same shape as the four above, and the deletion of
          # scenario 7 happens later over WebDAV so that the trash bin really
          # sees it.
          write_three parity-trash "${MARKER_TRASH}"
          ./occ files:scan --all
          find "data/${OWNER_USER}/files" -type f -printf '%P\n' | sort
          echo "fixture files: $(find "data/${OWNER_USER}/files" -type f | wc -l)"

      # Scenario 8 needs its fixture to arrive over WebDAV, and that is the
      # whole difference to the step above: files_versions keeps a version when
      # a file is written a second time THROUGH Nextcloud, and a file copied
      # into the data directory and scanned in has never been written through
      # Nextcloud at all. So this one file goes in over the same route a desktop
      # client uses, and the second write in the scenario below is what turns
      # this first one into a version.
      #
      # The trash bin and the version app are asked for rather than assumed. A
      # deletion on an instance without files_trashbin raises no MoveToTrashEvent
      # and there would be nothing to restore, and a second write without
      # files_versions keeps no older revision; either way the scenario would
      # test the absence of an app and still be able to look green.
      - name: The version fixture, over WebDAV, and the two apps it needs
        run: |
          ./occ app:enable files_trashbin
          ./occ app:enable files_versions
          ./occ app:list | grep -E 'files_trashbin|files_versions'

          printf '%s marker file 1 of the parity fixture, in the name and in the content. %s\n' \
            "${MARKER_VERSION}" "${MARKER_VERSION_OLD}" > "${{ runner.temp }}/${MARKER_VERSION}-1.txt"
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" \
            -T "${{ runner.temp }}/${MARKER_VERSION}-1.txt" \
            "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/${MARKER_VERSION}-1.txt"
          ./occ files:scan --all
          echo "fixture files after the version fixture: $(find "data/${OWNER_USER}/files" -type f | wc -l)"

      # Before the crawl, and that order is the point rather than a detail: the
      # access list of a file is written while the file is indexed. A share
      # granted afterwards travels over the share events instead, which is what
      # scenario 3 measures further down.
      #
      # permissions=1 is read only, shareType=0 is a share with a single user.
      # Every call checks the statuscode, because a refused share would turn the
      # scenario into a comparison of two empty sets.
      - name: Share three folders with their recipients, before the crawl
        run: |
          share() {  # $1 path, $2 recipient, $3 output file
            # Without -f on purpose: a refused share answers with a body that
            # says why, and -f would throw exactly that body away.
            curl -s -u "${OWNER_USER}:${OWNER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              -d "path=/$1" \
              -d 'shareType=0' \
              -d "shareWith=$2" \
              -d 'permissions=1' \
              'http://localhost:8080/ocs/v2.php/apps/files_sharing/api/v1/shares' | tee "$3"
            jq -e '.ocs.meta.statuscode == 200' "$3" > /dev/null \
              || { echo "::error::the share of /$1 was not created, so its scenario would prove nothing"; cat "$3"; exit 1; }
          }
          share parity-shared "${COLLEAGUE_USER}" share-shared.json
          share parity-revoked "${COLLEAGUE_USER}" share-revoked.json
          share parity-minimal "${MINIMAL_USER}" share-minimal.json
          # The id of the second one, because scenario 3 withdraws exactly that
          # share and a DELETE needs its id.
          jq -r '.ocs.data.id' share-revoked.json > revoked-share-id.txt
          echo "the share to be withdrawn later has id $(cat revoked-share-id.txt)"
          # The mount of a recipient only exists in the mount cache after a scan,
          # and the crawl reads the access list out of that cache.
          ./occ files:scan --all

      # Scenario 4 and the setup half of scenario 5, and both belong before the
      # crawl for the same reason the shares do: the access list of a file is
      # written while the file is indexed.
      #
      # Two members, and the second one is not redundancy. Scenario 5 removes the
      # colleague from this group, and "the removed user finds nothing" is also
      # what a search that broke entirely would say; the member who stays is what
      # turns that into a statement.
      #
      # The three marker files are uploaded over WebDAV as a member of the group
      # rather than written into the data directory. A team folder does not live
      # under the home of a user, its storage layout is the business of the
      # groupfolders app, and an upload is both the honest path and the one that
      # cannot go stale when that layout changes.
      - name: Create the team folder, its group and its two members
        run: |
          OC_PASS="${MEMBER_PASS}" ./occ user:add --password-from-env "${MEMBER_USER}"
          ./occ group:add "${TEAM_GROUP}"
          ./occ group:adduser "${TEAM_GROUP}" "${COLLEAGUE_USER}"
          ./occ group:adduser "${TEAM_GROUP}" "${MEMBER_USER}"

          # groupfolders:create writes the id of the new folder and nothing else.
          folder_id=$(./occ groupfolders:create "${TEAM_FOLDER}")
          echo "${folder_id}" > team-folder-id.txt
          ./occ groupfolders:group "${folder_id}" "${TEAM_GROUP}" read write
          ./occ groupfolders:list

          for n in 1 2 3; do
            printf '%s marker file %s of the parity fixture, in the name and in the content.\n' \
              "${MARKER_TEAM}" "${n}" > "${{ runner.temp }}/${MARKER_TEAM}-${n}.txt"
            curl -sfS -u "${COLLEAGUE_USER}:${COLLEAGUE_PASS}" \
              -T "${{ runner.temp }}/${MARKER_TEAM}-${n}.txt" \
              "http://localhost:8080/remote.php/dav/files/${COLLEAGUE_USER}/${TEAM_FOLDER}/${MARKER_TEAM}-${n}.txt"
          done

          # The upload is asked back rather than assumed. A team folder that the
          # group cannot write to would answer every PUT with a 403, curl -f
          # would stop the step, and this count is what catches the quieter
          # variant where the files land somewhere else.
          uploaded=$(curl -sfS -u "${COLLEAGUE_USER}:${COLLEAGUE_PASS}" \
            -X PROPFIND -H 'Depth: 1' \
            "http://localhost:8080/remote.php/dav/files/${COLLEAGUE_USER}/${TEAM_FOLDER}/" \
            | grep -o "${MARKER_TEAM}-[0-9]*\.txt" | sort -u | wc -l)
          echo "marker files in the team folder: ${uploaded}"
          if [ "${uploaded}" -ne 3 ]; then
            echo "::error::the team folder holds ${uploaded} marker files instead of three, so scenario 4 would compare nothing"
            exit 1
          fi
          ./occ files:scan --all

      # Both questions and the comparison, in a file rather than in every step.
      # A copy of the curl call per scenario is how the two sides start to differ
      # in a way nobody sees, and the whole job rests on them being identical
      # apart from the provider id.
      - name: The two questions, the comparison and the drain, as functions
        run: |
          cat > "${{ runner.temp }}/parity.sh" <<'SH'
          # $1 search route, $2 user, $3 password, $4 term, $5 output file.
          #
          # The route is the only argument that differs between the two calls,
          # and the limit is written out rather than taken from a variable: it is
          # the same number the result cap was raised to a few steps above, and
          # the two are one decision that has to be changed together. Asking
          # without a limit is the deadly variant, because SearchQuery::
          # LIMIT_DEFAULT is five.
          ask() {
            curl -sfS -G -u "$2:$3" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$4" \
              --data-urlencode 'limit=100' \
              "http://localhost:8080/ocs/v2.php/search/$1" -o "$5"
          }

          # $1 user, $2 term, $3 output file. The same question again, asked the
          # way a user asks it in a browser: of the result page of findling,
          # over the session cookie the login step put into the jar of this
          # account, and as HTML.
          #
          # No basic auth and no OCS header, because the page is not an OCS
          # route, and no request token on the GET, because PageController::
          # index() carries NoCSRFRequired and changes nothing. The token is
          # needed for the login POST alone, which is why it lives in the login
          # step and not here.
          #
          # /index.php in front of the route, and that part is not decoration.
          # The instance of this job is served by composer run serve, which is
          # php -S, and the builtin server resolves a request path against the
          # filesystem before anything else. setup-test-nc moves the companion
          # to apps/findling, so that directory really exists and carries no
          # index.php, and the builtin server answers such a path with its own
          # 404 instead of falling back to the front controller. Addresses like
          # /login and /ocs/v2.php work here because the first has no
          # counterpart on disk and the second is a file. The bare form is
          # nothing this instance ever hands out either: without a rewrite,
          # IURLGenerator prepends /index.php to every route, which is what the
          # navigation entry and the form action of the page carry. deploy-harp
          # .yml asks the admin route of this same app the same way.
          ask_page() {
            curl -sfS -G -b "cookies-$1.txt" -c "cookies-$1.txt" \
              --data-urlencode "query=$2" \
              'http://localhost:8080/index.php/apps/findling/' -o "$3"
          }

          # $1 scenario, $2 user, $3 password, $4 term, $5 expected minimum of
          # fileids. One line per scenario in the log, with the name and the
          # number of compared fileids, and its own error message on the way out.
          #
          # Three answers and not two since phase 9, and the third one is the
          # result page: success criterion 4 of that phase asks this job to cover
          # the new route with the same user and the same question. Two sentences
          # a later scenario has to know, both of them cheap to lose:
          #
          # The page shows PAGE_SIZE hits, which is twenty five. Every scenario
          # of this job builds three marker files, the team folder holds three
          # and the version scenario one, so page one is the whole answer here. A
          # scenario with more than twenty five hits would report a difference
          # where nothing but pagination happened, and would have to walk every
          # page instead.
          #
          # The expected minimum holds for all three sets alike. It is the guard
          # against a green statement over empty sets, and a third set that was
          # exempt from it would be the hole in that guard.
          compare() {
            ask 'providers/files/search' "$2" "$3" "$4" "native-$1.json"
            ask 'providers/findling/search' "$2" "$3" "$4" "findling-$1.json"
            ask_page "$2" "$4" "page-$1.html"
            if ! python3 findling-src/scripts/ci/parity_diff.py \
                --scenario "$1" \
                --native "native-$1.json" \
                --findling "findling-$1.json" \
                --findling-html "page-$1.html" \
                --expect-min "$5"; then
              echo "::error::scenario $1 did not pass the parity comparison, see the message above"
              return 1
            fi
          }

          # $1 seconds until the deadline. Waits for an empty work stock, with a
          # running line, and never sleeps on suspicion: the number it waits for
          # is a fact out of the queue table of Nextcloud.
          drain() {
            deadline=$(( $(date +%s) + $1 ))
            while :; do
              open=$(./occ findling:index | awk '
                $1 == "scheduled" { scheduled = $2 }
                /^  handed to the worker/ { running = $NF }
                END { print (scheduled + 0) + (running + 0) }')
              echo "draining: open=${open}"
              if [ "${open}" -eq 0 ]; then
                break
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::the work stock was not emptied within $1 seconds"
                ./occ findling:index
                return 1
              fi
              sleep 5
            done
            # The index is committed in batches, so the last commit may be a
            # moment behind an empty queue.
            sleep 5
          }
          SH
          echo "the three questions and the comparison are in place"

      # One logged in session per account, kept in a cookie jar in the workspace,
      # because the third question of every comparison is asked of an ordinary
      # page and not of an OCS route: the page answers a request without a
      # session with a redirect to the login form and never with a result.
      #
      # The path is the one scripts/dev/probe_page_login.sh walks by hand, and it
      # was walked against a running Nextcloud 34 before this step was written
      # (assumption A7 of the phase 9 research). The Origin header is what that
      # probe found: LoginController::tryLogin refuses a login whose origin is
      # empty or not a trusted domain BEFORE it looks at the password, and it
      # refuses it with the same redirect back to the form that a wrong password
      # produces. A browser sets the header, curl does not.
      #
      # No new credentials. The four accounts and their passwords are the
      # variables the whole job already runs on, and the jars die with the runner.
      - name: Log every account in and keep its session
        run: |
          login() {  # $1 user, $2 password
            jar="cookies-$1.txt"
            rm -f "${jar}"

            token=$(curl -sfS -c "${jar}" 'http://localhost:8080/login' \
              | sed -n 's/.*data-requesttoken="\([^"]*\)".*/\1/p' | head -1)
            if [ -z "${token}" ]; then
              echo "::error::the login form carried no request token, so $1 cannot be logged in"
              exit 1
            fi

            # Not followed: the answer is a redirect either way, and its target
            # is what tells a session from a refusal.
            redirect=$(curl -sS -b "${jar}" -c "${jar}" -o /dev/null -w '%{redirect_url}' \
              -H 'Origin: http://localhost:8080' \
              --data-urlencode "user=$1" \
              --data-urlencode "password=$2" \
              --data-urlencode "requesttoken=${token}" \
              'http://localhost:8080/login')
            case "${redirect}" in
              ''|*/login|*/login\?*)
                echo "::error::the login of $1 was refused, so every page answer of this account would be a login form"
                exit 1
                ;;
            esac

            # Asked back rather than assumed, and asked of the page this job
            # compares against: a session that does not reach that route would
            # otherwise surface as a scenario with an unreadable page answer,
            # twenty minutes further into the run.
            #
            # The same address ask_page uses, front controller and all, and the
            # reason is written out there: php -S answers /apps/findling/ with
            # its own 404 because that directory exists on disk without an
            # index.php, so the bare form never reaches Nextcloud at all.
            status=$(curl -sS -b "${jar}" -c "${jar}" -o "login-probe-$1.html" -w '%{http_code}' \
              --get --data-urlencode 'query=parityloginprobe' \
              'http://localhost:8080/index.php/apps/findling/')
            if [ "${status}" != "200" ] || ! grep -q 'findling-search' "login-probe-$1.html"; then
              echo "::error::the result page answered ${status} for $1 and not the page, so the session did not reach it"
              exit 1
            fi
            echo "$1 is logged in and the result page answers this session"
          }

          login "${OWNER_USER}" "${OWNER_PASS}"
          login "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}"
          login "${MINIMAL_USER}" "${MINIMAL_PASS}"
          login "${MEMBER_USER}" "${MEMBER_PASS}"

      - name: Queue and run the crawl
        run: |
          # --no-interaction: occ treats this shell as interactive, so the
          # restart confirmation would default to No and the queue would stay
          # empty (first run finding of the resilience gate).
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          # stop_after with an underscore. The dashed spelling does not exist on
          # background-job:worker, Symfony rejects it and the crawl never runs.
          timeout 120 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 60
          ./occ findling:index

      - name: Wait until the queue is empty and every fixture file has a verdict
        run: |
          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          deadline=$(( $(date +%s) + DRAIN_TIMEOUT ))
          while :; do
            report=$(status)
            judged=$(echo "${report}" | jq -r '.indexed + .skipped + .failed')
            open=$(open_rows)
            echo "draining: open=${open} judged=${judged}"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${EXPECTED_JUDGED}" ]; then
              echo "the queue is empty and ${judged} files have a verdict"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the crawl did not finish within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done
          # Printed rather than asserted: every fixture is a plain text file, so
          # the interesting number here is how many of the twelve ended as
          # indexed, and the comparisons below are what turns it into a verdict.
          status

      # Scenario 1 and scenario 2. The first is the base case, the one that would
      # be green with no permission chain at all, and it is here because a
      # comparison that never sees a hit proves nothing about the ones that must
      # not see any.
      #
      # Scenario 2 is asked in both directions. The colleague has to find the
      # three files of the folder that was shared with him, and nothing at all of
      # the folder that was not, and the second question is exactly where an
      # additional hit would show up as extra.
      - name: Scenario 1, own files, and scenario 2, a received share
        run: |
          . "${{ runner.temp }}/parity.sh"
          compare own-files "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_OWN}" 3
          compare received-share "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_SHARED}" 3
          # Nought expected, and it is not a vacuous comparison: the question
          # above proved that this user finds something at all, so an empty
          # answer here is a statement and not a silence.
          compare received-share-denied "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_OWN}" 0

      # Scenario 3, and the only scenario that changes the instance after the
      # crawl. A withdrawn share raises a share event, and a folder share is not
      # queued as a row but planned as a subtree expansion, so that job is driven
      # explicitly and the rows it produces are waited for. Nothing here sleeps
      # on suspicion.
      #
      # Both directions again, and this time they are the two halves of one
      # statement: the recipient finds nothing any more, and the owner still
      # finds all three. Without the second half a search that broke entirely
      # would pass the first.
      - name: Scenario 3, the withdrawn share
        run: |
          . "${{ runner.temp }}/parity.sh"

          # Before the withdrawal, so that its effect is a change and not a state
          # that was there all along.
          compare revoked-share-before "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_REVOKED}" 3

          share_id=$(cat revoked-share-id.txt)
          curl -s -X DELETE -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            "http://localhost:8080/ocs/v2.php/apps/files_sharing/api/v1/shares/${share_id}" | tee unshare.json
          jq -e '.ocs.meta.statuscode == 200' unshare.json > /dev/null \
            || { echo "::error::the share was not withdrawn, so scenario 3 would repeat scenario 2"; cat unshare.json; exit 1; }

          timeout 120 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SubtreeExpandJob' --stop_after 60
          drain 300

          # Nought is the right expectation for the recipient, and this is the one
          # place in this job where --expect-min 0 carries a decision rather than
          # a measurement: after the withdrawal this user is supposed to find
          # nothing on either side, so an empty comparison is the correct answer
          # and not a missing fixture. The question above and the one below are
          # what keep that honest.
          compare revoked-share "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_REVOKED}" 0
          compare revoked-share-owner "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_REVOKED}" 3

      # Scenario 4. A mount that belongs to a group and not to a user, and two
      # members of that group who both have to find all three files. The owner of
      # the other fixtures is not in the group and must find none of them, which
      # is the direction that would show an additional hit.
      - name: Scenario 4, the team folder
        run: |
          . "${{ runner.temp }}/parity.sh"
          compare team-folder-colleague "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_TEAM}" 3
          compare team-folder-member "${MEMBER_USER}" "${MEMBER_PASS}" "${MARKER_TEAM}" 3
          compare team-folder-outsider "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_TEAM}" 0

      # Scenario 5, the group change, and the one scenario whose mechanism the
      # plan of this work had wrong. The correction is worth writing down here,
      # because the wrong version reads perfectly plausibly.
      #
      # A membership change raises no share event. ShareEventListener says so in
      # its own docblock and the listener list confirms it: the three events it
      # subscribes to are ShareCreated, ShareDeleted and ShareDeletedFromSelf,
      # and none of them fires when a user leaves a group, because the share did
      # not change. So there is no subtree expansion to drive here, unlike in
      # scenario 3, and waiting for one would be waiting for a job that is never
      # planned.
      #
      # What follows from that is two questions instead of one, and the first one
      # is the more interesting.
      #
      # Asked immediately, while the ACL prefilter still lists the removed user,
      # it measures the sentence the whole architecture rests on: the prefilter
      # is not the permission boundary, the recheck in Provider is, and it
      # resolves every candidate through getUserFolder()->getFirstNodeById().
      # A stale prefilter therefore costs result quality and compute time and not
      # confidentiality. If that sentence were ever wrong, this comparison is
      # where it would show up, as extra.
      #
      # The second question is asked after the prefilter has been brought up to
      # date, explicitly and with a deadline rather than with a sleep on
      # suspicion. The carrier is a crawl pass: it rewrites the access list of
      # every file out of the mount cache, which is the same source the event
      # path reads. The nightly reconcile carries the case too, but it is
      # triggered by a change of the etag and a group change does not touch one,
      # so the crawl is the deterministic half of the pair.
      - name: Scenario 5, the group change
        run: |
          . "${{ runner.temp }}/parity.sh"

          ./occ group:removeuser "${TEAM_GROUP}" "${COLLEAGUE_USER}"
          ./occ user:info "${COLLEAGUE_USER}" || true

          # Immediately, with the prefilter still holding the old answer.
          compare group-change-immediate "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_TEAM}" 0
          echo "the removed user finds nothing even before the prefilter knows, which is the recheck doing its work"

          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          timeout 180 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 120
          drain 300

          compare group-change "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_TEAM}" 0
          # The half that carries the statement: the member who stayed in the
          # group still finds all three. Without it the line above would be
          # satisfied by a search that stopped working altogether.
          compare group-change-member "${MEMBER_USER}" "${MEMBER_PASS}" "${MARKER_TEAM}" 3

      # Scenario 6, in the shape D-22 gives it for CI: a user without any group,
      # without team folder access, with exactly one received view only share. He
      # has to find his three files and nothing of the four other markers, and
      # each of those five questions is a comparison rather than an assertion
      # about findling alone.
      - name: Scenario 6, the restricted user
        run: |
          . "${{ runner.temp }}/parity.sh"
          # Printed rather than assumed: the whole scenario rests on this user
          # having no group at all.
          ./occ user:info "${MINIMAL_USER}" || true
          compare restricted-user "${MINIMAL_USER}" "${MINIMAL_PASS}" "${MARKER_MINIMAL}" 3
          for marker in "${MARKER_OWN}" "${MARKER_SHARED}" "${MARKER_REVOKED}" "${MARKER_TEAM}"; do
            compare "restricted-user-denied-${marker}" \
              "${MINIMAL_USER}" "${MINIMAL_PASS}" "${marker}" 0
          done

      # Scenario 7, the trash bin, and it is asked in both directions because
      # only the pair is a statement. A deleted file that stays findable in
      # findling is the case IDX-05 rules out and D-10 gives the wording for: for
      # the search the trash bin is a deletion, so the file has to stop being
      # findable at once and not in thirty days. A restored file that never comes
      # back is the other half, and a run that only checked the first half would
      # be green on a container that simply drops everything.
      #
      # One of three is thrown away and not all three, so that both comparisons
      # are made of a non empty set: three against three, then two against two,
      # then three against three again. A set that fell to nought would also be
      # what a search that stopped working answers.
      #
      # The one file is followed by its fileid rather than by its name, because
      # the comparison is made of fileids and a statement about "this one" has to
      # be made in the same currency. That the id survives the way through the
      # trash bin is part of what is asserted here: the trash bin keeps the cache
      # entry, so a restored file is the same file, and if it ever were not, the
      # last two lines of this step are where it would show.
      - name: Scenario 7, the trash bin and the way back
        run: |
          . "${{ runner.temp }}/parity.sh"

          # Before the deletion, so that its effect is a change and not a state
          # that was there all along.
          compare trashbin-before "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_TRASH}" 3

          victim=$(jq -r --arg name "${MARKER_TRASH}-1.txt" \
            'first(.ocs.data.entries[] | select(.title == $name) | .attributes.fileId) // empty' \
            native-trashbin-before.json)
          case "${victim}" in
            ''|*[!0-9]*)
              echo "::error::the fileid of ${MARKER_TRASH}-1.txt could not be read out of the native answer, so the deletion could not be followed"
              jq -c '[.ocs.data.entries[] | {title, id: .attributes.fileId}]' native-trashbin-before.json
              exit 1
              ;;
          esac
          echo "the file that goes into the trash bin has fileid ${victim}"

          # Over WebDAV and not with rm, because only this route raises
          # MoveToTrashEvent and NodeDeletedEvent, and those two events are the
          # thing under test.
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" -X DELETE \
            "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/parity-trash/${MARKER_TRASH}-1.txt"
          drain "${EVENT_DEADLINE}"

          compare trashbin-deleted "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_TRASH}" 2
          for answer in native-trashbin-deleted.json findling-trashbin-deleted.json; do
            jq -e --arg id "${victim}" \
              '[.ocs.data.entries[].attributes.fileId | tostring] | index($id) == null' "${answer}" > /dev/null \
              || { echo "::error::fileid ${victim} is in the trash bin and ${answer} still offers it"; \
                   jq -c '[.ocs.data.entries[].attributes.fileId]' "${answer}"; exit 1; }
          done
          echo "the trashed file is gone from both answers, and the other two are still there"

          # The way back, over the trash bin endpoint of the DAV tree: the item
          # is listed under trash/ under a name of its own (the original name
          # plus the deletion timestamp), and a MOVE into restore/ puts it back
          # where it came from. The href is read out of the listing rather than
          # built from the name, because that suffix is Nextcloud's business and
          # not ours.
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" -X PROPFIND -H 'Depth: 1' \
            "http://localhost:8080/remote.php/dav/trashbin/${OWNER_USER}/trash/" -o trash-list.xml
          href=$(tr '<' '\n' < trash-list.xml | sed -n 's#^[a-zA-Z0-9]*:\{0,1\}href>##p' \
            | grep "${MARKER_TRASH}-1\.txt" | head -1)
          if [ -z "${href}" ]; then
            echo "::error::the deleted file is not in the trash bin listing, so there is nothing to restore"
            cat trash-list.xml
            exit 1
          fi
          echo "the trash bin holds the file"
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" -X MOVE \
            -H "Destination: http://localhost:8080/remote.php/dav/trashbin/${OWNER_USER}/restore/file" \
            "http://localhost:8080${href}"
          # Asked back rather than assumed: a MOVE that answered without moving
          # anything would leave the comparison below to explain it.
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" -X PROPFIND -H 'Depth: 0' \
            "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/parity-trash/${MARKER_TRASH}-1.txt" \
            -o restored-head.xml
          echo "the file lies where it was before"
          drain "${EVENT_DEADLINE}"

          compare trashbin-restored "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_TRASH}" 3
          for answer in native-trashbin-restored.json findling-trashbin-restored.json; do
            jq -e --arg id "${victim}" \
              '[.ocs.data.entries[].attributes.fileId | tostring] | index($id) != null' "${answer}" > /dev/null \
              || { echo "::error::the restored file does not carry fileid ${victim} in ${answer}, so the way through the trash bin did not preserve it"; \
                   jq -c '[.ocs.data.entries[].attributes.fileId]' "${answer}"; exit 1; }
          done
          echo "the restored file is back in both answers under the same fileid ${victim}"

      # Scenario 8, the version that is rolled back, and the one scenario of this
      # job whose substance the native search cannot answer.
      #
      # Two questions are asked of both sides and four are asked of findling
      # alone, and the split is not a shortcut. The symmetric half is about
      # visibility: the file has to stay visible, exactly once, on both sides,
      # across a second write and across a rollback. The asymmetric half is about
      # content, and the native term filter is a LIKE over the name column which
      # never looks at a text layer. A rollback cannot rename a file, so the
      # content of the newer version has no name to be found under, and asking
      # the native side about it would compare a hit against a blind side. The
      # fixture rule of this job says the same thing from the other end: a marker
      # that stands only in the content makes the native side blind.
      #
      # Both directions again, and here they are the whole point: after the
      # rollback the token of the old version has to be findable AND the token of
      # the newer one must not be. Only checking the first would let an index
      # through that carries both versions of the same file, which is exactly
      # what T-06.1-28 is about. The two questions before the rollback are what
      # make the two after it worth anything: they establish that the newer token
      # really was in the index, so its disappearance is a change and not a token
      # that never arrived.
      - name: Scenario 8, the version that is rolled back
        run: |
          . "${{ runner.temp }}/parity.sh"

          # $1 term, $2 how many hits findling has to answer with, $3 name of the
          # answer file. Findling alone, for the reason in the comment above.
          content_hits() {
            ask 'providers/findling/search' "${OWNER_USER}" "${OWNER_PASS}" "$1" "findling-$3.json"
            count=$(jq -r '.ocs.data.entries | length' "findling-$3.json")
            echo "content question ${3}: findling answers ${count} hit(s) for ${1}, ${2} expected"
            if [ "${count}" -ne "$2" ]; then
              echo "::error::the content question ${3} answered ${count} hits for ${1} and not ${2}"
              jq -c '[.ocs.data.entries[] | .title]' "findling-$3.json"
              exit 1
            fi
          }

          compare versions-before "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_VERSION}" 1
          file_id=$(jq -r --arg name "${MARKER_VERSION}-1.txt" \
            'first(.ocs.data.entries[] | select(.title == $name) | .attributes.fileId) // empty' \
            native-versions-before.json)
          case "${file_id}" in
            ''|*[!0-9]*)
              echo "::error::the fileid of ${MARKER_VERSION}-1.txt could not be read, so the version endpoint cannot be addressed"
              jq -c '[.ocs.data.entries[] | {title, id: .attributes.fileId}]' native-versions-before.json
              exit 1
              ;;
          esac
          echo "the file of the version scenario has fileid ${file_id}"

          content_hits "${MARKER_VERSION_OLD}" 1 versions-old-before
          content_hits "${MARKER_VERSION_NEW}" 0 versions-new-before

          # Three seconds before the second write, and the number is not
          # decoration: files_versions expires versions that are younger than a
          # couple of seconds, so two writes inside the same second leave nothing
          # to roll back to and the scenario would fail on its own setup rather
          # than on the index.
          sleep 3
          printf '%s marker file 1 of the parity fixture, in the name and in the content. %s\n' \
            "${MARKER_VERSION}" "${MARKER_VERSION_NEW}" > "${{ runner.temp }}/${MARKER_VERSION}-2.txt"
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" \
            -T "${{ runner.temp }}/${MARKER_VERSION}-2.txt" \
            "http://localhost:8080/remote.php/dav/files/${OWNER_USER}/${MARKER_VERSION}-1.txt"
          drain "${EVENT_DEADLINE}"

          # The control of the whole scenario: the newer content really is in the
          # index and the older one is not. Without this pair the two questions
          # after the rollback would also be answered by an index that never saw
          # the second write at all.
          content_hits "${MARKER_VERSION_NEW}" 1 versions-new-written
          content_hits "${MARKER_VERSION_OLD}" 0 versions-old-written
          compare versions-updated "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_VERSION}" 1

          # The rollback, over the versions endpoint of the DAV tree: the
          # versions of one file are listed under versions/<fileid>/, and a MOVE
          # into restore/ makes one of them current again. That write goes
          # through the same View every other write goes through, so it raises
          # NodeWrittenEvent, which is the event this scenario is really about.
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" -X PROPFIND -H 'Depth: 1' \
            "http://localhost:8080/remote.php/dav/versions/${OWNER_USER}/versions/${file_id}/" \
            -o versions-list.xml
          version_href=$(tr '<' '\n' < versions-list.xml | sed -n 's#^[a-zA-Z0-9]*:\{0,1\}href>##p' \
            | grep "/versions/${file_id}/." | head -1)
          if [ -z "${version_href}" ]; then
            echo "::error::no stored version of fileid ${file_id} was listed, so there is nothing to roll back to"
            echo "Either files_versions kept no version of the second write, which is a finding about the"
            echo "expiry rule and not a reason to weaken this scenario, or the listing has a shape this step"
            echo "does not read."
            cat versions-list.xml
            exit 1
          fi
          echo "the file has a stored version"
          curl -sfS -u "${OWNER_USER}:${OWNER_PASS}" -X MOVE \
            -H "Destination: http://localhost:8080/remote.php/dav/versions/${OWNER_USER}/restore/target" \
            "http://localhost:8080${version_href}"
          drain "${EVENT_DEADLINE}"

          # The statement of the scenario, in both directions.
          content_hits "${MARKER_VERSION_OLD}" 1 versions-old-restored
          content_hits "${MARKER_VERSION_NEW}" 0 versions-new-restored
          compare versions-restored "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_VERSION}" 1
          echo "the rolled back content is findable, the newer one is not, and the file is still one file on both sides"

      # Scenario 9, the public link, and its value is the NON change. This is
      # worth spelling out because a scenario whose expectation is "nothing
      # happens" reads like an idle case and gets deleted at the next rewrite.
      #
      # A link share hands a file to anybody who has the URL. It hands it to
      # nobody who is logged in. So the set of files a logged in user finds must
      # be exactly what it was before, and the acl table of the container must
      # not have gained a row. The failure this catches is the quiet one: a share
      # event that walks into the prefilter and writes an entry for a user, which
      # would show up here as extra, the direction parity_diff calls a security
      # defect. T-06.1-26 is the same sentence as a threat.
      #
      # A nought that is only a nought proves nothing, so the non change is
      # measured three ways: the two sets that have to stay empty, the two sets
      # that have to stay full, and the acl rows of the shared file itself, read
      # out of the container by fileid and compared name by name.
      - name: Scenario 9, the public link that must change nothing
        run: |
          . "${{ runner.temp }}/parity.sh"

          # The uids the container lets find one file, read out of the prefilter
          # table over the read only connection. A count alone would not do: a
          # row that is exchanged for another one keeps the count.
          acl_users() {
            python3 - "${{ runner.temp }}/findling/state.db" "$1" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          if not database.is_file():
              print("no-state-database")
              raise SystemExit(0)
          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          rows = connection.execute("SELECT uid FROM acl WHERE file_id = ? ORDER BY uid", (int(sys.argv[2]),)).fetchall()
          connection.close()
          print(",".join(str(row[0]) for row in rows) or "none")
          PY
          }

          compare link-share-before-owner "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_OWN}" 3
          compare link-share-before-colleague "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_OWN}" 0
          compare link-share-before-minimal "${MINIMAL_USER}" "${MINIMAL_PASS}" "${MARKER_OWN}" 0

          shared_id=$(jq -r --arg name "${MARKER_OWN}-1.txt" \
            'first(.ocs.data.entries[] | select(.title == $name) | .attributes.fileId) // empty' \
            native-link-share-before-owner.json)
          case "${shared_id}" in
            ''|*[!0-9]*)
              echo "::error::the fileid of ${MARKER_OWN}-1.txt could not be read, so the acl rows of the linked file cannot be followed"
              jq -c '[.ocs.data.entries[] | {title, id: .attributes.fileId}]' native-link-share-before-owner.json
              exit 1
              ;;
          esac
          before_users=$(acl_users "${shared_id}")
          echo "before the link: fileid ${shared_id} is in the prefilter for [${before_users}]"

          # shareType=3 is a public link, permissions=1 is read only. Without -f
          # on purpose, for the reason the share step above gives: a refused
          # share answers with a body that says why.
          curl -s -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            -d "path=/parity-own/${MARKER_OWN}-1.txt" \
            -d 'shareType=3' \
            -d 'permissions=1' \
            'http://localhost:8080/ocs/v2.php/apps/files_sharing/api/v1/shares' | tee link-share.json > /dev/null
          jq -e '.ocs.meta.statuscode == 200' link-share.json > /dev/null \
            || { echo "::error::the link share was not created, so this scenario would measure the absence of an event"; cat link-share.json; exit 1; }
          # The token and not the whole answer: the answer carries the path of the
          # file, and this log is the log of a public repository.
          echo "the public link exists, token $(jq -r '.ocs.data.token' link-share.json)"
          drain "${EVENT_DEADLINE}"

          # The three sets again, and every one of them has to answer the same
          # number as before. parity_diff prints the number it compared, so the
          # non change stands in the log as a figure and not as a claim.
          compare link-share-owner "${OWNER_USER}" "${OWNER_PASS}" "${MARKER_OWN}" 3
          compare link-share-colleague "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_OWN}" 0
          compare link-share-minimal "${MINIMAL_USER}" "${MINIMAL_PASS}" "${MARKER_OWN}" 0
          # The half that keeps the two noughts honest: the colleague still finds
          # the three files that really are shared with him, so "he finds nothing
          # of the linked folder" is a statement about permissions and not about
          # a search that stopped answering.
          compare link-share-control "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_SHARED}" 3

          after_users=$(acl_users "${shared_id}")
          echo "after the link: fileid ${shared_id} is in the prefilter for [${after_users}]"
          if [ "${before_users}" != "${after_users}" ]; then
            echo "::error::the link share changed who the container lets find fileid ${shared_id}, from [${before_users}] to [${after_users}]"
            exit 1
          fi
          if [ "${after_users}" != "${OWNER_USER}" ]; then
            echo "::error::fileid ${shared_id} is in the prefilter for [${after_users}] and not for ${OWNER_USER} alone"
            exit 1
          fi
          echo "the public link moved neither set and not one prefilter row: it is a link for the world and for no account"

      # Scenario 10, the group join, and the scenario that could not have been
      # written before plan 06.1-08. That is the point of it and it is worth
      # spelling out, because a reader who arrives here after scenario 5 will
      # wonder why the same group is touched twice.
      #
      # Pitfall 3 of the research of this phase, in plain words: a test for the
      # group join written while the join still had to wait for the next crawl
      # could only have frozen that wait as the expected behaviour, and the name
      # of such a test would have described a delay. The fix would then have been
      # the thing that turned it red, which is how a finding becomes unfixable.
      # So the listener came first (E-H3, DI-05-11) and this scenario asks for
      # the target behaviour: the new colleague finds the team content within one
      # event deadline and not within one crawl cadence. If GroupEventListener is
      # removed, this step goes red, which is exactly the direction a gate is
      # supposed to point.
      #
      # Three states and not two, because only the pair of directions is a
      # statement: outside the group the colleague finds nothing on either side,
      # after the join all three on both sides, after the departure nothing again
      # on either side. Scenario 5 left this account outside the group, so the
      # first state is the state this job is already in.
      #
      # Measured twice over, and the second measurement is what keeps the first
      # honest. The parity comparison sees what a user sees, and the prefilter
      # rows of one team file are read straight out of the container by fileid,
      # so "the set changed" is a figure in the log and not a claim. A scenario
      # that only asked the search would also be green on a build where the
      # listener does nothing and the PHP recheck carries everything.
      #
      # No new fixture file is created here, so EXPECTED_JUDGED stays at nineteen:
      # this scenario moves memberships, never bytes, which is the same sentence
      # the listener under test is made of.
      - name: Scenario 10, the group join and the way back out
        run: |
          . "${{ runner.temp }}/parity.sh"

          # The same reader as in scenario 9, written out a second time on
          # purpose: every run step is its own shell, and putting it into
          # parity.sh would edit a file the nine scenarios above depend on.
          acl_users() {
            python3 - "${{ runner.temp }}/findling/state.db" "$1" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          if not database.is_file():
              print("no-state-database")
              raise SystemExit(0)
          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          rows = connection.execute("SELECT uid FROM acl WHERE file_id = ? ORDER BY uid", (int(sys.argv[2]),)).fetchall()
          connection.close()
          print(",".join(str(row[0]) for row in rows) or "none")
          PY
          }

          holds() {  # $1 the uid list, $2 the account
            case ",$1," in *",$2,"*) return 0 ;; *) return 1 ;; esac
          }

          # The control first, and it does double duty: the member who never left
          # the group still finds all three, and its answer is where the fileid
          # this scenario follows comes from.
          compare group-join-control-before "${MEMBER_USER}" "${MEMBER_PASS}" "${MARKER_TEAM}" 3
          team_file=$(jq -r --arg name "${MARKER_TEAM}-1.txt" \
            'first(.ocs.data.entries[] | select(.title == $name) | .attributes.fileId) // empty' \
            native-group-join-control-before.json)
          case "${team_file}" in
            ''|*[!0-9]*)
              echo "::error::the fileid of ${MARKER_TEAM}-1.txt could not be read, so the prefilter rows of the team folder cannot be followed"
              jq -c '[.ocs.data.entries[] | {title, id: .attributes.fileId}]' native-group-join-control-before.json
              exit 1
              ;;
          esac
          echo "the file this scenario follows has fileid ${team_file}"

          # State one: outside the group, and nothing on either side.
          compare group-join-before "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_TEAM}" 0
          before_users=$(acl_users "${team_file}")
          echo "before the join: fileid ${team_file} is in the prefilter for [${before_users}]"
          if holds "${before_users}" "${COLLEAGUE_USER}"; then
            echo "::error::the prefilter already lists ${COLLEAGUE_USER} before the join, so the change below could not be measured"
            exit 1
          fi

          ./occ group:adduser "${TEAM_GROUP}" "${COLLEAGUE_USER}"
          ./occ group:list | head -40

          # What a new colleague does on their first morning: look at their
          # files. It is also what writes the new mount into the mount cache,
          # which is the source the container reads the access list out of. The
          # listener does not depend on it, because it asks the mount providers
          # live, but the acl rows it plans are filled in from the cache.
          curl -sfS -u "${COLLEAGUE_USER}:${COLLEAGUE_PASS}" \
            -X PROPFIND -H 'Depth: 1' \
            "http://localhost:8080/remote.php/dav/files/${COLLEAGUE_USER}/" -o join-mounts.xml
          if ! grep -q "${TEAM_FOLDER}" join-mounts.xml; then
            echo "::error::the team folder is not in the file list of ${COLLEAGUE_USER} after the join, so the join itself did not happen"
            exit 1
          fi
          echo "the team folder is mounted for the new member"

          # The listener plans a subtree expansion, exactly as a folder share
          # does, so the job is driven explicitly and the rows it produces are
          # waited for. Nothing here sleeps on suspicion, and the deadline is the
          # poller retreat and not a number that was raised until it was green.
          timeout 120 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SubtreeExpandJob' --stop_after 60
          drain "${EVENT_DEADLINE}"

          # State two: in the group, and all three on both sides. This is the
          # line that would have been impossible to write before the listener.
          compare group-join "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_TEAM}" 3
          after_users=$(acl_users "${team_file}")
          echo "after the join: fileid ${team_file} is in the prefilter for [${after_users}]"
          if [ "${before_users}" = "${after_users}" ]; then
            echo "::error::the prefilter of fileid ${team_file} did not move over the join, it is still [${after_users}], so the parity above was carried by the recheck alone"
            exit 1
          fi
          if ! holds "${after_users}" "${COLLEAGUE_USER}"; then
            echo "::error::the prefilter of fileid ${team_file} is [${after_users}] and does not list ${COLLEAGUE_USER}, so the group event never reached the queue"
            exit 1
          fi
          echo "the join reached the prefilter within one event deadline and not within one crawl cadence"

          # The way back out, and it is the same listener on the other event.
          ./occ group:removeuser "${TEAM_GROUP}" "${COLLEAGUE_USER}"
          curl -sfS -u "${COLLEAGUE_USER}:${COLLEAGUE_PASS}" \
            -X PROPFIND -H 'Depth: 1' \
            "http://localhost:8080/remote.php/dav/files/${COLLEAGUE_USER}/" -o leave-mounts.xml
          if grep -q "${TEAM_FOLDER}" leave-mounts.xml; then
            echo "::error::the team folder is still in the file list of ${COLLEAGUE_USER} after the removal, so the removal itself did not happen"
            exit 1
          fi
          timeout 120 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SubtreeExpandJob' --stop_after 60
          drain "${EVENT_DEADLINE}"

          # State three: outside again, and nothing on either side.
          compare group-leave "${COLLEAGUE_USER}" "${COLLEAGUE_PASS}" "${MARKER_TEAM}" 0
          final_users=$(acl_users "${team_file}")
          echo "after the departure: fileid ${team_file} is in the prefilter for [${final_users}]"
          if holds "${final_users}" "${COLLEAGUE_USER}"; then
            echo "::error::the prefilter of fileid ${team_file} still lists ${COLLEAGUE_USER} after the departure, so the second direction of the listener is not working"
            exit 1
          fi

          # The half that keeps the two noughts honest, for the third time and
          # for the same reason: the member who never left still finds all three,
          # so "the other one finds nothing" is a statement about membership and
          # not about a search that stopped answering.
          compare group-join-control "${MEMBER_USER}" "${MEMBER_PASS}" "${MARKER_TEAM}" 3
          echo "scenario 10 of ten: a membership change reaches the prefilter in both directions, [${before_users}] to [${after_users}] to [${final_users}]"

      # The falsification of everything above, and the reason the comparisons are
      # worth anything at all: a gate that has never been seen failing is not
      # known to work. Two answers of a scenario that passed are taken apart on
      # purpose, once with a fileid added and once with one removed, and the
      # comparison has to go red both times and has to name the direction.
      #
      # The exit code is inverted in this step: a failing parity_diff is the
      # success here, and a green one is the error. Without this step the whole
      # job is the claim that everything is in order, made by a tool nobody has
      # watched disagree.
      - name: The negative probe, in both directions
        run: |
          probe() {  # $1 name of the probe, $2 the word that has to appear
            if python3 findling-src/scripts/ci/parity_diff.py \
                --scenario "probe-$1" \
                --native probe-native.json \
                --findling probe-findling.json \
                --expect-min 1 > "probe-$1.log" 2>&1; then
              cat "probe-$1.log"
              echo "::error::the $1 probe stayed green, so the parity gate cannot go red and every comparison above proves nothing"
              exit 1
            fi
            cat "probe-$1.log"
            grep -q "$2" "probe-$1.log" \
              || { echo "::error::the $1 probe went red without naming the finding as $2"; exit 1; }
          }

          # One fileid more on the findling side: the search shows something the
          # native search does not show this user.
          cp native-own-files.json probe-native.json
          jq '.ocs.data.entries += [{"attributes": {"fileId": "999999"}}]' \
            native-own-files.json > probe-findling.json
          probe extra extra

          # One fileid less on the findling side: the search does not find
          # something the user is allowed to see.
          cp native-own-files.json probe-native.json
          jq '.ocs.data.entries |= .[1:]' native-own-files.json > probe-findling.json
          probe missing missing

          echo "the parity gate goes red in both directions and names which one it is"

          # The same falsification for the third comparison, and it needs one of
          # its own: the page is read out of markup and not out of JSON, so a
          # reader that quietly found no row in a page it could not read would be
          # green over two empty sets. That is the failure the HTML reader exists
          # to refuse, and this is where it is watched refusing it.
          page_probe() {  # $1 name of the probe, $2 the word that has to appear, $3 the page
            if python3 findling-src/scripts/ci/parity_diff.py \
                --scenario "page-probe-$1" \
                --native native-own-files.json \
                --findling findling-own-files.json \
                --findling-html "$3" \
                --expect-min 1 > "page-probe-$1.log" 2>&1; then
              cat "page-probe-$1.log"
              echo "::error::the $1 page probe stayed green, so the page half of every comparison above proves nothing"
              exit 1
            fi
            cat "page-probe-$1.log"
            grep -q "$2" "page-probe-$1.log" \
              || { echo "::error::the $1 page probe went red without naming the finding as $2"; exit 1; }
          }

          # One row more than the dialog shows: the page offers a file the search
          # dialog does not show this user.
          sed 's#</ol>#<li class="findling-hit" id="findling-hit-999999"></li></ol>#' \
            page-own-files.html > page-probe-extra.html
          page_probe extra page-extra page-probe-extra.html

          # One row less: the two ways into the same search answer two different
          # sets. The id of the first row is spelled without its number, so the
          # row stays in the markup and drops out of the set.
          sed '0,/id="findling-hit-[0-9]*"/s//id="findling-hit-dropped"/' \
            page-own-files.html > page-probe-missing.html
          page_probe missing page-missing page-probe-missing.html

          # And the answer that is not the page at all, which is what a session
          # that expired halfway through the job would produce.
          printf '%s' '<html><body><form action="/login"></form></body></html>' > page-probe-unreadable.html
          page_probe unreadable unreadable page-probe-unreadable.html

          echo "the page half of the gate goes red in both directions and on an answer it cannot read"

      - name: Everything the failure had to say
        if: failure()
        run: |
          echo "--- the result cap ---"
          ./occ config:app:get core unified_search_max_results_per_request || true
          echo "--- counters ---"
          ( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" ) || true
          ./occ findling:index || true
          echo "--- users, groups and team folders ---"
          ./occ user:list || true
          ./occ group:list || true
          ./occ groupfolders:list || true
          # The fileids of every answer and nothing else. A whole answer would
          # put the paths of the fixture files into the log, and the tool this
          # job rests on is careful not to do that.
          echo "--- the answers of both providers, as fileids ---"
          for answer in native-*.json findling-*.json; do
            if [ -f "${answer}" ]; then
              echo "== ${answer} =="
              jq -c '[.ocs.data.entries[]?.attributes.fileId]' "${answer}" || true
            fi
          done
          # The third answer, under the same rule: the row ids of the page and
          # nothing else. A page carries the file name in every row, and this log
          # is the log of a public repository.
          echo "--- the answers of the result page, as row ids ---"
          for page in page-*.html; do
            if [ -f "${page}" ]; then
              echo "== ${page} =="
              grep -o 'id="findling-hit-[0-9]*"' "${page}" | tr '\n' ' ' || true
              echo
              for marker in findling-hits findling-empty findling-banner--error; do
                printf '%s: %s ' "${marker}" "$(grep -c "${marker}" "${page}" || true)"
              done
              echo
            fi
          done
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- nextcloud ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi
