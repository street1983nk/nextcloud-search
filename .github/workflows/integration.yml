name: Integration

# The walking skeleton, end to end: a real Nextcloud is installed, both apps are
# enabled, the ExApp runs as a native process, it is registered through AppAPI
# and the unified search API is asked for a term. The answer has to carry a
# string that can only have been produced inside the running backend. The last
# step stops the backend again and proves that its absence costs a result group
# and nothing else.
#
# The second job in this file proves the read only invariant (IDX-07) on the
# same setup: the container reads every file of the reference corpus once, and
# checksums, modification times, sizes and the file count have to be identical
# afterwards. A user without access to the corpus runs the very same list and
# has to come back with nothing, which is the negative half of COMP-02.
on:
  push:
    paths:
      - 'php/**'
      - 'backend/**'
      - 'testdata/corpus/**'
      - 'scripts/dev/build_corpus.py'
      - 'scripts/ci/**'
      - '.github/workflows/integration.yml'
      # The setup of both jobs lives in a composite action, so a change there is a
      # change to this workflow. Without this line the two most expensive jobs in
      # the repository would silently not run on exactly the commits that rewrite
      # how they are set up.
      - '.github/actions/setup-test-nc/**'
  pull_request:
    paths:
      - 'php/**'
      - 'backend/**'
      - 'testdata/corpus/**'
      - 'scripts/dev/build_corpus.py'
      - 'scripts/ci/**'
      - '.github/workflows/integration.yml'
      # The setup of both jobs lives in a composite action, so a change there is a
      # change to this workflow. Without this line the two most expensive jobs in
      # the repository would silently not run on exactly the commits that rewrite
      # how they are set up.
      - '.github/actions/setup-test-nc/**'
  workflow_dispatch:
    inputs:
      tamper_probe:
        description: >-
          Modify one corpus file on purpose before the second checksum run. A
          gate that has never been seen failing is not known to work, so this
          switch exists to make it fail on demand. The run must end red.
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch. This is the most expensive workflow in the repository, two
# jobs that each install a whole Nextcloud, so a superseded run is the most
# expensive thing to keep alive.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walking-skeleton:
    name: walking-skeleton
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One server version only. The full stable32 / stable33 / stable34 matrix
        # becomes a scheduled run in phase 5, otherwise pull request feedback
        # gets slow.
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      # Test-only credentials of a throwaway instance that is destroyed with the
      # runner. Nothing here is reused anywhere else, and no real secret is ever
      # needed by this workflow.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      TESTUSER_PASS: 'findling-ci-canary-2026'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance.
      #
      # These two checkouts stay in the job and stay in this order. actions/checkout
      # empties its target directory, so the server checkout at the workspace root
      # has to come first, and the second one is what puts the composite action
      # below into the workspace at all.
      - name: Check out nextcloud/server
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # The canary is the diagnostic question from pitfall 3: if findling shows
      # up in the provider list, a later failure sits in the container. If it
      # does not, the failure sits in the PHP app.
      - name: Canary, findling in the search provider list
        id: canary
        run: |
          curl -sf -u admin:password \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers' | tee providers.json
          jq -e '[.ocs.data[] | select(.id == "findling")] | length == 1' providers.json

      # The proof has to run as an ordinary user. The admin would work too, but
      # the user id in the answer is the load bearing part, and a second account
      # makes it impossible to confuse it with the installer.
      - name: Add a test user
        run: OC_PASS="${TESTUSER_PASS}" ./occ user:add --password-from-env testuser

      # The assertions in order of what they rule out. First: exactly one entry,
      # not "at least one", so a provider that answers twice or leaks a second
      # backend's hit is a red run. Second: the title is the one string the PHP
      # side accepts without a file behind it, which is also what proves the
      # permission recheck let the canary through rather than everything through.
      # Third, and this is the actual proof of the phase: the subline carries the
      # host name and the timestamp of the process that produced it and ends with
      # the user id that only the signed AppAPI header could have carried into the
      # backend. A hard coded hit in PHP cannot pass this. Fourth: the snippet is
      # plain text, so the search dialog has nothing to interpolate as markup.
      - name: Search as the test user
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee out.json
          jq -e '.ocs.data.entries | length == 1' out.json
          jq -e '.ocs.data.entries[0].title == "findling-canary"' out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' out.json
          jq -e '.ocs.data.entries[0].subline | contains("<") | not' out.json

      # T2, the timeout path, and the reason it is a step rather than a note: the
      # unified search waits for every provider, so a slow backend does not cost
      # its own result group, it costs the whole search. ExAppService passes two
      # seconds to AppAPI for exactly that reason, and a timeout nobody has seen
      # work is a timeout nobody knows to work.
      #
      # The registration stays untouched. Only the process behind the port is
      # exchanged for one that answers /search after ten seconds.
      - name: Replace the backend with one that hangs
        run: |
          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          python3 findling-src/scripts/ci/slow_backend.py > "${{ runner.temp }}/slow.log" 2>&1 &
          echo $! > "${{ runner.temp }}/slow.pid"
          for _ in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "the slow stub answers on the ExApp port"
              exit 0
            fi
            sleep 1
          done
          echo "the slow stub did not come up"
          cat "${{ runner.temp }}/slow.log" || true
          exit 1

      - name: A hanging backend costs a result group, not the search
        run: |
          start=$(date +%s)
          status=$(curl -s -o slow.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          elapsed=$(( $(date +%s) - start ))
          cat slow.json
          echo "the search answered after ${elapsed}s with status ${status}"
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' slow.json
          # Two seconds is the configured timeout. Six is the ceiling: high enough
          # for PHP start up on a slow runner, far below the ten seconds the stub
          # takes, so removing the timeout turns this step red.
          test "${elapsed}" -lt 6

      - name: Stop the hanging backend
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/slow.pid" ]; then
            kill "$(cat "${{ runner.temp }}/slow.pid")" 2>/dev/null || true
          fi

      # Unregistering disables the ExApp first, and that call needs a living
      # backend on the port. The timeout probe above killed the real one, so it
      # comes back here, otherwise the teardown fails on its own test setup.
      - name: Restart the real backend for the teardown
        working-directory: findling-src/backend
        run: |
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "exapp is back up"
              exit 0
            fi
            sleep 1
          done
          echo "exapp did not come back before the teardown"
          tail -50 "${{ runner.temp }}/exapp.log" || true
          exit 1

      - name: Unregister the ExApp
        run: ./occ app_api:app:unregister findling_backend

      # Pitfall 1 as a test instead of a warning: with the backend gone the proxy
      # gets an array back, and the whole unified search of that user would die
      # if anyone treated it as a response object. The search must still answer
      # 200, only without our result group.
      - name: Search again with the backend gone
        run: |
          status=$(curl -s -o negative.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat negative.json
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' negative.json

      - name: Nextcloud log
        if: failure()
        run: |
          if [ -f data/nextcloud.log ]; then
            tail -n 200 data/nextcloud.log
          else
            echo "no data/nextcloud.log written"
          fi
          ./occ app:list || true
          ./occ app_api:app:list || true
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- slow stub ---"
          tail -n 40 "${{ runner.temp }}/slow.log" || echo "no slow stub log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # Gate B of the read only invariant. Gate A is the AST test in the python
  # workflow and stops anyone from writing a write path; this job catches a write
  # that happens through a road gate A does not know, for instance inside a
  # library. Deliberately a job of its own and not a few steps appended to the
  # walking skeleton: a red read only gate is the most serious verdict this
  # project can produce, and it must never be confusable with a broken search.
  readonly-gate:
    name: readonly-gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # The corpus lives in the admin account, because the installer owns a data
      # directory from the first second. The second account deliberately owns
      # nothing and is the negative case.
      CORPUS_USER: 'admin'
      CORPUS_PASS: 'password'
      STRANGER_USER: 'stranger'
      STRANGER_PASS: 'findling-ci-stranger-2026'

    steps:
      # Same order and the same reason as in the job above: the server checkout
      # empties the workspace root, and the second checkout is what brings the
      # composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: findling-src

      # The backend process is not what reads the corpus, the command line tool
      # is. It has to run anyway, because AppAPI only completes the registration
      # handshake against a live heartbeat, and without a registration the
      # gateway would refuse every call.
      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          admin-user: ${{ env.CORPUS_USER }}
          admin-pass: ${{ env.CORPUS_PASS }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      - name: Put the reference corpus into the account of the corpus user
        run: |
          cp -r findling-src/testdata/corpus "data/${CORPUS_USER}/files/corpus"
          ./occ files:scan --all

      # The list is frozen exactly once and both checksum runs use this very
      # list. Hashing a freshly globbed set instead would let a deleted file
      # disappear from both sides of the diff and look like nothing happened.
      - name: Freeze the file list, the checksums and the metadata
        run: |
          find "data/${CORPUS_USER}/files/corpus" -type f | sort > filelist.txt
          test -s filelist.txt
          xargs -a filelist.txt sha256sum > before.txt
          xargs -a filelist.txt stat -c '%n %Y %s' > before-meta.txt
          echo "corpus files: $(wc -l < filelist.txt)"
          cat before.txt

      # One PROPFIND per file instead of a single Depth 1 call on the folder: a
      # Depth 1 answer also carries the folder itself, and dropping the right
      # entry from an XML blob with shell tools is exactly the kind of cleverness
      # that fails silently when the order changes.
      - name: Resolve the file ids over WebDAV
        run: |
          : > ids.txt
          while read -r path; do
            curl -sf -u "${CORPUS_USER}:${CORPUS_PASS}" -X PROPFIND \
              -H 'Depth: 0' -H 'Content-Type: application/xml' \
              --data '<?xml version="1.0"?><d:propfind xmlns:d="DAV:" xmlns:oc="http://owncloud.org/ns"><d:prop><oc:fileid/></d:prop></d:propfind>' \
              "http://localhost:8080/remote.php/dav/files/${CORPUS_USER}/corpus/$(basename "${path}")" \
              | grep -o '<oc:fileid>[0-9]\+</oc:fileid>' | grep -o '[0-9]\+' >> ids.txt
          done < filelist.txt
          cat ids.txt
          test "$(wc -l < ids.txt)" -eq "$(wc -l < filelist.txt)"

      - name: Read every file through the content gateway
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "${CORPUS_USER}" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/read-report.txt"

      - name: The authorised run has to see every single file
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=${count} not-accessible=0 error=0 bytes=" read-report.txt
          # One file of the corpus is empty on purpose, so the sum is what proves
          # that content actually crossed the wire.
          read_bytes=$(sed -n 's/^summary .*bytes=\([0-9]\+\)$/\1/p' read-report.txt)
          test "${read_bytes}" -gt 0
          echo "bytes read: ${read_bytes}"

      - name: Add a user who owns nothing
        run: OC_PASS="${STRANGER_PASS}" ./occ user:add --password-from-env "${STRANGER_USER}"

      # COMP-02, the half that a functional test never covers: the gateway does
      # not only deliver, it also refuses. Same file ids, same code path, only
      # the user id differs.
      - name: Read the same file ids as a user without access
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "${STRANGER_USER}" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/denied-report.txt"

      - name: The unauthorised run must come back empty
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=0 not-accessible=${count} error=0 bytes=0" denied-report.txt
          # Not a single line may claim a successful read.
          ! grep -q ' read bytes=' denied-report.txt

      # The third case, and the only one of the three that used to answer 500: a
      # user id that does not exist at all. getUserFolder() throws for it, and the
      # difference between 500 here and 404 for "not your file" is a user name
      # oracle. The report has to look exactly like the one of the stranger, so
      # not-accessible for every file and error=0. An error line would mean the
      # gateway answered 500 and told the caller which accounts exist.
      - name: Read the same file ids as a user that does not exist
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "no-such-user-findling-ci" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/unknown-user-report.txt"

      - name: An unknown user is indistinguishable from a user without access
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=0 not-accessible=${count} error=0 bytes=0" unknown-user-report.txt
          ! grep -q ' error bytes=' unknown-user-report.txt

      # Off by default, switched on through workflow_dispatch. A gate nobody has
      # ever seen turn red is a gate nobody knows to work, so the falsification
      # is a step in the job rather than a note in a document.
      - name: Manipulation probe, tamper with the corpus on purpose
        if: ${{ inputs.tamper_probe }}
        run: |
          echo x >> "data/${CORPUS_USER}/files/corpus/04-notes.txt"
          # The second half: a touch leaves every checksum intact and still
          # breaks the invariant, which is why metadata is compared as well.
          touch "data/${CORPUS_USER}/files/corpus/05-picture.png"

      - name: Checksums and metadata after the read run
        run: |
          xargs -a filelist.txt sha256sum > after.txt
          xargs -a filelist.txt stat -c '%n %Y %s' > after-meta.txt

      - name: Gate B, not one byte and not one timestamp has moved
        run: |
          diff before.txt after.txt
          diff before-meta.txt after-meta.txt
          # Deletions and additions: the frozen list cannot show them by itself,
          # so the directory is enumerated a second time and compared.
          find "data/${CORPUS_USER}/files/corpus" -type f | sort > filelist-after.txt
          diff filelist.txt filelist-after.txt
          echo "read only invariant holds for $(wc -l < filelist.txt) files"

      - name: Everything the diff had to say
        if: failure()
        run: |
          echo "--- checksums ---"
          diff -u before.txt after.txt || true
          echo "--- metadata (name mtime size) ---"
          diff -u before-meta.txt after-meta.txt || true
          echo "--- file list ---"
          diff -u filelist.txt filelist-after.txt || true
          echo "--- authorised read report ---"
          cat read-report.txt || true
          echo "--- unauthorised read report ---"
          cat denied-report.txt || true
          echo "--- unknown user read report ---"
          cat unknown-user-report.txt || true
          echo "--- nextcloud log ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"
          echo "--- exapp log ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi
