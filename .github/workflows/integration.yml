name: Integration

# The walking skeleton, end to end: a real Nextcloud is installed, both apps are
# enabled, the ExApp runs as a native process, it is registered through AppAPI
# and the unified search API is asked for a term. The answer has to carry a
# string that can only have been produced inside the running backend. The last
# step stops the backend again and proves that its absence costs a result group
# and nothing else.
#
# The second job in this file proves the read only invariant (IDX-07) on the
# same setup: the container reads every file of the reference corpus once, and
# checksums, modification times, sizes and the file count have to be identical
# afterwards. A user without access to the corpus runs the very same list and
# has to come back with nothing, which is the negative half of COMP-02.
#
# Since phase 3 that job also runs the whole indexing pass over the corpus, OCR
# track included, because the download path is no longer the only path that
# touches a user file: a page is rendered to pixels and an engine is run over it,
# and that is the track the predecessor of this app destroyed data on. And it
# counts the verdicts afterwards, which is the other half of the same thought. A
# checksum comparison only measures what the run actually touched, so a pass that
# never reached the new files would be green and would prove nothing.
#
# The third job, added in phase 2, is the product promise itself: the same corpus
# is indexed and then searched through the ordinary Nextcloud search route, with
# seven German language cases, a second user who sees exactly the one file that
# was shared with him, a probe of the time budget against an artificially slow
# backend, and all of it on two database dialects.
on:
  push:
    paths:
      - 'php/**'
      - 'backend/**'
      - 'testdata/corpus/**'
      # The expected verdict of every corpus file stands in this document and
      # the verdict counter reads it from there. A reference that can change
      # without the gate running is not a reference.
      - 'testdata/CORPUS.md'
      - 'scripts/dev/build_corpus.py'
      - 'scripts/ci/**'
      - '.github/workflows/integration.yml'
      # The setup of both jobs lives in a composite action, so a change there is a
      # change to this workflow. Without this line the two most expensive jobs in
      # the repository would silently not run on exactly the commits that rewrite
      # how they are set up.
      - '.github/actions/setup-test-nc/**'
  pull_request:
    paths:
      - 'php/**'
      - 'backend/**'
      - 'testdata/corpus/**'
      - 'testdata/CORPUS.md'
      - 'scripts/dev/build_corpus.py'
      - 'scripts/ci/**'
      - '.github/workflows/integration.yml'
      # The setup of both jobs lives in a composite action, so a change there is a
      # change to this workflow. Without this line the two most expensive jobs in
      # the repository would silently not run on exactly the commits that rewrite
      # how they are set up.
      - '.github/actions/setup-test-nc/**'
  workflow_dispatch:
    inputs:
      tamper_probe:
        description: >-
          Modify one corpus file on purpose before the second checksum run. A
          gate that has never been seen failing is not known to work, so this
          switch exists to make it fail on demand. The run must end red.
        type: boolean
        default: false
      missing_verdict_probe:
        description: >-
          Drop the verdict of one corpus file on purpose, the WebP, which is the
          state a run has when a mimetype falls out of the allowlist. It is the
          falsification of the verdict counter and therefore of the sentence
          that a checksum comparison alone cannot prove anything. The run must
          end red, and red in the counter step, not in the checksum step.
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch. This is the most expensive workflow in the repository, two
# jobs that each install a whole Nextcloud, so a superseded run is the most
# expensive thing to keep alive.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walking-skeleton:
    name: walking-skeleton
    runs-on: ubuntu-24.04
    # Nothing here indexes, so this is the short one of the three deadlines. It
    # exists for the same reason as the others: a job that hangs must cost
    # minutes and not the default six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One server version only. The full stable32 / stable33 / stable34 matrix
        # becomes a scheduled run in phase 5, otherwise pull request feedback
        # gets slow.
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      # Test-only credentials of a throwaway instance that is destroyed with the
      # runner. Nothing here is reused anywhere else, and no real secret is ever
      # needed by this workflow.
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      TESTUSER_PASS: 'findling-ci-canary-2026'

    steps:
      # Actions are pinned to commit SHAs, never to tags: a moved tag would be
      # arbitrary code execution inside a job that holds a Nextcloud instance.
      #
      # These two checkouts stay in the job and stay in this order. actions/checkout
      # empties its target directory, so the server checkout at the workspace root
      # has to come first, and the second one is what puts the composite action
      # below into the workspace at all.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # The canary is the diagnostic question from pitfall 3: if findling shows
      # up in the provider list, a later failure sits in the container. If it
      # does not, the failure sits in the PHP app.
      - name: Canary, findling in the search provider list
        id: canary
        run: |
          curl -sf -u admin:password \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers' | tee providers.json
          jq -e '[.ocs.data[] | select(.id == "findling")] | length == 1' providers.json

      # The proof has to run as an ordinary user. The admin would work too, but
      # the user id in the answer is the load bearing part, and a second account
      # makes it impossible to confuse it with the installer.
      - name: Add a test user
        run: OC_PASS="${TESTUSER_PASS}" ./occ user:add --password-from-env testuser

      # The assertions in order of what they rule out. First: exactly one entry,
      # not "at least one", so a provider that answers twice or leaks a second
      # backend's hit is a red run. Second: the title is the one string the PHP
      # side accepts without a file behind it, which is also what proves the
      # permission recheck let the canary through rather than everything through.
      # Third, and this is the actual proof of the phase: the subline carries the
      # host name and the timestamp of the process that produced it and ends with
      # the user id that only the signed AppAPI header could have carried into the
      # backend. A hard coded hit in PHP cannot pass this. Fourth: the snippet is
      # plain text, so the search dialog has nothing to interpolate as markup.
      - name: Search as the test user
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary' | tee out.json
          jq -e '.ocs.data.entries | length == 1' out.json
          jq -e '.ocs.data.entries[0].title == "findling-canary"' out.json
          jq -e '.ocs.data.entries[0].subline | startswith("produced inside container ")' out.json
          jq -e '.ocs.data.entries[0].subline | endswith("for user testuser")' out.json
          jq -e '.ocs.data.entries[0].subline | contains("<") | not' out.json

      # The counter probe, and the reason the canary is allowed to stay at all.
      # It is produced inside the container for one single search term, so every
      # other term has to come back empty as long as nothing is indexed. Without
      # this step the canary could colour every search a user ever runs and
      # nobody would notice, because the step above only ever asks for the one
      # term that is supposed to show it.
      #
      # The elapsed time is printed rather than asserted. The wall clock of the
      # provider is two and a half seconds and this is the run that shows what a
      # search actually costs end to end, including the round that finds nothing.
      - name: Another term does not see the canary
        run: |
          start=$(date +%s%N)
          status=$(curl -s -o other.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=vertrag')
          elapsed_ms=$(( ( $(date +%s%N) - start ) / 1000000 ))
          cat other.json
          echo "the search for an ordinary term answered after ${elapsed_ms}ms with status ${status}"
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' other.json

      # A provider is skipped without a word when a client sends a filter it
      # does not declare, and a skipped provider looks exactly like a broken
      # backend: no error, no entry, no hint in any log. The dialog sends
      # title-only for "file name instead of content", so the reported list has
      # to name it, and it has to name the search term itself as well.
      - name: The reported filters name term and title-only
        run: |
          curl -sf -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers' | tee filters.json
          jq -e '[.ocs.data[] | select(.id == "findling")] | length == 1' filters.json
          jq -e '.ocs.data[] | select(.id == "findling") | .filters | has("term")' filters.json
          jq -e '.ocs.data[] | select(.id == "findling") | .filters | has("title-only")' filters.json

      # T2, the timeout path, and the reason it is a step rather than a note: the
      # unified search waits for every provider, so a slow backend does not cost
      # its own result group, it costs the whole search. ExAppService passes one
      # and a half seconds per call to AppAPI for exactly that reason, and a
      # timeout nobody has seen work is a timeout nobody knows to work.
      #
      # The registration stays untouched. Only the process behind the port is
      # exchanged for one that answers /search after ten seconds.
      - name: Replace the backend with one that hangs
        run: |
          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          python3 findling-src/scripts/ci/slow_backend.py > "${{ runner.temp }}/slow.log" 2>&1 &
          echo $! > "${{ runner.temp }}/slow.pid"
          for _ in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "the slow stub answers on the ExApp port"
              exit 0
            fi
            sleep 1
          done
          echo "the slow stub did not come up"
          cat "${{ runner.temp }}/slow.log" || true
          exit 1

      - name: A hanging backend costs a result group, not the search
        run: |
          start=$(date +%s)
          status=$(curl -s -o slow.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          elapsed=$(( $(date +%s) - start ))
          cat slow.json
          echo "the search answered after ${elapsed}s with status ${status}"
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' slow.json
          # One and a half seconds is the configured timeout of the first call,
          # and the second one is never made because the first one failed. Six is
          # the ceiling: high enough for PHP start up on a slow runner, far below
          # the ten seconds the stub takes, so removing the timeout turns this
          # step red.
          test "${elapsed}" -lt 6

      - name: Stop the hanging backend
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/slow.pid" ]; then
            kill "$(cat "${{ runner.temp }}/slow.pid")" 2>/dev/null || true
          fi

      # Unregistering disables the ExApp first, and that call needs a living
      # backend on the port. The timeout probe above killed the real one, so it
      # comes back here, otherwise the teardown fails on its own test setup.
      - name: Restart the real backend for the teardown
        working-directory: findling-src/backend
        run: |
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "exapp is back up"
              exit 0
            fi
            sleep 1
          done
          echo "exapp did not come back before the teardown"
          tail -50 "${{ runner.temp }}/exapp.log" || true
          exit 1

      - name: Unregister the ExApp
        run: ./occ app_api:app:unregister findling_backend

      # Pitfall 1 as a test instead of a warning: with the backend gone the proxy
      # gets an array back, and the whole unified search of that user would die
      # if anyone treated it as a response object. The search must still answer
      # 200, only without our result group.
      - name: Search again with the backend gone
        run: |
          status=$(curl -s -o negative.json -w '%{http_code}' \
            -u "testuser:${TESTUSER_PASS}" \
            -H 'OCS-APIRequest: true' \
            -H 'Accept: application/json' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search?term=findling-canary')
          cat negative.json
          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 0' negative.json

      - name: Nextcloud log
        if: failure()
        run: |
          if [ -f data/nextcloud.log ]; then
            tail -n 200 data/nextcloud.log
          else
            echo "no data/nextcloud.log written"
          fi
          ./occ app:list || true
          ./occ app_api:app:list || true
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- slow stub ---"
          tail -n 40 "${{ runner.temp }}/slow.log" || echo "no slow stub log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # Gate B of the read only invariant. Gate A is the AST test in the python
  # workflow and stops anyone from writing a write path; this job catches a write
  # that happens through a road gate A does not know, for instance inside a
  # library. Deliberately a job of its own and not a few steps appended to the
  # walking skeleton: a red read only gate is the most serious verdict this
  # project can produce, and it must never be confusable with a broken search.
  readonly-gate:
    name: readonly-gate
    runs-on: ubuntu-24.04
    # The OCR pass over the corpus is the slowest thing this repository runs in
    # CI, and a hung engine is exactly the failure this job exists to notice. The
    # default of six hours would hold a runner for an afternoon over it, so the
    # deadline is here (T-03-1303, and the same finding as in the perf audit of
    # resilience.yml). Measured, the whole job is well under twenty minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server-version: ['stable34']
        php-version: ['8.2']

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # Every file of the corpus has to end with a verdict, and that number is
      # the file count rather than a constant: the drain loop below waits for it
      # and the counter step asserts it name by name against CORPUS.md.
      DRAIN_TIMEOUT: '900'
      # The corpus lives in the admin account, because the installer owns a data
      # directory from the first second. The second account deliberately owns
      # nothing and is the negative case.
      CORPUS_USER: 'admin'
      CORPUS_PASS: 'password'
      STRANGER_USER: 'stranger'
      STRANGER_PASS: 'findling-ci-stranger-2026'

    steps:
      # Same order and the same reason as in the job above: the server checkout
      # empties the workspace root, and the second checkout is what brings the
      # composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          path: findling-src

      # The backend process is not what reads the corpus, the command line tool
      # is. It has to run anyway, because AppAPI only completes the registration
      # handshake against a live heartbeat, and without a registration the
      # gateway would refuse every call.
      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          admin-user: ${{ env.CORPUS_USER }}
          admin-pass: ${{ env.CORPUS_PASS }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # The engine the picture and the scan track need. It is installed here and
      # not in the composite action because only this job runs the OCR pass; the
      # walking skeleton indexes nothing at all.
      #
      # The version on the runner is not the version in the runtime image
      # (Debian trixie ships 5.5.0, Ubuntu noble a 5.3 series), and that
      # difference is deliberate rather than tolerated: it is precisely why the
      # assertions of this phase are verdicts and search terms and never a
      # comparison of the recognised text. A raw text assertion would be a test
      # against a tesseract build and would go red on a point release.
      - name: Install the OCR engine, so the scan track really runs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng tesseract-ocr-osd
          tesseract --version | head -1
          tesseract --list-langs

      - name: Put the reference corpus into the account of the corpus user
        run: |
          # The skeleton of the installer would be crawled as well, and its
          # documents would appear in the verdict list next to the corpus. The
          # corpus is the subject here, so the account starts empty.
          ./occ config:system:set skeletondirectory --value=''
          rm -rf "data/${CORPUS_USER}/files"/* "data/${CORPUS_USER}/files"/.[!.]* 2>/dev/null || true
          cp -r findling-src/testdata/corpus "data/${CORPUS_USER}/files/corpus"
          ./occ files:scan --all
          echo "files on the instance: $(find data/*/files -type f 2>/dev/null | wc -l)"

      # The list is frozen exactly once and both checksum runs use this very
      # list. Hashing a freshly globbed set instead would let a deleted file
      # disappear from both sides of the diff and look like nothing happened.
      - name: Freeze the file list, the checksums and the metadata
        run: |
          find "data/${CORPUS_USER}/files/corpus" -type f | sort > filelist.txt
          test -s filelist.txt
          xargs -a filelist.txt sha256sum > before.txt
          xargs -a filelist.txt stat -c '%n %Y %s' > before-meta.txt
          echo "corpus files: $(wc -l < filelist.txt)"
          cat before.txt

      # One PROPFIND per file instead of a single Depth 1 call on the folder: a
      # Depth 1 answer also carries the folder itself, and dropping the right
      # entry from an XML blob with shell tools is exactly the kind of cleverness
      # that fails silently when the order changes.
      - name: Resolve the file ids over WebDAV
        run: |
          : > ids.txt
          while read -r path; do
            curl -sf -u "${CORPUS_USER}:${CORPUS_PASS}" -X PROPFIND \
              -H 'Depth: 0' -H 'Content-Type: application/xml' \
              --data '<?xml version="1.0"?><d:propfind xmlns:d="DAV:" xmlns:oc="http://owncloud.org/ns"><d:prop><oc:fileid/></d:prop></d:propfind>' \
              "http://localhost:8080/remote.php/dav/files/${CORPUS_USER}/corpus/$(basename "${path}")" \
              | grep -o '<oc:fileid>[0-9]\+</oc:fileid>' | grep -o '[0-9]\+' >> ids.txt
          done < filelist.txt
          cat ids.txt
          test "$(wc -l < ids.txt)" -eq "$(wc -l < filelist.txt)"

      - name: Read every file through the content gateway
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "${CORPUS_USER}" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/read-report.txt"

      - name: The authorised run has to see every single file
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=${count} not-accessible=0 error=0 bytes=" read-report.txt
          # One file of the corpus is empty on purpose, so the sum is what proves
          # that content actually crossed the wire.
          read_bytes=$(sed -n 's/^summary .*bytes=\([0-9]\+\)$/\1/p' read-report.txt)
          test "${read_bytes}" -gt 0
          echo "bytes read: ${read_bytes}"

      - name: Add a user who owns nothing
        run: OC_PASS="${STRANGER_PASS}" ./occ user:add --password-from-env "${STRANGER_USER}"

      # COMP-02, the half that a functional test never covers: the gateway does
      # not only deliver, it also refuses. Same file ids, same code path, only
      # the user id differs.
      - name: Read the same file ids as a user without access
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "${STRANGER_USER}" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/denied-report.txt"

      - name: The unauthorised run must come back empty
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=0 not-accessible=${count} error=0 bytes=0" denied-report.txt
          # Not a single line may claim a successful read.
          ! grep -q ' read bytes=' denied-report.txt

      # The third case, and the only one of the three that used to answer 500: a
      # user id that does not exist at all. getUserFolder() throws for it, and the
      # difference between 500 here and 404 for "not your file" is a user name
      # oracle. The report has to look exactly like the one of the stranger, so
      # not-accessible for every file and error=0. An error line would mean the
      # gateway answered 500 and told the caller which accounts exist.
      - name: Read the same file ids as a user that does not exist
        working-directory: findling-src/backend
        run: |
          set -o pipefail
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_VERSION=0.1.0
          export NEXTCLOUD_URL=http://localhost:8080
          uv run python -m findling.tools.read_corpus \
            --user-id "no-such-user-findling-ci" \
            --ids-file "${{ github.workspace }}/ids.txt" \
            | tee "${{ github.workspace }}/unknown-user-report.txt"

      - name: An unknown user is indistinguishable from a user without access
        run: |
          count=$(wc -l < filelist.txt)
          grep -q "summary files=${count} read=0 not-accessible=${count} error=0 bytes=0" unknown-user-report.txt
          ! grep -q ' error bytes=' unknown-user-report.txt

      # From here on the second half of the gate: the whole indexing pass over
      # the same files, so that the comparison below covers the track that reads
      # a document as pixels and not only the track that downloads it.
      - name: Index the whole corpus, OCR track included
        run: |
          # --no-interaction: occ treats this shell as interactive, so the
          # restart confirmation would default to No and the queue would stay
          # empty (first run finding of the resilience gate).
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          # stop_after with an underscore. The dashed spelling does not exist on
          # background-job:worker, Symfony rejects it and the crawl never runs.
          timeout 180 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 120
          ./occ findling:index

      # The scans reach the queue twice: once as a content job, which ends as
      # skipped(no_text_layer), and once more as an ocr job that the container
      # requeues itself. So the loop waits for an empty queue and not for a fixed
      # number of passes, and the deadline is generous because thirty rendered
      # pages through an engine is minutes and not seconds.
      - name: Wait until the queue is empty and every file has a verdict
        run: |
          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          expected=$(wc -l < filelist.txt)
          deadline=$(( $(date +%s) + DRAIN_TIMEOUT ))
          while :; do
            report=$(status)
            indexed=$(echo "${report}" | jq -r '.indexed')
            skipped=$(echo "${report}" | jq -r '.skipped')
            failed=$(echo "${report}" | jq -r '.failed')
            open=$(open_rows)
            judged=$(( indexed + skipped + failed ))
            echo "draining: open=${open} indexed=${indexed} skipped=${skipped} failed=${failed}"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${expected}" ]; then
              echo "the queue is empty and ${judged} files have a verdict"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the indexing pass did not finish within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done

      # Off by default, switched on through workflow_dispatch, and the
      # falsification of the step that follows it. Taking a mimetype out of the
      # allowlist leaves exactly this trace: the file is never handed over and
      # keeps no verdict, while every checksum stays where it was.
      - name: Verdict probe, drop the verdict of the WebP on purpose
        if: ${{ inputs.missing_verdict_probe }}
        run: |
          python3 - "${{ runner.temp }}/findling/state.db" <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          removed = connection.execute("DELETE FROM files WHERE path LIKE '%20-rueckruf.webp'").rowcount
          connection.commit()
          connection.close()
          print(f"verdict probe: removed {removed} row(s)")
          PY

      # The step that makes this gate mean something, and the reason it exists is
      # worth spelling out. A checksum comparison measures the files the run
      # touched. A run that never reached the pictures and the scans compares
      # thirty three unchanged files with thirty three unchanged files and ends
      # green while proving nothing at all (pitfall 13). So every file is looked
      # up by name, and the expected verdict comes out of testdata/CORPUS.md
      # rather than out of a constant in here: the document that describes the
      # corpus is the reference, and a file added there without a verdict fails
      # this step instead of quietly leaving the count alone.
      - name: Every corpus file has exactly one verdict, and the one CORPUS.md names
        run: |
          python3 - "${{ runner.temp }}/findling/state.db" filelist.txt findling-src/testdata/CORPUS.md <<'PY'
          import re
          import sqlite3
          import sys
          from pathlib import Path

          database, listing, reference = (Path(argument) for argument in sys.argv[1:4])

          # A row of the file table of CORPUS.md: the name in backticks, one
          # column of prose, then the verdict as state or state(reason). Only the
          # first backticked token of that cell is read, so the remarks behind it
          # stay prose.
          ROW = re.compile(r"^\|\s*`(?P<name>\d\d-[^`]+)`\s*\|[^|]*\|\s*`(?P<state>[a-z_]+)(?:\((?P<reason>[a-z_]+)\))?`")
          CAP_REASONS = ("truncated", "timeout", "out_of_memory")

          expected = {}
          for line in reference.read_text(encoding="utf-8").splitlines():
              found = ROW.match(line)
              if found:
                  expected[found["name"]] = (found["state"], found["reason"] or "none")

          on_disk = sorted(Path(line.strip()).name for line in listing.read_text(encoding="utf-8").splitlines() if line.strip())

          # The self check of the reference, and it comes first: a pattern that
          # silently matches nothing would turn this whole step into a loop over
          # an empty dictionary, which is the same kind of green as the one this
          # step was written against.
          unlisted = [name for name in on_disk if name not in expected]
          if unlisted:
              print(f"::error::{reference} names no expected verdict for: {', '.join(unlisted)}")
              print("A corpus file without a reference cannot be counted, so the counter would pass it by.")
              sys.exit(1)

          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True)
          rows = connection.execute("SELECT path, state, reason, deleted_at FROM files").fetchall()
          connection.close()

          actual = {}
          for path, state, reason, deleted_at in rows:
              if not str(path).startswith("corpus/"):
                  continue
              actual[str(path).rsplit("/", 1)[-1]] = (state, reason or "none", deleted_at)

          # The caps of docs/ocr.md, counted before anything can end the step, so
          # that they stand in the log of a red run as well. Every one of them is
          # a pass that was cut short, and a corpus that starts hitting them is a
          # corpus whose numbers stop meaning what CORPUS.md says.
          caps = dict.fromkeys(CAP_REASONS, 0)
          for _state, reason, _deleted in actual.values():
              if reason in caps:
                  caps[reason] += 1
          print("cap verdicts: " + ", ".join(f"{reason}={count}" for reason, count in caps.items()))

          print(f"{'file':<34} {'expected':<28} {'actual':<28}")
          problems = []
          for name in on_disk:
              want = expected[name]
              got = actual.get(name)
              shown = "no verdict at all" if got is None else f"{got[0]}({got[1]})"
              print(f"{name:<34} {want[0] + '(' + want[1] + ')':<28} {shown:<28}")
              if got is None:
                  problems.append(f"{name} was never judged")
              elif (got[0], got[1]) != want:
                  problems.append(f"{name} is {shown} and CORPUS.md expects {want[0]}({want[1]})")
              elif got[2] is not None:
                  problems.append(f"{name} carries a tombstone, so it left the index again")

          # Belt and braces on the caps: the comparison above already catches
          # every one of them, because none of the three stands in CORPUS.md. It
          # is repeated as a rule of its own so that a future row which does name
          # a cap cannot make this job green by agreeing with it.
          if any(caps.values()):
              problems.append(
                  "a cap of the OCR cascade was hit: " + ", ".join(f"{reason}={count}" for reason, count in caps.items())
              )

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              print(
                  "A file without a verdict is worse than a red checksum comparison: "
                  "the OCR pass never touched it, so the comparison above compared "
                  "files nothing had happened to and would have stayed green whatever "
                  "the read path does to a picture."
              )
              sys.exit(1)

          print(f"{len(on_disk)} files, {len(actual)} verdicts, every one of them the expected one")
          PY

      # Off by default, switched on through workflow_dispatch. A gate nobody has
      # ever seen turn red is a gate nobody knows to work, so the falsification
      # is a step in the job rather than a note in a document.
      - name: Manipulation probe, tamper with the corpus on purpose
        if: ${{ inputs.tamper_probe }}
        run: |
          echo x >> "data/${CORPUS_USER}/files/corpus/04-notes.txt"
          # The second half: a touch leaves every checksum intact and still
          # breaks the invariant, which is why metadata is compared as well.
          touch "data/${CORPUS_USER}/files/corpus/05-picture.png"

      # After both halves: the gateway read and the whole indexing pass with its
      # renderer and its engine.
      - name: Checksums and metadata after the read run and the OCR pass
        run: |
          xargs -a filelist.txt sha256sum > after.txt
          xargs -a filelist.txt stat -c '%n %Y %s' > after-meta.txt

      - name: Gate B, not one byte and not one timestamp has moved
        run: |
          diff before.txt after.txt
          diff before-meta.txt after-meta.txt
          # Deletions and additions: the frozen list cannot show them by itself,
          # so the directory is enumerated a second time and compared.
          find "data/${CORPUS_USER}/files/corpus" -type f | sort > filelist-after.txt
          diff filelist.txt filelist-after.txt
          echo "read only invariant holds for $(wc -l < filelist.txt) files"

      - name: Everything the diff had to say
        if: failure()
        run: |
          echo "--- checksums ---"
          diff -u before.txt after.txt || true
          echo "--- metadata (name mtime size) ---"
          diff -u before-meta.txt after-meta.txt || true
          echo "--- file list ---"
          diff -u filelist.txt filelist-after.txt || true
          echo "--- authorised read report ---"
          cat read-report.txt || true
          echo "--- unauthorised read report ---"
          cat denied-report.txt || true
          echo "--- unknown user read report ---"
          cat unknown-user-report.txt || true
          echo "--- nextcloud log ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"
          echo "--- exapp log ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi

  # The product promise as a gate: a word out of a real German document, typed
  # into the ordinary search bar, brings back the document with an excerpt from
  # its text, and only to somebody who is allowed to see the file.
  #
  # Two matrix entries, and the second one is not thoroughness for its own sake.
  # This phase introduces the first table of this app, IQueryBuilder defects are
  # dialect dependent, and the upsert of the queue is open question 4 of the
  # phase research: which upsert variant carries over both dialects. Green on
  # SQLite and red on MariaDB is the normal case for that class of defect, so
  # the answer is a run rather than a decision.
  #
  # Two limits of the German analysis chain are measured, documented in
  # docs/german-analyzer.md under "Known limits" and deliberately NOT asserted
  # here: "suchte" does not find "suchen", because the Snowball stemmer unifies
  # the infinitive and the noun but not the past tense, and "Mietvertrag" is not
  # findable through "Vertrag", because it stands in the constituent list itself
  # and the splitter matches leftmost-longest. Neither is a defect and neither
  # should be turned into one by a future assertion.
  index-search-e2e:
    name: index-search-e2e (${{ matrix.database }})
    runs-on: ubuntu-24.04
    # Two installations of a whole Nextcloud plus an OCR pass over the corpus,
    # twice. The deadline is the guard against a hung engine holding a runner for
    # the default six hours (T-03-1303).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The value travels into the composite action and ends up as the
        # --database=sqlite or --database=mysql of occ maintenance:install. The
        # installed dialect is printed there rather than assumed, because a run
        # that quietly fell back would answer the dialect question with the
        # dialect it was asked about.
        database: ['sqlite', 'mysql']
        server-version: ['stable34']
        php-version: ['8.2']

    # Service containers cannot be made conditional on a matrix entry, so the
    # database server also starts for the sqlite run, which then ignores it. The
    # alternative would be a second, nearly identical job definition, and one
    # idle container for a few minutes is the cheaper of the two.
    #
    # The image is pinned to the 11.4 series and not to latest. A patch release
    # inside that series is wanted here: what this job asks is whether the query
    # builder speaks MariaDB, not whether it speaks one particular build.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: findling-ci-root-2026
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      EXAPP_SECRET: '12345'
      EXAPP_PORT: '10035'
      # Two ordinary accounts. The corpus lives in the first one and exactly one
      # file of it is shared with the second, which is the whole permission case.
      OWNER_USER: 'owner'
      OWNER_PASS: 'findling-ci-owner-2026'
      COLLEAGUE_USER: 'colleague'
      COLLEAGUE_PASS: 'findling-ci-colleague-2026'
      # The one file that is shared, and the three titles the language cases
      # have to bring back. Named here so a rename of a corpus file breaks in one
      # place instead of in seven.
      SHARED_FILE: '09-bescheid.pdf'
      NOTICE_FILE: '10-kuendigung.docx'
      OVERVIEW_FILE: '11-uebersicht.odt'
      MEMO_FILE: '12-aktenvermerk.txt'
      # What the container has to end up with, measured against the corpus and
      # not guessed. All thirty three entries of the directory reach the
      # container since plan 03-10: the four picture formats are on the mimetype
      # allowlist of the crawl, so nothing is left without a verdict any more.
      #
      # The three numbers were produced by running the real pipeline over the
      # corpus in the runtime image, text pass first and one OCR pass for every
      # handover, and testdata/CORPUS.md carries the verdict of every single file
      # next to the reason it has that one. The verdict counter of the
      # readonly-gate job asserts that table file by file; these three numbers
      # are the same statement as a sum, and both have to be changed together.
      #
      # failed is six and not zero, and that is the corpus doing its job: the
      # zero byte file plus five of the twelve deliberately broken PDFs. The
      # others are broken in ways pdfium repairs. Asserting the exact numbers is
      # the point; "failed is small" would hide the day a working document
      # starts failing.
      EXPECTED_INDEXED: '22'
      EXPECTED_SKIPPED: '5'
      EXPECTED_FAILED: '6'
      # Ceiling of the wait for an empty queue. Thirty three small files, but a
      # dozen rendered pages go through the OCR engine on the way, and that is
      # minutes rather than seconds. Still only a bound whose job is to end a
      # broken run with counters instead of with a reaped runner.
      DRAIN_TIMEOUT: '900'
      # The delay the container is restarted with for the time budget probe.
      # It acts in /snippets only (test hook of plan 02-11), so the first call
      # answers normally and the second one runs into its 1.5 second limit.
      DELAY_MS: '3000'

    steps:
      # Same order and the same reason as in the two jobs above: the server
      # checkout empties the workspace root, and the second checkout is what
      # brings the composite action into the workspace.
      - name: Check out nextcloud/server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: recursive

      - name: Check out findling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          path: findling-src

      - name: Set up the test Nextcloud with both halves and register the ExApp
        uses: ./findling-src/.github/actions/setup-test-nc
        with:
          server-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          database: ${{ matrix.database }}
          exapp-secret: ${{ env.EXAPP_SECRET }}
          exapp-port: ${{ env.EXAPP_PORT }}

      # Without the engine every scan and every picture of the corpus would end
      # as failed(ocr_unavailable), which is an honest verdict and the wrong one
      # to measure the corpus against. The counters below are the verdicts of an
      # instance that can read pixels.
      - name: Install the OCR engine, so the scan track really runs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng tesseract-ocr-osd
          tesseract --version | head -1

      # Every file on the instance is crawled, so every file on the instance is
      # part of the arithmetic below. The skeleton would put a manual, a picture
      # and a folder of templates into each of the three accounts, and the
      # counter assertions would then be about documents nobody chose.
      - name: Empty the instance of everything that is not the corpus
        run: |
          ./occ config:system:set skeletondirectory --value=''
          # The installer created its own account before the setting existed.
          rm -rf data/admin/files/* data/admin/files/.[!.]* 2>/dev/null || true
          OC_PASS="${OWNER_PASS}" ./occ user:add --password-from-env "${OWNER_USER}"
          OC_PASS="${COLLEAGUE_PASS}" ./occ user:add --password-from-env "${COLLEAGUE_USER}"
          ./occ files:scan --all
          echo "files on the instance before the corpus: $(find data/*/files -type f 2>/dev/null | wc -l)"

      - name: Put the reference corpus into the account of the owner
        run: |
          # The scan of the step before created both home directories; the mkdir
          # is there so a change in that order fails on the mkdir instead of on a
          # cp whose message is about a missing parent.
          mkdir -p "data/${OWNER_USER}/files"
          cp -r findling-src/testdata/corpus "data/${OWNER_USER}/files/corpus"
          ./occ files:scan --all
          echo "corpus entries: $(find "data/${OWNER_USER}/files/corpus" -type f | wc -l)"

      # The order of this step and the crawl below is the whole point, and it is
      # not an implementation detail: the access list is written while a file is
      # indexed. A share granted afterwards, or revoked afterwards, is not seen
      # by this phase at all; events and reconciliation are phase 3. A later
      # failure here therefore means the crawl did not see the share, not that
      # the permission chain leaks.
      #
      # permissions=1 is read only, shareType=0 is a share with a single user.
      - name: Share exactly one file with the second user, before the crawl
        run: |
          # Without -f on purpose: a refused share answers with a body that says
          # why, and -f would throw exactly that body away.
          curl -s -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            -d "path=/corpus/${SHARED_FILE}" \
            -d 'shareType=0' \
            -d "shareWith=${COLLEAGUE_USER}" \
            -d 'permissions=1' \
            'http://localhost:8080/ocs/v2.php/apps/files_sharing/api/v1/shares' | tee share.json
          jq -e '.ocs.meta.statuscode == 200' share.json > /dev/null \
            || { echo "::error::the share was not created, so the permission case would prove nothing"; cat share.json; exit 1; }
          # The recipient's mount only exists in the mount cache after a scan,
          # and the crawl reads the access list out of that cache.
          ./occ files:scan --all

      - name: Queue and run the crawl
        run: |
          # --no-interaction: occ treats this shell as interactive, so the
          # restart confirmation would default to No and the queue would stay
          # empty (first run finding of the resilience gate).
          ./occ findling:index --restart --no-interaction
          timeout 60 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\SchedulerJob' --once
          # stop_after with an underscore. The dashed spelling does not exist on
          # background-job:worker, Symfony rejects it and the crawl never runs.
          timeout 120 ./occ background-job:worker 'OCA\Findling\BackgroundJobs\StorageCrawlJob' --stop_after 60
          ./occ findling:index

      - name: Wait until the queue is empty and everything has a verdict
        run: |
          status() {
            ( cd findling-src/backend && uv run python -m findling.tools.index_status \
                --db "${{ runner.temp }}/findling/state.db" )
          }
          # scheduled plus the rows a worker holds, both out of the queue table
          # of Nextcloud, so "still open" is a fact rather than a guess.
          open_rows() {
            ./occ findling:index | awk '
              $1 == "scheduled" { scheduled = $2 }
              /^  handed to the worker/ { running = $NF }
              END { print (scheduled + 0) + (running + 0) }'
          }

          expected=$(( EXPECTED_INDEXED + EXPECTED_SKIPPED + EXPECTED_FAILED ))
          deadline=$(( $(date +%s) + DRAIN_TIMEOUT ))
          while :; do
            report=$(status)
            indexed=$(echo "${report}" | jq -r '.indexed')
            skipped=$(echo "${report}" | jq -r '.skipped')
            failed=$(echo "${report}" | jq -r '.failed')
            open=$(open_rows)
            judged=$(( indexed + skipped + failed ))
            echo "draining: open=${open} indexed=${indexed} skipped=${skipped} failed=${failed}"
            if [ "${open}" -eq 0 ] && [ "${judged}" -ge "${expected}" ]; then
              echo "the queue is empty and ${judged} files have a verdict"
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::the crawl did not finish within ${DRAIN_TIMEOUT} seconds"
              echo "${report}"
              ./occ findling:index
              exit 1
            fi
            sleep 5
          done

      # The seven language cases. Each one has its own message, because the seven
      # failures mean seven different things, and each one asserts a count and a
      # title: a search that finds "something" proves that the index is not
      # empty, and nothing else.
      - name: The seven German language cases, as the owner
        run: |
          search() {
            curl -sfS -G -u "${OWNER_USER}:${OWNER_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$1" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$2"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          # 1. The compound through one of its constituents. The file says
          # Grundstuecksverkehrsgenehmigung, the search says Genehmigung, and the
          # splitter is what closes the gap.
          start=$(date +%s%N)
          search 'Genehmigung' compound.json
          echo "an ordinary search answered after $(( ( $(date +%s%N) - start ) / 1000000 ))ms"
          jq -e '.ocs.data.entries | length == 1' compound.json > /dev/null \
            || fail "a compound searched through one constituent did not bring back exactly one file" compound.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' compound.json > /dev/null \
            || fail "the compound hit is not the German PDF of the corpus" compound.json
          # The excerpt, and this is the assertion that separates a hit from a
          # hit with content: the subline has to carry the compound out of the
          # document. The fallback subline is the path, and the path does not
          # contain the word, so a broken excerpt path cannot pass this line.
          jq -e '.ocs.data.entries[0].subline | ascii_downcase | contains("genehmigung")' compound.json > /dev/null \
            || fail "the subline carries no excerpt from the document" compound.json
          jq -e '.ocs.data.entries[0].subline | contains("<") | not' compound.json > /dev/null \
            || fail "the excerpt carries markup, which the search dialog would show verbatim" compound.json

          # 2. The second compound, in a different file and a different format.
          search 'Frist' frist.json
          jq -e '.ocs.data.entries | length == 1' frist.json > /dev/null \
            || fail "Frist did not bring back exactly the notice of termination" frist.json
          jq -e --arg name "${NOTICE_FILE}" '.ocs.data.entries[0].title == $name' frist.json > /dev/null \
            || fail "the Frist hit is not the DOCX of the corpus" frist.json

          # 3. The written out umlaut. The file says Mueller with the character,
          # the search says it with the two letters, and the query side variant
          # of plan 02-09 is what joins them.
          search 'Mueller' umlaut.json
          jq -e '.ocs.data.entries | length == 1' umlaut.json > /dev/null \
            || fail "the written out umlaut did not find the file that spells it with the character" umlaut.json
          jq -e --arg name "${MEMO_FILE}" '.ocs.data.entries[0].title == $name' umlaut.json > /dev/null \
            || fail "the umlaut hit is not the file note of the corpus" umlaut.json

          # 4. Nominal inflection. The file says Vertraege, the search says
          # Vertrag, and the stemmer is what closes that gap.
          search 'Vertrag' flexion.json
          jq -e '.ocs.data.entries | length == 1' flexion.json > /dev/null \
            || fail "the singular did not find the plural" flexion.json
          jq -e --arg name "${OVERVIEW_FILE}" '.ocs.data.entries[0].title == $name' flexion.json > /dev/null \
            || fail "the inflection hit is not the ODT of the corpus" flexion.json

          # 5. The phrase. Only the file with the two words in that order.
          search '"drei Monate"' phrase.json
          jq -e '.ocs.data.entries | length == 1' phrase.json > /dev/null \
            || fail "the phrase did not bring back exactly one file" phrase.json
          jq -e --arg name "${NOTICE_FILE}" '.ocs.data.entries[0].title == $name' phrase.json > /dev/null \
            || fail "the phrase hit is not the DOCX of the corpus" phrase.json

          # 6. The exclusion, and the control that gives it meaning. Bescheid
          # stands in two files on purpose; without the control an exclusion that
          # does nothing would look exactly like one that works.
          search 'bescheid' both.json
          jq -e '.ocs.data.entries | length == 2' both.json > /dev/null \
            || fail "the word that stands in two files did not bring back two files" both.json
          search 'bescheid -frist' excluded.json
          jq -e '.ocs.data.entries | length == 1' excluded.json > /dev/null \
            || fail "the minus did not remove the second file" excluded.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' excluded.json > /dev/null \
            || fail "the exclusion removed the wrong file" excluded.json

          # 7. The file type. There is no built in Nextcloud filter for it, so it
          # travels inside the search line and becomes a required term on ext.
          search 'type:pdf bescheid' filetype.json
          jq -e '.ocs.data.entries | length == 1' filetype.json > /dev/null \
            || fail "the file type filter did not narrow the two hits down to the PDF" filetype.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' filetype.json > /dev/null \
            || fail "the file type filter kept the wrong file" filetype.json

      # The counter proof, and the only one of the whole workflow that says
      # something about a user who was never meant to see a file. Both directions
      # are checked: the negative half alone would be green even if the search
      # returned nothing to anybody.
      - name: The second user sees the shared file and nothing else
        run: |
          search() {
            curl -sfS -G -u "${COLLEAGUE_USER}:${COLLEAGUE_PASS}" \
              -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
              --data-urlencode "term=$1" \
              'http://localhost:8080/ocs/v2.php/search/providers/findling/search' -o "$2"
          }
          fail() { echo "::error::$1"; cat "$2"; exit 1; }

          search 'Genehmigung' colleague-shared.json
          jq -e '.ocs.data.entries | length == 1' colleague-shared.json > /dev/null \
            || fail "the second user does not find the file that was shared with him" colleague-shared.json
          jq -e --arg name "${SHARED_FILE}" '.ocs.data.entries[0].title == $name' colleague-shared.json > /dev/null \
            || fail "the second user found something other than the shared file" colleague-shared.json

          # Deliberately without "bescheid": that word stands in the shared file
          # as well, and a term the second user is allowed to find has no place
          # in the list of terms he must not find.
          for term in 'Frist' 'Vertrag' 'Mueller'; do
            search "${term}" colleague-denied.json
            jq -e '.ocs.data.entries | length == 0' colleague-denied.json > /dev/null \
              || fail "the second user found a file that was never shared with him, searching for ${term}" colleague-denied.json
          done
          echo "the second user sees one file out of thirty three, and it is the shared one"

      # The time budget, measured instead of claimed. The container is restarted
      # with FINDLING_ARTIFICIAL_DELAY_MS, which acts in /snippets and nowhere
      # else, so the candidate call answers normally and only the excerpt call
      # runs into its limit. What has to survive is the hit; what may fall away
      # is the excerpt.
      - name: Restart the backend with an artificial delay
        working-directory: findling-src/backend
        run: |
          kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null || break
            sleep 1
          done
          export APP_ID=findling_backend
          export APP_SECRET="${EXAPP_SECRET}"
          export APP_PORT="${EXAPP_PORT}"
          export APP_VERSION=0.1.0
          export APP_HOST=127.0.0.1
          export NEXTCLOUD_URL=http://localhost:8080
          # The same volume as before, so the index built above is the one that
          # is searched.
          export APP_PERSISTENT_STORAGE="${{ runner.temp }}/findling"
          export FINDLING_ARTIFICIAL_DELAY_MS="${DELAY_MS}"
          uv run python -m findling.main >> "${{ runner.temp }}/exapp.log" 2>&1 &
          echo $! > "${{ runner.temp }}/exapp.pid"
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${EXAPP_PORT}/heartbeat" > /dev/null; then
              echo "the delayed backend answers on the ExApp port"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the delayed backend did not come up"
          tail -50 "${{ runner.temp }}/exapp.log" || true
          exit 1

      - name: A slow backend costs the excerpt, not the hit and not the budget
        run: |
          read -r seconds status <<< "$(curl -s -G -u "${OWNER_USER}:${OWNER_PASS}" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            --data-urlencode 'term=Genehmigung' \
            -o delayed.json -w '%{time_total} %{http_code}' \
            'http://localhost:8080/ocs/v2.php/search/providers/findling/search')"
          elapsed_ms=$(awk -v value="${seconds}" 'BEGIN { printf "%d", value * 1000 }')
          cat delayed.json
          echo "the search answered after ${elapsed_ms}ms with status ${status}, while the backend delayed every excerpt by ${DELAY_MS}ms"

          test "${status}" = "200"
          jq -e '.ocs.data.entries | length == 1' delayed.json > /dev/null \
            || { echo "::error::a slow excerpt call cost the hit itself"; cat delayed.json; exit 1; }
          # The excerpt is gone and the subline fell back to the path. That is
          # the designed behaviour: a hit without an excerpt beats no hit.
          jq -e '.ocs.data.entries[0].subline | startswith("corpus/")' delayed.json > /dev/null \
            || { echo "::error::the subline is not the path, so the excerpt call did not run into its limit"; cat delayed.json; exit 1; }
          # The falsifying bound. The backend delays every excerpt by three
          # seconds, so a run that waited for it cannot come back below that;
          # 2900 milliseconds is therefore a ceiling that a missing timeout
          # cannot pass, and it sits far above the roughly 1.5 seconds the
          # limited call costs.
          if [ "${elapsed_ms}" -ge 2900 ]; then
            echo "::error::the search waited for the delayed backend instead of giving up on the excerpt"
            exit 1
          fi

      - name: The verdicts of the whole corpus, counted
        run: |
          report=$( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" )
          echo "::group::counters after the run"
          echo "${report}"
          ./occ findling:index
          echo "::endgroup::"

          indexed=$(echo "${report}" | jq -r '.indexed')
          skipped=$(echo "${report}" | jq -r '.skipped')
          failed=$(echo "${report}" | jq -r '.failed')
          docs=$(echo "${report}" | jq -r '.docs')

          if [ "${indexed}" -ne "${EXPECTED_INDEXED}" ]; then
            echo "::error::${indexed} files were indexed, ${EXPECTED_INDEXED} were expected"
            exit 1
          fi
          if [ "${skipped}" -ne "${EXPECTED_SKIPPED}" ]; then
            echo "::error::${skipped} files were skipped, ${EXPECTED_SKIPPED} were expected: the encrypted PDF and six documents without a text layer"
            exit 1
          fi
          if [ "${failed}" -ne "${EXPECTED_FAILED}" ]; then
            echo "::error::${failed} files failed, ${EXPECTED_FAILED} were expected: the zero byte PDF and five of the ten broken ones"
            exit 1
          fi
          if [ "${docs}" -ne "${indexed}" ]; then
            echo "::error::a document lies twice in the index: ${docs} documents against ${indexed} indexed files"
            exit 1
          fi
          echo "the corpus ended as ${indexed} indexed, ${skipped} skipped, ${failed} failed, ${docs} documents in the index"

      - name: Everything the failure had to say
        if: failure()
        run: |
          echo "--- dialect ---"
          ./occ config:system:get dbtype || true
          echo "--- counters ---"
          ( cd findling-src/backend && uv run python -m findling.tools.index_status \
            --db "${{ runner.temp }}/findling/state.db" ) || true
          ./occ findling:index || true
          echo "--- the last search answers ---"
          for answer in compound.json frist.json umlaut.json flexion.json phrase.json both.json \
                        excluded.json filetype.json colleague-shared.json colleague-denied.json delayed.json; do
            if [ -f "${answer}" ]; then
              echo "== ${answer} =="
              cat "${answer}"
              echo
            fi
          done
          echo "--- exapp ---"
          tail -n 200 "${{ runner.temp }}/exapp.log" || echo "no exapp log written"
          echo "--- nextcloud ---"
          tail -n 200 data/nextcloud.log || echo "no data/nextcloud.log written"

      - name: Stop the ExApp
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/exapp.pid" ]; then
            kill "$(cat "${{ runner.temp }}/exapp.pid")" 2>/dev/null || true
          fi
