# OpenSSF Scorecard: an external, reproducible assessment of the supply chain
# hygiene of this repository (pinned actions, token permissions, branch
# protection, dependency update tooling, and so on). The point of running it
# here is the public result: the README carries the badge, and the score is
# produced by a third party's tool against published criteria rather than by
# this repository's own tests, which is as close to an independent statement
# as a weekly job can get. Weekly on top of every push to main, because the
# checks also judge things that change outside this tree, such as branch
# protection settings.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '45 5 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To upload the results to the code scanning dashboard.
      security-events: write
      # publish_results below signs the result and publishes it to the OpenSSF
      # REST API, which is what the badge and https://scorecard.dev read.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
